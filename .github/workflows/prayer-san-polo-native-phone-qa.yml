name: Stations — native-pixel and 14-stage EN/FR phone review

# QA of Git-held unpublished assets. No Pages publish, source mutation, or
# waiver of rights/selection/mobile sign-off. Uploaded artifacts expire.
on:
  pull_request:
    paths:
      - 'tests/prayer-san-polo-14-source-reader-phone-review.mjs'
      - 'src/pray/stations-verified-artwork-styles.js'
      - 'scripts/san_polo_native_phone_review.py'
      - '.github/workflows/prayer-san-polo-native-phone-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-phone-review:
    name: All fourteen native WebPs and current source-owned Stations reader
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image diagnostics
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Native 1:1 pixel corners, borders, hashes and 14 original WebPs
        run: python scripts/san_polo_native_phone_review.py
      - name: Verify all rights/approval holds and unpublished runtime bindings
        run: node tests/prayer-san-polo-license-ready-assets.mjs && node tests/prayer-stations-verified-artwork-release.mjs
      - name: Install existing app browser dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture real Stations reader at 320/390 in English and French
        run: node tests/prayer-san-polo-14-source-reader-phone-review.mjs
      - name: Upload private temporary original-byte and native-edge review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stations-14-native-image-evidence
          path: ${{ runner.temp }}/san-polo-native-phone-review/
          retention-days: 3
          if-no-files-found: warn
      - name: Upload temporary 56-screen reader and attribution review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stations-14-en-fr-phone-captures
          path: ${{ runner.temp }}/san-polo-phone-review/
          retention-days: 3
          if-no-files-found: warn
