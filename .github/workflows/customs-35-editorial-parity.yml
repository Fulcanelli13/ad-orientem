name: Customs 35-article editorial parity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/calendar/customs-read-model.js"
      - "src/calendar/customs-editorial-preview.js"
      - "data/customs/review/calendar-five-candidate-articles.v1.json"
      - "tests/calendar-customs-editorial-preview.mjs"
      - "src/calendar/customs-search.js"
      - "tests/calendar-customs-search.mjs"
      - "src/calendar/calendar-runtime.js"
      - "data/customs/source-registry.v1.json"
      - "data/customs/customs-historical-folios.v1.json"
      - "src/calendar/customs-extra-articles.js"
      - "data/customs/research/customs-published-35-editorial-first-pass.20261023.v1.json"
      - "tests/customs-35-editorial-first-pass.mjs"
      - "tests/customs-bilingual-scope-parity.mjs"
      - "tests/customs-final-editorial-acceptance.mjs"
      - "tests/customs-critical-13-prose-pass.mjs"
      - "tests/customs-standard-22-prose-pass.mjs"
      - "data/customs/customs-fr-canonical-copy.v1.json"
      - "data/customs/customs-p0-guidance-en-fr.v1.json"
      - "data/customs/customs-p1-guidance-en-fr.v1.json"
      - "data/customs/editorial-final-acceptance.v1.json"
      - "tools/customs/editorial-acceptance-contract.mjs"
      - "tools/customs/export-final-editorial-review.mjs"
      - ".github/workflows/customs-35-editorial-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  article-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check English/French article history and editorial register
        run: |
          node tests/customs-35-editorial-first-pass.mjs
          node tests/customs-bilingual-scope-parity.mjs
          node tests/customs-final-editorial-acceptance.mjs
          node tests/customs-critical-13-prose-pass.mjs
          node tests/customs-standard-22-prose-pass.mjs
          node tests/calendar-customs-context.mjs
          node tests/calendar-customs-search.mjs
          node tests/calendar-customs-editorial-preview.mjs
          node tests/customs-living-library.mjs
      - name: Build full bilingual editor review packet
        run: node tools/customs/export-final-editorial-review.mjs > customs-final-editorial-review.md
      - name: Attach source-derived reviewer packet
        uses: actions/upload-artifact@v4
        with:
          name: customs-final-editorial-review
          path: customs-final-editorial-review.md
          if-no-files-found: error
          retention-days: 30
