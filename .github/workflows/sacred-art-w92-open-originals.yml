name: Sacred Art W92 Exact Open-Original Acquisition
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - data/calendar/sacred-art-review-uploads/20261016-w92-open-original-image-recovery.v1.json
      - tools/calendar/acquire-sacred-art-w92-open-originals.py
      - .github/workflows/sacred-art-w92-open-originals.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging prerequisites
        run: python -m pip install 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Download exact photographic sources and report unverified edges
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w92-open-originals.py
          python tools/calendar/acquire-sacred-art-w92-open-originals.py
      - name: Preserve native source files, previews, identities and contact-sheet proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w92-open-originals-research-only
          path: artifacts/sacred-art-w92-open-originals/
          retention-days: 30
          if-no-files-found: warn
