name: Acquire single Notre-Dame de Paris exact-site cover

on:
  push:
    branches:
      - fix/explore-reuse-approved-gallery-as-covers-20261031
    paths:
      - "tools/acquire-notre-dame-paris-2026-cover.py"
      - "tests/production-tree-hygiene.mjs"
      - ".github/workflows/acquire-notre-dame-paris-cover.yml"

permissions:
  contents: write

concurrency:
  group: notre-dame-paris-cover-acquisition
  cancel-in-progress: true

jobs:
  acquire-and-commit:
    if: github.repository == 'Fulcanelli13/ad-orientem' && github.ref == 'refs/heads/fix/explore-reuse-approved-gallery-as-covers-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explore-reuse-approved-gallery-as-covers-20261031
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - name: Validate exact Commons photo source, SHA1, license and write approved local WebP
        run: python tools/acquire-notre-dame-paris-2026-cover.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserve exact review branch acquisition governance
        run: node tests/production-tree-hygiene.mjs
      - name: Validate image, rights and site UI lookup
        run: node tests/explore-approved-gallery-cover-reuse-20261031.mjs
      - name: Commit verified WebP and metadata together to PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/FR-notre-dame-paris-2026.webp data/geography/approved-place-media.v1.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "feat(explore): publish-source Notre-Dame de Paris exact-site cover in review branch"
          git fetch origin fix/explore-reuse-approved-gallery-as-covers-20261031
          git rebase origin/fix/explore-reuse-approved-gallery-as-covers-20261031
          git push origin HEAD:fix/explore-reuse-approved-gallery-as-covers-20261031
