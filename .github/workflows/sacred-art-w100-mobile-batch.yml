name: Sacred Art W100 Mobile Candidate Bulk Acquisition
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - data/calendar/sacred-art-review-uploads/20261016-w100-mobile-gap-acquisition-candidates.v1.json
      - tools/calendar/acquire-sacred-art-w100-mobile-source-batch.py
      - .github/workflows/sacred-art-w100-mobile-batch.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Fetch seven whole-photo candidates and contain-fit previews without print-resolution gates
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w100-mobile-source-batch.py
          python tools/calendar/acquire-sacred-art-w100-mobile-source-batch.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w100-mobile-full-picture-candidates
          path: artifacts/sacred-art-w100-mobile-subject-evidence/
          retention-days: 30
          if-no-files-found: warn
