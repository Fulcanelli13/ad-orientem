name: Sacred Art B10 - Rijksmuseum bulk new religious paintings
on:
  push:
    branches: [research/sacred-art-b10-getty-20261029]
    paths:
      - scripts/art/sacred-art-b10-rijks-bulk-discovery-20261029.py
      - .github/workflows/sacred-art-b10-rijks-bulk-discovery-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-b10-rijks-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b10-getty-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search entire Rijks oil-painting subject registry with bounded official queries
        run: |
          python -m py_compile scripts/art/sacred-art-b10-rijks-bulk-discovery-20261029.py
          python -u scripts/art/sacred-art-b10-rijks-bulk-discovery-20261029.py
      - name: Preserve one deduplicated source index
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/calendar/sacred-art-b10-rijks-bulk-discovery-20261029.v1.json'))
          assert len(d['ids'])==len(set(d['ids']))
          assert d['count']['photosSaved']==0
          assert all(i.startswith('rijks:') for i in d['ids'])
          print('SEARCHED',d['count'])
          PY
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b10-rijks-bulk-discovery-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): archive B10 Rijksmuseum large-source sacred painting discovery"
          git pull --rebase origin research/sacred-art-b10-getty-20261029
          git push origin HEAD:research/sacred-art-b10-getty-20261029
