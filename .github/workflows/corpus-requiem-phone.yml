name: Corpus and Requiem phone lifecycle
on:
  pull_request:
    paths:
      - "tests/reader-corpus-requiem-phone.mjs"
      - "tests/fixtures/reader-phone-harness.html"
      - ".github/workflows/corpus-requiem-phone.yml"
      - "src/mass/reader-corpus-christi.js"
      - "src/mass/reader-requiem-absolution.js"
      - "src/mass/reader-native-preview.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  following-action-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check explicit Corpus procession and body-present/absent Requiem mobile handoffs
        run: timeout --signal=TERM --kill-after=5s 650s node tests/reader-corpus-requiem-phone.mjs
      - name: Preserve source and displayed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-requiem-phone-lifecycle
          path: artifacts/corpus-requiem-phone/
          retention-days: 30
          if-no-files-found: warn
