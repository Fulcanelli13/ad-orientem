name: Sacred Art first 73 · one-click grid with reliable local previews (€0)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-first73-fast-grid-20261030.yml
      - scripts/art/build-sacred-art-fast-grid-first73-20261030.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ao-sacred-art-first73-one-click
  cancel-in-progress: false

jobs:
  create-self-contained-fast-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up zero-cost image preview encoder
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Preserve frozen editorial approvals and rejection records
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Generate embedded review photos and one-click gallery
        run: python -u scripts/art/build-sacred-art-fast-grid-first73-20261030.py
      - name: Verify 73 originals remain in their original queues unless the user approves
        run: |
          python - <<'PY'
          import json, pathlib
          a=json.loads(pathlib.Path('data/calendar/sacred-art-master-v1/fast-grid-first73-previews-20261030.v1.json').read_text())
          html=pathlib.Path('docs/SACRED_ART_FAST_GRID_REVIEW_BATCH01_20261030.html').read_text()
          assert a['total']==73 and len(a['previewEvidence'])==73
          assert a['userPhotoQualityApprovalsGranted']==0
          assert a['productionPhotoApprovalsGranted']==0
          assert a['originalSourcePhotosAltered']==False
          assert a['previewsEmbedded']+a['previewsMissing']==73
          assert 'Approve → Queue 1' in html
          assert '<aside' not in html
          assert 'missing previews' in html
          assert 'Missing image' in html
          assert 'Import earlier review CSV' in html
          print(a['previewsEmbedded'],'working local review images;',a['previewsMissing'],'held for recovery')
          PY
      - name: Permanently store first reviewer HTML and proof (not expiring Actions artifact)
        run: |
          set -euo pipefail
          git config user.name "Ad Orientem sacred art review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SACRED_ART_FAST_GRID_REVIEW_BATCH01_20261030.html data/calendar/sacred-art-master-v1/fast-grid-first73-previews-20261030.v1.json
          git diff --cached --check
          git commit -m "feat(sacred-art): self-contained one-click pristine grid first 73 with image proof [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
