name: Archive two approved public-domain Prayer paintings (no Rauth sources)

on:
  push:
    branches:
      - research/prayer-artwork-gap-consolidation-20261031
    paths:
      - scripts/archive_two_user_approved_pd_prayer_images.py
      - data/prayer/artwork-editorial-20261031/user-direct-benediction-therese-selections.v1.json
      - .github/workflows/archive-two-user-approved-prayer-pd-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-two-user-approved-pd-photos:
    if: github.ref == 'refs/heads/research/prayer-artwork-gap-consolidation-20261031' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download and verify only two explicitly approved Commons PD images
        run: python scripts/archive_two_user_approved_pd_prayer_images.py
      - name: Commit verified images and source-provenance to research PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/prayer/user-approved/benediction-mystic-lamb.webp assets/prayer/user-approved/st-therese-lisieux-historical-portrait.webp assets/prayer/user-approved/source-provenance.v1.json
          if git diff --cached --quiet; then
            echo 'Verified public-domain assets already committed'
          else
            git commit -m 'Archive approved PD Mystic Lamb and exact St Therese portrait in permanent asset bank'
            git push origin HEAD:research/prayer-artwork-gap-consolidation-20261031
          fi
