name: Visible Mass P4 scene bridge contract
on:
  push:
    branches: [feature/visible-mass-3d-explorer-p0]
    paths:
      - previews/visible-mass-3d/photographic-scene-bridge.mjs
      - previews/visible-mass-3d/sanctuary-hotspot-pilot.html
      - previews/visible-mass-3d/PHASE1_SANCTUARY_PILOT_QUESTIONS_20261017.v1.json
      - tests/visible-mass-photo-bridge.mjs
      - tests/visible-mass-stage-a-reconciliation.mjs
      - previews/visible-mass-3d/photographic-published-explorer-handoff.mjs
      - previews/visible-mass-3d/photographic-object-mass-bridge.mjs
      - tests/visible-mass-published-explorer-handoff.mjs
      - src/learn/visible-mass-review-gate.js
      - src/learn/visible-mass-review.js
      - src/learn/lazy-module-registry.js
      - src/learn/browser-entry.js
      - src/learn/presentation.js
      - tests/visible-mass-learn-integration.mjs
      - tests/visible-mass-guided-trail-graph.mjs
      - previews/visible-mass-3d/GUIDED_TRAIL_GRAPH_RESEARCH_20261018.v1.json
      - previews/visible-mass-3d/GUIDED_TRAIL_EDITORIAL_DECISION_20261018.md
      - previews/visible-mass-3d/HISTORICAL_SYMBOLIC_ANSWERS_20261017.v1.json
      - previews/visible-mass-3d/HISTORICAL_FUNCTIONAL_ANSWERS_NEXT_20261017.v1.json
      - previews/visible-mass-3d/LITURGICAL_EXPLANATIONS_P1_5_FIRST20_20261017.v1.json
      - previews/visible-mass-3d/LITURGICAL_SOURCE_TO_SUBJECT_CROSSWALK_20261017.v1.json
      - .github/workflows/visible-mass-p4-bridge.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check previews/visible-mass-3d/photographic-scene-bridge.mjs
      - run: node tests/visible-mass-photo-bridge.mjs
      - run: node tests/visible-mass-stage-a-reconciliation.mjs
      - run: node --check previews/visible-mass-3d/photographic-published-explorer-handoff.mjs
      - run: node tests/visible-mass-published-explorer-handoff.mjs
      - run: node --check src/learn/visible-mass-review.js
      - run: node --check src/learn/presentation.js
      - run: node --check src/learn/lazy-module-registry.js
      - run: node --check src/learn/browser-entry.js
      - run: node tests/visible-mass-learn-integration.mjs
      - run: node tests/visible-mass-guided-trail-graph.mjs
