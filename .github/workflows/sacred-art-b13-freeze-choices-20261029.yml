name: Sacred Art B13 - freeze completed B10 B11 editorial choices
on:
  push:
    branches: [research/sacred-art-b13-french-museums-20261029]
    paths:
      - scripts/art/sacred-art-b13-freeze-b10-b11-user-choices-20261029.py
      - data/calendar/sacred-art-b10-user-choice-bundle-20261029.b64.txt
      - data/calendar/sacred-art-b11-user-choice-bundle-20261029.b64.txt
      - .github/workflows/sacred-art-b13-freeze-choices-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b13-french-museums-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and validate every B10 and B11 decision
        run: python -u scripts/art/sacred-art-b13-freeze-b10-b11-user-choices-20261029.py
      - name: Archive complete editorial ledgers
        run: |
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b10-user-final-decisions-20261029.v2.json data/calendar/sacred-art-b11-user-final-decisions-20261029.v2.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): preserve B10 and B11 complete user reviews as permanent audited ledgers"
          git pull --rebase origin research/sacred-art-b13-french-museums-20261029
          git push origin HEAD:research/sacred-art-b13-french-museums-20261029
