name: Approved Feast Heroes — actual Home and Calendar preview only
on:
  push:
    branches: [fix/approved-feast-heroes-main-20261021]
    paths:
      - "tests/approved-feast-hero-real-surfaces-preview.mjs"
      - "src/home/presentation.js"
      - "src/calendar/calendar-runtime.js"
      - ".github/workflows/approved-feast-hero-real-surfaces-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/approved-feast-hero-real-surfaces-preview.mjs"
      - "src/home/presentation.js"
      - "src/calendar/calendar-runtime.js"
      - ".github/workflows/approved-feast-hero-real-surfaces-preview.yml"
permissions:
  contents: read
jobs:
  real-phone-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Actual Home and Calendar preview; test-only simulated release, no photo rights grant
        run: node tests/approved-feast-hero-real-surfaces-preview.mjs
      - name: Save screenshots for review, even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-feast-heros-actual-home-calendar-320-390-preview-not-released
          path: artifacts/sacred-art-approved-hero-real-surface-preview/
          if-no-files-found: warn
          retention-days: 30
