name: Processionale GABC read-only research capture

# The original 15 sources were verified and archived; rerun only manually.
# New Palm psalter Textus novus comparison is a separate two-source intake.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/research/processionale-palm-new-psalter-capture.mjs
      - .github/workflows/processionale-gabc-research.yml

permissions:
  contents: read

jobs:
  capture-original-source-set:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/research/processionale-gabc-capture.mjs

  capture-new-palm-psalter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture new Latin psalm tone source bytes and SHA256, no writes
        run: node tools/research/processionale-palm-new-psalter-capture.mjs
