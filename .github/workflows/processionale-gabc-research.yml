name: Processionale GABC read-only research capture

# Initial 15-source set archived, SHA256-verified on 2026-10-26.
# Manual-only for intentional source refresh: avoid re-downloading on each PR edit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grab-source-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture CC0 GABC source bytes and SHA256 without repository write
        run: node tools/research/processionale-gabc-capture.mjs
