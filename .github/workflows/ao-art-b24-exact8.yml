name: B24 8 exact-inventory source-image acquisition
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-b24-exact8.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-b24-eight-exact-artworks
  cancel-in-progress: false
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Enforce exactly eight frozen unrejected museum-object identities
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('data/research/sacred-art-b24-exact8.manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'));r=m['records']
          assert len(r)==8 and len({x['record_id'] for x in r})==8
          assert len({x['asset_source_id'] for x in r})==8
          assert all(x['download_gate']=='METADATA_FIRST' for x in r)
          assert all(x['identity_evidence_kind'].startswith('EXACT_') for x in r)
          assert all(x['editorial_gate']=='NOT_APPROVED' for x in r)
          PY
      - name: Acquire actual Commons files only after file-level rights metadata
        run: |
          python scripts/research/sacred_art_acquire.py \
            --manifest data/research/sacred-art-b24-exact8.manifest.json \
            --output artifacts/b24-exact8 \
            --max-files 8 \
            --max-bytes 250000000 \
            --prior-audit data/research/no-prior-b24.csv
      - name: Save research binaries and source rights metadata temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-sacred-art-b24-eight-exact-object-files-audit
          path: artifacts/b24-exact8/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve exact per-object source and SHA-256 audit
        if: success()
        run: |
          cp artifacts/b24-exact8/Acquisition_results.csv data/research/sacred-art-b24-exact8.audit.csv
          cp artifacts/b24-exact8/Acquisition_summary.json data/research/sacred-art-b24-exact8.audit-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b24-exact8.audit.csv data/research/sacred-art-b24-exact8.audit-summary.json
          git commit -m 'research: preserve B24 eight exact source art images, licences, dimensions and hashes'
          for i in 1 2 3; do
            git fetch origin research/b19-original-image-acquisition-probe-20261023
            git rebase origin/research/b19-original-image-acquisition-probe-20261023
            git push origin HEAD:research/b19-original-image-acquisition-probe-20261023 && exit 0
            sleep 4
          done
          exit 1
