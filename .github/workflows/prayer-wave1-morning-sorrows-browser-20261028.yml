name: Prayer Wave 1 - Morning art and Seven Sorrows source proof
on:
  push:
    branches:
      - feature/prayer-wave1-morning-sorrows-proof-20261028
    paths:
      - .github/workflows/prayer-wave1-morning-sorrows-browser-20261028.yml
      - src/pray/morning-wave1-art-proof.js
      - src/pray/traditional-pray-runtime.js
      - assets/pray/hero-proof/**
      - tests/pray-morning-wave1-art-proof.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-unchanged-source-daily-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing free browser-test package
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Morning artwork preview, true sunrise, evening isolation and both SHA-pinned artwork files
        run: |
          node --check src/pray/morning-wave1-art-proof.js
          node --check src/pray/traditional-pray-runtime.js
          node --check tests/pray-morning-wave1-art-proof.mjs
          node tests/pray-morning-wave1-art-proof.mjs
      - name: Preserve reviewed device screenshots and checksums in this research branch
        if: success()
        run: |
          mkdir -p assets/staged/prayer-wave1-morning-device-qa-20261028
          for state in collapsed open; do
            for width in 320 390 1440; do
              cp "artifacts/prayer-wave1-morning-proof/morning-art-${state}-${width}.png" "assets/staged/prayer-wave1-morning-device-qa-20261028/morning-art-${state}-${width}.png"
            done
          done
          (
            cd assets/staged/prayer-wave1-morning-device-qa-20261028
            sha256sum *.png > SCREENSHOT-SHA256.txt
          )
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-wave1-morning-device-qa-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(prayer art): archive Morning artwork device screenshots permanently"
          git pull --rebase origin feature/prayer-wave1-morning-sorrows-proof-20261028
          git push origin HEAD:feature/prayer-wave1-morning-sorrows-proof-20261028
      - name: Temporary UI inspection screens, not sole photo archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-morning-proof-device-screens-${{ github.run_id }}
          path: artifacts/prayer-wave1-morning-proof/
          retention-days: 3
          if-no-files-found: warn
