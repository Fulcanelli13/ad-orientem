name: Sacred Art Rijksmuseum 66 official Linked Art records (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-rijks-66-official-linked-art-20261029.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-rijks-66-official-source
  cancel-in-progress: false

jobs:
  verify-66-rijksmuseum-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable 2455 source decisions and protected canonical crosswalk
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Reconcile 66 official Rijksmuseum persistent IDs and inventory numbers
        run: node scripts/art/reconcile-rijks-official-66-20261029.mjs
      - name: Preserve fail-closed source evidence and official counters
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p='data/calendar/sacred-art-phase1-rijks-66-official-linked-art-report-20261029.v1.json';
          const data=JSON.parse(readFileSync(p,'utf8'));
          const c=data.counts;
          if(data.rows.length!==66 || c.frozenSourceCards!==66 || c.originallyConditionalDecisions!==4 ||
             c.officialIdAndInventoryConfirmed+c.fetchedButNotConfirmed+c.fetchFailed!==66 ||
             data.rows.some(r=>r.originalEditorialDecisionPreserved!==true ||
              r.exactPhotoVerified!==false || r.licensedOriginalBytesVerified!==false ||
              r.physicalPaintingUniquenessVerified!==false || r.matchedToCanonical383!==false ||
              r.productionMutation!==false) || c.canonical383NewLinks!==0 ||
             c.photosCertified!==0 || c.productionImports!==0 || data.gate.productionMutation!==false)
            throw Error('Rijks official report source/release guards invalid');
          console.log('Official source evidence counts',JSON.stringify(c,null,2));
          NODE
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-rijks-66-official-linked-art-report-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Research source evidence unchanged'
            exit 0
          fi
          git commit -m "research(sacred-art): preserve official Rijks 66 accession evidence [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
