name: Scripture contracts
on:
  pull_request:
    paths:
      - 'src/scripture/**'
      - 'tests/scripture-*.mjs'
      - 'package.json'
      - '.github/workflows/scripture-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/scripture/**'
      - 'tests/scripture-*.mjs'
      - 'package.json'
# Cancel obsolete revisions of the same pull request; never cancel manual or main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:scripture
