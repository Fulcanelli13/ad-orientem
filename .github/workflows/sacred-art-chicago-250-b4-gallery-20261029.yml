name: Sacred Art — Chicago B4 250-work independent import-only review
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - scripts/art/build-sacred-art-chicago-b4-review-20261029.py
      - data/calendar/sacred-art-artic-250-b4-20261029.v1.json
      - .github/workflows/sacred-art-chicago-250-b4-gallery-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-art-chicago-b4-gallery
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 250-item standalone gallery from verified source data
        run: |
          if [ ! -f data/calendar/sacred-art-artic-250-b4-20261029.v1.json ]; then
            echo 'Verified B4 records not yet archived'; exit 0
          fi
          python -m py_compile scripts/art/build-sacred-art-chicago-b4-review-20261029.py
          python scripts/art/build-sacred-art-chicago-b4-review-20261029.py
      - name: Verify 250 card JSON, native Javascript, B3/B4 isolation, only two import choices
        run: |
          if [ ! -f docs/SACRED_ART_CHICAGO_250_WORK_IMPORT_REVIEW_B4_20261029.html ]; then exit 0; fi
          python - <<'PY'
          import json,re
          from pathlib import Path
          h=Path('docs/SACRED_ART_CHICAGO_250_WORK_IMPORT_REVIEW_B4_20261029.html').read_text()
          m=re.search(r'<script id="catalog-data" type="application/json">(.*?)</script>',h,re.S)
          assert m
          rows=json.loads(m.group(1))
          b3=json.loads(Path('data/calendar/sacred-art-250-review-source-b3-20261029.v1.json').read_text())
          user=json.loads(Path('data/calendar/sacred-art-20261029-user-60-import-reject-ledger.v1.json').read_text())
          earlier={x['id'] for x in b3['rows']} | {x['sourceId'] for z in ('imports','rejects') for x in user[z]}
          ids={x['id'] for x in rows}
          assert 200<=len(rows)<=250 and len(ids)==len(rows) and not ids&earlier
          assert len(earlier)==310
          assert all(x['provider']=='ArtInstituteChicago' for x in rows)
          assert all(x['previewURL'].startswith('https://www.artic.edu/iiif/2/') for x in rows)
          assert 'const PAGE_SIZE=50' in h
          assert 'seenPages.length<TOTAL_PAGES' in h
          assert 'Import with corrections' in h and 'Finalize and export decisions' in h
          assert "batchId:'B4'" in h and "B4-chicago" in h
          assert "for(let score=" not in h
          js=re.search(r'</script><script>(.*?)</script></body></html>',h,re.S)
          assert js
          Path('/tmp/ao-b4-gallery.js').write_text(js.group(1))
          print('B4_HTML_250_PASS',len(ids))
          PY
          node --check /tmp/ao-b4-gallery.js
          echo 'B4_JAVASCRIPT_PASS'
          git diff --exit-code -- data/calendar/sacred-art-250-review-source-b3-20261029.v1.json data/calendar/sacred-art-20261029-user-60-import-reject-ledger.v1.json
      - name: Preserve Chicago B4 review as a distinct file
        run: |
          if [ ! -f docs/SACRED_ART_CHICAGO_250_WORK_IMPORT_REVIEW_B4_20261029.html ]; then exit 0; fi
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SACRED_ART_CHICAGO_250_WORK_IMPORT_REVIEW_B4_20261029.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): build independent Chicago B4 250 painting import-only gallery"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
