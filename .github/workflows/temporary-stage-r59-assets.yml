name: R59 temporary asset import on review branch

on:
  push:
    branches: [feature/explore-r59-remaining-place-photos-20261011]
    paths: [.github/workflows/temporary-stage-r59-assets.yml]

permissions:
  contents: write

jobs:
  import-originals:
    if: github.ref == 'refs/heads/feature/explore-r59-remaining-place-photos-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Reconfirm source and actual license, stage ten
        run: python tools/stage-place-media-r59.py
      - name: Transfer only eight editorially selected, source-verified derivatives
        run: |
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          report=json.loads(Path('data/geography/research/place-media-stage-report-r59.v1.json').read_text())
          approved_ids={
            'place:FR:chartres-notre-dame',
            'place:FR:sainte-anne-d-auray',
            'place:FR:rue-du-bac',
            'place:PL:jasna-gora',
            'place:IE:knock-shrine',
            'place:DE:altoetting-gnadenkapelle',
            'place:UG:namugongo-martyrs',
            'place:BR:aparecida-national-shrine',
          }
          entries=[r for r in report['media'] if r['place_id'] in approved_ids]
          assert len(entries)==8
          for e in entries:
            assert e['status']=='STAGED_NOT_APPROVED',e
            assert e['license']=='CC-BY-SA-4.0'
            src=Path(e['asset_path'])
            assert src.is_file()
            assert hashlib.sha256(src.read_bytes()).hexdigest()==e['derivative_sha256']
            out=Path('assets/approved/place-media')/src.name
            assert not out.exists()
            out.parent.mkdir(parents=True,exist_ok=True)
            shutil.copyfile(src,out)
            assert hashlib.sha256(out.read_bytes()).hexdigest()==e['derivative_sha256']
          print('Eight actual CC BY-SA 4.0 image derivatives verified and copied; older-license files excluded.')
          PY
      - name: Commit exact image binaries to temporary review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/
          git diff --cached --quiet && exit 1
          git commit -m "Explore R59: store eight rights-verified image assets for editorial release [skip ci]"
          git push origin HEAD:feature/explore-r59-remaining-place-photos-20261011
