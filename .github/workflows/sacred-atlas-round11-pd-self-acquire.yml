name: Sacred Atlas Round 11 exact PD-self source acquisition
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round11-pd-self-selected-cover-manifest-20261104.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round11-pd-self-originals.py'
      - '.github/workflows/sacred-atlas-round11-pd-self-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-11-original-selected-pd-self-files:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round11-pd-self-11-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install Pillow==11.3.0
      - name: Audit eleven first-rank Commons PD-self originals with exact revision and SHA1
        run: python 'tools/atlas/acquire-sacred-atlas-round11-pd-self-originals.py'
      - name: Preserve all eleven source verification outcomes even on 429
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-atlas-round11-source-evidence
          path: data/geography/research/sacred-atlas-round11-pd-self-source-evidence-20261104.v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit only source-verified approved Place binaries and evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-media/ data/geography/research/sacred-atlas-round11-pd-self-source-evidence-20261104.v1.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/ \
            data/geography/approved-place-media.v1.json \
            data/geography/research/sacred-atlas-round11-pd-self-source-evidence-20261104.v1.json
          git commit -m "assets(atlas): import independently checked PD-self church photos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
