name: Angelus Tanner art materialization

on:
  push:
    branches:
      - feature/angelus-cinematic-reader-20261011
    paths:
      - .github/workflows/angelus-tanner-art.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angelus-tanner-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-offline-art:
    if: github.repository == 'Fulcanelli13/ad-orientem' && github.ref == 'refs/heads/feature/angelus-cinematic-reader-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/angelus-cinematic-reader-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated image encoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Materialize the identified Commons reproduction
        run: python tools/build-tanner-angelus-art.py
      - name: Verify pixel dimensions, ledger and same-image provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          root=Path('assets/pray/angelus')
          img=root/'tanner-annunciation-1898.webp'
          ledger=json.loads((root/'tanner-annunciation-1898.provenance.json').read_text('utf-8'))
          assert img.is_file() and img.stat().st_size <= 550_000
          assert Image.open(img).size[0] >= 1500
          assert ledger['digitalSource']['license'] == 'Public Domain Mark 1.0'
          assert ledger['derivative']['sha256'] == hashlib.sha256(img.read_bytes()).hexdigest()
          assert ledger['derivative']['transformation'].startswith('Downscale')
          print('Offline Tanner art provenance: verified')
          PY
      - name: Commit generated binary to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ad-orientem-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pray/angelus/tanner-annunciation-1898.webp assets/pray/angelus/tanner-annunciation-1898.provenance.json
          if git diff --cached --quiet; then
            echo "Asset already generated; no additional commit"
            exit 0
          fi
          git commit -m "asset(pray): package Tanner public-domain Annunciation WebP [offline art]"
          git pull --rebase origin feature/angelus-cinematic-reader-20261011
          git push origin HEAD:feature/angelus-cinematic-reader-20261011
