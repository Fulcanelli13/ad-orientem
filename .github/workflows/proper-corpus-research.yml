name: Proper corpus research

on:
  push:
    branches:
      - research/core-201-350-resolved-propers
    paths:
      - "tools/build_core_proper_corpus.mjs"
      - ".github/workflows/proper-corpus-research.yml"

jobs:
  resolved-proper-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Resolve canonical Proper corpus
        run: node tools/build_core_proper_corpus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-proper-corpus
          path: artifacts/core-proper-corpus/
          if-no-files-found: error
          retention-days: 14
