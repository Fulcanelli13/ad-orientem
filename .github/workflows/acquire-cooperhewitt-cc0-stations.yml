name: Acquire complete Cooper Hewitt 1749 Stations (CC0 research)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acquire-cooperhewitt-cc0
  cancel-in-progress: false

jobs:
  acquire-all-14:
    if: ${{ false }} # User rejected etching medium; prevent further acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image processing library
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download and validate all 14 original files then prepare permanent derivatives
        run: python scripts/acquire_cooperhewitt_stations.py
      - name: Assert exactly fourteen valid images with no runtime publication
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('data/prayer/stations/cooperhewitt-via-crucis-1749')
          a=json.loads((root/'acquisition-results.v1.json').read_text())
          assert a['downloadedAndConverted']==14
          assert a['sourceOriginalCount']==14
          assert a['livePrayerImagesPublished']==0
          assert a['previouslyApprovedImagesReplaced']==0
          assert len(set(x['derivativeSHA256'] for x in a['stations']))==14
          for row in a['stations']:
              p=Path(row['derivativePath'])
              assert p.exists() and p.stat().st_size>80000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['derivativeSHA256']
              assert row['productionReady'] is False
          print('PASS: all fourteen unique Smithsonian CC0 Stations archived without Prayer publication')
          PY
      - name: Persist verified research images in Git, not expiring Actions artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prayer/stations/cooperhewitt-via-crucis-1749/images data/prayer/stations/cooperhewitt-via-crucis-1749/acquisition-results.v1.json
          if git diff --cached --quiet; then
            echo 'Complete archive already committed; no changes'
          else
            git commit -m 'Research archive: fourteen high-quality Cooper Hewitt CC0 Stations images'
            git push origin HEAD:research/stations-cooperhewitt-cc0-20261031
          fi
