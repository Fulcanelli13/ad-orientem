name: Sacred Art Phase 20 — canvas identity and provenance (research-only)
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/iiif_canvas_identity_audit.py'
      - 'scripts/sacred-art/commons_provenance_157.py'
      - '.github/workflows/sacred-art-phase20-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: sacred-art-phase20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas-identity:
    name: Compare every IIIF canvas with the owner-selected photograph
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image-audit dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Reuse Phase 18 downloaded owner-selected images
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase18-iiif-audit-20-research-only
          run-id: 42112061358
          github-token: ${{ github.token }}
          path: reference-artifact
      - name: Validate and run canvas-aware visual identity audit
        run: |
          python -m py_compile scripts/sacred-art/iiif_canvas_identity_audit.py
          python scripts/sacred-art/iiif_canvas_identity_audit.py --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase20-canvas-identity-research-only
          path: artifacts/sacred-art-phase20-canvas/
          if-no-files-found: warn
          retention-days: 7

  recover-museum-crosswalk:
    name: Recover Commons provenance for 157 handpicked artworks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install request client
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Reuse prior successful Commons page records
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase20-commons-provenance-157-research-only
          run-id: 42168618666
          github-token: ${{ github.token }}
          path: reference-provenance
      - name: Validate and extract source hints without promoting images
        run: |
          python -m py_compile scripts/sacred-art/commons_provenance_157.py
          python scripts/sacred-art/commons_provenance_157.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase20-commons-provenance-157-research-only
          path: artifacts/sacred-art-phase20-provenance/
          if-no-files-found: warn
          retention-days: 7
