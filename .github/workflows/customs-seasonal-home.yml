name: Customs seasonal Home editorial integrity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/customs/seasonal-home-spotlight.js"
      - "src/customs/year-led-library.js"
      - "src/calendar/calendar-runtime.js"
      - "src/home/today-v2-sections.js"
      - "src/home/today-v2-styles.js"
      - "src/home/presentation.js"
      - "tests/customs-seasonal-home-year.mjs"
      - "tests/customs-seasonal-home-visual-e2e.mjs"
      - ".github/workflows/customs-seasonal-home.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  year-led-spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify sourced approved-only year-led Home Customs spotlight
        run: |
          node --check src/customs/seasonal-home-spotlight.js
          node --check src/customs/year-led-library.js
          node --check src/calendar/calendar-runtime.js
          node --check src/home/today-v2-sections.js
          node --check src/home/presentation.js
          node --check tests/customs-seasonal-home-year.mjs
          node tests/customs-seasonal-home-year.mjs
          node tests/calendar-customs-context.mjs
          node tests/calendar-customs-search.mjs

  real-home-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture Candlemas, Palm Sunday, All Souls at 390px and desktop
        run: |
          node --check tests/customs-seasonal-home-visual-e2e.mjs
          node tests/customs-seasonal-home-visual-e2e.mjs
      - name: Publish review screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customs-home-seasonal-visual-review
          path: artifacts/customs-home-visual/
          if-no-files-found: warn
          retention-days: 14
