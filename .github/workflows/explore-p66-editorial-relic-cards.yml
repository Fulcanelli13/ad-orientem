name: Explore P66 editorial source and relic cards
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/find/place-profiles.js'
      - 'src/find/place-editorial-presentation.js'
      - 'src/find/explore-presentation.js'
      - 'src/find/heritage-style.js'
      - 'tests/explore-p66-editorial-relic-cards.mjs'
      - 'tests/explore-sacred-venerated-image-presentation.mjs'
      - 'tests/explore-sacred-atlas-round01-two-published-photos.mjs'
      - 'tests/explore-sacred-atlas-round02-two-published-photos.mjs'
      - 'tests/explore-sacred-atlas-round03-two-published-photos.mjs'
      - 'tests/explore-sacred-atlas-round04-one-published-photo.mjs'
      - 'data/geography/research/sacred-atlas-round2-four-photo-decision-20261103.v1.json'
      - 'data/geography/research/sacred-atlas-round3-four-photo-decision-20261103.v1.json'
      - 'data/geography/research/sacred-atlas-round4-four-photo-decision-20261103.v1.json'
      - 'data/geography/approved-place-gallery.v1.json'
      - 'data/geography/research/sacred-atlas-round1-four-photo-release-20261103.v1.json'
      - 'tests/explore-place-profiles.mjs'
      - 'tests/explore-r69-multi-place-gallery.mjs'
      - 'data/explore/sacred-phenomena-seed.v1.json'
      - '.github/workflows/explore-p66-editorial-relic-cards.yml'
  push:
    branches: [main]
    paths:
      - 'src/find/place-profiles.js'
      - 'src/find/place-editorial-presentation.js'
      - 'src/find/explore-presentation.js'
      - 'src/find/heritage-style.js'
      - 'tests/explore-p66-editorial-relic-cards.mjs'
      - 'tests/explore-sacred-venerated-image-presentation.mjs'
      - 'tests/explore-sacred-atlas-round01-two-published-photos.mjs'
      - 'tests/explore-sacred-atlas-round02-two-published-photos.mjs'
      - 'tests/explore-sacred-atlas-round03-two-published-photos.mjs'
      - 'tests/explore-sacred-atlas-round04-one-published-photo.mjs'
      - 'data/geography/research/sacred-atlas-round2-four-photo-decision-20261103.v1.json'
      - 'data/geography/research/sacred-atlas-round3-four-photo-decision-20261103.v1.json'
      - 'data/geography/research/sacred-atlas-round4-four-photo-decision-20261103.v1.json'
      - 'data/geography/approved-place-gallery.v1.json'
      - 'data/geography/research/sacred-atlas-round1-four-photo-release-20261103.v1.json'
permissions:
  contents: read
jobs:
  place-editorial-folio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source-verified stories, relic custody and local customs
        run: node tests/explore-p66-editorial-relic-cards.mjs
      - name: Existing Place and gallery regressions
        run: |
          node tests/explore-place-profiles.mjs
          node tests/explore-r69-multi-place-gallery.mjs
      - name: Source-approved sacred image and attribution presentation
        run: node tests/explore-sacred-venerated-image-presentation.mjs
      - name: Sacred Atlas Round 1 requires actual new approved image bytes and bilingual galleries
        run: node tests/explore-sacred-atlas-round01-two-published-photos.mjs
      - name: Sacred Atlas Round 2 requires two verified original WebPs and precise Place display
        run: node tests/explore-sacred-atlas-round02-two-published-photos.mjs
      - name: Sacred Atlas Round 3 requires pinned Rocamadour and Goa WebPs in correct EN/FR Place galleries
        run: node tests/explore-sacred-atlas-round03-two-published-photos.mjs
      - name: Sacred Atlas Round 4 requires exact Chartres original, 3 rights holds and bilingual Place gallery
        run: node tests/explore-sacred-atlas-round04-one-published-photo.mjs
      - name: Read-only cross-owner release boundaries
        run: node tests/connected-sacred-entities-p64.mjs
