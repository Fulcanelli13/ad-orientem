name: Sacred Art exact museum download-link discovery

# Discover first-party museum media records; do not fetch image bytes.
on:
  pull_request:
    paths:
      - 'data/artwork/research/m2m-nationalmuseum-mnk-download-link-discovery-20261110.v1.json'
      - 'scripts/sacred-art-find-museum-download-links.py'
      - 'tests/sacred-art-museum-download-link-discovery-research.test.mjs'
      - '.github/workflows/sacred-art-museum-download-link-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  museum-portal-metadata:
    name: inspect four exact museum portal records
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out research PR
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect exact museum identities and image release holds
        run: node tests/sacred-art-museum-download-link-discovery-research.test.mjs
      - name: Collect bounded first-party portal search evidence
        run: |
          python scripts/sacred-art-find-museum-download-links.py \
            --manifest data/artwork/research/m2m-nationalmuseum-mnk-download-link-discovery-20261110.v1.json \
            --output research-museum-link-discovery
      - name: Retain metadata-only report for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-orientem-museum-download-link-discovery
          path: research-museum-link-discovery/report.json
          retention-days: 7
          if-no-files-found: warn
