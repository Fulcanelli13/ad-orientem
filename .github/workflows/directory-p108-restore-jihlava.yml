name: P108 one-time Jihlava source-pinned WebP restoration
on:
  pull_request:
    paths:
      - tools/directory/restore-p108-jihlava-webp.py
      - data/directory/research/p108-jihlava-source-locked-approved-cover-input.v1.json
      - .github/workflows/directory-p108-restore-jihlava.yml
permissions:
  contents: write
jobs:
  restore-one-source-pinned-webp:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p108-jihlava-approved-church-cover-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Fetch immutable P107 source archive
        run: git fetch --depth=50 origin research/p107-alternate-church-photos-newbrighton-reconcile-20261030
      - name: Restore SHA-verified Jihlava photo
        run: python3 tools/directory/restore-p108-jihlava-webp.py
      - name: Commit source-identical output and audit, no licence shortcuts
        shell: bash
        run: |
          git add assets/approved/place-media/CZ-st-ignatius-jihlava.webp \
            data/directory/research/p108-jihlava-approved-cover-byte-audit.v1.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'media(directory): restore source-matched Jihlava WebP without reencoding'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
