name: Sacred Atlas Round 6 acquire 16 originally selected missing covers
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round6-selected-16-cover-manifest-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round6-16-covers.py'
      - '.github/workflows/sacred-atlas-round6-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-original-source-covers:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round06-selected-16-covers-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact image conversion dependency
        run: python -m pip install Pillow==11.3.0
      - name: Acquire exact original Commons sources and enforce SHA1 / author / copyright / original bytes
        run: python tools/atlas/acquire-sacred-atlas-round6-16-covers.py
      - name: Commit only source-verified WebP covers, canonical registry and holds evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-media/ data/geography/research/sacred-atlas-round6-published-cover-evidence-20261103.v1.json)" ]; then
            echo 'No new original source images to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/ \
            data/geography/approved-place-media.v1.json \
            data/geography/research/sacred-atlas-round6-published-cover-evidence-20261103.v1.json
          git commit -m "assets(atlas): publish source-verified Round 6 Place covers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
