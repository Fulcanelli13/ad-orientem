name: Mass 1962 commemoration preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/mass/calendar-preflight-context.js'
      - 'src/mass/full-mass-preflight.js'
      - 'src/mass/full-mass-preflight-styles.js'
      - 'src/mass/proper-reader-slots.js'
      - 'tests/mass-1962-commemoration-preflight.mjs'
      - '.github/workflows/mass-1962-commemoration-preflight.yml'
  pull_request:
    paths:
      - 'src/mass/calendar-preflight-context.js'
      - 'src/mass/full-mass-preflight.js'
      - 'src/mass/full-mass-preflight-styles.js'
      - 'src/mass/proper-reader-slots.js'
      - 'tests/mass-1962-commemoration-preflight.mjs'
      - '.github/workflows/mass-1962-commemoration-preflight.yml'
jobs:
  source-confirmed-commemorations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/mass/calendar-preflight-context.js
      - run: node --check src/mass/full-mass-preflight.js
      - run: node tests/mass-1962-commemoration-preflight.mjs
      - run: node tests/full-mass-preflight.mjs
      - run: node tests/proper-reader-slots.mjs
