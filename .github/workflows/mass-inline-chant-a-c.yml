name: Mass inline Gregorian notation A/C acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/mass/reader-inline-chant.js'
      - 'src/mass/reader-participation-neume-policy.js'
      - 'src/mass/reader-participation-reference-scores.js'
      - 'src/mass/reader-gospel-response-reference-scores.js'
      - 'src/mass/reader-dismissal-variant-reference-scores.js'
      - 'src/mass/reader-canon-pax-response-reference-scores.js'
      - 'tests/reader-canon-pax-responses.mjs'
      - 'src/mass/reader-oration-amen-source-handoff.js'
      - 'src/mass/reader-oration-festive-amen-reference.js'
      - 'tests/reader-oration-festive-amen-reference.mjs'
      - 'tests/reader-oration-festive-amen-phone.mjs'
      - 'tests/reader-oration-amen-source-handoff.mjs'
      - 'data/mass/oration-amen-notation-source-gate.v1.json'
      - 'data/mass/participation-amen-1962-coverage.v1.json'
      - 'tests/reader-dismissal-variant-reference.mjs'
      - 'tests/reader-dismissal-variant-phone.mjs'
      - 'tests/reader-participation-reference-scores.mjs'
      - 'tests/reader-participation-reference-phone.mjs'
      - 'tests/reader-participation-neume-policy.mjs'
      - 'src/mass/reader-inline-proper-reference.js'
      - 'src/mass/reader-inline-all-saints-reference.js'
      - 'src/mass/reader-inline-proper-registry.js'
      - 'tests/reader-inline-proper-registry.mjs'
      - 'tests/reader-inline-all-saints-phone.mjs'
      - 'tests/reader-inline-proper-july07-phone.mjs'
      - 'src/mass/reader-inline-chant-selector.js'
      - 'src/mass/reader-inline-chant-bulk-review.js'
      - 'tests/reader-inline-chant-generic-source.mjs'
      - 'tests/reader-inline-chant-bulk-review.mjs'
      - 'tests/reader-inline-chant-bulk-91-source-queue.mjs'
      - 'scripts/schola/build-91-inline-review-queue.mjs'
      - 'data/research/mass-music-1962-91-inline-review-queue.v1.json'
      - 'src/mass/reader-inline-chant-approved.js'
      - 'src/mass/reader-dom.js'
      - 'tests/reader-inline-chant-a-c*.mjs'
      - '.github/workflows/mass-inline-chant-a-c.yml'

permissions:
  contents: read

jobs:
  inline-chant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse source, preserve source-first reader imports
        run: |
          node --check src/mass/reader-inline-chant.js
          node --check src/mass/reader-participation-neume-policy.js
          node --check src/mass/reader-participation-reference-scores.js
          node --check src/mass/reader-gospel-response-reference-scores.js
          node --check src/mass/reader-dismissal-variant-reference-scores.js
          node --check src/mass/reader-canon-pax-response-reference-scores.js
          node --check src/mass/reader-oration-amen-source-handoff.js
          node --check src/mass/reader-oration-festive-amen-reference.js
          node --check tests/reader-oration-festive-amen-reference.mjs
          node --check tests/reader-oration-festive-amen-phone.mjs
          node --check tests/reader-oration-amen-source-handoff.mjs
          node --check tests/reader-canon-pax-responses.mjs
          node --check tests/reader-dismissal-variant-reference.mjs
          node --check tests/reader-dismissal-variant-phone.mjs
          node --check tests/reader-participation-reference-scores.mjs
          node --check tests/reader-participation-reference-phone.mjs
          node --check tests/reader-participation-neume-policy.mjs
          node --check src/mass/reader-inline-proper-reference.js
          node --check src/mass/reader-inline-all-saints-reference.js
          node --check src/mass/reader-inline-proper-registry.js
          node --check tests/reader-inline-proper-registry.mjs
          node --check tests/reader-inline-all-saints-phone.mjs
          node --check tests/reader-inline-proper-july07-phone.mjs
          node --check src/mass/reader-inline-chant-selector.js
          node --check src/mass/reader-inline-chant-bulk-review.js
          node --check src/mass/reader-dom.js
          node tests/reader-inline-chant-a-c.mjs
          node tests/reader-participation-neume-policy.mjs
          node tests/reader-participation-reference-scores.mjs
          node tests/reader-dismissal-variant-reference.mjs
          node tests/reader-canon-pax-responses.mjs
          node tests/reader-oration-amen-source-handoff.mjs
          node tests/reader-oration-festive-amen-reference.mjs
          node tests/reader-inline-chant-generic-source.mjs
          node tests/reader-inline-proper-registry.mjs
          node tests/reader-proper-gabc-bulk-join.mjs
          node tests/reader-inline-chant-bulk-review.mjs
          node tests/reader-inline-chant-bulk-91-source-queue.mjs
      - name: Prepare source-backed browser validation
        run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify 390 and 320 px compact score alongside intact Latin, independent toggle, Low fallback
        run: |
          node tests/reader-inline-chant-a-c-phone.mjs
          node tests/reader-participation-reference-phone.mjs
          node tests/reader-dismissal-variant-phone.mjs
          node tests/reader-oration-festive-amen-phone.mjs
          node tests/reader-inline-proper-july07-phone.mjs
          node tests/reader-inline-all-saints-phone.mjs

      - name: Retain 320 and 390 px source-notation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-1961-inline-july07-screens
          path: .tmp/mass-inline-proper-july07/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Retain All Saints 320 and 390 px notation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-1961-inline-all-saints-screens
          path: .tmp/mass-inline-all-saints/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Retain 1961 participation source-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-participation-research-reference-neumes
          path: .tmp/mass-participation-preview/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Retain 1961 festive oration Amen research phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-oration-amen-1961-preview-screens
          path: .tmp/mass-oration-amen-preview/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Retain 1961 dismissal alternatives research phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-dismissal-variant-source-neumes
          path: .tmp/mass-dismissal-variant-preview/*.png
          if-no-files-found: warn
          retention-days: 14
