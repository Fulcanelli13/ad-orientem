name: Mass inline Gregorian notation A/C acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/mass/reader-inline-chant.js'
      - 'src/mass/reader-inline-proper-reference.js'
      - 'src/mass/reader-inline-all-saints-reference.js'
      - 'src/mass/reader-inline-proper-registry.js'
      - 'tests/reader-inline-proper-registry.mjs'
      - 'tests/reader-inline-all-saints-phone.mjs'
      - 'tests/reader-inline-proper-july07-phone.mjs'
      - 'src/mass/reader-inline-chant-selector.js'
      - 'src/mass/reader-inline-chant-bulk-review.js'
      - 'tests/reader-inline-chant-generic-source.mjs'
      - 'tests/reader-inline-chant-bulk-review.mjs'
      - 'tests/reader-inline-chant-bulk-91-source-queue.mjs'
      - 'scripts/schola/build-91-inline-review-queue.mjs'
      - 'data/research/mass-music-1962-91-inline-review-queue.v1.json'
      - 'src/mass/reader-inline-chant-approved.js'
      - 'src/mass/reader-dom.js'
      - 'tests/reader-inline-chant-a-c*.mjs'
      - '.github/workflows/mass-inline-chant-a-c.yml'

permissions:
  contents: read

jobs:
  inline-chant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse source, preserve source-first reader imports
        run: |
          node --check src/mass/reader-inline-chant.js
          node --check src/mass/reader-inline-proper-reference.js
          node --check src/mass/reader-inline-all-saints-reference.js
          node --check src/mass/reader-inline-proper-registry.js
          node --check tests/reader-inline-proper-registry.mjs
          node --check tests/reader-inline-all-saints-phone.mjs
          node --check tests/reader-inline-proper-july07-phone.mjs
          node --check src/mass/reader-inline-chant-selector.js
          node --check src/mass/reader-inline-chant-bulk-review.js
          node --check src/mass/reader-dom.js
          node tests/reader-inline-chant-a-c.mjs
          node tests/reader-inline-chant-generic-source.mjs
          node tests/reader-inline-proper-registry.mjs
          node tests/reader-proper-gabc-bulk-join.mjs
          node tests/reader-inline-chant-bulk-review.mjs
          node tests/reader-inline-chant-bulk-91-source-queue.mjs
      - name: Prepare source-backed browser validation
        run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify 390 and 320 px visible score, independent text toggle and Low Mass fallback
        run: |
          node tests/reader-inline-chant-a-c-phone.mjs
          node tests/reader-inline-proper-july07-phone.mjs
          node tests/reader-inline-all-saints-phone.mjs

      - name: Retain 320 and 390 px source-notation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-1961-inline-july07-screens
          path: .tmp/mass-inline-proper-july07/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Retain All Saints 320 and 390 px notation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-1961-inline-all-saints-screens
          path: .tmp/mass-inline-all-saints/*.png
          if-no-files-found: warn
          retention-days: 14
