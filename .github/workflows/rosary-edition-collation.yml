name: Rosary DRC Crampon collation
on:
  pull_request:
    paths:
      - 'tools/scripture/collate-rosary-editions.mjs'
      - '.github/workflows/rosary-edition-collation.yml'
      - 'data/pray/rosary-scripture-editorial-inventory.v1.json'
      - 'data/pray/rosary-primary-edition-review.v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-catholic-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Catholic digital transcripts (not published in app)
        run: |
          set -euo pipefail
          REV=e1b254cef86d0e65b1a5d1a94b8b112d0f296a2c
          BASE=https://raw.githubusercontent.com/scrollmapper/bible_databases/$REV/sources
          curl -fLsS --retry 3 "$BASE/en/DRC/DRC.zip" -o /tmp/rosary-drc.zip
          curl -fLsS --retry 3 "$BASE/fr/FreCrampon/FreCrampon.zip" -o /tmp/rosary-crampon.zip
          mkdir -p /tmp/rosary-drc /tmp/rosary-crampon
          unzip -oq /tmp/rosary-drc.zip -d /tmp/rosary-drc
          unzip -oq /tmp/rosary-crampon.zip -d /tmp/rosary-crampon
          echo 'English archive:'; find /tmp/rosary-drc -type f | head -8
          echo 'French archive:'; find /tmp/rosary-crampon -type f | head -8
          EN=$(find /tmp/rosary-drc -type f -name '*.json' -print -quit)
          FR=$(find /tmp/rosary-crampon -type f -name '*.json' -print -quit)
          test -n "$EN" && test -n "$FR"
          echo "EN_FILE=$EN" >> "$GITHUB_ENV"
          echo "FR_FILE=$FR" >> "$GITHUB_ENV"
      - name: Collate all 200 original Rosary cues without publishing Bible text
        run: node tools/scripture/collate-rosary-editions.mjs "$EN_FILE" "$FR_FILE" /tmp/rosary-edition-collation.json
      - uses: actions/upload-artifact@v4
        with:
          name: rosary-catholic-edition-collation
          path: /tmp/rosary-edition-collation.json
          retention-days: 7
