name: TLM Wave A Commons CC0 source review (no publication)
on:
  pull_request:
    paths:
      - .github/workflows/tlm-wave-a-cc0-review.yml
      - tools/directory/stage_tlm_cc0_originals.py
      - data/directory/research/tlm-wave-a-cc0-commons-preflight-20261101.v1.json
      - data/directory/research/tlm-photo-audit-739-existing-archive-reconcile-part-*.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tlm-wave-a-cc0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-originals-and-render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local image encoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=10.0,<13.0'
      - name: Verify pinned originals and prepare full-frame review artifacts only
        run: python tools/directory/stage_tlm_cc0_originals.py
      - name: Upload evidence and contact sheet — NOT production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlm-wave-a-cc0-review-${{ github.sha }}
          path: artifacts/tlm-wave-a-cc0-review/
          if-no-files-found: error
          retention-days: 7
