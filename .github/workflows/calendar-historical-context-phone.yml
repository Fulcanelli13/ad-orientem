name: Calendar ICRSP historical context — actual phone acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/calendar/calendar-runtime.js'
      - 'src/calendar/historical-context.js'
      - 'src/calendar/historical-context-ui.js'
      - 'src/calendar/intelligence.js'
      - 'tests/calendar-historical-context-phone.mjs'
      - '.github/workflows/calendar-historical-context-phone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-context-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Actual 390px Calendar day, source disclosure and impeded saint
        run: node tests/calendar-historical-context-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-history-phone-screenshots
          path: artifacts/calendar-historical-context/
          retention-days: 30
          if-no-files-found: warn
