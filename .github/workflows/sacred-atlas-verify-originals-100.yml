name: Sacred Atlas — verify 100 exact Commons original files
on:
  push:
    branches:
      - research/atlas-original-check-100-20261031
    paths:
      - "data/geography/research/sacred-atlas-original-integrity-100-20261031.v1.json"
      - "tools/sacred-atlas-verify-originals-100.mjs"
      - ".github/workflows/sacred-atlas-verify-originals-100.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-atlas-original-100-source-integrity
  cancel-in-progress: false

jobs:
  verify-exact-commons-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/atlas-original-check-100-20261031
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify 100 exact canonical Place and source contracts (no internet)
        run: node tools/sacred-atlas-verify-originals-100.mjs --selftest
      - name: Download, inspect magic bytes and SHA1, discard downloaded originals
        run: node tools/sacred-atlas-verify-originals-100.mjs
      - name: Check result schema, zero publication and 100 unique canonical Place owners
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const p="data/geography/research/sacred-atlas-original-integrity-100-20261031.results.json";
            const x=JSON.parse(readFileSync(p));
            if(x.results.length!==100||new Set(x.results.map(y=>y.place_id)).size!==100)process.exit(1);
            if(x.summary.verified_original_source_bytes+x.summary.holds!==100)process.exit(1);
            if(x.summary.newly_archived_image_files!==0||x.summary.published!==0)process.exit(1);
            if(x.results.some(y=>y.published||y.publishable||y.underlying_artwork_rights_cleared||y.source_identity_visually_verified))process.exit(1);
            console.log(x.summary);
          '
      - name: Permanently record exact original hash verification receipts — no photos published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/research/sacred-atlas-original-integrity-100-20261031.results.json
          if git diff --cached --quiet; then echo "No new source receipt"; exit 0; fi
          git commit -m "research(atlas): persist 100 exact Commons original SHA1 verification receipts"
          git fetch origin research/atlas-original-check-100-20261031
          git rebase origin/research/atlas-original-check-100-20261031
          git push origin HEAD:research/atlas-original-check-100-20261031
