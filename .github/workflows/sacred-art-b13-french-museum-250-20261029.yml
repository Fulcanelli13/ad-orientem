name: Sacred Art B13 — French museums 250 PD sacred painting gallery
on:
  push:
    branches: [research/sacred-art-b13-french-museums-20261029]
    paths:
      - scripts/art/sacred-art-b13-french-museum-250-review-20261029.py
      - .github/workflows/sacred-art-b13-french-museum-250-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-b13-french-museum-250
  cancel-in-progress: true
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b13-french-museums-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan French-museum Commons sources and verify public-domain image bytes
        run: |
          python -m py_compile scripts/art/sacred-art-b13-french-museum-250-review-20261029.py
          python -u scripts/art/sacred-art-b13-french-museum-250-review-20261029.py
      - name: Validate 250 review cards with French museum association and 2205 exclusions
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          d=json.loads(Path('data/calendar/sacred-art-b13-french-museums-250-20261029.v1.json').read_text())
          a=d['rows'];c=d['counts']
          assert d['batchReady'] and len(a)==c['reviewable']==250,('incomplete',c)
          assert c['frenchMuseumAssociated']>=70,('insufficient French museum inclusion',c)
          assert c['priorBatchesSourceIdsExcluded']==2205
          assert c['originalImagesAcquired']==c['productionImports']==0
          assert len({x['id'] for x in a})==len({x['previewURL'] for x in a})==250
          assert all(x['licenseShortName'].lower() in ('public domain','cc0','cc0 1.0') for x in a)
          assert all(x['sourceRights']=='WIKIMEDIA_COMMONS_EXACT_FILE_PUBLIC_DOMAIN_OR_CC0' for x in a)
          assert all(min(x['nativeSourceDimensions'].values())>=1600 and x['imageRightsVerified'] for x in a)
          assert d['batchSha256']==hashlib.sha256(json.dumps([x['id'] for x in a],separators=(',',':')).encode()).hexdigest()
          h=Path('docs/SACRED_ART_B13_FRENCH_MUSEUMS_250_IMPORT_REVIEW_20261029.html').read_text()
          m=re.search(r'<script id="catalog-data" type="application/json">(.*?)</script>',h,re.S)
          assert m and json.loads(m.group(1))==a
          assert "batchId:'B13'" in h and 'const PAGE_SIZE=50;' in h
          assert 'IMPORT_WITH_CORRECTIONS' in h and 'seenPages.length<TOTAL_PAGES' in h
          js=re.search(r'</script><script>(.*?)</script></body></html>',h,re.S)
          assert js
          Path('/tmp/ao-b13-gallery.js').write_text(js.group(1))
          print('B13_PASSED',c)
          PY
          node --check /tmp/ao-b13-gallery.js
      - name: Archive rights-verified candidate gallery on isolated research branch
        if: success()
        run: |
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b13-french-museums-250-20261029.v1.json
          git add docs/SACRED_ART_B13_FRENCH_MUSEUMS_250_SOURCE_QA_20261029.md
          git add docs/SACRED_ART_B13_FRENCH_MUSEUMS_250_IMPORT_REVIEW_20261029.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): B13 250 new PD French museum-associated sacred images"
          git pull --rebase origin research/sacred-art-b13-french-museums-20261029
          git push origin HEAD:research/sacred-art-b13-french-museums-20261029
