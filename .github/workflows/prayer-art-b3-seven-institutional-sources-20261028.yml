name: Prayer Sacred Art B3 - seven unresolved image source gates
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/prayer-art-b3-seven-institutional-sources-20261028.yml
      - scripts/art/prayer-art-b3-seven-group-institutional-intake-20261028.py
      - data/research/prayer-sacred-art-b3-seven-group-source-gates-20261028.v1.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-prayer-b3-seven-group-source-gates
  cancel-in-progress: false
jobs:
  audit-seven-and-archive-only-rights-labelled-institutional-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free pinned raster audit
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify seven cases and fetch approved research candidate
        run: |
          python -m py_compile scripts/art/prayer-art-b3-seven-group-institutional-intake-20261028.py
          python scripts/art/prayer-art-b3-seven-group-institutional-intake-20261028.py
      - name: Preserve all result records and original response bytes in research Git
        if: always()
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-art-b3-institutional-source-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then echo "No new research evidence"; exit 0; fi
          git commit -m "research(prayer art): preserve B3 seven-group IIIF photo candidate and QA evidence"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
