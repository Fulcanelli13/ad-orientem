name: Divine Office research — text, reader and native chant pilot

on:
  pull_request:
    paths:
      - 'src/office/**'
      - 'scripts/office/**'
      - 'tests/divine-office-*.mjs'
      - 'tests/test_divine_office_normalizer.py'
      - 'docs/DIVINE-OFFICE-PHASE-A-2026-10-28.md'
      - '.github/workflows/divine-office-phase-b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ao-divine-office-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source-generator JavaScript syntax
        run: |
          node --check scripts/office/phase-b-generate.mjs
          node --check scripts/office/build-research-preview.mjs
          node --check src/office/research-reader.js
          node --check src/office/source-content-gate.js
          node --check src/office/mass-style-research-reader.js
          node --check src/office/prime-martyrology-split.js
          node --check src/office/vespers-concurrence-gate.js
          node --check scripts/office/audit-vespers-concurrence.mjs
          node --check src/office/vespers-commemoration-gate.js
          node --check src/office/vespers-translation-collation.js
          node --check scripts/office/audit-vespers-commemorations.mjs
          node --check scripts/office/diagnose-french-vespers-composer.mjs
          node --check src/office/mass-style-research-ui.js
          node --check scripts/office/build-mass-style-preview.mjs
          node --check src/office/sung-vespers-gate.js
          node --check scripts/office/audit-sunday-chant.mjs
          node --check scripts/office/audit-advent-vespers-text.mjs
          node --check scripts/office/audit-printed-rubrics-pilot.mjs
          node --check scripts/office/audit-translation-risks.mjs
          node --check scripts/office/research-french-directive-overlay.mjs
          node --check scripts/office/compare-french-directive-overlay.mjs
          node --check scripts/office/audit-recovered-french-allsouls.mjs
          node --check scripts/office/audit-all-souls-prime-critical.mjs
          node --check scripts/office/audit-all-souls-proper-prayers.mjs
      - name: Calendar, Tenebrae and composition probe contracts
        run: node --test tests/divine-office-phase-a.mjs tests/divine-office-composition-probe.mjs tests/divine-office-research-reader.mjs tests/divine-office-content-scope-gate.mjs tests/divine-office-native-sung.mjs tests/divine-office-mass-style-reader.mjs tests/divine-office-prime-martyrology-split.mjs tests/divine-office-printed-rubric-pilot.mjs tests/divine-office-vespers-concurrence.mjs tests/divine-office-vespers-commemorations.mjs tests/divine-office-vespers-translations.mjs tests/divine-office-translation-risk.mjs tests/divine-office-french-directive-overlay.mjs tests/divine-office-french-provenance.mjs tests/divine-office-all-souls-prime-critical.mjs tests/divine-office-all-souls-prayers.mjs
      - name: Source-cell HTML normalizer unit tests
        run: python3 -m unittest discover -s tests -p 'test_divine_office_normalizer.py' -v

  native-sung-vespers-source-audit:
    needs: office-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned candidate Gregorian scores (research only)
        env:
          SOURCE: ${{ runner.temp }}/advent-vespers-chant
        run: |
          set -euo pipefail
          PIN=5787df436f5cd432dd95bcacdc911b3488dc3a8a
          mkdir -p "$SOURCE"
          git -C "$SOURCE" init -q
          git -C "$SOURCE" remote add origin https://github.com/asbloomf/gabc-chants.git
          git -C "$SOURCE" fetch --no-tags --depth=1 origin "$PIN"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$PIN"
      - name: Audit real score files and psalm-tone descriptors without publishing
        env:
          SOURCE: ${{ runner.temp }}/advent-vespers-chant
          REPORT: ${{ runner.temp }}/advent-chant-audit.json
        run: |
          node scripts/office/audit-sunday-chant.mjs --upstream "$SOURCE" --out "$REPORT"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const d=JSON.parse(readFileSync(process.env.REPORT,"utf8"));
            if(d.sundayDate!=="2026-11-29" || d.part!=="SECOND" ||
               d.candidateCount!==10 || d.tones.psalms.length!==5 ||
               d.publishedScores!==0 || d.chantButtonEnabled!==false ||
               d.fullSundayVespersCertified!==false || d.copyrightStatus!=="UNRESOLVED_PER_FILE")
              process.exit(1);
            console.log("Native chant proof: 10 GABC candidates, 5 psalm-tone references; NOT certified or published.");
          '
      # No assets shipped, remote scores linked to users or artifact upload.

  original-composer-smoke:
    needs: office-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install minimum upstream Perl CGI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcgi-pm-perl libcgi-session-perl libwww-perl
      - name: Fetch exact upstream revision using sparse checkout
        env:
          UPSTREAM: ${{ runner.temp }}/divinum-officium
        run: |
          set -euo pipefail
          PIN="$(sed -n 's/^export const DIVINUM_OFFICIUM_PIN="\([^"]*\)";/\1/p' src/app/source-transport-compat.js)"
          test "${#PIN}" -eq 40
          mkdir -p "$UPSTREAM"
          git -C "$UPSTREAM" init -q
          git -C "$UPSTREAM" remote add origin https://github.com/DivinumOfficium/divinum-officium.git
          git -C "$UPSTREAM" sparse-checkout init --cone
          git -C "$UPSTREAM" sparse-checkout set web/cgi-bin web/www/horas web/www/Tabulae standalone/tools/epubgen2
          git -C "$UPSTREAM" -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=1 origin "$PIN"
          git -C "$UPSTREAM" checkout --detach FETCH_HEAD
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$PIN"
      - name: Generate four dates × eight real 1960 Roman Office hours × three languages
        env:
          UPSTREAM: ${{ runner.temp }}/divinum-officium
          OUTPUT: ${{ runner.temp }}/ao-office-probe
        run: |
          node scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$OUTPUT" \
            --dates 2026-10-28,2026-10-31,2026-11-01,2026-11-03 \
            --hours MATINS,LAUDS,PRIME,TERCE,SEXT,NONE,VESPERS,COMPLINE \
            --languages la,en,fr
          python3 scripts/office/normalize_xhtml.py --out "$OUTPUT"
          node scripts/office/build-research-preview.mjs --out "$OUTPUT"
          node scripts/office/build-mass-style-preview.mjs --out "$OUTPUT" --quarantine-content-scope
          node scripts/office/audit-translation-risks.mjs --out "$OUTPUT" --report "$OUTPUT/translation-risk.json"
          # Liturgical witness for Advent I: FIRST Vespers on Saturday and
          # SECOND on Sunday. This is a fresh six-file source sample, not
          # six production scores and not part of the original 96-file pilot.
          node scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$OUTPUT/advent-vespers" \
            --dates 2026-11-28,2026-11-29 --hours VESPERS --languages la,en,fr
          python3 scripts/office/normalize_xhtml.py --out "$OUTPUT/advent-vespers"
          node scripts/office/build-mass-style-preview.mjs --out "$OUTPUT/advent-vespers"
          node scripts/office/audit-translation-risks.mjs --out "$OUTPUT/advent-vespers" --report "$OUTPUT/advent-vespers/translation-risk.json"
          node scripts/office/audit-advent-vespers-text.mjs --out "$OUTPUT/advent-vespers" --report "$OUTPUT/advent-text-audit.json"
          # All Souls is an exceptional Office, not an ordinary Class I
          # festive Office. Keep this 24-file supplementary cohort separate
          # from the frozen original 96-file pilot and Advent sample.
          node scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$OUTPUT/all-souls" \
            --dates 2026-11-02 \
            --hours MATINS,LAUDS,PRIME,TERCE,SEXT,NONE,VESPERS,COMPLINE \
            --languages la,en,fr
          python3 scripts/office/normalize_xhtml.py --out "$OUTPUT/all-souls"
          node scripts/office/build-mass-style-preview.mjs --out "$OUTPUT/all-souls" --quarantine-unaligned --quarantine-missing-translations --quarantine-content-scope
          node scripts/office/audit-translation-risks.mjs --out "$OUTPUT/all-souls" --report "$OUTPUT/all-souls/translation-risk.json"
          node scripts/office/audit-all-souls-proper-prayers.mjs \
            --souls "$OUTPUT/all-souls" --main "$OUTPUT" \
            --report "$OUTPUT/all-souls/exception-collect-audit.json"
          node scripts/office/audit-printed-rubrics-pilot.mjs \
            --main "$OUTPUT" --souls "$OUTPUT/all-souls" \
            --report "$OUTPUT/printed-rubric-audit.json"
          node scripts/office/audit-vespers-concurrence.mjs \
            --main "$OUTPUT" --advent "$OUTPUT/advent-vespers" \
            --souls "$OUTPUT/all-souls" --report "$OUTPUT/vespers-concurrence-audit.json"
          node scripts/office/audit-vespers-commemorations.mjs \
            --main "$OUTPUT" --advent "$OUTPUT/advent-vespers" \
            --souls "$OUTPUT/all-souls" --report "$OUTPUT/vespers-commemorations.json"
          # Phase J syntax-only candidate: baseline captured first.
          # This mutates the PINNED upstream checkout's WORKTREE only in CI
          # scratch, preserving its Git commit SHA but marking results as an
          # experimental overlay. No source files or scores are published.
          node scripts/office/research-french-directive-overlay.mjs \
            --upstream "$UPSTREAM" --report "$OUTPUT/all-souls-syntax/overlay-source.json"
          test "$(git -C "$UPSTREAM" diff --name-only)" = "web/www/horas/Francais/Sancti/11-02.txt"
          node scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$OUTPUT/all-souls-syntax" \
            --dates 2026-11-02 \
            --hours MATINS,LAUDS,PRIME,TERCE,SEXT,NONE,VESPERS,COMPLINE \
            --languages la,en,fr
          python3 scripts/office/normalize_xhtml.py --out "$OUTPUT/all-souls-syntax"
          node scripts/office/build-mass-style-preview.mjs --out "$OUTPUT/all-souls-syntax" --quarantine-content-scope
          node scripts/office/audit-translation-risks.mjs \
            --out "$OUTPUT/all-souls-syntax" --report "$OUTPUT/all-souls-syntax/translation-risk.json"
          node scripts/office/compare-french-directive-overlay.mjs \
            --baseline "$OUTPUT/all-souls" --candidate "$OUTPUT/all-souls-syntax" \
            --report "$OUTPUT/all-souls-syntax/comparison.json"
          test -f "$UPSTREAM/LICENSE"
          grep -q "MIT License" "$UPSTREAM/LICENSE"
          node scripts/office/audit-recovered-french-allsouls.mjs \
            --baseline "$OUTPUT/all-souls" --candidate "$OUTPUT/all-souls-syntax" \
            --upstream "$UPSTREAM" --report "$OUTPUT/all-souls-syntax/provenance-review.json"
          node scripts/office/audit-all-souls-prime-critical.mjs \
            --candidate "$OUTPUT/all-souls-syntax" \
            --report "$OUTPUT/all-souls-syntax/prime-critical-review.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const p=JSON.parse(readFileSync(process.env.OUTPUT+"/manifest.json","utf8"));
            if (p.counts.requested!==96 || p.counts.captured!==96 ||
              p.counts.failed || p.counts.published!==0 || p.researchOnly!==true)
              process.exit(1);
            console.log("Research-only envelope captures:",p.counts);
          '
      - name: Trace omitted French II Vespers in scratch composer and restore exact upstream bytes
        env:
          UPSTREAM: ${{ runner.temp }}/divinum-officium
          OUTPUT: ${{ runner.temp }}/ao-office-probe
        run: |
          node scripts/office/diagnose-french-vespers-composer.mjs \
            --upstream "$UPSTREAM" --report "$OUTPUT/french-vespers-composer-diagnostic.json"
          test -z "$(git -C "$UPSTREAM" status --porcelain)"
      - name: Assert normalization manifest coverage (no publication)
        env:
          OUTPUT: ${{ runner.temp }}/ao-office-probe
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["OUTPUT"],"normalized-manifest.json"),encoding="utf8") as f:
            doc=json.load(f)
          assert doc["count"]==96, doc["count"]
          assert doc["alignmentSamples"]==32, doc["alignmentSamples"]
          assert doc["published"]==0 and doc["liturgicallyVerified"]==0
          from pathlib import Path
          advent=json.loads((Path(os.environ["OUTPUT"])/"advent-vespers"/"normalized-manifest.json").read_text(encoding="utf8"))
          assert advent["count"]==6 and advent["alignmentSamples"]==2 and advent["structurallyAligned"]==2
          assert advent["published"]==0 and advent["liturgicallyVerified"]==0
          pair=json.loads((Path(os.environ["OUTPUT"])/"advent-text-audit.json").read_text(encoding="utf8"))
          assert pair["textScoreCandidatesAligned"] is True, pair
          assert pair["requiresDistinctFirstVespersMusic"] is True, pair
          assert pair["scoresPublished"]==0 and pair["sungButtonEnabled"] is False
          previews=json.loads((Path(os.environ["OUTPUT"])/"preview"/"preview-manifest.json").read_text(encoding="utf8"))
          assert previews["pages"]==63 and previews["published"]==0 and previews["researchOnly"]
          assert previews["blockedLocalePageCount"]==1
          assert previews["blockedLocalePages"][0]["reasons"]==["FR_VESPERS_SUNDAY_COMMEMORATION_INCOMPLETE"]
          mass_preview=json.loads((Path(os.environ["OUTPUT"])/"preview"/"mass"/"preview-manifest.json").read_text(encoding="utf8"))
          assert mass_preview["pages"]==63 and mass_preview["published"]==0
          assert mass_preview["blockedLocalePageCount"]==1
          assert {(x["date"],x["hour"],x["locale"]) for x in mass_preview["blockedLocalePages"]}=={
            ("2026-11-01","VESPERS","fr")}
          assert mass_preview["blockedLocalePages"][0]["semanticBlockerReasons"]==[
            "FR_VESPERS_SUNDAY_COMMEMORATION_INCOMPLETE"]
          assert mass_preview["researchOnly"] and not mass_preview["productionRouteRegistered"]
          assert mass_preview["externalResources"]==0 and mass_preview["chantScoreAssets"]==0
          assert not mass_preview["chantButtonEnabled"]
          souls=json.loads((Path(os.environ["OUTPUT"])/"all-souls"/"normalized-manifest.json").read_text(encoding="utf8"))
          assert souls["count"]==24 and souls["alignmentSamples"]==8 and souls["published"]==0
          assert souls["structurallyAligned"]==8 and souls["alignmentSamples"]==8
          souls_mass=json.loads((Path(os.environ["OUTPUT"])/"all-souls"/"preview"/"mass"/"preview-manifest.json").read_text(encoding="utf8"))
          assert souls_mass["pages"]==10 and souls_mass["quarantinedSourceHourCount"]==0
          assert souls_mass["blockedLocalePageCount"]==6
          assert {(x["hour"],x["locale"]) for x in souls_mass["blockedLocalePages"]}=={
            ("PRIME","fr"),("PRIME","en"),("TERCE","fr"),("SEXT","fr"),("NONE","fr"),("COMPLINE","fr")}
          semantic_en=[x for x in souls_mass["blockedLocalePages"] if x["locale"]=="en"]
          assert len(semantic_en)==1 and semantic_en[0]["semanticBlockerSourceIds"]==["Prima5"]
          assert semantic_en[0]["semanticBlockerReasons"]==["EN_PRIME_RECIPIENT_SCOPE_MISMATCH"]
          assert sum(len(x["missingSourceCellIds"]) for x in souls_mass["blockedLocalePages"])==11
          # Source-level status markers are explicitly logged, never prayer-card material.
          expected={"MATINS":{"en":2,"fr":2},"LAUDS":{"en":1,"fr":1},"VESPERS":{"en":1,"fr":1}}
          for hour,languages in expected.items():
            for lang,number in languages.items():
              d=json.loads((Path(os.environ["OUTPUT"])/"all-souls"/"2026-11-02"/hour.lower()/(lang+".research.json")).read_text(encoding="utf8"))
              new_status=[x for x in d["omittedSourceCells"] if x["reason"] in {"UPSTREAM_EXPLICIT_START_OMISSION","UPSTREAM_EXPLICIT_HYMN_OMISSION"}]
              assert len(new_status)==number,(hour,lang,d["omittedSourceCells"])
              assert all(x["reason"] in {"UPSTREAM_EXPLICIT_START_OMISSION","UPSTREAM_EXPLICIT_HYMN_OMISSION","UPSTREAM_EXPLICIT_PRECES_OMISSION"} for x in d["omittedSourceCells"])
          assert souls_mass["published"]==0 and not souls_mass["productionRouteRegistered"]
          rubric=json.loads((Path(os.environ["OUTPUT"])/"printed-rubric-audit.json").read_text(encoding="utf8"))
          assert rubric["schema"]=="ao.office.independent-1961-rubric-pilot.v1"
          assert rubric["structuralChecksTotal"]==5
          assert not rubric["canPublish"] and rubric["published"]==0 and rubric["verifiedOfficeDates"]==0
          assert not rubric["allSoulsMatins"]["independentlyCheckedPrintedOfficeText"]
          concurrence=json.loads((Path(os.environ["OUTPUT"])/"vespers-concurrence-audit.json").read_text(encoding="utf8"))
          assert concurrence["schema"]=="ao.office.vespers-concurrence-source-audit.v1"
          assert concurrence["pairsChecked"]==2 and concurrence["pairsSourceConsistent"]==2
          assert {x["id"] for x in concurrence["paired"]}=={"ALL_SAINTS","ADVENT_I"}
          assert all(x["sourceStructureConsistent"] and not x["commemorationsVerified"] for x in concurrence["paired"])
          assert concurrence["special"]["status"]=="BR_173_SPECIAL_OFFICE_REVIEW_REQUIRED"
          assert concurrence["special"]["sourceHeadlinesConsistent"]
          assert concurrence["special"]["vesperalOfficeOnNovember1NotIndependentlyAdjudicated"]
          assert concurrence["locallyAdjudicatedVespers"]==0 and concurrence["verifiedCommemorations"]==0
          assert concurrence["printedOfficeTextCertified"]==0
          comms=json.loads((Path(os.environ["OUTPUT"])/"vespers-commemorations.json").read_text(encoding="utf8"))
          assert comms["schema"]=="ao.office.vespers-commemoration-screening.v1"
          assert comms["sampleDates"]==5 and len(comms["cases"])==5
          assert len(comms["translations"])==4
          assert {(x["date"],x["language"]) for x in comms["translations"]}=={
            ("2026-10-31","en"),("2026-10-31","fr"),
            ("2026-11-01","en"),("2026-11-01","fr")}
          assert all(not x["translationPublicationAuthorized"] and
                     not x["independentPrintedTranslationCertified"] and
                     x["published"]==0 for x in comms["translations"])
          assert len(comms["sundayComparisons"])==2
          assert [(x["date"],x["part"]) for x in comms["sundayComparisons"]]==[
            ("2026-10-31","FIRST"),("2026-11-01","SECOND")]
          assert all(x["specificPrintedWitnessComparisonDone"] is True for x in comms["sundayComparisons"])
          assert all(x["sourceStructureMatches"] and x["componentOrderMatches"] and
                     all(x["componentIncipitsLocated"].values()) and
                     x["commemorationHeadingCount"]==1
                     for x in comms["sundayComparisons"])
          assert all(x["original1961BreviaryPrintedProperCertified"] is False
                     and x["canPublish"] is False and x["published"]==0
                     for x in comms["sundayComparisons"])
          assert {x["date"] for x in comms["cases"]}=={"2026-10-31","2026-11-01","2026-11-02","2026-11-28","2026-11-29"}
          assert all(x["absenceOfHeadingProvesNoCommemoration"] is False for x in comms["cases"])
          assert all(x["printAndLocalOrdoReviewRequired"] is True for x in comms["cases"])
          assert comms["independentlyVerifiedOfficeCommemorations"]==0
          assert comms["certifiedVespersTextComponents"]==0 and not comms["canPublish"]
          assert comms["published"]==0 and not comms["productionRouteRegistered"]
          assert not concurrence["canPublish"] and concurrence["published"]==0
          exception=json.loads((Path(os.environ["OUTPUT"])/"all-souls"/"exception-collect-audit.json").read_text(encoding="utf8"))
          assert exception["schema"]=="ao.office.all-souls-exception-collect-audit.v1"
          assert exception["total"]==2 and not exception["canPublish"] and exception["published"]==0
          assert {x["hour"] for x in exception["comparisons"]}=={"PRIME","COMPLINE"}
          for folder,count in [(".",64),("all-souls",16),("advent-vespers",4)]:
            risk=json.loads((Path(os.environ["OUTPUT"])/folder/"translation-risk.json").read_text(encoding="utf8"))
            assert risk["schema"]=="ao.office.translation-risk-screening.v1"
            assert risk["trilingualHourCount"]==count//2
            assert risk["structurallyScreenedHourCount"]==count//2
            assert risk["quarantinedSourceHourCount"]==0
            assert risk["translationCellsScreened"]==risk["alignedLatinCells"]*2
            assert risk["verifiedTranslations"]==0 and risk["published"]==0 and not risk["canPublish"]
            if folder=="all-souls":
              assert risk["flaggedTranslationCells"]==11, risk["flags"]
              assert {x["language"] for x in risk["flags"]}=={"fr"}
              expected_missing={
                ("PRIME","Prima4"),("PRIME","Prima5"),("PRIME","Prima6"),
                ("TERCE","Tertia4"),("TERCE","Tertia5"),
                ("SEXT","Sexta4"),("SEXT","Sexta5"),
                ("NONE","Nona4"),("NONE","Nona5"),
                ("COMPLINE","Completorium6"),("COMPLINE","Completorium7")}
              assert {(x["hour"],x["translationSourceCellId"]) for x in risk["flags"]}==expected_missing
              assert all("UPSTREAM_PLACEHOLDER_MISSING_TEXT" in x["reason"] for x in risk["flags"])
              blocked={(x["hour"],cell) for x in souls_mass["blockedLocalePages"] for cell in x["missingSourceCellIds"]}
              assert blocked==expected_missing
          syntax=json.loads((Path(os.environ["OUTPUT"])/"all-souls-syntax"/"overlay-source.json").read_text(encoding="utf8"))
          assert syntax["schema"]=="ao.office.french-special-syntax-experiment.v1"
          assert syntax["changedDirectives"]==15 and syntax["published"]==0
          comparison=json.loads((Path(os.environ["OUTPUT"])/"all-souls-syntax"/"comparison.json").read_text(encoding="utf8"))
          assert comparison["schema"]=="ao.office.french-syntax-candidate-comparison.v1"
          assert comparison["originalMissingCount"]==11 and comparison["published"]==0
          assert comparison["documentsCompared"]==24 and comparison["certifiedFrenchHours"]==0
          assert comparison["originalMissingCount"]==11 and comparison["candidateMissingCount"]==0
          assert comparison["recoveredCount"]==11 and comparison["fullyRecovered"] is True
          assert comparison["newlyMissingCount"]==0 and not comparison["candidateSourceCellsReduced"]
          syntax_preview=json.loads((Path(os.environ["OUTPUT"])/"all-souls-syntax"/"preview"/"mass"/"preview-manifest.json").read_text(encoding="utf8"))
          assert syntax_preview["pages"]==15 and syntax_preview["blockedLocalePageCount"]==1
          assert syntax_preview["blockedLocalePages"][0]["locale"]=="en"
          assert syntax_preview["blockedLocalePages"][0]["hour"]=="PRIME"
          assert syntax_preview["blockedLocalePages"][0]["semanticBlockerSourceIds"]==["Prima5"]
          provenance=json.loads((Path(os.environ["OUTPUT"])/"all-souls-syntax"/"provenance-review.json").read_text(encoding="utf8"))
          assert provenance["schema"]=="ao.office.french-source-provenance-review.v1"
          assert provenance["sourceCellsAudited"]==11 and provenance["officesAudited"]==5
          assert provenance["candidateNonPlaceholderCells"]==11
          assert provenance["provenance"]["projectLicense"]=="MIT"
          assert provenance["independentlyCheckedPrintedTextCells"]==0
          assert provenance["verifiedTranslationCells"]==0 and provenance["published"]==0
          prime=json.loads((Path(os.environ["OUTPUT"])/"all-souls-syntax"/"prime-critical-review.json").read_text(encoding="utf8"))
          assert prime["schema"]=="ao.office.all-souls-prime-critical-review.v1"
          assert prime["recipientScope"]["mismatch"]
          assert not prime["martyrology2026_11_03TextVerified"]
          assert not prime["martyrology1961VariationAppliedAndVerified"]
          assert not prime["englishRecipientScopeReviewedAndApproved"]
          assert not prime["readyForPublicReader"] and prime["published"]==0
          assert not provenance["textSuitableForPublicDeployment"]
          assert syntax_preview["published"]==0 and not syntax_preview["productionRouteRegistered"]
          syntax_risk=json.loads((Path(os.environ["OUTPUT"])/"all-souls-syntax"/"translation-risk.json").read_text(encoding="utf8"))
          assert syntax_risk["flaggedTranslationCells"]==0 and syntax_risk["verifiedTranslations"]==0
          assert syntax_risk["published"]==0 and not syntax_risk["canPublish"]
          advent_mass=json.loads((Path(os.environ["OUTPUT"])/"advent-vespers"/"preview"/"mass"/"preview-manifest.json").read_text(encoding="utf8"))
          assert advent_mass["pages"]==4 and advent_mass["published"]==0
