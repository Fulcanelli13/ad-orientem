name: Divine Office research — text, reader and native chant pilot

on:
  pull_request:
    paths:
      - 'src/office/**'
      - 'scripts/office/**'
      - 'tests/divine-office-*.mjs'
      - 'tests/test_divine_office_normalizer.py'
      - 'docs/DIVINE-OFFICE-PHASE-A-2026-10-28.md'
      - '.github/workflows/divine-office-phase-b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ao-divine-office-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source-generator JavaScript syntax
        run: |
          node --check scripts/office/phase-b-generate.mjs
          node --check scripts/office/build-research-preview.mjs
          node --check src/office/research-reader.js
          node --check src/office/mass-style-research-reader.js
          node --check src/office/mass-style-research-ui.js
          node --check scripts/office/build-mass-style-preview.mjs
          node --check src/office/sung-vespers-gate.js
          node --check scripts/office/audit-sunday-chant.mjs
          node --check scripts/office/audit-advent-vespers-text.mjs
      - name: Calendar, Tenebrae and composition probe contracts
        run: node --test tests/divine-office-phase-a.mjs tests/divine-office-composition-probe.mjs tests/divine-office-research-reader.mjs tests/divine-office-native-sung.mjs tests/divine-office-mass-style-reader.mjs
      - name: Source-cell HTML normalizer unit tests
        run: python3 -m unittest discover -s tests -p 'test_divine_office_normalizer.py' -v

  native-sung-vespers-source-audit:
    needs: office-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned candidate Gregorian scores (research only)
        env:
          SOURCE: ${{ runner.temp }}/advent-vespers-chant
        run: |
          set -euo pipefail
          PIN=5787df436f5cd432dd95bcacdc911b3488dc3a8a
          mkdir -p "$SOURCE"
          git -C "$SOURCE" init -q
          git -C "$SOURCE" remote add origin https://github.com/asbloomf/gabc-chants.git
          git -C "$SOURCE" fetch --no-tags --depth=1 origin "$PIN"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$PIN"
      - name: Audit real score files and psalm-tone descriptors without publishing
        env:
          SOURCE: ${{ runner.temp }}/advent-vespers-chant
          REPORT: ${{ runner.temp }}/advent-chant-audit.json
        run: |
          node scripts/office/audit-sunday-chant.mjs --upstream "$SOURCE" --out "$REPORT"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const d=JSON.parse(readFileSync(process.env.REPORT,"utf8"));
            if(d.sundayDate!=="2026-11-29" || d.part!=="SECOND" ||
               d.candidateCount!==10 || d.tones.psalms.length!==5 ||
               d.publishedScores!==0 || d.chantButtonEnabled!==false ||
               d.fullSundayVespersCertified!==false || d.copyrightStatus!=="UNRESOLVED_PER_FILE")
              process.exit(1);
            console.log("Native chant proof: 10 GABC candidates, 5 psalm-tone references; NOT certified or published.");
          '
      # No assets shipped, remote scores linked to users or artifact upload.

  original-composer-smoke:
    needs: office-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install minimum upstream Perl CGI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcgi-pm-perl libcgi-session-perl libwww-perl
      - name: Fetch exact upstream revision using sparse checkout
        env:
          UPSTREAM: ${{ runner.temp }}/divinum-officium
        run: |
          set -euo pipefail
          PIN="$(sed -n 's/^export const DIVINUM_OFFICIUM_PIN="\([^"]*\)";/\1/p' src/app/source-transport-compat.js)"
          test "${#PIN}" -eq 40
          mkdir -p "$UPSTREAM"
          git -C "$UPSTREAM" init -q
          git -C "$UPSTREAM" remote add origin https://github.com/DivinumOfficium/divinum-officium.git
          git -C "$UPSTREAM" sparse-checkout init --cone
          git -C "$UPSTREAM" sparse-checkout set web/cgi-bin web/www/horas web/www/Tabulae standalone/tools/epubgen2
          git -C "$UPSTREAM" -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=1 origin "$PIN"
          git -C "$UPSTREAM" checkout --detach FETCH_HEAD
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$PIN"
      - name: Generate four dates × eight real 1960 Roman Office hours × three languages
        env:
          UPSTREAM: ${{ runner.temp }}/divinum-officium
          OUTPUT: ${{ runner.temp }}/ao-office-probe
        run: |
          node scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$OUTPUT" \
            --dates 2026-10-28,2026-10-31,2026-11-01,2026-11-03 \
            --hours MATINS,LAUDS,PRIME,TERCE,SEXT,NONE,VESPERS,COMPLINE \
            --languages la,en,fr
          python3 scripts/office/normalize_xhtml.py --out "$OUTPUT"
          node scripts/office/build-research-preview.mjs --out "$OUTPUT"
          node scripts/office/build-mass-style-preview.mjs --out "$OUTPUT"
          # Liturgical witness for Advent I: FIRST Vespers on Saturday and
          # SECOND on Sunday. This is a fresh six-file source sample, not
          # six production scores and not part of the original 96-file pilot.
          node scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$OUTPUT/advent-vespers" \
            --dates 2026-11-28,2026-11-29 --hours VESPERS --languages la,en,fr
          python3 scripts/office/normalize_xhtml.py --out "$OUTPUT/advent-vespers"
          node scripts/office/build-mass-style-preview.mjs --out "$OUTPUT/advent-vespers"
          node scripts/office/audit-advent-vespers-text.mjs --out "$OUTPUT/advent-vespers" --report "$OUTPUT/advent-text-audit.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const p=JSON.parse(readFileSync(process.env.OUTPUT+"/manifest.json","utf8"));
            if (p.counts.requested!==96 || p.counts.captured!==96 ||
              p.counts.failed || p.counts.published!==0 || p.researchOnly!==true)
              process.exit(1);
            console.log("Research-only envelope captures:",p.counts);
          '
      - name: Assert normalization manifest coverage (no publication)
        env:
          OUTPUT: ${{ runner.temp }}/ao-office-probe
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["OUTPUT"],"normalized-manifest.json"),encoding="utf8") as f:
            doc=json.load(f)
          assert doc["count"]==96, doc["count"]
          assert doc["alignmentSamples"]==32, doc["alignmentSamples"]
          assert doc["published"]==0 and doc["liturgicallyVerified"]==0
          from pathlib import Path
          advent=json.loads((Path(os.environ["OUTPUT"])/"advent-vespers"/"normalized-manifest.json").read_text(encoding="utf8"))
          assert advent["count"]==6 and advent["alignmentSamples"]==2 and advent["structurallyAligned"]==2
          assert advent["published"]==0 and advent["liturgicallyVerified"]==0
          pair=json.loads((Path(os.environ["OUTPUT"])/"advent-text-audit.json").read_text(encoding="utf8"))
          assert pair["textScoreCandidatesAligned"] is True, pair
          assert pair["requiresDistinctFirstVespersMusic"] is True, pair
          assert pair["scoresPublished"]==0 and pair["sungButtonEnabled"] is False
          previews=json.loads((Path(os.environ["OUTPUT"])/"preview"/"preview-manifest.json").read_text(encoding="utf8"))
          assert previews["pages"]==64 and previews["published"]==0 and previews["researchOnly"]
          mass_preview=json.loads((Path(os.environ["OUTPUT"])/"preview"/"mass"/"preview-manifest.json").read_text(encoding="utf8"))
          assert mass_preview["pages"]==64 and mass_preview["published"]==0
          assert mass_preview["researchOnly"] and not mass_preview["productionRouteRegistered"]
          assert mass_preview["externalResources"]==0 and mass_preview["chantScoreAssets"]==0
          assert not mass_preview["chantButtonEnabled"]
          advent_mass=json.loads((Path(os.environ["OUTPUT"])/"advent-vespers"/"preview"/"mass"/"preview-manifest.json").read_text(encoding="utf8"))
          assert advent_mass["pages"]==4 and advent_mass["published"]==0
          assert advent_mass["hours"]==["VESPERS"] and not advent_mass["productionRouteRegistered"]
          print("Office Mass-style preview valid: 64 main + 4 Advent I bilingual interactive pages, zero published.")
          PY
      - name: Install pinned Playwright browser for mobile layout QA
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise real Office source cells in LIVE and MISSAL at phone sizes
        env:
          OUTPUT: ${{ runner.temp }}/ao-office-probe
        run: node tests/divine-office-phone-acceptance.mjs --out "$OUTPUT"
      # Deliberately no artifact upload and no source-text publication.
      # This browser test is reproducible and has no permanent-storage dependencies.
