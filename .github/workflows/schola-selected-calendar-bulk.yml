name: Schola actual 1962 Calendar bulk GABC audit

on:
  pull_request:
    paths:
      - 'src/mass/reader-schola-selected-calendar-audit.js'
      - 'tools/mass/reader-schola-selected-calendar-audit.mjs'
      - 'tests/reader-schola-selected-calendar-audit.mjs'
      - '.github/workflows/schola-selected-calendar-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-selected-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-selection result integrity
        run: node tests/reader-schola-selected-calendar-audit.mjs
      - name: Install browser runner
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sweep all 365 actually selected 1962 Calendar dates, no scraping
        run: node tools/mass/reader-schola-selected-calendar-audit.mjs
      - name: Upload full per-date source, chant-role and candidate ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schola-1962-selected-calendar-2026-coverage
          path: artifacts/mass/schola-1962-selected-calendar-2026-01-01_2026-12-31.json
          retention-days: 14
          if-no-files-found: warn
