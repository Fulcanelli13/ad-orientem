name: B23R3 preserve one native MPO sacred-art source
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-b23r3-mpo1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mpo-binary-original:
    # Historical acquisition: avoid replaying old downloads when archive gating merges.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Preserve file bytes and image identity in native MPO, no silent JPEG replacement
        run: |
          python scripts/research/sacred_art_acquire.py \
            --manifest data/research/sacred-art-b23r3-mpo1.manifest.json \
            --output artifacts/b23r3-mpo1 \
            --max-files 1 \
            --max-bytes 15000000 \
            --prior-audit data/research/no-prior-b23r3.csv
          python - <<'PY'
          import csv,pathlib,re
          with pathlib.Path('artifacts/b23r3-mpo1/Acquisition_results.csv').open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==1
          r=rows[0]
          assert r['asset_source_id']=='AO-SRC-D731162493ACD4'
          assert r['download_status']=='ACQUIRED_DECODED_SHA256'
          assert r['format']=='MPO'
          assert r['resolution_gate']=='MPO_MULTIFRAME_REVIEW'
          assert re.fullmatch('[a-f0-9]{64}',r['sha256'])
          assert r['editorial_gate']=='NOT_APPROVED'
          PY
      - name: Upload original native MPO and audit
        uses: actions/upload-artifact@v4
        with:
          name: ao-b23r3-delacroix-original-MPO-and-audit
          path: artifacts/b23r3-mpo1/
          retention-days: 7
      - name: P0 gate - archive unchanged acquisition files in an unpublished GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_release_archive_gate.py --wave b23r3mpo --source-dir artifacts/b23r3-mpo1
      - name: Persist MPO original format and hash in research branch
        run: |
          cp artifacts/b23r3-mpo1/Acquisition_results.csv data/research/sacred-art-b23r3-mpo1.audit.csv
          cp artifacts/b23r3-mpo1/Acquisition_summary.json data/research/sacred-art-b23r3-mpo1.audit-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b23r3-mpo1.audit.csv data/research/sacred-art-b23r3-mpo1.audit-summary.json
          git commit -m 'research: preserve Delacroix original MPO SHA256 with strict visual format hold'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
