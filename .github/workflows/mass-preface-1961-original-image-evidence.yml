name: Mass 1961 original-print ictus image capture
on:
  pull_request:
    paths:
      - 'scripts/mass/capture-preface-1961-ictus-original-print.py'
      - '.github/workflows/mass-preface-1961-original-image-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare original PDF crop tools
        run: python -m pip install --quiet pymupdf pillow
      - name: Check capture script syntax
        run: python -m py_compile scripts/mass/capture-preface-1961-ictus-original-print.py
      - name: Capture original 1961 Preface printed staff for editorial review
        run: python scripts/mass/capture-preface-1961-ictus-original-print.py
      - name: Retain original printed source evidence (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-preface-1961-original-ictus-highres-research
          path: .tmp/mass-preface-1961-print-ictus-evidence/*
          if-no-files-found: error
          retention-days: 30
