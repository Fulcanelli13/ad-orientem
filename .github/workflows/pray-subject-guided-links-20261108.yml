name: Prayer guided subjects — real-reader phone routes
on:
  push:
    branches:
      - feat/prayer-guided-subject-links-20261108
    paths:
      - .github/workflows/pray-subject-guided-links-20261108.yml
      - src/pray/prayer-subject-guided-links.v1.js
      - src/pray/presentation-runtime.js
      - tests/pray-subject-guided-links-20261108.mjs
      - tests/pray-subject-guided-links-phone-20261108.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pray-subject-guided-links-20261108.yml
      - src/pray/prayer-subject-guided-links.v1.js
      - src/pray/presentation-runtime.js
      - tests/pray-subject-guided-links-20261108.mjs
      - tests/pray-subject-guided-links-phone-20261108.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-subject-guides-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-owned-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Seven source-backed reader routes, theological mapping and no duplicate reader
        run: node tests/pray-subject-guided-links-20261108.mjs
  guided-routes-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: All 7 existing readers in 4 mobile English/French contexts
        run: node tests/pray-subject-guided-links-phone-20261108.mjs
