name: Sacred Atlas — release exact selected Maria Luggau cover to PR branch
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-maria-luggau-frozen-selected-release-20261104.v1.json'
      - 'tools/atlas/release-sacred-atlas-maria-luggau-selected-cover.py'
      - 'tests/sacred-atlas-maria-luggau-selected-release-contract.mjs'
      - 'src/find/place-profiles.js'
      - 'tests/explore-photo-research.mjs'
      - '.github/workflows/sacred-atlas-maria-luggau-selected-release.yml'

permissions:
  contents: write

jobs:
  source-gated-one-selected-cover:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/sacred-atlas-maria-luggau-selected-cover-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact first-party PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen first-choice manifest before any Commons request
        run: node tests/sacred-atlas-maria-luggau-selected-release-contract.mjs
      - name: Check Python code syntax
        run: python -m py_compile tools/atlas/release-sacred-atlas-maria-luggau-selected-cover.py
      - name: Install bounded original-image decoder
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify exact Commons original source and stage selected cover on PR branch only
        run: python tools/atlas/release-sacred-atlas-maria-luggau-selected-cover.py
      - name: Validate original bytes, output hash, licence, regional allowlist, display rendering and prior image preservation
        run: |
          node tests/sacred-atlas-maria-luggau-selected-release-contract.mjs --staged
          node tests/explore-photo-research.mjs
      - name: Commit only approved exact-selected source on this first-party PR branch
        env:
          BRANCH: release/sacred-atlas-maria-luggau-selected-cover-20261104
        run: |
          node -e 'const p=require("./data/geography/research/sacred-atlas-maria-luggau-selected-cover-binary-evidence-20261104.v1.json");if(p.place_id!=="place:AT:wallfahrtsbasilika-maria-schnee-luggau"||!/^assets\/approved\/place-media\/pf-[a-f0-9]{22}\.webp$/.test(p.asset_path))process.exit(1)'
          ASSET=$(node -p 'require("./data/geography/research/sacred-atlas-maria-luggau-selected-cover-binary-evidence-20261104.v1.json").asset_path')
          git add -- "$ASSET" data/geography/approved-place-media.v1.json data/geography/research/sacred-atlas-maria-luggau-selected-cover-binary-evidence-20261104.v1.json
          node - <<'JS'
          const {execFileSync}=require("node:child_process");
          const p=require("./data/geography/research/sacred-atlas-maria-luggau-selected-cover-binary-evidence-20261104.v1.json");
          const actual=execFileSync("git",["diff","--cached","--name-only"],{encoding:"utf8"}).trim().split("\n").sort();
          const expected=[p.asset_path,"data/geography/approved-place-media.v1.json","data/geography/research/sacred-atlas-maria-luggau-selected-cover-binary-evidence-20261104.v1.json"].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)){
            process.stderr.write("Refusing non-allowlisted staged change: "+JSON.stringify(actual)+"\n");process.exit(1);
          }
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'media(atlas): stage verified selected Maria Luggau source and WebP on release PR'
          test "$BRANCH" = 'release/sacred-atlas-maria-luggau-selected-cover-20261104'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-atlas-maria-luggau-source-verified-release
          path: data/geography/research/sacred-atlas-maria-luggau-selected-cover-binary-evidence-20261104.v1.json
          if-no-files-found: ignore
          retention-days: 14
