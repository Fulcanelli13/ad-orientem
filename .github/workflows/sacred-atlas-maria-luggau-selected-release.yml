name: Sacred Atlas Maria Luggau exact selected source readiness (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-maria-luggau-frozen-selected-release-20261104.v1.json'
      - 'data/geography/research/sacred-atlas-maria-luggau-original-429-hold-20261104.v1.json'
      - 'tools/atlas/release-sacred-atlas-maria-luggau-selected-cover.py'
      - 'tests/sacred-atlas-maria-luggau-selected-release-contract.mjs'
      - 'src/find/place-profiles.js'
      - 'tests/explore-photo-research.mjs'
      - '.github/workflows/sacred-atlas-maria-luggau-selected-release.yml'

permissions:
  contents: read

jobs:
  frozen-selection-offline-readiness:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/sacred-atlas-maria-luggau-selected-cover-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original first-choice identity and that no unverified cover was added
        run: node tests/sacred-atlas-maria-luggau-selected-release-contract.mjs
      - name: Check bounded source verifier syntax without contacting Wikimedia
        run: python -m py_compile tools/atlas/release-sacred-atlas-maria-luggau-selected-cover.py
      - name: Confirm the original image is still blocked by HTTP 429 and not published
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const hold=JSON.parse(readFileSync("data/geography/research/sacred-atlas-maria-luggau-original-429-hold-20261104.v1.json","utf8"));
          const media=JSON.parse(readFileSync("data/geography/approved-place-media.v1.json","utf8"));
          assert.equal(hold.status,"ORIGINAL_BINARY_HTTP_429_HOLD");
          assert.equal(hold.source_bytes_verified,false);
          assert.equal(hold.cover_publication_authorized,false);
          assert.equal(media.items.length,379);
          assert.ok(!media.items.some(x=>x.place_id===hold.place_id));
          console.log("MARIA LUGGAU: source metadata verified, original-byte HTTP 429 hold retained, no public cover.");
          JS
