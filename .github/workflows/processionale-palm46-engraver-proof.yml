name: Palm restored psalms read-only Exsurge proof

# Original pull_request run: https://github.com/Fulcanelli13/ad-orientem/actions/runs/40378960243
# Reuse the existing pinned vendor for isolated Palm research validation.
# Trigger only on the explicitly named music-proof files; not on all PR commits.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/processionale-palm46-engraver-proof.yml
      - tools/research/palm23-verse2-exsurge-proof.mjs
      - data/research/chant-source-review/palm23-verse2-tone-application-20261027-PROVISIONAL.gabc
      - data/research/chant-source-review/palm23-verse2-accent-alignment-20261027-ALTERNATE.gabc
      - data/research/processionale-palm-attested-cadence-windows-20261027.v1.json
      - tools/research/palm-bulk-cadence-exsurge-proof.mjs

permissions:
  contents: read

jobs:
  test-isolated-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Research branch, read-only
        uses: actions/checkout@v4
        with:
          path: processionale
          persist-credentials: false
      - name: Pinned existing Mass Schola source and Exsurge vendor
        uses: actions/checkout@v4
        with:
          ref: 8a75c2cbb6ea2bc6ba26da30ec923b3dc8c827e1
          path: schola-owner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render candidate and reference at phone/tablet/desktop widths
        run: >
          node processionale/tools/research/palm46-exsurge-facsimile-gate.mjs
          schola-owner/assets/vendor/exsurge/exsurge.min.js
          processionale/data/research/chant-source-archive/1961-graduale-novus-20261026/gregobase-19316.gabc
          processionale/data/research/chant-source-review/palm46-omnes-populi-1961-provisional.gabc
      - name: Render experimental Psalm23 verse2 at phone/tablet/desktop widths
        run: > 
          node processionale/tools/research/palm23-verse2-exsurge-proof.mjs
          schola-owner/assets/vendor/exsurge/exsurge.min.js
          processionale/data/research/chant-source-archive/1961-graduale-novus-20261026/gregobase-19315.gabc
          processionale/data/research/chant-source-review/palm23-verse2-tone-application-20261027-PROVISIONAL.gabc
          processionale/data/research/processionale-palm23-verse2-tone-hypothesis-20261027.v1.json
          processionale/data/research/chant-source-review/palm23-verse2-accent-alignment-20261027-ALTERNATE.gabc
      - name: Prove 15 source-anchored Psalm cadence excerpts render as offline SVG
        run: >
          node processionale/tools/research/palm-bulk-cadence-exsurge-proof.mjs
          schola-owner/assets/vendor/exsurge/exsurge.min.js
          processionale/data/research/processionale-palm-attested-cadence-windows-20261027.v1.json
          processionale/data/research/chant-source-archive/1961-graduale-novus-20261026/gregobase-19315.gabc
          processionale/data/research/chant-source-archive/1961-graduale-novus-20261026/gregobase-19316.gabc
