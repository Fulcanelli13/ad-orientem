name: B26 108 legacy-preview tracked-binary audit
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-b26-legacy108.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Search exact recorded source photo filenames in Git tracked image objects
        run: |
          python -m py_compile scripts/research/sacred_art_b26_legacy108_repo_audit.py
          python scripts/research/sacred_art_b26_legacy108_repo_audit.py
      - name: Save row-level reproducible file/binary/hash audit, all release gates on hold
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b26-legacy108-repo-photo-audit.csv data/research/sacred-art-b26-legacy108-repo-photo-audit.summary.json
          git commit -m 'research: inspect all 108 legacy photo claims against tracked source binaries and original hashes'
          for i in 1 2 3; do
            git fetch origin research/b19-original-image-acquisition-probe-20261023
            git rebase origin/research/b19-original-image-acquisition-probe-20261023
            git push origin HEAD:research/b19-original-image-acquisition-probe-20261023 && exit 0
            sleep 4
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ao-b26-108-legacy-image-filename-sha-audit
          path: |
            data/research/sacred-art-b26-legacy108-repo-photo-audit.csv
            data/research/sacred-art-b26-legacy108-repo-photo-audit.summary.json
          retention-days: 45
          if-no-files-found: warn
