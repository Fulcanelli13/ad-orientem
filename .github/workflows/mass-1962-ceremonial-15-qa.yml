name: Mass 1962 Ceremonial 15 Cue QA

on:
  pull_request:
    paths:
      - "src/mass/reader-requiem-conditions.js"
      - "src/mass/reader-model.js"
      - "src/mass/reader-text.js"
      - "src/mass/reader-cue-state.js"
      - "data/research/mass-ordo-15-ceremonial-source-ownership-20261019.v1.json"
      - "tests/mass-ordo-15-ceremonial-qa.mjs"
      - "tests/reader-model.mjs"
      - "tests/reader-cue-state.mjs"
      - ".github/workflows/mass-1962-ceremonial-15-qa.yml"
  workflow_dispatch:

jobs:
  form-cues-and-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify 15 original ceremonial cue source owners
        run: node tests/mass-ordo-15-ceremonial-qa.mjs
      - name: Verify production model form/rite suppression and Last Gospel
        run: node tests/reader-model.mjs
      - name: Verify priest actions/postures fail closed at omitted Requiem cues
        run: node tests/reader-cue-state.mjs
      - name: Verify unchanged frozen Canon and Mass text
        run: node tests/reader-text.mjs
