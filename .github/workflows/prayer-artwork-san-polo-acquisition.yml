name: Prayer San Polo Stations photos (research only)
on:
  push:
    branches: [research/prayer-artwork-approved-reuse-wave1-20261031]
    paths:
      - .github/workflows/prayer-artwork-san-polo-acquisition.yml
      - scripts/art/acquire-prayer-stations-san-polo-batch01.py
      - data/prayer/artwork-editorial-20261101/tiepolo-san-polo-stations-14-source-photos-20261101.v1.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prayer-stations-san-polo-stage-b01
  cancel-in-progress: true
jobs:
  archive-station-originals:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-approved-reuse-wave1-20261031
          persist-credentials: true
      - name: Verify source-rights metadata and archive first three original photographs
        id: fetch-originals
        continue-on-error: true
        run: python3 scripts/art/acquire-prayer-stations-san-polo-batch01.py
      - name: Release manifest must remain empty
        run: |
          node --input-type=module - <<'JS'
          import {PRAYER_RELEASED_IMAGE_ASSETS_V1} from './src/pray/artwork-release-runtime.js';
          if (Object.keys(PRAYER_RELEASED_IMAGE_ASSETS_V1).length) throw new Error('No automatic image publication');
          JS
      - name: Commit source files and verification evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prayer/artwork-editorial-20261101/tiepolo-san-polo-stations-originals-acquisition-batch01.v1.json
          if test -d assets/staged/prayer-stations-san-polo-originals-20261101; then
            git add -- assets/staged/prayer-stations-san-polo-originals-20261101
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'research(prayer-art): retain original San Polo photo bytes and rights report'
            git push origin HEAD:refs/heads/research/prayer-artwork-approved-reuse-wave1-20261031
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prayer-stations-source-record-b01
          path: data/prayer/artwork-editorial-20261101/tiepolo-san-polo-stations-originals-acquisition-batch01.v1.json
          retention-days: 1
          if-no-files-found: warn
      - name: Surface any source errors
        if: steps.fetch-originals.outcome == 'failure'
        run: |
          echo 'Some originals could not be staged. Read committed acquisition report; no painting published.'
          exit 1
