name: Sacred Atlas Round 18 — offline geosearch and explicit photo choice contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round18-*.json'
      - 'data/geography/research/sacred-atlas-round18-*.html'
      - 'tools/atlas/recover-sacred-atlas-30-nearby-commons.py'
      - 'tests/sacred-atlas-round18-geosearch-review-contract.mjs'
      - '.github/workflows/sacred-atlas-round18-offline.yml'
permissions:
  contents: read
jobs:
  source-and-decision-safety:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'research/sacred-atlas-round18-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce exact canonical 30-place input and explicit 10-photograph user decision
        run: node tests/sacred-atlas-round18-geosearch-review-contract.mjs
      - name: Verify bounded Commons geo query logic, no network
        run: |
          python tools/atlas/recover-sacred-atlas-30-nearby-commons.py --self-test
          python tools/atlas/recover-sacred-atlas-30-nearby-commons.py --dry-run
