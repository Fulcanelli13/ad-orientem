name: Biblical Atlas cinematic 151 review
on:
  pull_request:
    branches: [main]
    paths:
      - "src/find/bible-atlas.js"
      - "src/find/browser-entry.js"
      - "tests/explore-atlas-cinematic-151.mjs"
      - "tests/explore-atlas-cinematic-151-phone.mjs"
      - ".github/workflows/biblical-atlas-cinematic-151.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check src/find/bible-atlas.js
          node --check src/find/browser-entry.js
          node tests/explore-atlas-cinematic-151.mjs
          node tests/explore-bible-atlas-151.mjs
          node tests/explore-bible-atlas-151-scope.mjs
          node tests/explore-touch-navigation-r53.mjs
  phone:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/explore-atlas-cinematic-151-phone.mjs
      - run: node tests/explore-bible-atlas-151-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblical-atlas-cinema-151-review
          path: test-output/atlas-cinema-151/*.png
          if-no-files-found: warn
