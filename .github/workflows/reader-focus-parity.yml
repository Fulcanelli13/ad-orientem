name: Reader focus mode and language parity
on:
  pull_request:
    paths:
      - "tests/reader-focus-mode-language-parity-phone.mjs"
      - ".github/workflows/reader-focus-parity.yml"
      - "src/mass/reader-dom.js"
      - "src/mass/reader-cue-focus.js"
      - "src/mass/reader-native-preview.js"
      - "src/pray/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mode-language-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Audit real Simple, Missal and French LIVE phone readers
        run: timeout --signal=TERM --kill-after=5s 780s node tests/reader-focus-mode-language-parity-phone.mjs
      - name: Preserve mode/language coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-focus-mode-language-parity
          path: artifacts/text-focus-parity/
          if-no-files-found: warn
          retention-days: 30
