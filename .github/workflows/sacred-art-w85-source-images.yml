name: Sacred Art W85 Image Sources
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - tools/calendar/acquire-sacred-art-w85-source-images.py
      - .github/workflows/sacred-art-w85-source-images.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - name: Download high-quality exact-original image bytes and verify hashes
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w85-source-images.py
          python tools/calendar/acquire-sacred-art-w85-source-images.py
      - name: Preserve full source bytes, full-frame review copies and source manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w85-source-image-proofs
          path: |
            artifacts/sacred-art-w85-image-acquisition/
            docs/research/review-galleries/acquired/
          retention-days: 30
          if-no-files-found: warn
