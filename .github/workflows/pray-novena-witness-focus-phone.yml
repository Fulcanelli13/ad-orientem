name: Prayer Novena witness position phone acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pray/novena-runtime.js"
      - "tests/pray-novena-witness-position-phone.mjs"
      - "tests/pray-novena-witness-contract.mjs"
      - "package.json"
      - ".github/workflows/pray-novena-witness-focus-phone.yml"
  push:
    branches: [main]
    paths:
      - "src/pray/novena-runtime.js"
      - "tests/pray-novena-witness-position-phone.mjs"
      - "tests/pray-novena-witness-contract.mjs"
      - ".github/workflows/pray-novena-witness-focus-phone.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilingual-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Source witness contract
        run: node tests/pray-novena-witness-contract.mjs
      - name: 320px and 390px Novena language/witness continuity
        run: node tests/pray-novena-witness-position-phone.mjs
