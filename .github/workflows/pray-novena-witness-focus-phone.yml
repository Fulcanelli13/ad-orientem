name: Prayer Novena reading and witness phone acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pray/novena-runtime.js"
      - "src/pray/novena-styles.js"
      - "src/pray/devotional-sequence-adapter.js"
      - "tests/pray-novena-witness-position-phone.mjs"
      - "tests/pray-novena-witness-contract.mjs"
      - "tests/pray-novena-stage-progress-contract.mjs"
      - "tests/pray-novena-reading-comfort-contract.mjs"
      - "package.json"
      - ".github/workflows/pray-novena-witness-focus-phone.yml"
  push:
    branches: [main]
    paths:
      - "src/pray/novena-runtime.js"
      - "src/pray/novena-styles.js"
      - "src/pray/devotional-sequence-adapter.js"
      - "tests/pray-novena-witness-position-phone.mjs"
      - "tests/pray-novena-witness-contract.mjs"
      - "tests/pray-novena-stage-progress-contract.mjs"
      - "tests/pray-novena-reading-comfort-contract.mjs"
      - ".github/workflows/pray-novena-witness-focus-phone.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilingual-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Source witness contract
        run: node tests/pray-novena-witness-contract.mjs
      - name: Guided stage source/ARIA contract
        run: node tests/pray-novena-stage-progress-contract.mjs
      - name: Novena long-form reading comfort contract
        run: node tests/pray-novena-reading-comfort-contract.mjs
      - name: 320px and 390px Novena witness, guided-stage and thumb-reading acceptance
        run: node tests/pray-novena-witness-position-phone.mjs
      - name: Attach temporary Novena mobile review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novena-reading-comfort-phone
          path: artifacts/pray-b35/*.png
          if-no-files-found: ignore
          retention-days: 3
