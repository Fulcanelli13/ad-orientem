name: B35 Kress two exact K-numbered Public Domain source images with SHA archive
on:
  push:
    branches: [research/sacred-art-b35-40-gaps-source-recovery-20261024]
    paths: [.github/workflows/ao-art-b35-kress2-public-domain.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b35-kress2-research-source-once
  cancel-in-progress: false
jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b35-40-gaps-source-recovery-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python -m py_compile scripts/research/sacred_art_b35_kress2.py
      - name: Check item-specific institution public-domain and recover exact original bytes
        run: python scripts/research/sacred_art_b35_kress2.py
      - name: Mandatory unpublished full source TAR remote transfer and checksum proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/research/sacred_art_release_archive_gate.py \
            --wave b35-kress2-pd --source-dir artifacts/b35-kress2-public-domain
      - name: Store compact original-source and rights research audit only
        run: |
          set -euo pipefail
          cp artifacts/b35-kress2-public-domain/source-results.csv data/research/sacred-art-b35-kress2-results.csv
          cp artifacts/b35-kress2-public-domain/source-summary.json data/research/sacred-art-b35-kress2-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b35-kress2-results.csv data/research/sacred-art-b35-kress2-summary.json
          git commit -m 'research: B35 Kress exact Public Domain source and unpublished image archive evidence'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b35-40-gaps-source-recovery-20261024
            git rebase origin/research/sacred-art-b35-40-gaps-source-recovery-20261024
            git push origin HEAD:research/sacred-art-b35-40-gaps-source-recovery-20261024 && exit 0
            sleep 4
          done
          exit 1
