name: Directory P86 actual visual QA ledger and generic-site photo protection
on:
  pull_request:
    paths:
      - data/directory/research/p86-actual-visual-photo-qa-301-20261029.json
      - data/directory/research/p88-p85-recovered-84-source-triage-20261029.json
      - tests/directory-p88-p85-photo-source-triage-test.py
      - data/directory/research/p88-p85-84-actual-thumbnail-visual-qa-20261029.json
      - tests/directory-p88-84-actual-visual-qa-test.py
      - data/directory/research/p89-77-documentary-building-identity-gate-20261029.json
      - tests/directory-p89-77-photo-identity-gate-test.py
      - data/directory/research/p90-two-originals-media-publication-gates-20261029.json
      - tests/directory-p90-original-photo-publication-gates-test.py
      - tools/directory/screen-worldwide-p83-photo-candidates.py
      - tests/directory-p83-global-photo-screen-test.py
      - tests/directory-p86-visual-qa-ledger-test.py
      - .github/workflows/directory-p86-visual-qa-contracts.yml
permissions:
  contents: read
jobs:
  visual-qa-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 301 assessed source rows, 52 non-approved choices, city-only holds
        run: |
          set -euo pipefail
          python tests/directory-p86-visual-qa-ledger-test.py
          python tests/directory-p88-p85-photo-source-triage-test.py
          python tests/directory-p88-84-actual-visual-qa-test.py
          python tests/directory-p89-77-photo-identity-gate-test.py
          python tests/directory-p90-original-photo-publication-gates-test.py
          python tests/directory-p83-global-photo-screen-test.py -v
          node tests/production-tree-hygiene.mjs
