name: Calendar — 1962 year wheel and palette regression

on:
  push:
    branches: [fix/calendar-1962-year-wheel-daily-colours-20261011]
    paths:
      - "src/calendar/year-colour-wheel.js"
      - "src/calendar/year-journey.js"
      - "src/calendar/calendar-runtime.js"
      - "tests/calendar-liturgical-year.mjs"
      - ".github/workflows/calendar-year-colour-wheel-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source identity and liturgical wheel test
        run: node tests/calendar-liturgical-year.mjs
      - name: App liturgical palette regression
        run: node tests/app-liturgical-theme.mjs
      - name: ECMAScript syntax gates
        run: |
          node --check src/calendar/year-colour-wheel.js
          node --check src/calendar/year-journey.js
          node --check src/calendar/calendar-runtime.js
