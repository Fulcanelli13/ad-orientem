name: Source reference locator checks
on:
  push:
    branches:
      - feature/source-text-parsing-infrastructure-20261015
    paths:
      - 'src/source-text/**'
      - 'data/source-text/witness-profiles.v1.json'
      - 'tests/source-text-references.mjs'
      - '.github/workflows/source-text-pilot.yml'
  pull_request:
    paths:
      - 'src/source-text/**'
      - 'data/source-text/witness-profiles.v1.json'
      - 'tests/source-text-references.mjs'
      - '.github/workflows/source-text-pilot.yml'
  workflow_dispatch:
jobs:
  reference-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source locator and existing reference crosswalk
        run: node tests/source-text-references.mjs
