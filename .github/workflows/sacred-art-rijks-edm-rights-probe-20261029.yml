name: Sacred Art — Rijks EDM exact rights probe
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - .github/workflows/sacred-art-rijks-edm-rights-probe-20261029.yml
      - scripts/art/sacred-art-rijks-edm-rights-probe-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-edm-rights-probe
  cancel-in-progress: true
jobs:
  inspect-three-official-edm-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read 3 exact official EDM object records, never image bytes
        run: |
          python -m py_compile scripts/art/sacred-art-rijks-edm-rights-probe-20261029.py
          python scripts/art/sacred-art-rijks-edm-rights-probe-20261029.py
      - name: Preserve bounded rights evidence
        run: |
          git config user.name "Ad Orientem sacred art source research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-rijks-edm-rights-probe-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): retain Rijks object EDM rights evidence"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
