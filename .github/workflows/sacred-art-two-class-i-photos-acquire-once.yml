name: Sacred Art two Class I exact photo sources - one-time acquisition
on:
  push:
    branches:
      - 'release/sacred-art-two-frozen-class-i-photo-reuses-20261111'
    paths:
      - 'data/artwork/releases/2026-03-15-07-01-two-frozen-class-i-source-manifest.v1.json'
      - '.github/workflows/sacred-art-two-class-i-photos-acquire-once.yml'
permissions:
  contents: write
concurrency:
  group: ao-two-class-i-photo-sources-once
  cancel-in-progress: false
jobs:
  acquire:
    if: github.repository == 'Fulcanelli13/ad-orientem' && github.ref == 'refs/heads/release/sacred-art-two-frozen-class-i-photo-reuses-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Fetch exact preselected Commons photographs, verify original hashes and create one mobile derivative
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/home/class-i-2026 data/artwork/releases/source-masters
          curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 210 \
            -A 'AdOrientemSacredArt/1.0 (+https://github.com/Fulcanelli13/ad-orientem)' \
            'https://upload.wikimedia.org/wikipedia/commons/9/93/Giovanni_Lanfranco_-_Miracle_of_the_Bread_and_Fish_-_WGA12454.jpg' \
            -o /tmp/lanfranco-original.jpg
          curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 240 \
            -A 'AdOrientemSacredArt/1.0 (+https://github.com/Fulcanelli13/ad-orientem)' \
            'https://upload.wikimedia.org/wikipedia/commons/a/aa/Anthony_van_Dyck_-_Christ_on_the_cross_between_the_two_criminals.jpg' \
            -o /tmp/van-dyck-original.jpg
          python - <<'PY'
          import json,hashlib,pathlib,shutil
          from PIL import Image
          manifest=json.load(open('data/artwork/releases/2026-03-15-07-01-two-frozen-class-i-source-manifest.v1.json'))
          rows=manifest['candidates']
          assert len(rows)==2
          assert [x['date'] for x in rows]==['2026-03-15','2026-07-01']
          proof=[]
          for row,tmp in zip(rows,['/tmp/lanfranco-original.jpg','/tmp/van-dyck-original.jpg']):
            src=pathlib.Path(tmp);data=src.read_bytes()
            sha1=hashlib.sha1(data).hexdigest()
            assert sha1==row['sourcePhotoSHA1'],(row['date'],'Wrong source SHA1',sha1)
            assert data[:2]==b'\xff\xd8' and data[-2:]==b'\xff\xd9'
            with Image.open(src) as im:
              assert im.format=='JPEG' and list(im.size)==row['expectedOriginalDimensions'],(row['date'],im.size)
              im.verify()
            with Image.open(src) as im: im.load()
            dst=pathlib.Path(row['publishedHomeAsset'])
            dst.parent.mkdir(parents=True,exist_ok=True)
            if row['date']=='2026-03-15':
              assert 700000<=len(data)<=2000000
              shutil.copyfile(src,dst)
              publicDimensions=row['expectedOriginalDimensions']
            else:
              assert 15000000<=len(data)<=40000000
              archive=pathlib.Path(row['originalImageArchive'])
              archive.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,archive)
              with Image.open(src) as img:
                rgb=img.convert('RGB')
                rgb.thumbnail((2400,2400),Image.Resampling.LANCZOS)
                assert rgb.height==2400 and 1700<=rgb.width<=1900,(rgb.width,rgb.height)
                rgb.save(dst,format='WEBP',quality=88,method=6)
                publicDimensions=list(rgb.size)
            published=dst.read_bytes()
            assert len(published)>100000
            if row['date']=='2026-07-01':
              assert len(published)<3000000,'Mobile derivative unexpectedly oversized'
              with Image.open(dst) as im:
                assert im.format=='WEBP' and list(im.size)==publicDimensions
                im.verify()
            proof.append({
              'date':row['date'],'artist':row['artist'],'workTitle':row['title'],
              'museumObject':row['museumObjectUrl'],'museumInventory':row['objectId'],
              'source':row['commonsSourcePage'],'exactOriginalUrl':row['originalFileUrl'],
              'sourceSHA1':sha1,'sourceSHA256':hashlib.sha256(data).hexdigest(),
              'sourceBytes':len(data),'sourceDimensions':row['expectedOriginalDimensions'],
              'sourceOriginalRetained':row['originalImageArchive'] or row['publishedHomeAsset'],
              'publicAsset':row['publishedHomeAsset'],'publicSHA256':hashlib.sha256(published).hexdigest(),
              'publicBytes':len(published),'publicDimensions':publicDimensions,
              'publicPhotoIsExactOriginal':row['publicImageIsExactOriginal'],
              'photoRights':row['sourcePhotoRights'],
              'artworkSelectionNew':False,'ownerCropCertificationCreated':False
            })
            print('CLASS_I_EXACT_SOURCE',row['date'],sha1,len(data),len(published),publicDimensions,flush=True)
          out=pathlib.Path('data/artwork/releases/2026-03-15-07-01-two-class-i-photo-byte-proof.v1.json')
          out.write_text(json.dumps({
            'schema':'AO_TWO_CLASS_I_2026_SOURCE_MASTER_AND_WEB_IMAGE_HASHES_V1',
            'noNewPaintingSelections':True,'records':proof},indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit verified exact source and lightweight public images only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ad Orientem exact source acquisition'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            assets/home/class-i-2026/lanfranco-ngi72-miracle-original.jpg \
            assets/home/class-i-2026/van-dyck-kmska297-lance-thrust-2400.webp \
            data/artwork/releases/source-masters/van-dyck-kmska297-lance-thrust-original.jpg \
            data/artwork/releases/2026-03-15-07-01-two-class-i-photo-byte-proof.v1.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Retain exact Lanfranco and Van Dyck Commons source bytes with one mobile WebP derivative'
          # The user-facing implementation branch may receive normal source
          # edits while this one-time source acquisition is processing.
          # Rebase the *four new files only* on current remote branch first.
          git fetch origin 'release/sacred-art-two-frozen-class-i-photo-reuses-20261111'
          git rebase FETCH_HEAD
          git push origin 'HEAD:release/sacred-art-two-frozen-class-i-photo-reuses-20261111'
