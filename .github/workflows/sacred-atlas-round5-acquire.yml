name: Sacred Atlas Round 5 acquire prior-selected Place covers
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round5-selected-13-cover-manifest-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round5-13-covers.py'
      - '.github/workflows/sacred-atlas-round5-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-selected-covers:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round05-prior-selected-13-covers-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation/conversion dependency
        run: python -m pip install Pillow==11.3.0
      - name: Resolve rank-1 user selections, verify Commons original bytes and publish eligible cover WebPs
        run: python tools/atlas/acquire-sacred-atlas-round5-13-covers.py
      - name: Commit verified local binaries and canonical source evidence
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          ledger=json.loads(Path('data/geography/research/sacred-atlas-round5-published-cover-evidence-20261103.v1.json').read_text())
          paths=['data/geography/approved-place-media.v1.json',
                 'data/geography/research/sacred-atlas-round5-published-cover-evidence-20261103.v1.json']
          for item in ledger['published']:
              path=item['asset_path']
              assert path.startswith('assets/approved/place-media/pf-') and path.endswith('.webp')
              assert Path(path).is_file()
              paths.append(path)
          assert len(ledger['published'])>=1
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo 'No new files to commit'; exit 1; }
          git commit -m "assets(atlas): publish verified previously selected Round 5 site covers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
