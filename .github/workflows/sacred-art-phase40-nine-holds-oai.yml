name: Sacred Art Phase 40 — nine museum identity holds (research only)
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase40-nine-holds-oai-crosswalk.py'
      - '.github/workflows/sacred-art-phase40-nine-holds-oai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oai-crosswalk:
    name: Verify Flemish OAI artist and Bruges panel inventories
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare HTTP-only dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Query public institutional metadata without image acquisition
        run: |
          python -m py_compile scripts/sacred-art/phase40-nine-holds-oai-crosswalk.py
          python scripts/sacred-art/phase40-nine-holds-oai-crosswalk.py
      - name: Save temporary source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-phase40-nine-holds-oai-research-only
          path: artifacts/sacred-art-phase40-nine-holds/
          retention-days: 7
          if-no-files-found: warn
