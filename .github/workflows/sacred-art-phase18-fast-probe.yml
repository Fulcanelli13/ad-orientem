name: Sacred Art Phase 18 — fast IIIF connectivity probe
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/iiif_fast_probe.py'
      - '.github/workflows/sacred-art-phase18-fast-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Probe 20 mapped IIIF records in parallel; research-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image probe dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Check syntax and run bounded institutional preview probe
        run: |
          python -m py_compile scripts/sacred-art/iiif_fast_probe.py
          python scripts/sacred-art/iiif_fast_probe.py
      - name: Upload diagnostic manifest, errors and preview bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-phase18-fast-probe-results
          path: artifacts/sacred-art-phase18-fast-probe/
          if-no-files-found: warn
          retention-days: 5
