name: Sacred Art closeout integrity

# Avoid overlapping 224-image remote audits on rapid research-branch pushes.
concurrency:
  group: sacred-art-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - platform/885-sacred-art-candidates
    paths:
      - 'docs/research/review-galleries/ao-sacred-art-unified-curator-20261016.html'
      - 'data/calendar/sacred-art-review-uploads/**'
      - 'tests/sacred-art-acquisition-gallery-integrity.mjs'
      - 'tests/sacred-art-mobile-photo-e2e.mjs'
      - 'tools/calendar/build-sacred-art-class-i-ii-review.mjs'
      - '.github/workflows/sacred-art-closeout-integrity.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/research/review-galleries/ao-sacred-art-unified-curator-20261016.html'
      - 'data/calendar/sacred-art-review-uploads/**'
      - 'tests/sacred-art-acquisition-gallery-integrity.mjs'
      - 'tests/sacred-art-mobile-photo-e2e.mjs'
      - 'tools/calendar/build-sacred-art-class-i-ii-review.mjs'
      - '.github/workflows/sacred-art-closeout-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gallery:
    name: Historical rating and exact-object integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce immutable decisions, 168 research sources and two rights-held subjects
        run: node tests/sacred-art-acquisition-gallery-integrity.mjs
      - name: Check earlier immutable Saints review decisions
        run: node tests/sacred-art-w73-user-decisions.mjs

  audit-mobile-images:
    name: Mobile 390px layout and on-demand remote image audit
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project test dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Confirm Playwright dependency is installed
        run: node -e "import('@playwright/test').then(() => console.log('Playwright installed'))"
      - name: Install Chromium for 390px phone simulation
        run: npx playwright install --with-deps chromium
      - name: Audit 390px mobile layout; full external image decoding on manual dispatch
        env:
          AO_ART_REMOTE_AUDIT: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'layout' }}
        run: node tests/sacred-art-mobile-photo-e2e.mjs
      - name: Archive research-only image audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-mobile-preview-audit
          path: artifacts/sacred-art-mobile-qa/
          retention-days: 7
          if-no-files-found: warn

  build-class-i-ii-review:
    name: 2026 Class I and II 129-date artwork review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Playwright dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resolve complete 1962 General Calendar 2026
        run: node tests/calendar-1962-full-year-audit.mjs
      - name: Generate source-identified open-artwork alternatives (no cross-pipeline approval checks)
        run: |
          node tools/calendar/build-sacred-art-full-year-associations.mjs
          node tools/calendar/build-sacred-art-class-i-ii-review.mjs
      - name: Publish mobile HTML, every-date JSON, source gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-2026-class-i-ii-129-day-review
          path: |
            artifacts/sacred-art-coverage/class-i-ii-2026-review.html
            artifacts/sacred-art-coverage/class-i-ii-2026-review.json
            artifacts/sacred-art-coverage/class-i-ii-2026-review.md
            artifacts/sacred-art-coverage/full-year-multiple-associations.v1.json
          retention-days: 30
          if-no-files-found: warn
