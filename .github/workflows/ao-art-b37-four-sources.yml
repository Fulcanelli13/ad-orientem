name: B37 four exact Sacred Art source-photo research recoveries with mandatory draft SHA archive
on:
  push:
    branches: [research/sacred-art-b37-30-institutional-exceptions-20261024]
    paths: [.github/workflows/ao-art-b37-four-sources.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b37-art-four-sources-once
  cancel-in-progress: false
jobs:
  research-archive-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b37-30-institutional-exceptions-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder and guard rights/frozen source scope
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python -m py_compile scripts/research/sacred_art_b37_recover4.py
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/research/sacred-art-b37-30-institutional-evidence-and-four-photo-leads.json').read_text())
          assert len(j['cases'])==30 and len(j['exact_photo_leads'])==4
          assert j['protected_underlying_copyright_cases']==2
          assert j['publication_rights_approved']==0 and j['source_photos_selected']==0
          PY
      - name: Preserve source photos for exact art objects, with rights and quality holds
        run: python scripts/research/sacred_art_b37_recover4.py
      - name: Compulsory unpublished Release original-file archive and remote SHA verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/research/sacred_art_release_archive_gate.py \
            --wave b37-exact4 --source-dir artifacts/b37-four-institution-exact-source-research
      - name: Commit compact file/rights audit without original binaries or catalogue mutation
        run: |
          set -euo pipefail
          cp artifacts/b37-four-institution-exact-source-research/source-results.csv data/research/sacred-art-b37-four-source-results.csv
          cp artifacts/b37-four-institution-exact-source-research/source-summary.json data/research/sacred-art-b37-four-source-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b37-four-source-results.csv data/research/sacred-art-b37-four-source-summary.json
          git commit -m 'research: B37 four precise rights-held artwork original bytes and verified draft archive'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b37-30-institutional-exceptions-20261024
            git rebase origin/research/sacred-art-b37-30-institutional-exceptions-20261024
            git push origin HEAD:research/sacred-art-b37-30-institutional-exceptions-20261024 && exit 0
            sleep 4
          done
          exit 1
