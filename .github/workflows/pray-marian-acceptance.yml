name: Marian devotional acceptance
on:
  pull_request:
    paths:
      - "src/pray/**"
      - "tests/pray-presentation.mjs"
      - "tests/pray-marian-mobile.mjs"
      - "tests/pray-internal-route-fail-closed.mjs"
      - "tests/pray-all-modules-mobile.mjs"
      - ".github/workflows/pray-marian-acceptance.yml"
  workflow_dispatch:
# Cancel obsolete revisions of the same pull request; never cancel manual or main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  marian-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:pray-owner
      - run: npx playwright install --with-deps chromium
      - name: All sixteen Novenas — dual-axis guided and simple phone acceptance
        run: timeout --signal=TERM --kill-after=5s 165s node tests/pray-novena-dual-axis-mobile.mjs
      - name: Verify Prayer route ownership fails closed
        run: node tests/pray-internal-route-fail-closed.mjs
      - name: Angelus and Rosary real mobile Guide
        run: timeout --signal=TERM --kill-after=5s 160s node tests/pray-marian-mobile.mjs
      - name: All devotional routes and canonical Prayer Library mobile
        run: timeout --signal=TERM --kill-after=5s 190s node tests/pray-all-modules-mobile.mjs
      - name: Preserve Novena Folio phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-novena-folio-mobile
          path: artifacts/pray-novena-dual-axis/
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve Marian mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pray-marian-mobile-captures
          path: artifacts/pray-marian-mobile
          if-no-files-found: warn
          retention-days: 21
