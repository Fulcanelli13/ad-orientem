name: ARCHIVED pilot — 19-feast sacred-art sample gallery
# Superseded by comprehensive all-year research and negative-exception audit.
# Kept as manually retrievable proof of concept; never run on research updates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Verify museum CC0 metadata and embed real thumbnail paintings
        run: python tools/calendar/build-sacred-art-priority-gallery.py
      - name: Upload standalone offline HTML and preview provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-orientem-priority-art-gallery
          path: artifacts/sacred-art-priority-review/
          if-no-files-found: error
          retention-days: 30
