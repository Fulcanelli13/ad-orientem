name: Sacred Atlas B22 — exact Ars native originals (research only)

on:
  push:
    branches: [research/sacred-atlas-b09-photo-file-audit-20261031]
    paths:
      - 'tools/sacred-atlas-b22-ars-two-originals.py'
      - '.github/workflows/sacred-atlas-b22-ars-original-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sacred-atlas-b22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-input Pillow==11.3.0
      - name: Validate allowlisted two source file pins
        run: python tools/sacred-atlas-b22-ars-two-originals.py --selftest
      - name: Download and independently verify native originals; make uncropped research previews
        run: python tools/sacred-atlas-b22-ars-two-originals.py --out artifacts/sacred-atlas-b22-ars
      - name: Upload seven-day exact-source research pack (never modify approved media)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sacred-atlas-b22-ars-two-originals-unapproved
          path: artifacts/sacred-atlas-b22-ars/
          retention-days: 7
          if-no-files-found: warn
