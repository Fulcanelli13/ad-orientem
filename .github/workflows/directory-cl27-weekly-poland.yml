name: CL27 Polish first-party six-chapel source gate
on:
  pull_request:
    paths:
      - 'data/directory/cl27-weekly-mass-poland-20261110.v1.json'
      - 'src/find/tlm-weekly-source-poland.js'
      - 'src/find/preliminary-directory-r49.js'
      - 'tests/tlm-cl27-weekly-source-poland.mjs'
      - '.github/workflows/directory-cl27-weekly-poland.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-polish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six source-backed Polish CL2 profiles, patterns and EN/FR
        run: node tests/tlm-cl27-weekly-source-poland.mjs
      - name: Verify previous 24 weekly sites and worldwide directory
        run: |
          node tests/tlm-cl27-weekly-source-programme.mjs
          node tests/tlm-cl27-weekly-source-supplement.mjs
          node tests/directory-b91-three-published-provisional-sites.mjs
      - name: Verify curated GitHub Pages bundle and no research leak
        run: |
          node tools/build-web-preview.mjs
          test -f dist/web-preview/data/directory/cl27-weekly-mass-poland-20261110.v1.json
          test -f dist/web-preview/src/find/tlm-weekly-source-poland.js
          test ! -d dist/web-preview/data/directory/research/cl27-current-firstparty-20261104
