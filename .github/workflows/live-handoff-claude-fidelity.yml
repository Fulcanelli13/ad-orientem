name: LIVE handoff literal Claude renderer fidelity
on:
  pull_request:
    paths:
      - 'src/mass/reader-live-handoff-claude-*.js'
      - 'src/mass/reader-live-handoff-band.js'
      - 'tests/reader-live-handoff-claude-*.mjs'
      - 'tests/live-handoff-visual-acceptance.mjs'
      - 'tests/live-handoff-native-mass-e2e.mjs'
      - '.github/workflows/live-handoff-claude-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-geometry-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify literal Claude modules and all source semantics
        run: |
          node --check src/mass/reader-live-handoff-claude-figs.js
          node --check src/mass/reader-live-handoff-claude-sanctuary.js
          node --check src/mass/reader-live-handoff-claude-stage-d.js
          node --check src/mass/reader-live-handoff-band.js
          node --test tests/reader-live-handoff-claude-source.mjs
          node --test tests/reader-live-handoff-claude-stage-d.mjs
          node --test tests/reader-live-handoff-routes.mjs
          node --test tests/reader-live-handoff-turns.mjs
          node --test tests/reader-live-handoff-stage-d.mjs
