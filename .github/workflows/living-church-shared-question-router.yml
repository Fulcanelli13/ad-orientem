name: Living Church shared question router
on:
  push:
    branches:
      - feature/living-church-shared-question-routing-20261019
    paths:
      - data/learn/living-church-shared-question-routing-pilot.v1.json
      - data/learn/living-church-pius-x-historical-passage-pointers.v1.json
      - data/learn/living-church-pius-x-fresh-bilingual-60.v1.json
      - data/learn/living-church-personal-verdict-boundary-48.v1.json
      - data/learn/living-church-pius-x-liturgical-scope-26.v1.json
      - src/learn/living-church-shared-question-router.js
      - src/learn/living-church-historical-focus.js
      - src/learn/living-church-personal-verdict-gate.js
      - src/learn/living-church-liturgical-source-scope.js
      - src/learn/living-church-hybrid-question-router.js
      - src/learn/living-church-embedding-candidate-router.js
      - src/learn/living-church-evaluation-gate.js
      - tests/living-church-evaluation-gate.mjs
      - tests/living-church-embedding-candidate-router.mjs
      - data/learn/living-church-symbolic-concepts.v1.json
      - tests/living-church-hybrid-question-router.mjs
      - tests/living-church-shared-question-router.mjs
      - tests/living-church-historical-document-navigation.mjs
      - tests/living-church-pius-x-fresh-bilingual-diagnostic.mjs
      - tests/living-church-personal-verdict-safety.mjs
      - tests/living-church-liturgical-source-scope.mjs
      - tests/living-church-question-retrieval-probes.mjs
      - tests/living-church-routing-holdout.mjs
      - tests/living-church-fresh-question-probes.mjs
      - data/learn/living-church-fresh-question-probes.v1.json
      - .github/workflows/living-church-shared-question-router.yml
  pull_request:
    paths:
      - data/learn/living-church-shared-question-routing-pilot.v1.json
      - data/learn/living-church-pius-x-historical-passage-pointers.v1.json
      - data/learn/living-church-pius-x-fresh-bilingual-60.v1.json
      - data/learn/living-church-personal-verdict-boundary-48.v1.json
      - data/learn/living-church-pius-x-liturgical-scope-26.v1.json
      - src/learn/living-church-shared-question-router.js
      - src/learn/living-church-historical-focus.js
      - src/learn/living-church-personal-verdict-gate.js
      - src/learn/living-church-liturgical-source-scope.js
      - src/learn/living-church-hybrid-question-router.js
      - src/learn/living-church-embedding-candidate-router.js
      - src/learn/living-church-evaluation-gate.js
      - tests/living-church-evaluation-gate.mjs
      - tests/living-church-embedding-candidate-router.mjs
      - data/learn/living-church-symbolic-concepts.v1.json
      - tests/living-church-hybrid-question-router.mjs
      - tests/living-church-shared-question-router.mjs
      - tests/living-church-historical-document-navigation.mjs
      - tests/living-church-pius-x-fresh-bilingual-diagnostic.mjs
      - tests/living-church-personal-verdict-safety.mjs
      - tests/living-church-liturgical-source-scope.mjs
      - tests/living-church-question-retrieval-probes.mjs
      - tests/living-church-routing-holdout.mjs
      - tests/living-church-fresh-question-probes.mjs
      - data/learn/living-church-fresh-question-probes.v1.json
      - .github/workflows/living-church-shared-question-router.yml
permissions:
  contents: read
jobs:
  source-only-topic-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all topic links and question/referral scenarios
        run: |
          node --check src/learn/living-church-shared-question-router.js
          node --check src/learn/living-church-historical-focus.js
          node --check src/learn/living-church-personal-verdict-gate.js
          node --check src/learn/living-church-liturgical-source-scope.js
          node --check src/learn/living-church-hybrid-question-router.js
          node --check src/learn/living-church-embedding-candidate-router.js
          node --check src/learn/living-church-evaluation-gate.js
          node tests/living-church-shared-question-router.mjs
          node tests/living-church-historical-document-navigation.mjs
          node tests/living-church-personal-verdict-safety.mjs
          node tests/living-church-liturgical-source-scope.mjs
          node tests/living-church-pius-x-fresh-bilingual-diagnostic.mjs
          node tests/living-church-question-retrieval-probes.mjs
          node tests/living-church-routing-holdout.mjs
          node tests/living-church-fresh-question-probes.mjs
          node tests/living-church-hybrid-question-router.mjs
          node tests/living-church-embedding-candidate-router.mjs
          node tests/living-church-evaluation-gate.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-fresh-bilingual-60-plus-8-report
          path: research-out/living-church-pius-x-fresh-60-plus-8-results.v1.json
          if-no-files-found: warn
          retention-days: 30
