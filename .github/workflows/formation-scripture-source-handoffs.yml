name: Formation Scripture source handoffs
on:
  pull_request:
    paths:
      - "src/learn/formation-recovery-review.js"
      - "src/learn/formation-scripture-source.js"
      - "tests/formation-scripture-source-*.mjs"
      - ".github/workflows/formation-scripture-source-handoffs.yml"
  push:
    branches: [main]
    paths:
      - "src/learn/formation-recovery-review.js"
      - "src/learn/formation-scripture-source.js"
      - "tests/formation-scripture-source-*.mjs"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node tests/formation-scripture-source-handoff.mjs
      - run: node tests/formation-recovery-review.mjs
      - run: node tests/formation-integrated-owner-corrections.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/formation-scripture-source-phone.mjs
