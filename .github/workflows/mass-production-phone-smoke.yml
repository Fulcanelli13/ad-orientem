name: Mass production phone smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/mass-reader-production-phone-smoke.mjs"
      - "tests/mass-reader-production-pages-contract.mjs"
      - ".github/workflows/mass-production-phone-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production-anonymous-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify GitHub Pages exclusive public Mass test target
        run: node tests/mass-reader-production-pages-contract.mjs
      - name: Verify live GitHub Pages Mass reader on 320/390px
        env:
          AO_PAGES_URL: https://fulcanelli13.github.io/ad-orientem/
        run: node tests/mass-reader-production-phone-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-reader-production-phone-smoke
          path: artifacts/mass-reader-production-smoke/
          if-no-files-found: warn
          retention-days: 7
