name: Visual acceptance capture

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "src/apostolate/**"
      - "src/app/**"
      - "src/assets/**"
      - "src/calendar/**"
      - "src/find/**"
      - "src/glossary/**"
      - "src/home/**"
      - "src/learn/*.js"
      - "src/mass/**"
      - "src/pray/**"
      - "src/settings/**"
      - "assets/**"
      - "tests/app-visual-acceptance.mjs"
      - "tests/mass-visual-acceptance.mjs"
      - "tests/nonmass-donor-reference-e2e.mjs"
      - "data/presentation/exact-donor-parity.v1.json"
      - "data/presentation/nonmass-primary-donor-sources.v1.json"
      - ".github/workflows/visual-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Capture Mass first so an unrelated Pray/Home visual failure cannot hide
      # the definitive Mass acceptance evidence from this workflow.
      - run: node tests/mass-visual-acceptance.mjs
      - run: node tests/app-visual-acceptance.mjs
      - run: node tests/nonmass-donor-reference-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-visual-acceptance
          path: artifacts/visual-acceptance
          if-no-files-found: error
