name: Visual acceptance capture

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
    paths:
      - "index.html"
      - "src/apostolate/**"
      - "src/app/**"
      - "src/assets/**"
      - "src/calendar/**"
      - "src/find/**"
      - "src/glossary/**"
      - "src/home/**"
      - "src/learn/*.js"
      - "src/mass/**"
      - "src/pray/**"
      - "src/settings/**"
      - "assets/**"
      - "tests/app-visual-acceptance.mjs"
      - "tests/explore-medallion-visual-acceptance.mjs"
      - "tests/home-pray-single-reader-e2e.mjs"
      - "tests/catechism-guided-mode-e2e.mjs"
      - "tests/mass-visual-acceptance.mjs"
      - "tests/reader-phone-curated65.mjs"
      - "tests/reader-live-visual-focus-production-phone.mjs"
      - "tests/reader-live-product48.mjs"
      - "tests/mass-phase12-curated65-contract.mjs"
      - "tests/nonmass-donor-reference-e2e.mjs"
      - "data/presentation/exact-donor-parity.v1.json"
      - "data/presentation/nonmass-primary-donor-sources.v1.json"
      - ".github/workflows/visual-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    # Drafts opt in explicitly; ordinary draft PRs still skip costly visual E2E.
    # This allows a visual-review request before making a PR merge-ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'visual-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Production uses the source-curated 65-family (64 when local second
      # Confiteor is omitted). The frozen 48-card projection is a separately
      # tested source/compatibility contract, not a URL-selectable live mode.
      # Test both without changing Mass ownership or weakening production gates.
      - run: node tests/mass-phase12-curated65-contract.mjs
      - run: node tests/reader-live-product48.mjs
      - run: node tests/reader-phone-curated65.mjs
      - run: node tests/reader-live-visual-focus-production-phone.mjs
      # Explore captures before the broader app sweep, so source-backed map
      # evidence is available even if an unrelated surface later fails.
      - run: node tests/explore-medallion-visual-acceptance.mjs
      - run: node tests/app-visual-acceptance.mjs
      - run: node tests/catechism-guided-mode-e2e.mjs
      - run: node tests/nonmass-donor-reference-e2e.mjs
      - run: node tests/home-pray-single-reader-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-visual-acceptance
          path: |
            artifacts/visual-acceptance
            artifacts/curated65-phone
            artifacts/live-mass-visual-focus
          if-no-files-found: error
