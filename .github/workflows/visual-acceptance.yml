name: Visual acceptance capture

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "tests/app-visual-acceptance.mjs"
      - "tests/mass-visual-acceptance.mjs"
      - ".github/workflows/visual-acceptance.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/app-visual-acceptance.mjs
      - run: node tests/mass-visual-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-visual-acceptance
          path: artifacts/visual-acceptance
          if-no-files-found: error
