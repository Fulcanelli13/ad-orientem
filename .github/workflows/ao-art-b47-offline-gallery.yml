name: B47 offline six-art CC0 gallery from SHA-verified draft Releases
on:
  push:
    branches: [research/sacred-art-b47-offline-cc0-gallery-from-archive-20261024]
    paths: [.github/workflows/ao-art-b47-offline-gallery.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b47-offline-six-art-gallery-one
  cancel-in-progress: false
jobs:
  build-real-offline-visual-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b47-offline-cc0-gallery-from-archive-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate six frozen source identities and install verified image decoder
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python -m py_compile scripts/research/sacred_art_b47_offline_gallery_from_archives.py
          node tests/sacred-art-b46-six-cc0-gallery-integrity.mjs
          test -f tests/sacred-art-b47-offline-six-review-originals.mjs
      - name: Reread three unpublished Releases and verify six original SHA before embedding previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_b47_offline_gallery_from_archives.py
      - name: Verify actual HTML carries six decoded offline images and exact archive provenance
        run: |
          node tests/sacred-art-b47-offline-six-review-originals.mjs
          python - <<'PY'
          from PIL import Image
          import re,json,base64,io
          from pathlib import Path
          d=json.loads(Path('data/research/sacred-art-b47-six-offline-thumbnail-audit.json').read_text())
          t=Path(d['html_gallery_path']).read_text()
          m=re.search(r'const items=(\[[\s\S]*?\]);\s*const gallery=',t)
          assert m
          x=json.loads(m.group(1))
          assert len(x)==6
          for z in x:
            uri=z["offline_preview_data_url"]
            assert uri.startswith("data:image/webp;base64,")
            b=base64.b64decode(uri.split(',',1)[1],validate=True)
            with Image.open(io.BytesIO(b)) as image:
              assert image.format=='WEBP'
              image.verify()
          assert d['offline_image_display_requires_network'] is False
          print('B47_DECODED_ALL_SIX_INLINE_OFFLINE_IMAGES')
          PY
      - name: Commit only local compressed HTML derivative and source SHA audit, no full originals or app changes
        run: |
          set -euo pipefail
          test ! -e artifacts/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/sacred-art-b47-offline-cc0-editorial-gallery.html data/research/sacred-art-b47-six-offline-thumbnail-audit.json
          git commit -m 'preview: B47 offline 6-photo owner CC0 HTML gallery SHA-sourced from durable draft originals'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b47-offline-cc0-gallery-from-archive-20261024
            git rebase origin/research/sacred-art-b47-offline-cc0-gallery-from-archive-20261024
            git push origin HEAD:research/sacred-art-b47-offline-cc0-gallery-from-archive-20261024 && exit 0
            sleep 3
          done
          exit 1
