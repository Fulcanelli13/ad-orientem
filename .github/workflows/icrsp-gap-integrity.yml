name: ICRSP source gap register integrity
# Includes B11–B13 source-subject, exact lection boundaries, historical holds and publication release guards.
on:
  push:
    branches: [governance/icrsp-source-inventory-1665]
    paths:
      - '.github/workflows/icrsp-gap-integrity.yml'
      - 'data/source-text/icrsp-france-39-major-content-gap-triage.v1.json'
      - 'data/source-text/icrsp-france-temporal-193-gap-register.v1.json'
      - 'data/source-text/icrsp-france-temporal-189-dedup-verified.v1.json'
      - 'tests/test_icrsp_gap_register_integrity.py'
      - 'tests/test_icrsp_mass_explorer_owner_parity.py'
      - 'data/source-text/icrsp-france-mass-explorer-39-owner-parity.v1.json'
      - 'data/source-text/icrsp-france-mass-moment-author-overlap.v1.json'
      - 'data/source-text/icrsp-france-temporal-193-sourcepath-crosswalk.v1.json'
      - 'data/source-text/icrsp-france-temporal-93-sourcepath-exceptions.v2.json'
      - 'tests/test_icrsp_temporal_sourcepath_witnesses.py'
      - 'data/source-text/icrsp-france-b10-lent-pentecost51-content-screen.v1.json'
      - 'tests/test_icrsp_b10_lent_pentecost_content_screen.py'
      - 'data/source-text/icrsp-france-b11-40-commentary-theme-review.v1.json'
      - 'tests/test_icrsp_b11_commentary_theme_review.py'
      - 'data/source-text/icrsp-france-b11-40-content-evidence-topics.v1.json'
      - 'data/source-text/icrsp-france-b11-51-crossdomain-content-handoff.v1.json'
      - 'tests/test_icrsp_b11_51_content_owner_handoff.py'
      - 'data/source-text/icrsp-france-b12-atomic-claim-and-lection-boundaries.v1.json'
      - 'tests/test_icrsp_b12_liturgical_claim_boundaries.py'
      - 'data/source-text/icrsp-france-b13-patristic-loci-crossbranch-handoff.v1.json'
      - 'tests/test_icrsp_b13_patristic_handoff.py'
      - 'data/source-text/icrsp-france-b14-gueranger-aphrahat-source-claims.v1.json'
      - 'tests/test_icrsp_b14_source_claims.py'
      - 'data/source-text/icrsp-france-b14-continued-work-authorship-and-original-loci.v1.json'
      - 'data/source-text/icrsp-france-commentary-783-verified-summary.v1.json'
      - 'tests/test_icrsp_b14_fromage_personal_authorship.py'
      - 'data/source-text/icrsp-france-b15-original-language-and-print-evidence.v1.json'
      - 'tests/test_icrsp_b15_original_language_evidence.py'
      - 'data/source-text/icrsp-france-b16-edition-divergence-crossdomain-parity.v1.json'
      - 'tests/test_icrsp_b16_edition_claim_reconciliation.py'
      - 'data/source-text/icrsp-france-b16-fromage-six-sunday-passage-crosscheck.v1.json'
      - 'tests/test_icrsp_b16_fromage_six_sunday_passages.py'
      - 'data/source-text/icrsp-france-b17-fromage-edition-ledger-and-two-more-text-matches.v1.json'
      - 'tests/test_icrsp_b17_fromage_edition_evidence.py'
      - 'data/source-text/icrsp-france-b18-fourth-sunday-original-edition-ocr-witness.v1.json'
      - 'tests/test_icrsp_b18_fourth_sunday_scan_ocr_variant.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-gap-registry:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all source, owner and release-gate contracts
        run: |
          python -m unittest discover -s tests -p 'test_icrsp_gap_register_integrity.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_mass_explorer_owner_parity.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_temporal_sourcepath_witnesses.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b10_lent_pentecost_content_screen.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b11_commentary_theme_review.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b11_51_content_owner_handoff.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b12_liturgical_claim_boundaries.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b13_patristic_handoff.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b14_source_claims.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b14_fromage_personal_authorship.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b15_original_language_evidence.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b16_edition_claim_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b16_fromage_six_sunday_passages.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b17_fromage_edition_evidence.py' -v
          python -m unittest discover -s tests -p 'test_icrsp_b18_fourth_sunday_scan_ocr_variant.py' -v
