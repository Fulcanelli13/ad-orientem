name: Rosary single-file hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        run: python3 tools/patch-rosary-group-width.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Rosary Group width in monolithic runtime"
          git push origin HEAD:main
