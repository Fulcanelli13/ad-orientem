name: 1962 multiple commemoration source audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/mass-1962-multiple-commemorations-year-audit.mjs'
      - 'src/mass/browser-entry.js'
      - 'src/mass/1962-commemoration-form-source.js'
      - 'src/mass/1962-multiple-commemoration-source.js'
      - 'src/mass/1962-passion-friday-commemorations.js'
      - 'src/mass/reader-proper-runtime-recovery.js'
      - 'src/mass/proper-reader-slots.js'
      - 'src/mass/ordo-mass-completeness.js'
      - 'src/calendar/print-proper.js'
      - 'src/calendar/liturgical-year.js'
      - 'src/calendar/ordo-mass-facts.js'
      - 'src/mass/host-adapter.js'
      - 'src/home/browser-entry.js'
      - '.github/workflows/mass-1962-multi-commemoration-source-audit.yml'
  push:
    paths:
      - 'tests/mass-1962-multiple-commemorations-year-audit.mjs'
      - 'src/mass/browser-entry.js'
      - 'src/mass/1962-commemoration-form-source.js'
      - 'src/mass/1962-multiple-commemoration-source.js'
      - 'src/mass/1962-passion-friday-commemorations.js'
      - 'src/mass/reader-proper-runtime-recovery.js'
      - 'src/mass/proper-reader-slots.js'
      - 'src/mass/ordo-mass-completeness.js'
      - 'src/calendar/print-proper.js'
      - 'src/calendar/liturgical-year.js'
      - 'src/calendar/ordo-mass-facts.js'
      - 'src/mass/host-adapter.js'
      - 'src/home/browser-entry.js'
      - '.github/workflows/mass-1962-multi-commemoration-source-audit.yml'
jobs:
  entire-calendar-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Gate 365 actual 2026 day resolutions and source-certified oration groups in all Mass forms
        run: node tests/mass-1962-multiple-commemorations-year-audit.mjs
