name: Performance investigation
on:
  push:
    branches:
      - performance/lazy-shell-phase1-20261009
    paths:
      - tools/measure-startup-structure.mjs
      - .github/workflows/performance-investigation.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze HTML boot payload
        run: node tools/measure-startup-structure.mjs
