name: Sacred Art W96 Distinct Original Photo Recovery
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - data/calendar/sacred-art-review-uploads/20261016-w96-distinct-original-source-acquisition.v1.json
      - tools/calendar/acquire-sacred-art-w96-distinct-originals.py
      - .github/workflows/sacred-art-w96-distinct-originals.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=10,<12' 'requests>=2.31,<3'
      - run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w96-distinct-originals.py
          python tools/calendar/acquire-sacred-art-w96-distinct-originals.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w96-distinct-original-research-files
          path: artifacts/sacred-art-w96-authentic-variant-originals/
          retention-days: 30
          if-no-files-found: warn
