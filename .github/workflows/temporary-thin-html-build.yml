name: Temporary thin startup extraction
on:
  push:
    branches: [performance/thin-html-safe-extraction-20261009]
    paths:
      - .github/workflows/temporary-thin-html-build.yml
      - tools/extract-thin-html-shell.mjs
      - tests/thin-html-browser-e2e.mjs
permissions:
  contents: write
concurrency:
  group: isolated-thin-html-generation
  cancel-in-progress: true
jobs:
  generate-verify:
    if: github.ref == 'refs/heads/performance/thin-html-safe-extraction-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/thin-html-safe-extraction-20261009
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve original HTML for matched baseline
        run: cp index.html /tmp/ad-orientem-thin-baseline.html
      - name: Generate and enforce thin shell
        run: |
          node tools/extract-thin-html-shell.mjs --apply
          node tools/extract-thin-html-shell.mjs --verify
          node tests/startup-payload-contract.mjs
          git diff --stat
      - name: Install phone Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify timings, routes, graphics and phone acceptance
        env:
          AO_THIN_BASELINE_PATH: /tmp/ad-orientem-thin-baseline.html
        run: |
          node tests/thin-html-browser-e2e.mjs
          node tests/per-icon-svg-e2e.mjs
          node tests/external-svg-sprite-e2e.mjs
          node tests/route-lazy-browser-e2e.mjs
          npm run test:app-shell-contract
          npm run test:rc-interaction-qa
          npm run test:phone
      - name: Commit verified generated HTML and code assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ao-inline-*.js ao-inline-*.css data/presentation/startup-thin-shell.v1.json
          git diff --cached --stat
          git commit -m "Externalize parser-ordered static code and styles into cacheable startup assets"
          git push origin HEAD:refs/heads/performance/thin-html-safe-extraction-20261009
