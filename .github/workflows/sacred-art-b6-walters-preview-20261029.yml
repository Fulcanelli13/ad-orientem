name: Sacred Art — Walters museum image-view smoke
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - scripts/art/sacred-art-b6-walters-preview-20261029.py
      - .github/workflows/sacred-art-b6-walters-preview-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile scripts/art/sacred-art-b6-walters-preview-20261029.py
          python scripts/art/sacred-art-b6-walters-preview-20261029.py
      - name: Archive image access evidence (no photo bytes)
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/calendar/sacred-art-b6-walters-preview-delivery-20261029.v1.json'))
          assert len(x['tests'])==15 and x['imageFilesSaved']==0
          print([(r['mode'],r.get('status'),r['validJpeg']) for r in x['tests']])
          PY
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b6-walters-preview-delivery-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): verify real Walters image preview delivery"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
