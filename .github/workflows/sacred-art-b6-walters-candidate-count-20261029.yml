name: Sacred Art — Count Walters actual painting images for B6
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - scripts/art/sacred-art-b6-walters-candidate-count-20261029.py
      - .github/workflows/sacred-art-b6-walters-candidate-count-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile scripts/art/sacred-art-b6-walters-candidate-count-20261029.py
          python scripts/art/sacred-art-b6-walters-candidate-count-20261029.py
      - name: Persist candidate evidence
        run: |
          python - <<'PY'
          import json
          p='data/calendar/sacred-art-b6-walters-exact-candidate-count-20261029.v1.json'
          d=json.load(open(p))
          assert d['photosDownloaded']==0 and d['withExactImageURL']<=d['candidatePaintings']
          print(d['candidatePaintings'],d['withExactImageURL'])
          PY
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b6-walters-exact-candidate-count-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): document Walters exact Christian painting and image candidate inventory"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
