name: Sacred Art Phase 44C — Grenoble two museum-linked photographs (research)
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase44c-grenoble-image-sources.py'
      - '.github/workflows/sacred-art-phase44c-grenoble-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grenoble-two:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
      - run: |
          python -m py_compile scripts/sacred-art/phase44c-grenoble-image-sources.py
          python scripts/sacred-art/phase44c-grenoble-image-sources.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-phase44c-grenoble-photo-provenance-only
          path: artifacts/sacred-art-phase44c-grenoble/
          retention-days: 14
          if-no-files-found: warn
