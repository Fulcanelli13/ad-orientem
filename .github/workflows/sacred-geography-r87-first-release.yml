name: Sacred Geography R87 first canonical release
on:
  push:
    branches:
      - 'research/v10-sacred-atlas-b20-admission-20261105'
    paths:
      - 'data/geography/**'
      - 'data/shrines/**'
      - 'data/explore/heritage-place-reconciliation.review.v1.json'
      - 'tests/sacred-atlas-**'
      - 'tests/sacred-places-**'
      - 'tests/sacred-geography-**'
      - 'tests/explore-geography-contracts.mjs'
      - 'tests/explore-pilgrimage-journey.mjs'
      - 'tests/relic-*.mjs'
      - 'tests/shrines-pilgrimages-contracts.mjs'
      - 'tools/geography/audit-sacred-atlas-editorial.mjs'
      - '.github/workflows/sacred-geography-r87-first-release.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'data/geography/**'
      - 'data/shrines/source-registry.v1.json'
      - 'src/find/geography-contracts.js'
      - 'src/find/shrines-contracts.js'
      - 'tests/sacred-geography-r87-first-release.mjs'
      - '.github/workflows/sacred-geography-r87-first-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r87-canonical-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: New physical sites, original source and coordinate contract
        run: node tests/sacred-geography-r87-first-release.mjs
      - name: V10 B21 two Marian admissions and 96-candidate preflight
        run: |
          node tests/sacred-atlas-96-country-area-preflight.mjs
          node tests/sacred-atlas-96-admission-review.mjs
          node tests/sacred-atlas-169-consolidated-intake.mjs
          node tests/sacred-atlas-73-source-exception-adjudication.mjs
          node tests/sacred-atlas-169-country-area-preflight.mjs
          node tests/sacred-atlas-67-source-evidence.mjs
          node tests/sacred-atlas-29-priority-source-review.mjs
          node tests/sacred-atlas-169-owner-review-packet.mjs
          node tests/sacred-atlas-16-evidence-repairs.mjs
          node tests/sacred-atlas-v10-b21-two-marian-places.mjs
      - name: V10 editorial master deterministic source audit
        run: node tests/sacred-atlas-editorial-master-530-contract.mjs
      - name: Preserve nine new approved covers and editorial photo rights
        run: |
          node tests/sacred-atlas-r26-existing21-original-cover-triage-contract.mjs
          node tests/shrine-marian-editorial-inventory-contract.mjs
          node tests/explore-sacred-photo-crosswalk.mjs
          node tests/relic-principal-sites-bulk.mjs
      - name: V10 broader graph and reader profiles
        run: |
          node tests/sacred-geography-r70-worldwide-coverage.mjs
          node tests/sacred-atlas-530-card-release-acceptance.mjs
          node tests/explore-pilgrimage-journey.mjs
      - name: Geography and Shrine registry integrity
        run: |
          node tests/explore-geography-contracts.mjs
          node tests/shrines-pilgrimages-contracts.mjs
      - name: P61 exact Catholic building release verification
        run: node tests/sacred-places-p61-four-catholic-buildings.mjs
      - name: P62 reuse and multi-subject photography research safety
        run: node tests/sacred-places-p62-reuse-and-subject-gallery.mjs
      - name: Earlier sacred-geography wave regression
        run: |
          node tests/sacred-geography-r72-world-anchors.mjs
          node tests/sacred-geography-r74-essential-sites.mjs
          node tests/sacred-geography-r75-essential-sites.mjs
          node tests/sacred-geography-r76-essential-sites.mjs
          node tests/sacred-geography-r77-essential-sites.mjs
          node tests/sacred-geography-r78-identity-adjudication.mjs
          node tests/sacred-geography-r79-major-church-sites.mjs
