name: Prayer artwork — Confession Nightly Seven Sorrows actual screen audit
on:
  pull_request:
    paths:
      - "src/pray/traditional-pray-runtime.js"
      - "src/pray/art-slot-map.v1.js"
      - "src/pray/internal-route-owner.js"
      - "src/pray/presentation-runtime.js"
      - "tests/prayer-artwork-three-destination-screen.mjs"
      - ".github/workflows/prayer-three-artwork-destination-screen.yml"
  workflow_dispatch:
jobs:
  real-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/prayer-artwork-three-destination-screen.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prayer-three-artwork-destination-qa
          path: artifacts/prayer-three-destinations-20261103/
          if-no-files-found: warn
          retention-days: 14
