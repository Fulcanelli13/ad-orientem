name: Prayer Holy Face original French 1895 public reader source verification
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pray/holy-face-janvier-1895-fr-reader-candidate.v1.js"
      - "src/pray/novena-runtime.js"
      - "tests/pray-holy-face-1895-french-native-reader-integration.mjs"
      - "tests/pray-holy-face-1895-french-public-reader-phone.mjs"
      - "tests/pray-b25-holy-face-full-novena.mjs"
      - ".github/workflows/pray-holy-face-1895-french-reader-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-1895-french-native-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-french-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify nine available 1895 French texts, Day VIII printed I/III/III and Day IX collect; preserve English witness
        run: node tests/pray-holy-face-1895-french-native-reader-integration.mjs
      - name: Preserve canonical 1887 English source and the distinct 1895 French original-reader attribution
        run: |
          node tests/pray-b25-holy-face-full-novena.mjs
          node tests/pray-holy-face-french-1895-all-nine-first-pass-gate.mjs
          node tests/pray-holy-face-1895-fr-days01-07-photo-section-recheck-gate.mjs
          node tests/pray-holy-face-1895-fr-days08-09-photo-secondpass-gate.mjs
  native-phone-french-default:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test full original French 1895 default and 1887 English 320/390 native Simple + Guided reader
        run: node tests/pray-holy-face-1895-french-public-reader-phone.mjs
      - name: Confirm ordinary French visits show 1895 French original and English switch (no preview query)
        run: node tests/pray-b25-holy-face-french-original-phone-20261109.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holy-face-1895-french-public-reader
          path: |
            artifacts/pray-b25-holyface-original-fr/holy-face-1895-french-public-phone.json
            artifacts/pray-b25-holyface-original-fr/holy-face-1895-fr-public-*.png
            artifacts/pray-b25-holyface-original-fr/holy-face-french-default-access.json
          if-no-files-found: ignore
