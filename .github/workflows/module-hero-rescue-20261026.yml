name: Remaining heroes image fidelity rescue
on:
  push:
    branches: [main]
    paths: [.github/workflows/module-hero-rescue-20261026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-only:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Move research script to runner and switch existing archive branch
        run: |
          cp scripts/art/acquire-hero-rescue.py /tmp/acquire-hero-rescue.py
          cp scripts/art/make-module-hero-review-previews.py /tmp/make-hero-previews.py
          git fetch origin research/module-hero-rescue-20261026
          git switch -C research/module-hero-rescue-20261026 origin/research/module-hero-rescue-20261026
      - name: Acquire both originals, retaining Nikon MPO source bytes
        run: python3 /tmp/acquire-hero-rescue.py
      - name: Make full and 1:1 detail previews
        env:
          AO_HERO_PREVIEW_INPUT: assets/staged/module-hero-rescue
        run: python3 /tmp/make-hero-previews.py
      - name: Permanently preserve source bytes and report on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/module-hero-rescue-20261026.json
          if [ -d assets/staged/module-hero-rescue ]; then git add -f assets/staged/module-hero-rescue; fi
          if [ -d assets/staged/module-hero-preview-jpegs ]; then git add -f assets/staged/module-hero-preview-jpegs; fi
          if ! git diff --cached --quiet; then
            git commit -m "research(art): archive native Gérôme MPO photograph and corrected image reports"
            git push origin research/module-hero-rescue-20261026
          fi
      - name: Publication boundary
        run: echo "No artwork approvals or app changes. Strictly a €0 research archive."
