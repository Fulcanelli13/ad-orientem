name: Build source-identified Catholic Scripture transcriptions
on:
  push:
    branches:
      - feat/scripture-source-reading-restoration-20261010
    paths:
      - 'tools/scripture/publish-source-transcriptions.mjs'
      - '.github/workflows/scripture-source-transcription-packs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-text-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Byte-pin all Catholic source candidates
        run: node tools/scripture/fetch-upstream.mjs
      - name: Retrieve all 73 CPDV books from the author's own pages
        run: node tools/scripture/collate-cpdv-master.mjs artifacts/scripture-candidates 73
      - name: Generate source-identified, not certified, per-book reading files
        run: node tools/scripture/publish-source-transcriptions.mjs artifacts/scripture-candidates data/scripture/source-transcriptions
      - name: Commit source transcriptions to this branch
        env:
          GITHUB_HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture/source-transcriptions/
          git diff --cached --quiet && exit 0
          git commit -m "Include byte-pinned Catholic source transcriptions for in-app reading"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
