name: Sacred Art — KMSKA next 250 Batch B4 import-only gallery
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - .github/workflows/sacred-art-kmska-b4-gallery-20261029.yml
      - scripts/art/build-sacred-art-kmska-next-b4-gallery-20261029.py
      - data/calendar/sacred-art-kmska-next-250-b4-20261029.v1.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-kmska-b4-gallery
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build next 250-piece museum review file after source check
        run: |
          if [ ! -f data/calendar/sacred-art-kmska-next-250-b4-20261029.v1.json ]; then
            echo 'Verified B4 source data not yet committed'; exit 0
          fi
          python -m py_compile scripts/art/build-sacred-art-kmska-next-b4-gallery-20261029.py
          python scripts/art/build-sacred-art-kmska-next-b4-gallery-20261029.py
      - name: Ensure 250 non-repeated museum works, research rights hold and JavaScript integrity
        run: |
          if [ ! -f docs/SACRED_ART_KMSKA_NEXT_250_IMPORT_REVIEW_B4_20261029.html ]; then exit 0; fi
          python - <<'PY'
          import re,json
          from pathlib import Path
          h=Path('docs/SACRED_ART_KMSKA_NEXT_250_IMPORT_REVIEW_B4_20261029.html').read_text(encoding='utf8')
          m=re.search(r'<script id="catalog-data" type="application/json">(.*?)</script>',h,re.S)
          assert m
          rows=json.loads(m.group(1))
          b3=json.loads(Path('data/calendar/sacred-art-250-review-source-b3-20261029.v1.json').read_text())
          p=json.loads(Path('data/calendar/sacred-art-20261029-user-60-import-reject-ledger.v1.json').read_text())
          old={x['id'] for x in b3['rows']}|{x['sourceId'] for z in ('imports','rejects') for x in p[z]}
          assert len(old)==310
          assert 200<=len(rows)<=250 and len({x['id'] for x in rows})==len(rows)
          assert not {x['id'] for x in rows}&old
          assert all(x['provider']=='KMSKA' and x['rightsConflict'] for x in rows)
          assert all(x['previewURL'].startswith('https://iiif.kmska.be/') for x in rows)
          assert 'const PAGE_SIZE=50' in h and 'seenPages.length<TOTAL_PAGES' in h
          assert "batchId:'B4'" in h
          assert 'Import with corrections' in h and 'Finalize and export decisions' in h
          assert "for(let score=" not in h
          js=re.search(r'</script><script>(.*?)</script></body></html>',h,re.S)
          assert js
          Path('/tmp/ao-kmska-b4.js').write_text(js.group(1))
          print('B4_KMSKA_250_GALLERY_PASS',len(rows))
          PY
          node --check /tmp/ao-kmska-b4.js
          git diff --exit-code -- data/calendar/sacred-art-250-review-source-b3-20261029.v1.json data/calendar/sacred-art-20261029-user-60-import-reject-ledger.v1.json
      - name: Commit distinct B4 gallery, with no changes to B3
        run: |
          if [ ! -f docs/SACRED_ART_KMSKA_NEXT_250_IMPORT_REVIEW_B4_20261029.html ]; then exit 0; fi
          git config user.name "Ad Orientem sacred art curation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SACRED_ART_KMSKA_NEXT_250_IMPORT_REVIEW_B4_20261029.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): build next 250 KMSKA paintings B4 import-only review gallery"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
