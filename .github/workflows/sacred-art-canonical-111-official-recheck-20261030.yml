name: Sacred Art 111 canonical archived sources official recheck (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-canonical-111-official-recheck-20261030.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-canonical-111-official-recheck
  cancel-in-progress: false

jobs:
  official-source-page-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect 383 baseline and frozen source decisions
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Resolve 111 archived source URLs from official museum and Commons interfaces
        run: node scripts/art/verify-canonical383-111-official-sources-20261030.mjs
      - name: Enforce no-photo and no-production certification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('data/calendar/sacred-art-phase1-canonical383-111-official-source-verification-20261030.v1.json','utf8'));
          const s=d.stats;
          if(d.rows.length!==111||s.selectedSingleArchivedSourceUrlCases!==111||
             s.sourceLanes.commons!==46||s.sourceLanes.cleveland!==34||
             s.sourceLanes.met!==30||s.sourceLanes.other!==1||
             s.newAcceptedCanonical383Links!==0||s.canonical383SourcePageFieldsUpdated!==0||
             s.officialExactNativePhotoQualityCertified!==0||s.photoLicenseCertified!==0||
             s.productionImports!==0||d.release.productionMutation!==false||
             d.rows.some(x=>x.productionMutation!==false||x.editorialDecisionUnchanged!==true||
               x.exactImageRightsNotCertified!==true||x.nativeImageNotVisuallyInspected!==true))
             throw Error("111-source validation release-gate breach");
          console.log(JSON.stringify(s,null,2));
          NODE
      - name: Commit source recheck evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-canonical383-111-official-source-verification-20261030.v1.json
          git diff --cached --check
          git commit -m "research(sacred-art): verify 111 canonical archived sources against official APIs [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
