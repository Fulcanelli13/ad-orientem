name: Visible Mass M6 B30 TLM-photo typology contract
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - tests/visible-mass-m6-single-hero-b30-tlm-typology-contract.mjs
      - previews/visible-mass-3d/M6_ONE_OBJECT_ONE_IMAGE_P0_20261019.v9.json
      - previews/visible-mass-3d/M6_B30_ORIGINAL_TLM_FIRST_PIXEL_REVIEW_20261019.v1.json
      - .github/workflows/visible-mass-m6-b30-typology-contract.yml
  pull_request:
    paths:
      - tests/visible-mass-m6-single-hero-b30-tlm-typology-contract.mjs
      - previews/visible-mass-3d/M6_ONE_OBJECT_ONE_IMAGE_P0_20261019.v9.json
      - previews/visible-mass-3d/M6_B30_ORIGINAL_TLM_FIRST_PIXEL_REVIEW_20261019.v1.json
      - .github/workflows/visible-mass-m6-b30-typology-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/visible-mass-m6-single-hero-b30-tlm-typology-contract.mjs
