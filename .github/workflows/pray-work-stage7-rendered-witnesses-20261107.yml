name: Prayer registry Stage 7 — rendered historical source witnesses
on:
  push:
    branches:
      - research/prayer-work-identity-registry-20261106
    paths:
      - .github/workflows/pray-work-stage7-rendered-witnesses-20261107.yml
      - tests/pray-work-stage7-rendered-witnesses-20261107.mjs
      - data/pray/prayer-work-identity-registry-20261106.v1.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pray-work-stage7-rendered-witnesses-20261107.yml
      - tests/pray-work-stage7-rendered-witnesses-20261107.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-stage7-source-witnesses-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  historical-source-body:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify full visible witnesses in original Prayer readers
        run: node tests/pray-work-stage7-rendered-witnesses-20261107.mjs
      - name: Preserve source-exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-stage7-rendered-historical-witnesses
          path: artifacts/pray-work-stage7-rendered/rendered-source-witnesses.json
          if-no-files-found: warn
          retention-days: 7
