name: Sacred Art Curator — 383 full licence and photographic queues
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/sacred-art-curator-383-20261029.yml
      - scripts/art/build-sacred-art-curation-queues-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-curator-383
  cancel-in-progress: false
jobs:
  build-and-audit-curation-queues:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 383 fully traceable curatorial dispositions
        run: |
          python -m py_compile scripts/art/build-sacred-art-curation-queues-20261029.py
          python scripts/art/build-sacred-art-curation-queues-20261029.py
      - name: Preserve three actionable artwork curation queues and sources
        if: always()
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-curator-queues-383-20261029.v1.json data/calendar/sacred-art-curator-licence-review-20261029.csv data/calendar/sacred-art-curator-photo-repair-20261029.csv data/calendar/sacred-art-curator-near-ready-20261029.csv
          git diff --cached --check
          if git diff --cached --quiet; then echo "No new evidence"; exit 0; fi
          git commit -m "research(sacred art): archive 383-ID licence, photo repair and near-ready queues"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
