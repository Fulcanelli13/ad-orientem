name: P72 Mauritius Ireland Commons original bytes (read-only)
on:
  pull_request:
    branches:
      - research/p71-commons-batch0-curation-preflight-20261029
    paths:
      - 'tools/verify-priority-commons-p72.py'
      - 'data/geography/research/p72-priority-commons-originals-plan.v1.json'
      - '.github/workflows/p72-priority-commons-originals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only preview dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Validate fixed nine-source manifest without network
        run: python tools/verify-priority-commons-p72.py --dry-run
      - name: Verify actual original image bytes against frozen Wikimedia SHA1
        run: python tools/verify-priority-commons-p72.py --delay 4.0
      - name: Temporary research evidence (not published image assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p72-research-only-original-hashes-and-contact-sheet
          retention-days: 1
          if-no-files-found: warn
          path: |
            data/geography/research/p72-priority-original-byte-results.jsonl
            data/geography/research/p72-priority-originals-contact-sheet.jpg
