name: M6 One-Object Existing Source Sprint
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "tools/visible-mass-m6-existing-source-contact.py"
      - ".github/workflows/visible-mass-m6-existing-source-sprint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install thumbnail inspection tools
        run: python -m pip install --quiet requests==2.32.5 Pillow==11.3.0
      - name: Produce object-specific quality contact sheet and rights evidence
        run: python tools/visible-mass-m6-existing-source-contact.py
      - name: Save source evidence including partial results on source throttle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M6-Existing-Object-Source-Sprint
          path: dist/visible-mass/m6-existing-source-sprint/
          if-no-files-found: warn
          retention-days: 30
