name: Sacred Art SMK 54 official collection API probe (research only)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-smk-54-official-api-probe-20261029.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-smk-api-probe
  cancel-in-progress: false

jobs:
  verify-smk-public-api-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect all original Sacred Art editorial decisions
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Probe SMK official object API and metadata schema
        run: node scripts/art/probe-smk-54-official-api-20261029.mjs
      - name: Save bounded research evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p='data/calendar/sacred-art-phase1-smk-api-probe-20261029.v1.json';
          const j=JSON.parse(readFileSync(p,'utf8'));
          if(j.sampleSize!==3 || j.records.length!==3 || j.productionMutation!==false ||
            j.records.some(r=>r.verified!==false)) throw Error('Probe prematurely verified sources.');
          NODE
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-smk-api-probe-20261029.v1.json
          git diff --cached --check
          git commit -m "research(sacred-art): record official SMK API schema probe [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
