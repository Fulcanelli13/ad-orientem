name: Preferences missal book real phone acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/settings/**"
      - "tests/settings-owner.mjs"
      - "tests/settings-preferences-phone.mjs"
      - ".github/workflows/settings-preferences-phone.yml"
permissions:
  contents: read
jobs:
  preferences-book-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify Settings donor and eight-section source-preserving layout
        run: node tests/settings-owner.mjs
      - name: Exercise all eight pages on two real phone widths
        run: node tests/settings-preferences-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preferences-missal-phone-320-390
          path: artifacts/preferences-book-phone/
          if-no-files-found: warn
          retention-days: 14
