name: P100 original photo integrity verification (research-only)
on:
  push:
    branches:
      - research/p100-original-byte-audit-20261030
    paths:
      - .github/workflows/p100-photo-probe.yml
      - docs/research/directory/p100-original-photo-probe-20261030/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-integrity:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install JPEG full-resolution decoder
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Fetch, hash and decode 31 originals in transient runner memory
        run: python3 docs/research/directory/p100-original-photo-probe-20261030/batch.py
