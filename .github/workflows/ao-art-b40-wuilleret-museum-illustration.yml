name: B40 full Wuilleret Saint Peter Canisius museum dossier research original archive
on:
  push:
    branches: [research/sacred-art-b40-27-commons-accession-image-screen-20261024]
    paths: [.github/workflows/ao-art-b40-wuilleret-museum-illustration.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b40-museum-wuilleret-original-once
  cancel-in-progress: false
jobs:
  museum-pdf-source-archive-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b40-27-commons-accession-image-screen-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only predecessor integrity and decoder preparation
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'pymupdf>=1.24,<1.30'
          python -m py_compile scripts/research/sacred_art_b40_extract_wuilleret_canisius.py
          node tests/sacred-art-b38-evidence-holds.mjs
          node tests/sacred-art-b39-27-evidence-integrity.mjs
      - name: Preserve full original research-only museum-published PDF image p6
        run: python scripts/research/sacred_art_b40_extract_wuilleret_canisius.py
      - name: Mandatory unpublished draft Release with remote checksum reread
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/research/sacred_art_release_archive_gate.py --wave b40-wuilleret-p6 --source-dir artifacts/b40-wuilleret-pierre-canisius-p6-research
      - name: Commit source evidence; NO copyrighted image files in Git
        run: |
          set -euo pipefail
          cp artifacts/b40-wuilleret-pierre-canisius-p6-research/source-results.csv data/research/sacred-art-b40-wuilleret-source-results.csv
          cp artifacts/b40-wuilleret-pierre-canisius-p6-research/source-summary.json data/research/sacred-art-b40-wuilleret-source-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b40-wuilleret-source-results.csv data/research/sacred-art-b40-wuilleret-source-summary.json
          git commit -m 'research: B40 museum PDF exact Wuilleret full-object original SHA verified privately, no photo reuse grant'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b40-27-commons-accession-image-screen-20261024
            git rebase origin/research/sacred-art-b40-27-commons-accession-image-screen-20261024
            git push origin HEAD:research/sacred-art-b40-27-commons-accession-image-screen-20261024 && exit 0
            sleep 3
          done
          exit 1
