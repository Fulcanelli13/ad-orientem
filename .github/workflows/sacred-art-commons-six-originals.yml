name: Sacred Art — Commons six museum originals (research-only)
on:
  push:
    branches:
      - platform/885-sacred-art-candidates
    paths:
      - "data/calendar/sacred-art-commons-six-strict-acquisition-20261013.v1.json"
      - "tools/calendar/acquire-sacred-art-commons-six.py"
      - ".github/workflows/sacred-art-commons-six-originals.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-commons-six-originals
  cancel-in-progress: true
jobs:
  research-source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch (not application release)
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow for actual JPEG integrity and pixel validation
        run: python -m pip install Pillow
      - name: Offline manifest and script preflight (fails before network)
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-commons-six.py
          python - <<'PY'
          import json, re
          from pathlib import Path
          m=json.loads(Path("data/calendar/sacred-art-commons-six-strict-acquisition-20261013.v1.json").read_text())
          q=json.loads(Path(m["master"]).read_text())
          leads={r["leadId"]:r for r in q["queue"]}
          assert len(m["items"])==6 and m["schema"].endswith("_V2")
          assert len({r["leadId"] for r in m["items"]})==6
          for r in m["items"]:
              assert r["leadId"] in leads
              assert r["expectedWidth"]>=2500 and r["expectedHeight"]>=1800
              assert (not r.get("expectedCommonsSha1")) or re.fullmatch(r"[a-f0-9]{40}",r["expectedCommonsSha1"])
              assert r["professionalUseRights"].startswith("HOLD_")
          print("SIX_SOURCE_PINS_VALID")
          PY
      - name: Retrieve exact Commons original files and verify SHA1 + SHA256
        run: python tools/calendar/acquire-sacred-art-commons-six.py
      - name: Verify fail-closed image research and no production promotions
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path("artifacts/sacred-art-commons-six-originals")
          ledger=json.loads((root/"acquisition.json").read_text(encoding="utf-8"))
          assert ledger["requested"] == 6 and ledger["productionChanges"] == 0
          assert len(ledger["results"]) == 6
          count=0
          for row in ledger["results"]:
              assert row["rating"] is None
              assert row["productionApproved"] is False
              assert row["artCuratorApproved"] is False
              assert row["mobileCropApproved"] is False
              if row["status"] != "ORIGINAL_ACQUIRED_RESEARCH_ONLY":
                  print("HELD",row["leadId"],row.get("holdReason"))
                  continue
              data=(root/row["filename"]).read_bytes()
              assert len(data) == row["bytes"]
              assert hashlib.sha1(data).hexdigest() == row["originalSha1Commons"]
              assert hashlib.sha256(data).hexdigest() == row["originalSha256"]
              assert "PENDING" in row["rights"]
              assert max(row["width"],row["height"]) >= 2800
              count+=1
          print("VERIFIED_RESEARCH_ORIGINALS",count,"/6")
          if count == 0:
              print("ALL_SIX_SOURCES_HELD_NO_VERIFIED_JPEGS; inspect per-file hold ledger")
          PY
      - name: Show per-work acquisition and hold ledger in Actions summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          f=Path("artifacts/sacred-art-commons-six-originals/acquisition.json")
          path=Path(os.environ["GITHUB_STEP_SUMMARY"])
          with path.open("a",encoding="utf-8") as s:
              s.write("## Six original painting image acquisitions (research only)\n\n")
              if not f.exists():
                  s.write("Acquisition ledger absent: setup or downloader failed before writing. **Count zero.**\n")
              else:
                  j=json.loads(f.read_text(encoding="utf-8"))
                  s.write(f"Verified acquisition claims in ledger: **{j['acquired']}/{j['requested']}**. Independent artifact hashes still need review. No app approval or deployment.\n\n")
                  s.write("| Lead | Status | Dimensions | Reason / SHA256 |\n|---|---|---|---|\n")
                  for r in j["results"]:
                      dim=f"{r.get('width','—')} × {r.get('height','—')}"
                      note=r.get("holdReason") or r.get("originalSha256","")
                      note=str(note).replace("|","/").replace("\n"," ")[:160]
                      s.write(f"| {r['leadId']} | {r['status']} | {dim} | {note} |\n")
          PY
      - name: Commit audited acquisition receipt to research branch (metadata only)
        if: success()
        run: |
          python - <<'PY'
          import json, os, hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          artifact=Path("artifacts/sacred-art-commons-six-originals")
          report=json.loads((artifact/"acquisition.json").read_text(encoding="utf-8"))
          assert report["requested"]==6 and report["productionChanges"]==0
          done=0
          rows=[]
          for x in report["results"]:
              record={"leadId":x["leadId"],"sourceCommonsFile":x["commonsFile"],
                "status":x["status"],"productionApproved":False,"humanRating":None}
              if x["status"]=="ORIGINAL_ACQUIRED_RESEARCH_ONLY":
                  data=(artifact/x["filename"]).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==x["originalSha256"]
                  assert hashlib.sha1(data).hexdigest()==x["originalSha1Commons"]
                  assert len(data)==x["bytes"]
                  record.update(originalSha256=x["originalSha256"],
                    originalSha1Commons=x["originalSha1Commons"],
                    dimensions=[x["width"],x["height"]],
                    bytes=x["bytes"],commonsPage=x["commonsPage"],
                    imageRights=x["rights"],fileName=x["filename"])
                  done+=1
              else:
                  record["holdReason"]=str(x.get("holdReason",""))[:240]
              rows.append(record)
          assert done==report["acquired"]
          receipt={"schema":"AO_SACRED_ART_COMMONS_6_ACTUAL_RUN_VERIFIED_RECEIPT_V1",
            "timeUtc":datetime.now(timezone.utc).isoformat(),
            "runUrl":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+
               "/actions/runs/"+os.environ["GITHUB_RUN_ID"],
            "triggerCommit":os.environ["GITHUB_SHA"],
            "status":"SOURCE_JPEG_HASH_VERIFIED" if done else "ALL_SIX_SOURCES_HELD_NO_NEW_MASTER",
            "requested":6,"sourceMastersVerified":done,
            "held":6-done,"results":rows,
            "note":"Files remain ONLY in temporary GitHub Actions ZIP until independently preserved; no production rights, aesthetic ratings or crops granted.",
            "productionChanges":0,"commercialReleaseApproved":False}
          target=Path("data/calendar/sacred-art-commons-six-LAST-VERIFIED-20261013.v1.json")
          target.write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("VERIFIABLE_RECEIPT",target,done,"/6")
          PY
          git config user.name "ad-orientem-art-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-commons-six-LAST-VERIFIED-20261013.v1.json
          git commit -m "research(art): record Commons source-JPEG checksums [skip ci]"
          git fetch origin platform/885-sacred-art-candidates
          git rebase origin/platform/885-sacred-art-candidates
          git push origin HEAD:platform/885-sacred-art-candidates
      - name: Preserve original JPEG bytes and SHA ledger for review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-commons-six-research-originals
          path: artifacts/sacred-art-commons-six-originals/
          retention-days: 30
          if-no-files-found: warn
