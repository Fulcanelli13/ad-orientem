name: Sacred Atlas Round 9 polite 429 recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round9-selected-429-retry-manifest-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round9-429-retry-covers.py'
      - '.github/workflows/sacred-atlas-round9-429-retry-acquire.yml'
permissions:
  contents: write
jobs:
  recover-locked-selected-originals:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round09-selected-429-recovery-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install Pillow==11.3.0
      - name: Recheck ten selected Commons originals with six-second pacing and 429 circuit breaker
        run: python tools/atlas/acquire-sacred-atlas-round9-429-retry-covers.py
      - name: Commit only verified WebPs, registry and evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-media/ data/geography/research/sacred-atlas-round9-selected-429-retry-evidence-20261103.v1.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/ \
            data/geography/approved-place-media.v1.json \
            data/geography/research/sacred-atlas-round9-selected-429-retry-evidence-20261103.v1.json
          git commit -m "assets(atlas): recovered exact selected originals after Commons 429"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
