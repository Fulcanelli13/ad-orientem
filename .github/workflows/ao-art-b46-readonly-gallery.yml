name: B46 Sacred Art CC0 comparative gallery and frozen ID integrity (read-only)
on:
  push:
    branches: [research/sacred-art-b46-cc0-editorial-gallery-20261024]
    paths: [.github/workflows/ao-art-b46-readonly-gallery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial_gallery_provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b46-cc0-editorial-gallery-20261024
      - name: B45 exact source and image rights baseline
        run: node tests/sacred-art-b45-exact-source-and-rights-integrity.mjs
      - name: B46 six-source SHA image URLs and no-publication HTML preview
        run: node tests/sacred-art-b46-six-cc0-gallery-integrity.mjs
