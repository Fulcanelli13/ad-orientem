name: Divine Office — one real-source week into annual register
on:
  pull_request:
    paths:
      - 'src/office/annual-capture-plan.js'
      - 'scripts/office/validate-annual-capture.mjs'
      - 'tests/divine-office-annual-capture.mjs'
      - '.github/workflows/office-weekly-source-import.yml'
permissions:
  contents: read
concurrency:
  group: office-weekly-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  raw-source-week:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate finite annual queue and real-byte importer
        run: |
          node --check src/office/annual-capture-plan.js
          node --check scripts/office/validate-annual-capture.mjs
          node --test tests/divine-office-annual-capture.mjs
      - name: Read only exact reviewed research composer commit
        uses: actions/checkout@v4
        with:
          repository: Fulcanelli13/ad-orientem
          ref: ce39a02827049b31041ae250ec3b9b7c364f4a1e
          path: office-research
          persist-credentials: false
      - name: Confirm matching original source revision
        run: |
          PIN="$(sed -n 's/^export const DIVINUM_OFFICIUM_PIN="\([^"]*\)";/\1/p' src/app/source-transport-compat.js)"
          OTHER="$(sed -n 's/^export const DIVINUM_OFFICIUM_PIN="\([^"]*\)";/\1/p' office-research/src/app/source-transport-compat.js)"
          test "$PIN" = "$OTHER"
          test "$(git -C office-research rev-parse HEAD)" = ce39a02827049b31041ae250ec3b9b7c364f4a1e
      - name: Install original generator CGI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcgi-pm-perl libcgi-session-perl libwww-perl
      - name: Fetch source-pinned original generator in sparse scratch
        env:
          UPSTREAM: ${{ runner.temp }}/office-upstream
        run: |
          set -euo pipefail
          PIN="$(sed -n 's/^export const DIVINUM_OFFICIUM_PIN="\([^"]*\)";/\1/p' src/app/source-transport-compat.js)"
          test "$(printf %s "$PIN" | wc -c)" -eq 40
          mkdir -p "$UPSTREAM"
          git -C "$UPSTREAM" init -q
          git -C "$UPSTREAM" remote add origin https://github.com/DivinumOfficium/divinum-officium.git
          git -C "$UPSTREAM" sparse-checkout init --cone
          git -C "$UPSTREAM" sparse-checkout set web/cgi-bin web/www/horas web/www/Tabulae standalone/tools/epubgen2
          git -C "$UPSTREAM" -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=1 origin "$PIN"
          git -C "$UPSTREAM" checkout --detach FETCH_HEAD
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$PIN"
      - name: Generate seven dates Nov 5-11, eight Hours, three languages
        env:
          UPSTREAM: ${{ runner.temp }}/office-upstream
          RAW: ${{ runner.temp }}/office-week-raw
        run: |
          set -euo pipefail
          DATES="$(node --input-type=module -e '
            import {planAnnualOfficeCaptures,selectAnnualOfficeCaptureBatch} from "./src/office/annual-capture-plan.js";
            const week=selectAnnualOfficeCaptureBatch(planAnnualOfficeCaptures({year:2026}),"2026-11-05");
            if(week.plannedDocuments!==168||week.dates.length!==7||week.endDate!=="2026-11-11")
              throw Error("OFFICE_WEEKLY_PLAN_DRIFT");
            process.stdout.write(week.dates.join(","));
          ')"
          node office-research/scripts/office/phase-b-generate.mjs \
            --upstream "$UPSTREAM" --out "$RAW" \
            --dates "$DATES" \
            --hours MATINS,LAUDS,PRIME,TERCE,SEXT,NONE,VESPERS,COMPLINE \
            --languages la,en,fr
      - name: Verify all source bytes and import genuine manifest into annual register
        env:
          RAW: ${{ runner.temp }}/office-week-raw
          REPORT: ${{ runner.temp }}/office-annual-import
        run: |
          set -euo pipefail
          node scripts/office/validate-annual-capture.mjs \
            --root "$RAW" --start 2026-11-05 --report "$RAW/sha256-verified-week.json"
          node scripts/office/build-annual-readiness-register.mjs \
            --year 2026 --out "$REPORT" --probe-manifest "$RAW/manifest.json"
          REPORT="$REPORT" RAW="$RAW" node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const d=JSON.parse(readFileSync(process.env.REPORT+"/2026-office-annual-readiness.json","utf8"));
            const v=JSON.parse(readFileSync(process.env.RAW+"/sha256-verified-week.json","utf8"));
            const s=d.summary;
            if(s.planned!==8760||s.rawCaptured!==168||s.notGenerated!==8592||
               s.datesWithAnyRawEvidence!==7||
               s.liturgicallyCertified!==0||s.approved!==0||s.published!==0||
               d.release.canPublish||d.release.publicRouteEnabled||
               v.validatedXhtmlEnvelopes!==168||v.bytesSha256Verified!==168||
               v.independentlyPrintedTextCertified!==0||v.published!==0||
               Object.values(s.byHour).some(x=>x.rawCaptured!==21)||
               Object.values(s.byLanguage).some(x=>x.rawCaptured!==56))
              throw Error("OFFICE_REAL_SOURCE_WEEK_IMPORT_OR_RELEASE_GATE_INVALID");
            console.log("OFFICE_REAL_WEEKLY_REGISTER",JSON.stringify({
              planned:s.planned,sourceFilesCapturedAndShaVerified:s.rawCaptured,
              dates:s.datesWithAnyRawEvidence,remaining:s.notGenerated,
              certified:s.liturgicallyCertified,approved:s.approved,published:s.published
            }));
          '
      # No source-text/artifact uploads, publication or recurring schedule.
