name: Sacred Art W86 Frame Aware Sources
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - tools/calendar/acquire-sacred-art-w86-source-images.py
      - .github/workflows/sacred-art-w86-source-images.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - name: Acquire exact sources, master hashes and full-frame review previews
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w86-source-images.py
          python tools/calendar/acquire-sacred-art-w86-source-images.py
      - name: Archive acquired bytes and provenance with explicit contextual-image holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w86-exact-source-acquisitions
          path: |
            artifacts/sacred-art-w86-image-acquisition/
            docs/research/review-galleries/acquired/
          retention-days: 30
          if-no-files-found: warn
