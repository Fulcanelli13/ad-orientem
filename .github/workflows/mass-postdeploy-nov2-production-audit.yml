name: Mass H7 local preflight and postdeploy GitHub Pages acceptance
on:
  pull_request:
    paths:
      - ".github/workflows/mass-postdeploy-nov2-production-audit.yml"
      - "tests/mass-h7-sunday-asperges-phone.mjs"
  workflow_run:
    workflows: ["Ad Orientem — GitHub Pages release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-h7-mass:
    name: H7 Mass source preflight (pull request checkout)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: EN/FR All Saints Asperges and All Souls 1962 on PR source
        run: node tests/mass-h7-sunday-asperges-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-h7-pr-source-phone
          path: artifacts/mass-h7-sunday-asperges/
          if-no-files-found: warn
          retention-days: 7
  real-production-h7-mass:
    # Never audit an undeployed PR against the separately published Pages site.
    # Only run this after the Pages workflow completed successfully on main.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Live H7 on public site — All Saints + All Souls three formularies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AO_MASS_TEST_ORIGIN: "https://fulcanelli13.github.io/ad-orientem/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Public-domain EN/FR All Saints Asperges and All Souls exact 1962 LIVE H7
        run: node tests/mass-h7-sunday-asperges-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-postdeploy-nov1-nov2-public-site-phones
          path: artifacts/mass-h7-sunday-asperges/
          if-no-files-found: warn
          retention-days: 7
