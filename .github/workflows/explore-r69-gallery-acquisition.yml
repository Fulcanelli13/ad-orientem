name: Explore R69 four source-verified French gallery images

on:
  push:
    branches:
      - feature/explore-r69-france-sacred-art-photo-galleries-20261011
    paths:
      - .github/workflows/explore-r69-gallery-acquisition.yml
      - tools/acquire-approved-place-gallery-r69.py
      - data/geography/research/explore-r69-gallery-sources.v1.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-verify-and-store-images-on-feature-branch:
    if: github.ref == 'refs/heads/feature/explore-r69-france-sacred-art-photo-galleries-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Acquire verified images into exact local Place assets
        run: python tools/acquire-approved-place-gallery-r69.py
      - name: Check SHA-256, copyright, canonical ownership, unchanged R68 images
        run: python tests/explore-r69-gallery-file-audit.py
      - name: Preserve verified review photographs
        uses: actions/upload-artifact@v4
        with:
          name: r69-france-shrine-gallery-review
          path: |
            assets/approved/place-gallery/*.webp
            data/geography/approved-place-gallery.v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified binaries to the isolated feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-gallery/ data/geography/approved-place-gallery.v1.json
          git diff --cached --exit-code && exit 0
          git commit -m "Explore R69: publish four verified French sacred-place images"
          git push origin HEAD:feature/explore-r69-france-sacred-art-photo-galleries-20261011
