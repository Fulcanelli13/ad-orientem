name: Sacred Art licence only - official object CC0 recheck 103
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/sacred-art-licence-only-103-museum-20261029.yml
      - scripts/art/sacred-art-licence-only-recheck-met-cma-103-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-licence-only-103
  cancel-in-progress: false
jobs:
  recheck-licence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - name: Recheck Met and Cleveland public-domain source flags, no images
        run: |
          python -m py_compile scripts/art/sacred-art-licence-only-recheck-met-cma-103-20261029.py
          python scripts/art/sacred-art-licence-only-recheck-met-cma-103-20261029.py
      - name: Permanently preserve licence audit and current flags
        if: always()
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-license-only-master-audit-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo "No new licence evidence"; exit 0; fi
          git commit -m "research(sacred art): persist live Met/CMA 103-object CC0 rights checks"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
