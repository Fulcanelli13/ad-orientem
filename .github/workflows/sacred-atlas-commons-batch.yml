name: Sacred Atlas Commons 100-photo research batch

on:
  push:
    branches:
      - research/explore-precise-sacred-subject-photo-search-20261031
    paths:
      - tools/sacred-atlas-commons-batch.mjs
      - data/geography/research/sacred-atlas-commons-batch-001.manifest.json
      - .github/workflows/sacred-atlas-commons-batch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-commons-batch-001
  cancel-in-progress: false

jobs:
  commons-batch-001:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/explore-precise-sacred-subject-photo-search-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve Commons source, free-license and photo metadata for 100 targets
        run: node tools/sacred-atlas-commons-batch.mjs
      - name: Validate 100 records and unchanged editorial approvals
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const x=JSON.parse(readFileSync("data/geography/research/sacred-atlas-commons-batch-001.results.json"));
            if(x.results.length!==100||x.stats.round1_user_keeps_preserved!==20)process.exit(1);
            if(x.results.some(r=>r.publication_approved||r.candidates.some(c=>c.publishable||c.published||c.underlying_artwork_rights_cleared)))process.exit(1);
            console.log(x.stats);
          '
      - name: Commit permanent result metadata to research branch (never media binaries)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/research/sacred-atlas-commons-batch-001.results.json
          if git diff --cached --quiet; then echo "No updated results"; exit 0; fi
          git commit -m "research(atlas): persist Commons 100-target candidate and licence results"
          git push origin HEAD:research/explore-precise-sacred-subject-photo-search-20261031
