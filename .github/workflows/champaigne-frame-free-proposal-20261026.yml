name: Champaigne frame-free photo review proposals
on:
  push:
    branches: [fix/approved-feast-heroes-main-20261021]
    paths: [.github/workflows/champaigne-frame-free-proposal-20261026.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: champaigne-inv1125-rectification-20261026
  cancel-in-progress: false

jobs:
  candidate-only-not-published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Preserve original-safe transformation script outside working tree
        run: cp tools/calendar/propose-champaigne-frame-free-comparison.py /tmp/ao-crop-qa.py
      - name: Work on isolated photo research branch (never feast production branch)
        run: |
          git fetch origin research/champaigne-inv1125-photo-review-20261026
          git switch -C research/champaigne-inv1125-photo-review-20261026 origin/research/champaigne-inv1125-photo-review-20261026
          python3 /tmp/ao-crop-qa.py
      - name: Preserve only research candidates, original immutable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/staged/champaigne-petite-cene-research/
          if ! git diff --cached --quiet; then
            git commit -m "research(art): archive unapproved painting-only photo comparisons, preserve source"
            git push origin research/champaigne-inv1125-photo-review-20261026
          fi
      - run: echo "No new app artwork or image-rights release. These are crop proposals only."

# Repeat deliberate manual edge tightening; source bytes and editorial approvals unchanged.

# Research refinement D: exclude confirmed bottom gold trim from candidate C; preserve original and keep release blocked.
