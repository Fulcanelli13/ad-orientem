name: Text focus coverage audit
on:
  pull_request:
    paths:
      - "tests/text-focus-coverage-phone.mjs"
      - "tests/support/text-focus-probe.mjs"
      - ".github/workflows/text-focus-coverage.yml"
      - "src/mass/reader-dom.js"
      - "src/mass/reader-cue-focus.js"
      - "src/pray/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Devotional opening focus contract
        run: node tests/devotional-focus-geometry.mjs
      - name: Audit rendered Mass and Prayer focus coverage
        run: timeout --signal=TERM --kill-after=5s 780s node tests/text-focus-coverage-phone.mjs
      - name: Preserve per-paragraph coverage and uncovered-text examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-focus-coverage
          path: artifacts/text-focus-coverage/
          if-no-files-found: warn
          retention-days: 30
