name: Sacred Art - B8 Nationalmuseum Sweden public-domain source probe
on:
  push:
    branches: [research/sacred-art-b8-smk-20261029]
    paths:
      - scripts/art/sacred-art-b8-nationalmuseum-se-probe-20261029.py
      - .github/workflows/sacred-art-b8-nationalmuseum-se-probe-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-art-b8-nms-probe
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b8-smk-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/art/sacred-art-b8-nationalmuseum-se-probe-20261029.py
          python scripts/art/sacred-art-b8-nationalmuseum-se-probe-20261029.py
      - name: Archive actual source shapes without copying any image
        run: |
          git config user.name "Ad Orientem art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b8-nationalmuseum-se-lido-probe-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): document Swedish Nationalmuseum official PD image corpus"
          git pull --rebase origin research/sacred-art-b8-smk-20261029
          git push origin HEAD:research/sacred-art-b8-smk-20261029
