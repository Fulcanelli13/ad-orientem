name: B41 three exact institutional original-source images with mandatory remote research archive
on:
  push:
    branches: [research/sacred-art-b41-institution-exact-image-recovery-20261024]
    paths: [.github/workflows/ao-art-b41-institution-exact3.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b41-exact-institution-sources-single
  cancel-in-progress: false
jobs:
  acquire-exact-official-source-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b41-institution-exact-image-recovery-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 27 case source totals and no publication approval
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          node tests/sacred-art-b40-complete-source-coverage-integrity.mjs
          python -m py_compile scripts/research/sacred_art_b41_three_institution_photo_sources.py
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/research/sacred-art-b41-three-institutional-source-candidates.json').read_text())
          assert len(j['candidates'])==3 and len({x['artwork_id'] for x in j['candidates']})==3
          assert j['app_rights_approved']==0 and j['strictly_zero_euro']
          PY
      - name: Acquire only host-bound official exact research photos; all publication gates held
        run: python scripts/research/sacred_art_b41_three_institution_photo_sources.py
      - name: Mandatory unpublished draft Release archived and remote checksum verified
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/research/sacred_art_release_archive_gate.py --wave b41-institution-exact3 --source-dir artifacts/b41-three-exact-institutional-research-photos
      - name: Commit only source evidence and rights holds; never artwork binaries
        run: |
          set -euo pipefail
          cp artifacts/b41-three-exact-institutional-research-photos/source-results.csv data/research/sacred-art-b41-three-institution-source-results.csv
          cp artifacts/b41-three-exact-institutional-research-photos/source-summary.json data/research/sacred-art-b41-three-institution-source-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b41-three-institution-source-results.csv data/research/sacred-art-b41-three-institution-source-summary.json
          git commit -m 'research: B41 precise institutional original SHA archive, zero rights or app changes'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b41-institution-exact-image-recovery-20261024
            git rebase origin/research/sacred-art-b41-institution-exact-image-recovery-20261024
            git push origin HEAD:research/sacred-art-b41-institution-exact-image-recovery-20261024 && exit 0
            sleep 3
          done
          exit 1
