name: Scripture candidate source acquisition
on:
  pull_request:
    paths:
      - 'tools/scripture/**'
      - 'tests/scripture-source-normalization.mjs'
      - 'tests/scripture-cpdv-editorial-review.mjs'
      - 'tests/scripture-cpdv-first-pass.mjs'
      - 'tests/scripture-cpdv-errata.mjs'
      - 'tests/scripture-author-master-collation.mjs'
      - 'tests/scripture-cpdv-stage-and-crosswalk.mjs'
      - 'tests/scripture-esther-crosswalk.mjs'
      - 'tests/scripture-song-psalter-crosswalk.mjs'
      - 'tests/scripture-full-psalter-audit.mjs'
      - 'tests/scripture-remaining-psalms.mjs'
      - '.github/workflows/scripture-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Catholic canon and verse gap classification
        run: node tests/scripture-source-normalization.mjs
      - name: Test pending CPDV theological review gates
        run: node tests/scripture-cpdv-editorial-review.mjs
      - name: Assert documented author-master errata and doctrinal first-pass coverage
        run: |
          node tests/scripture-cpdv-errata.mjs
          node tests/scripture-cpdv-first-pass.mjs
      - name: Validate primary author HTML parser and canonical index mapping
        run: node tests/scripture-author-master-collation.mjs
      - name: Test CPDV pack staging and cross-version safety
        run: node tests/scripture-cpdv-stage-and-crosswalk.mjs
      - name: Test complete Catholic Esther crosswalk and edition-aware bookmarks
        run: node tests/scripture-esther-crosswalk.mjs
      - name: Check Song of Songs and Catholic Psalm crosswalk contracts
        run: node tests/scripture-song-psalter-crosswalk.mjs
      - name: Test all 150 Psalm source comparison safeguards
        run: node tests/scripture-full-psalter-audit.mjs
      - name: Test unresolved Psalms strict per-verse safeguards
        run: node tests/scripture-remaining-psalms.mjs
      - name: Fetch and verify historical Catholic text witnesses
        run: node tools/scripture/fetch-upstream.mjs
      - name: Check primary publisher text and correct only attested errata in research snapshots
        run: node tools/scripture/verify-cpdv-edition.mjs artifacts/scripture-candidates
      - name: Collate all 73 CPDV books against the author's maintained master text
        run: node tools/scripture/collate-cpdv-master.mjs artifacts/scripture-candidates 73
      - name: Audit 274 CPDV Esther references against all 275 Douay–Rheims source verses
        run: node tools/scripture/audit-esther-crosswalk.mjs artifacts/scripture-candidates
      - name: Quantify Psalm and Song of Songs verse differences
        run: node tools/scripture/audit-psalms-song-divergence.mjs artifacts/scripture-candidates
      - name: Build all 73 original-author CPDV book packs as unpublished staging assets
        run: node tools/scripture/stage-cpdv-original-packs.mjs artifacts/scripture-candidates artifacts/scripture-candidates/cpdv-staged-offline-books
      - name: Source-audit all 116 Song verses and Psalm exceptional passages
        run: node tools/scripture/audit-song-psalter-crosswalk.mjs artifacts/scripture-candidates
      - name: Inspect every Psalm for same-number Catholic source correspondence
        run: node tools/scripture/audit-full-catholic-psalter.mjs artifacts/scripture-candidates
      - name: Triage all 13 remaining Catholic Psalms verse by verse
        run: node tools/scripture/audit-remaining-catholic-psalms.mjs artifacts/scripture-candidates
      - name: Generate side-by-side doctrinal and readability review dossier
        run: node tools/scripture/audit-cpdv-vs-drc.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: scripture-historical-candidates-review-only
          path: artifacts/scripture-candidates/
          retention-days: 7
      - name: Materialize all 219 source-identifed book packs (review not certified)
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/scripture-source-reading-restoration-20261010'
        run: node tools/scripture/publish-source-transcriptions.mjs artifacts/scripture-candidates data/scripture/source-transcriptions
      - name: Commit on-demand Scripture source transcriptions
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/scripture-source-reading-restoration-20261010'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture/source-transcriptions/
          git diff --cached --quiet && exit 0
          git commit -m "Build source-identified per-book Catholic Bible texts (edition review pending)"
          git push origin "HEAD:${BRANCH}"
