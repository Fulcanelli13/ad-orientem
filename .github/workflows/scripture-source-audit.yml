name: Scripture candidate source acquisition
on:
  pull_request:
    paths:
      - 'tools/scripture/fetch-upstream.mjs'
      - '.github/workflows/scripture-source-audit.yml'
  workflow_dispatch:
jobs:
  source-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify historical Catholic text witnesses
        run: node tools/scripture/fetch-upstream.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: scripture-historical-candidates-review-only
          path: artifacts/scripture-candidates/
          retention-days: 7
