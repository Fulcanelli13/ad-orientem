name: Living Catena whole-corpus source audit

on:
  push:
    branches:
      - research/living-catena-corpus-wide-pass-20261021
    paths:
      - scripts/scripture-catena-first-pass.mjs
      - .github/workflows/living-catena-corpus-pass.yml
  pull_request:
    paths:
      - scripts/scripture-catena-first-pass.mjs
      - tests/scripture-catena-first-pass.mjs
      - tests/scripture-catena-matthew-batch-one.mjs
      - tests/scripture-catena-matthew-batch-two.mjs
      - data/scripture/catena/research/full-corpus-pass-20261021/**
      - .github/workflows/living-catena-corpus-pass.yml

permissions:
  contents: read

jobs:
  index-all-excerpts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inventory every Catena excerpt and build review batches
        run: node scripts/scripture-catena-first-pass.mjs
      - name: Verify complete coverage, source text identity and review queue uniqueness
        run: node tests/scripture-catena-first-pass.mjs
      - name: Verify the 300-item Matthew review and 26 source-grounded spot reviews
        run: node tests/scripture-catena-matthew-batch-one.mjs
      - name: Verify second 300 Matthew excerpts and 47 source-level reviews
        run: node tests/scripture-catena-matthew-batch-two.mjs
      - name: Ensure generated index is up to date for PR
        run: |
          git diff --exit-code -- data/scripture/catena/research/full-corpus-pass-20261021/
          test -z "$(git status --porcelain -- data/scripture/catena/research/full-corpus-pass-20261021/)"
          test -f data/scripture/catena/research/full-corpus-pass-20261021/summary.v1.json
