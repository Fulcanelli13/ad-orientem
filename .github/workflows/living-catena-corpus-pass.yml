name: Living Catena whole-corpus source audit

on:
  push:
    branches:
      - research/living-catena-corpus-wide-pass-20261021
    paths:
      - scripts/scripture-catena-first-pass.mjs
      - .github/workflows/living-catena-corpus-pass.yml
  pull_request:
    paths:
      - scripts/scripture-catena-first-pass.mjs
      - data/scripture/catena/research/full-corpus-pass-20261021/**
      - .github/workflows/living-catena-corpus-pass.yml

permissions:
  contents: write

jobs:
  index-all-excerpts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inventory every Catena excerpt and build review batches
        run: node scripts/scripture-catena-first-pass.mjs
      - name: Persist generated research index on dedicated branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture/catena/research/full-corpus-pass-20261021/
          if ! git diff --cached --quiet; then
            git commit -m "research(catena): store full 12,692-excerpt classification and 300-item review batches"
            git push origin HEAD:refs/heads/research/living-catena-corpus-wide-pass-20261021
          fi
      - name: Ensure generated index is up to date for PR
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- data/scripture/catena/research/full-corpus-pass-20261021/
          test -z "$(git status --porcelain -- data/scripture/catena/research/full-corpus-pass-20261021/)"
          test -f data/scripture/catena/research/full-corpus-pass-20261021/summary.v1.json
