name: Deep Prayer paragraph focus
on:
  pull_request:
    paths:
      - "tests/pray-all-novena-days-focus-phone.mjs"
      - ".github/workflows/deep-prayer-focus.yml"
      - "src/pray/novena-*.js"
      - "src/pray/devotional-sequence-adapter.js"
      - "src/pray/devotional-reading-runway.js"
      - "src/pray/devotional-focus-geometry.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-novena-days:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check all days and Guided / Simple reading focus
        run: timeout --signal=TERM --kill-after=5s 720s node tests/pray-all-novena-days-focus-phone.mjs
      - name: Preserve per-day illumination ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-novena-days-focus
          path: artifacts/prayer-deep-focus/
          retention-days: 30
          if-no-files-found: warn
