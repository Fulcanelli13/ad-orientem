name: Prayer eight historical work entries — source/phone
on:
  push:
    branches:
      - feat/prayer-verified-supplemental-work-links-20261108
    paths:
      - .github/workflows/pray-supplemental-work-direct-entry-20261108.yml
      - src/pray/prayer-supplemental-live-works.v1.js
      - src/pray/presentation-runtime.js
      - tests/pray-supplemental-work-direct-entry-20261108.mjs
      - tests/pray-supplemental-work-direct-entry-phone-20261108.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pray-supplemental-work-direct-entry-20261108.yml
      - src/pray/prayer-supplemental-live-works.v1.js
      - src/pray/presentation-runtime.js
      - tests/pray-supplemental-work-direct-entry-20261108.mjs
      - tests/pray-supplemental-work-direct-entry-phone-20261108.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prayer-eight-works-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-work-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check eight original works, 16 source-language resolutions, no duplication
        run: node tests/pray-supplemental-work-direct-entry-20261108.mjs
  eight-source-work-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: 32 exact historical reader-body and language assertions on phones
        run: node tests/pray-supplemental-work-direct-entry-phone-20261108.mjs
