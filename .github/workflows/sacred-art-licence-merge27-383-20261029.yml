name: Sacred Art licence - merge 27 exact Commons source rights
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/sacred-art-licence-merge27-383-20261029.yml
      - scripts/art/sacred-art-licence-merge-27-into-383-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-licence-merge-27-383
  cancel-in-progress: false
jobs:
  join-file-licences-without-image-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile 27 Commons file rights with 383 preserved image identities
        run: |
          python -m py_compile scripts/art/sacred-art-licence-merge-27-into-383-20261029.py
          python scripts/art/sacred-art-licence-merge-27-into-383-20261029.py
      - name: Preserve master licence audit and regenerated CSV queues
        if: always()
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-licence-first-383-exact-source-audit-20261029.v1.json data/calendar/sacred-art-licence-first-383-review-20261029.csv data/calendar/sacred-art-licence-first-383-holds-20261029.csv
          git diff --cached --check
          if git diff --cached --quiet; then echo "No licence changes"; exit 0; fi
          git commit -m "research(sacred art): update all 383 exact file licensing dispositions after 27 Commons source joins"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
