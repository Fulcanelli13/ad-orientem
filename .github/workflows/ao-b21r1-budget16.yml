name: B21R1 recover 16 budget-deferred museum originals
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-b21r1-budget16.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire-recovery:
    # Historical acquisition: avoid re-downloading originals merely because the protective workflow was merged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Check recovery IDs are the B21 byte-budget queue
        shell: bash
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          m=json.loads(Path('data/research/sacred-art-b21r1-budget16.manifest.json').read_text())
          with Path('data/research/sacred-art-b21-museum95.audit.csv').open(encoding='utf-8',newline='') as f:
              audit={r['asset_source_id']:r for r in csv.DictReader(f)}
          rows=m['records']
          assert len(rows)==16 and len({r['asset_source_id'] for r in rows})==16
          assert all(audit[r['asset_source_id']]['failure']=='over wave byte budget' for r in rows)
          assert all(r['download_gate']=='METADATA_FIRST' for r in rows)
          print('PASS: 16 uniquely sourced budget-only recovery targets')
          PY
      - name: Download and technically verify eligible museum images
        run: |
          python scripts/research/sacred_art_acquire.py \
            --manifest data/research/sacred-art-b21r1-budget16.manifest.json \
            --prior-audit data/research/sacred-art-b21-museum95.audit.csv \
            --output artifacts/b21r1 \
            --max-files 16 \
            --max-bytes 950000000
      - name: Upload research-only original image binaries and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-b21r1-16-museum-originals-and-audit
          path: artifacts/b21r1/
          retention-days: 7
          if-no-files-found: warn
      - name: P0 gate - archive unchanged acquisition files in an unpublished GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_release_archive_gate.py --wave b21r1 --source-dir artifacts/b21r1
      - name: Commit compact technical evidence, not binary image masters
        if: success()
        shell: bash
        run: |
          cp artifacts/b21r1/Acquisition_results.csv data/research/sacred-art-b21r1-budget16.audit.csv
          cp artifacts/b21r1/Acquisition_summary.json data/research/sacred-art-b21r1-budget16.audit-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b21r1-budget16.audit.csv data/research/sacred-art-b21r1-budget16.audit-summary.json
          git commit -m 'research: preserve 16-file B21 budget recovery source/hash audit'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
