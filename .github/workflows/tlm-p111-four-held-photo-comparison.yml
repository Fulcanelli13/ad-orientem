name: TLM P111 four exact church candidate photo research
on:
  push:
    branches: [research/tlm-p111-four-site-photo-comparison-20261112]
    paths:
      - data/directory/research/tlm-p111-four-site-common-photo-review-input-20261112.v1.json
      - tools/directory/stage-tlm-p111-four-held-photo-comparison.py
      - .github/workflows/tlm-p111-four-held-photo-comparison.yml
permissions:
  contents: write
concurrency:
  group: tlm-p111-four-photo-comparison
  cancel-in-progress: false
jobs:
  source-and-visual-research:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Research Commons exact-category photos and original SHA1/rights
        run: python tools/directory/stage-tlm-p111-four-held-photo-comparison.py
      - name: Fail closed on source identity, licence, binary and public media
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          base=pathlib.Path('.')
          m=json.loads((base/'data/directory/research/tlm-p111-four-site-photo-comparison-20261112.v1.json').read_text())
          assert m['schema']=='AO_TLM_P111_FOUR_SITE_ORIGINALS_AND_VISUAL_RESEARCH_V1'
          assert m['status']=='STAGING_ONLY_NOT_PUBLIC'
          assert len(m['groups'])==4 and m['counts']['production_covers_unchanged']==25
          assert m['counts']['approved_new_covers']==0 and m['counts']['remaining_holds']==5 and m['counts']['new_pins']==0
          count=0
          for g in m['groups']:
            assert g['editorial_status']=='VISUAL_IDENTITY_REVIEW_REQUIRED_NO_APPROVAL'
            for rec in g['records']:
              assert not rec['publication_approved']
              if rec['status']!='VERIFIED_STAGED_NOT_APPROVED':continue
              count+=1
              img=(base/rec['staged_asset_path']).read_bytes()
              assert img[:4]==b'RIFF' and img[8:12]==b'WEBP'
              assert hashlib.sha256(img).hexdigest()==rec['derivative_sha256']
              assert rec['source_sha1'] and rec['credit'] and rec['license'] and rec['license_url']
              assert rec['venue_id']==g['venue_id']
              assert not rec['image_identity_editorial_approved'] and not rec['mobile_frame_editorial_approved']
          assert count==m['counts']['verified_candidates'] and count>0
          registry=json.loads((base/'data/directory/approved-venue-media.v1.json').read_text())
          assert len(registry['items'])==25
          assert all(g['venue_id'] not in [x['venue_id'] for x in registry['items']] for g in m['groups'])
          print('P111_RESEARCH_ONLY_VERIFIED',count,'EXACT_CATEGORY_IMAGES_ZERO_APPROVALS')
          PY
      - name: Commit research-only preview and source audit to this branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/tlm-p111-four-site-photo-comparison-20261112"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/directory-p111-four-held-20261112/ \
            data/directory/research/tlm-p111-four-site-photo-comparison-20261112.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "P111 research: source-verified held-site alternative previews, no new approved covers"
            git push origin HEAD:refs/heads/research/tlm-p111-four-site-photo-comparison-20261112
          fi
      - name: Preserve inspectable editorial candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TLM_P111_FOUR_HELD_SITES_PREVIEW_RESEARCH_ONLY
          path: |
            assets/staged/directory-p111-four-held-20261112/
            data/directory/research/tlm-p111-four-site-photo-comparison-20261112.v1.json
          retention-days: 14
          if-no-files-found: warn
