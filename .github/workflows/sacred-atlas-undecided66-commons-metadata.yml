name: Sacred Atlas undecided 66 — bulk Commons metadata research
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-undecided66-*.json'
      - 'data/geography/research/sacred-atlas-undecided66-*.html'
      - 'tools/atlas/audit-sacred-atlas-undecided66-commons-metadata.py'
      - 'tests/sacred-atlas-round15-bulk-review-contract.mjs'
      - '.github/workflows/sacred-atlas-undecided66-commons-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-85-source-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/sacred-atlas-undecided66-bulk-review-20261104') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen queue and all 85 candidate-source links offline
        run: |
          python tools/atlas/audit-sacred-atlas-undecided66-commons-metadata.py --self-test
          python tools/atlas/audit-sacred-atlas-undecided66-commons-metadata.py --dry-run
      - name: Validate 66-place editorial review and inline browser script offline
        run: node tests/sacred-atlas-round15-bulk-review-contract.mjs
      - name: Metadata-only paced Commons audit, stop after first HTTP 429
        if: github.event_name == 'workflow_dispatch'
        run: python tools/atlas/audit-sacred-atlas-undecided66-commons-metadata.py
      - name: Preserve read-only audit result as review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-atlas-undecided66-bulk-commons-metadata
          path: /tmp/ao-sacred-atlas-undecided66-bulk-commons-metadata.json
          if-no-files-found: warn
          retention-days: 14
