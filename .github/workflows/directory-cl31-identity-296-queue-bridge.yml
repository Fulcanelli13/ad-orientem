          assert db.execute('SELECT COUNT(*) FROM cl20_building_spatial_candidate').fetchone()[0]==6
          assert db.execute('SELECT COUNT(*) FROM cl20_building_spatial_candidate WHERE building_reference_supported=1').fetchone()[0]==5
