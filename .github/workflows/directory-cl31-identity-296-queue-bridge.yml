          assert db.execute('SELECT COUNT(*) FROM cl20_building_spatial_candidate WHERE public_geocoordinate_approved=1 OR published_map_pin=1 OR visitor_entrance_geocode_approved=1').fetchone()[0]==0
          ent=json.loads(Path('/tmp/ao-cl21/cl21_summary.json').read_text())
          assert ent['entry_route_site_reviews']==7
          assert ent['exterior_architectural_portal_or_main_door_identification_records']==3
          assert ent['wrong_place_or_not_an_exterior_church_door_explicitly_excluded']==5
          assert ent['Potsdam_Raum_der_Stille_separate_Auferstehungskapelle_confirmed_by_hospital'] is True
          assert ent['new_verified_door_level_coordinates']==ent['new_operational_mass_entrance_approvals']==ent['new_published_direction_records']==ent['new_public_map_pins']==ent['new_confirmed_future_mass_schedules']==ent['new_una_cum']==0
