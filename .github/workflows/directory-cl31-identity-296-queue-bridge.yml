          assert db.execute('SELECT COUNT(*) FROM cl21_entrance_evidence WHERE architectural_entry_identified=1').fetchone()[0]==3
          assert db.execute('SELECT COUNT(*) FROM cl21_excluded_wrong_target').fetchone()[0]==5
          assert db.execute('SELECT COUNT(*) FROM cl21_entrance_evidence WHERE actual_door_gps_approved=1 OR public_pin_approved=1').fetchone()[0]==0
