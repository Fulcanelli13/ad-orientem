name: B23 close 82 Commons sources and reconcile 451 artwork entries
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-b23-commons82-final-crosswalk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precise-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check 82 Commons originals against all 451 frozen catalogue identities
        run: |
          python -m py_compile scripts/research/sacred_art_catalogue_after_b23r2.py
          python scripts/research/sacred_art_catalogue_after_b23r2.py
      - name: Preserve final exact ID-by-ID source/crop/rights holds and remaining missing artworks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-catalogue451-after-b23r2.csv data/research/sacred-art-missing-after-b23r2.csv data/research/sacred-art-catalogue451-after-b23r2.summary.json
          git commit -m 'research: all 82 prior Commons sources acquired; reconcile 451 frozen artwork entries'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
      - name: Export final artwork/source Excel-compatible crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: ao-b23-final-451-image-coverage-and-rights-holds
          path: |
            data/research/sacred-art-catalogue451-after-b23r2.csv
            data/research/sacred-art-missing-after-b23r2.csv
            data/research/sacred-art-catalogue451-after-b23r2.summary.json
          retention-days: 60
