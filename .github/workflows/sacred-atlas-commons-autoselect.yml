name: Sacred Atlas auto-select licensed photographs from source research

on:
  push:
    branches:
      - research/explore-precise-sacred-subject-photo-search-20261031
    paths:
      - "data/geography/research/sacred-atlas-commons-batch-*.results.json"

permissions:
  contents: write

concurrency:
  group: atlas-photo-selection
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/explore-precise-sacred-subject-photo-search-20261031
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select a freely licensed candidate for each of 247 exact subjects where possible
        run: node tools/sacred-atlas-commons-autoselect.mjs
      - name: Assert none of the proposed images was automatically published
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const x=JSON.parse(readFileSync("data/geography/research/sacred-atlas-batches-001-003-autoselected.json"));
            if(x.items.length!==247||x.counts.round1_keep_decisions_preserved!==20)process.exit(1);
            if(x.items.some(i=>i.gates.publication_approved||i.gates.published||i.gates.artwork_rights_verified))process.exit(1);
            console.log(x.counts);
          '
      - name: Permanently save auto-selected candidate ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/research/sacred-atlas-batches-001-003-autoselected.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(atlas): save automatically chosen source photo candidates for 247 subjects"
          git fetch origin research/explore-precise-sacred-subject-photo-search-20261031
          git rebase origin/research/explore-precise-sacred-subject-photo-search-20261031
          git push origin HEAD:research/explore-precise-sacred-subject-photo-search-20261031
