name: CL27 exact-site contact publication gate

on:
  pull_request:
    paths:
      - 'data/directory/cl27-site-contact-evidence-20261108.v1.json'
      - 'src/find/tlm-site-contact-evidence.js'
      - 'src/find/tlm-church-profile.js'
      - 'src/find/preliminary-directory-r49.js'
      - 'tests/tlm-cl27-site-contact-evidence.mjs'
      - '.github/workflows/directory-cl27-site-contact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-site-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify twenty-six source-scoped profiles and adversarial CL2 joins
        run: node tests/tlm-cl27-site-contact-evidence.mjs
      - name: Verify curated GitHub Pages includes the contact manifest, not CL27 research files
        run: |
          node tools/build-web-preview.mjs
          test -f dist/web-preview/data/directory/cl27-site-contact-evidence-20261108.v1.json
          test -f dist/web-preview/src/find/tlm-site-contact-evidence.js
          test ! -f dist/web-preview/data/directory/research/cl27-current-firstparty-20261104/source-review-wave7-source-dispositions.v1.json
