name: CL27 exact dated Mass programme publication gate

on:
  pull_request:
    paths:
      - 'data/directory/cl27-dated-mass-programme-paita-20261108.v1.json'
      - 'src/find/tlm-dated-mass-programme.js'
      - 'src/find/preliminary-directory-r49.js'
      - 'src/find/tlm-church-profile.js'
      - 'tests/tlm-cl27-dated-mass-programme.mjs'
      - 'tests/directory-b91-three-published-provisional-sites.mjs'
      - '.github/workflows/directory-cl27-dated-mass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dated-mass:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact chapel identity, two printed dates and adversarial recurrence guards
        run: node tests/tlm-cl27-dated-mass-programme.mjs
      - name: Verify Directory loader and physical-site census
        run: node tests/directory-b91-three-published-provisional-sites.mjs
      - name: Verify GitHub Pages ships dated release without leaking source research
        run: |
          node tools/build-web-preview.mjs
          test -f dist/web-preview/data/directory/cl27-dated-mass-programme-paita-20261108.v1.json
          test -f dist/web-preview/src/find/tlm-dated-mass-programme.js
          test ! -f dist/web-preview/data/directory/research/cl27-current-firstparty-20261104/source-review-wave7-source-dispositions.v1.json
