name: Sacred Art Walters 42 current official collection pages (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-walters-42-current-pages-20261030.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-walters-current-pages
  cancel-in-progress: false

jobs:
  verify-current-museum-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original 2455 choices and 383 canonical artworks
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Confirm 42 Walters current official accession and title pages
        run: node scripts/art/reconcile-walters-42-current-pages-20261030.mjs
      - name: Save research-only museum page evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('data/calendar/sacred-art-phase1-walters-42-current-page-report-20261030.v1.json','utf8'));
          if(r.rows.length!==42 || r.counts.frozenAcceptedCards!==42 ||
             r.counts.originalConditionalDecisions!==2 ||
             r.counts.officialTitleAndAccessionConfirmed+r.counts.officialPagesNeedsReview+r.counts.sourcePageFetchFailed!==42 ||
             r.rows.some(x=>x.originalDecisionPreserved!==true ||
              x.canonical383IdentityLinked!==false || x.sourcePhotoRightsCertified!==false ||
              x.originalPhotoVisuallyInspected!==false || x.productionMutation!==false) ||
              r.release.productionMutation!==false)throw Error('Walters official page audit gate violated');
          console.log(JSON.stringify(r.counts,null,2));
          NODE
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-walters-42-current-page-report-20261030.v1.json
          git diff --cached --check
          git commit -m "research(sacred-art): preserve current Walters collection identity checks [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
