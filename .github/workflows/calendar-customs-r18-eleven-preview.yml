name: Calendar R18 eleven editorial preview (not published)
on:
  pull_request:
    paths:
      - 'src/calendar/customs-r18-eleven-editorial-preview.js'
      - 'src/calendar/calendar-runtime.js'
      - 'tests/calendar-customs-r18-eleven-editorial-only.mjs'
      - 'tests/calendar-customs-r18-eleven-visual-browser.mjs'
      - '.github/workflows/calendar-customs-r18-eleven-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-only-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Confirm published Calendar is unchanged by eleven research candidates
        run: |
          node tests/calendar-customs-r18-eleven-editorial-only.mjs
          node tests/calendar-customs-context.mjs
          node tests/calendar-customs-search.mjs
      - name: Actual phone and desktop English/French editorial acceptance
        run: node tests/calendar-customs-r18-eleven-visual-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-customs-r18-eleven-visual-screenshots
          path: artifacts/calendar-customs-r18-eleven-visual/
          if-no-files-found: warn
          retention-days: 2
