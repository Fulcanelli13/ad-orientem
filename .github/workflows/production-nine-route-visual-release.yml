name: Production nine-route visual release audit
on:
  pull_request:
    paths:
      - "tests/ui-nine-route-phone-review.mjs"
      - ".github/workflows/production-nine-route-visual-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-ui-nine-route:
    name: Public 320/390/430 EN/FR Home Calendar Mass Prayer Rosary Explore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AO_VISUAL_AUDIT_ORIGIN: https://ad-orientem.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Read-only public production nine-route captures and measurements
        run: node tests/ui-nine-route-phone-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ui-nine-route-320-390-430-en-fr
          path: artifacts/ui-nine-route-phone-review/
          if-no-files-found: warn
          retention-days: 7
