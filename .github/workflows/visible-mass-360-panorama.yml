name: Visible Mass real 360 panorama source bundle
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - tools/acquire-visible-mass-360-panorama.py
      - .github/workflows/visible-mass-360-panorama.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install Pillow requests
      - run: python -m py_compile tools/acquire-visible-mass-360-panorama.py
      - run: python -u tools/acquire-visible-mass-360-panorama.py
      - name: Verify authentic panoramas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('dist/visible-mass/panorama-sources')
          m=json.loads((d/'metadata.json').read_text())
          assert all(k in m for k in ('brompton360','newman360','newman_altar1','newman_altar2','newman_apse'))
          for k in ('brompton360','newman360'):
            assert m[k]['width']==2*m[k]['height']
            assert 'BY-SA' in m[k]['license']
            assert (d/m[k]['file']).stat().st_size>100_000
          print('Verified:',{k:(v['width'],v['height'],v['license']) for k,v in m.items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Visible-Mass-Brompton-Newman-360-Assets
          path: dist/visible-mass/panorama-sources/
          retention-days: 60
          if-no-files-found: error
