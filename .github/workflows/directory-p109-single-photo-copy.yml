name: Directory P109 single Jihlava photo copy
on:
  pull_request:
    paths:
      - tools/directory/restore-p109-jihlava-webp.py
      - .github/workflows/directory-p109-single-photo-copy.yml
permissions:
  contents: write
jobs:
  copy-jihlava-from-main-archive:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p109-jihlava-photo-clean-after-hannover-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - run: python3 tools/directory/restore-p109-jihlava-webp.py
      - name: Commit source-identical full-frame WebP
        shell: bash
        run: |
          git add assets/approved/place-media/CZ-st-ignatius-jihlava.webp \
            data/directory/research/p108-jihlava-approved-cover-byte-audit.v1.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'media(P109): commit one source-verified Jihlava photo on Hannover baseline'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
