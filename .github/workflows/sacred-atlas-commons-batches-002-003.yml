name: Sacred Atlas Commons remaining 147 source-linked photo subjects

on:
  push:
    branches:
      - research/explore-precise-sacred-subject-photo-search-20261031
    paths:
      - .github/workflows/sacred-atlas-commons-batches-002-003.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-commons-batch-001
  cancel-in-progress: false

jobs:
  commons-batch-002-003:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/explore-precise-sacred-subject-photo-search-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commons photo and licence metadata · batch 002 · 100 subjects
        run: node tools/sacred-atlas-commons-batch.mjs 002
      - name: Commons photo and licence metadata · batch 003 · 47 subjects
        run: node tools/sacred-atlas-commons-batch.mjs 003
      - name: Verify each source result and no unauthorized publication
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for(const [id,n] of [["002",100],["003",47]]){
              const x=JSON.parse(readFileSync("data/geography/research/sacred-atlas-commons-batch-"+id+".results.json"));
              if(x.results.length!==n||x.stats.targets!==n||x.stats.round1_user_keeps_preserved!==0)process.exit(1);
              if(x.results.some(r=>r.publication_approved||r.candidates.some(c=>c.publishable||c.published||c.underlying_artwork_rights_cleared)))process.exit(1);
              console.log(id,x.stats);
            }
          '
      - name: Commit both metadata batches permanently
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/research/sacred-atlas-commons-batch-002.results.json data/geography/research/sacred-atlas-commons-batch-003.results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(atlas): persist 147 more Commons photo and licence candidates"
          git push origin HEAD:research/explore-precise-sacred-subject-photo-search-20261031
