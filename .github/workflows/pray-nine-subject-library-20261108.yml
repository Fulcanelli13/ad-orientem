name: Prayer implementation — nine subject families
on:
  push:
    branches:
      - feat/prayer-subjects-nine-family-browse-20261108
    paths:
      - .github/workflows/pray-nine-subject-library-20261108.yml
      - src/pray/prayer-subject-index.v1.js
      - src/pray/presentation-runtime.js
      - tests/pray-nine-subject-library-implementation-20261108.mjs
      - tests/pray-nine-subject-library-browser-phone-20261108.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pray-nine-subject-library-20261108.yml
      - src/pray/prayer-subject-index.v1.js
      - src/pray/presentation-runtime.js
      - tests/pray-nine-subject-library-implementation-20261108.mjs
      - tests/pray-nine-subject-library-browser-phone-20261108.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-subjects-nine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  nine-subjects-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Prove all nine families use only published canonical text
        run: node tests/pray-nine-subject-library-implementation-20261108.mjs
  nine-subjects-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise nine subject filters at 320/390px in English and French
        run: node tests/pray-nine-subject-library-browser-phone-20261108.mjs
