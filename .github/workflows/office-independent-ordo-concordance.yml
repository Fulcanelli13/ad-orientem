name: Divine Office — independent 2026–27 Roman Ordo concordance (research)

on:
  pull_request:
    paths:
      - 'tools/office-ordo/independent_ordo_concordance.py'
      - 'tools/office-ordo/test_independent_ordo_concordance.py'
      - '.github/workflows/office-independent-ordo-concordance.yml'
  workflow_dispatch:

# Independent external Ordo audit is NOT a public Breviary release and
# never writes to main, Pages, or any source-data registry.
permissions:
  contents: read
  actions: read

concurrency:
  group: office-ordo-concordance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-independent-ordo:
    name: Compare both 1960 source years with independent 1962 universal Ordo
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SOURCE_RUN_ID: '42615804676'
      FSSPX_EXPORT_BASE: 'https://ordo.fsspx.org/api/v1/export/json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise exact-date, independent witness and zero-publication tests
        run: |
          python3 -m unittest discover -s tools/office-ordo \
            -p 'test_independent_ordo_concordance.py' -v
      - name: Download two-year immutable reviewed source reader from main
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          name: office-1960-la-2026-2027-private-reader
          path: office-private-source/
      - name: Fetch both independent universal calendar witnesses (2 requests only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ordo-witness
          for year in 2026 2027; do
            curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 3 --retry-all-errors \
              --connect-timeout 25 --max-time 180 \
              --header 'Accept: application/json' \
              --header 'User-Agent: AdOrientem-1960-Office-independent-ordo-research/1.0' \
              "${FSSPX_EXPORT_BASE}?year=${year}&lang=la&mode=civil&congregation=" \
              -o "ordo-witness/fsspx-universal-${year}.json"
          done
          python3 - <<'PY'
          import json, pathlib
          for year in (2026, 2027):
              path = pathlib.Path(f"ordo-witness/fsspx-universal-{year}.json")
              obj = json.loads(path.read_text(encoding="utf-8"))
              print(f"AO_OFFICE_EXTERNAL_ORDO_WITNESS year={year} "
                    f"days={obj.get('count')} lang={obj.get('lang')} "
                    f"mode={obj.get('mode')} source={obj.get('source')} "
                    f"congregation={obj.get('congregation')} bytes={path.stat().st_size}")
          PY
      - name: Compare 730 dates, source ranks, First Vespers and commemorations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/office-ordo/independent_ordo_concordance.py \
            --reader office-private-source \
            --ordo-2026 ordo-witness/fsspx-universal-2026.json \
            --ordo-2027 ordo-witness/fsspx-universal-2027.json \
            --output office-ordo-audit/
          python3 - <<'PY'
          import json, pathlib
          audit = json.loads(pathlib.Path(
              "office-ordo-audit/concordance.json"
          ).read_text(encoding="utf-8"))
          assert audit["days_compared"] == 730
          assert audit["hours_source_verified"] == 5840
          assert audit["quality_gate"]["all_730_dates_and_5840_hours_verified_for_source_integrity"]
          assert not audit["quality_gate"]["public_reader_authorized"]
          print("AO_OFFICE_INDEPENDENT_WITNESS_DELTA_QA")
          for kind, n in audit["summary"]["issue_counts"].items():
              print(f"  {kind}={n}")
          PY
      - name: Upload source concordance and finite liturgical exception queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-2026-2027-independent-universal-ordo-research
          path: |
            office-ordo-audit/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
