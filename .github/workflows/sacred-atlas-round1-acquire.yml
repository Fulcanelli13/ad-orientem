name: Sacred Atlas Round 1 acquire two reviewed images
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round1-four-photo-release-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round1-two-photos.py'
      - '.github/workflows/sacred-atlas-round1-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-exact-source-images:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round01-two-gallery-photo-release-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter without adding a runtime dependency
        run: python -m pip install Pillow==11.3.0
      - name: Retrieve and verify the precise Commons originals against archived visual identity
        run: python tools/atlas/acquire-sacred-atlas-round1-two-photos.py --write
      - name: Commit verified exact images, gallery rows, and original-byte evidence into PR
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-gallery data/geography/research/sacred-atlas-round1-published-binary-evidence-20261103.v1.json)" ]; then
            echo 'No new source images to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/approved-place-gallery.v1.json \
            data/geography/research/sacred-atlas-round1-published-binary-evidence-20261103.v1.json \
            assets/approved/place-gallery/FR-lourdes-original-massabielle-grotto-sotos-2026.webp \
            assets/approved/place-gallery/IT-padua-st-anthony-tongue-reliquary-2022.webp
          git commit -m "assets(atlas): publish verified Lourdes grotto and Padua tongue reliquary photos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
