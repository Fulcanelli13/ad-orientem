permissions:
  contents: read
jobs:
  offline-visual-novel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Execute the single-file story at phone and desktop sizes
        run: node tests/pius-x-study-standalone-e2e.mjs
      - name: Compile the full 82-chapter offline review from immutable source-owner stages
        run: node tools/build-pius-x-expanded-standalone.mjs
      - name: Exercise expanded bilingual dialogue, sources and third-level questions
        run: node tests/pius-x-study-expanded-82-e2e.mjs
      - name: Assemble twelve additional source-linked dialogues without mutating previous 327 replies
        run: node tools/build-pius-x-next12-dialogues.mjs
      - name: Test all 94 subjects, bilingual authorship and offline browser interaction
        run: node tests/pius-x-study-next12-dialogues-e2e.mjs
      - name: Assemble the next twelve pastoral dialogue chapters
        run: node tools/build-pius-x-next12-pastoral-dialogues.mjs
      - name: Browser-test 106 bilingual subjects and immutable original 375 answers
        run: node tests/pius-x-study-next12-pastoral-e2e.mjs
      - name: Build separate P6 voice-review artifact for twelve earlier subjects
        run: node tools/build-pius-x-earlier-94-p6.mjs
      - name: Reconcile 423 source-owned avatar turns with both 433-question catechism indexes without source promotion
        run: node tools/pius-x-p31-cross-source-reconciliation.mjs
      - name: Validate read-only cross-source candidates, editorial-number caveats and zero semantic merges
        run: node tests/pius-x-p31-cross-source-reconciliation.mjs
      - name: Cross-reference 200 existing 1905 source-owner turns against P6 and the 339-question upstream registry
        run: node tools/pius-x-p32-bulk-200-source-crosswalk.mjs
      - name: Test P1 200-turn source identity, research holds and zero artificial semantic merges
        run: node tests/pius-x-p32-bulk-200-source-crosswalk.mjs
      - name: Verify original 1905 Italian Q&A extraction parser without network
        run: python3 tools/formation/pius-x-p33-italian-original-100-audit.py --selftest
      - name: Extract 100 original Italian catechism Q&A witnesses from live museum transcription
        run: python3 tools/formation/pius-x-p33-italian-original-100-audit.py
      - name: Reconcile 100 Italian source witnesses and keep translations, print and pastoral holds unapproved
        run: python3 tests/pius-x-p33-italian-original-100-audit.py
      - name: Align 100 bilingual editorial opening drafts with original Italian witness excerpts as an uncertified claim review packet
        run: node tools/pius-x-p34-bilingual-claim-comparison.mjs
      - name: Browser-test 100-case offline documentary desk, human-review flags and research export
        run: node tests/pius-x-p34-claim-review-e2e.mjs
      - name: Build free one-file offline Pius X source-dialogue trial with preserved sprites
        run: node tools/build-pius-x-p26-offline-replay.mjs
      - name: Browser-test offline source dialogue, French/English and original Vatican witnesses
        run: node tests/pius-x-p26-offline-replay-e2e.mjs
      - name: Validate P6 preserved sources and bilingual offline interaction
        run: node tests/pius-x-study-earlier-94-p6-e2e.mjs
      - name: Test typed questions, conservative source navigation and short-form follow-ups
        run: node tests/pius-x-study-free-ask-e2e.mjs
      - name: Verify private model-assisted source-constrained research stage
        run: node tests/pius-x-generative-review-e2e.mjs
      - name: Reject all uncollated model topics and withhold full P6 editorial answers
        run: node tests/pius-x-source-only-gate.mjs
      - name: Verify 23 wave4 Latin and Italian excerpts against independent Vatican text windows
        run: node tests/pius-x-wave4-original-contexts.mjs
      - name: Reconcile all 228 outside-batch St Pius X source-owner nodes without evidence admissions
        run: node tests/pius-x-wave5-bulk-inventory.mjs
      - name: Audit five newly researched Vatican documents with 18 immutable dialogue nodes
        run: node tests/pius-x-wave6-five-vatican-documents.mjs
      - name: Audit all 120 Salzano source-owner nodes against numbered Italian manuscript-transcription loci
        run: node tests/pius-x-salzano-wave7-transcription-research.mjs
      - name: Validate all 59 Italian 1905 Catechismo Maggiore evidence decisions without papal authorship inflation
        run: node tests/pius-x-catechismo-maggiore-wave8-all59.mjs
      - name: Verify final biography and Congregational source triage and complete 228-node reconciliation
        run: node tests/pius-x-wave9-biography-quam-singulari-all31.mjs
      - name: Check eleven source-bound bilingual conversation specimens, six present-law refusals and two historical holds
        run: node tests/pius-x-p22-bilingual-claim-acceptance.mjs
      - name: Validate 23 bilingual claim sentences against source-specific Latin or Italian fragments
        run: node tests/pius-x-p23-bilingual-fidelity-review.mjs
      - name: Hold unsafe invented memories and current-law verdicts across 80 bilingual unseen prompts
        run: node tests/pius-x-p24-unexpected-visitors.mjs
      - name: Route 32 unseen English and French questions to their exact historical witness-owned cards
        run: node tests/pius-x-p25-intent-to-original-witness-routing.mjs
      - name: Exercise real-model evaluation harness without external inference
        run: node tests/pius-x-live-eval-harness.mjs
      - name: Exercise provider HTTP integration against loopback fake model (no paid inference)
        run: node tests/pius-x-live-bilingual-loopback-adapter.mjs
      - name: Replay six in-chat GPT-6 source-scoped specimen replies (not live inference)
        run: node tests/pius-x-inchat-bilingual-conversation-specimen.mjs
      - name: Validate bounded original E supremi pilot witness metadata
        run: node tests/pius-x-primary-witness-contract.mjs
      - name: Validate additional original Italian and Latin source-witness annexes
        run: node tests/pius-x-primary-witness-expansion.mjs
      - name: Test 23 Vatican excerpt presence against independently transcribed source windows
        run: node tests/pius-x-primary-witness-webtext-audit.mjs
      - name: Account for all 106 research chapters and next primary-document targets
        run: node tests/pius-x-primary-coverage-report.mjs
      - name: Verify twelve Vatican document groups and eight unpromoted textual witnesses
        run: node tests/pius-x-next12-primary-discovery-contract.mjs
      - name: Verify 41 contextual original-language source snippets against independent text windows
        run: node tests/pius-x-eight-opening-context-witnesses.mjs
      - name: Check source-aligned English and French opening paragraphs and editorial cautions
        run: node tests/pius-x-eight-opening-bilingual-audit.mjs
      - name: Attach private P2 source-coverage inventory and next twelve document candidates
        run: AO_SPX_COVERAGE_REPORT_OUTPUT=artifacts/pius-x-study-expanded/PiusX_Private_Source_Coverage.json node tools/pius-x-primary-coverage-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-study-desktop-mobile-review
          path: |
            artifacts/pius-x-study-review/
            artifacts/pius-x-study-expanded/
          if-no-files-found: warn
          retention-days: 30
