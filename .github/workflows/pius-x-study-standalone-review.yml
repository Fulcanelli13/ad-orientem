name: St Pius X standalone study review
on:
  push:
    branches:
      - prototype/pius-x-standalone-study-20261021
    paths:
      - 'previews/pius-x-study/**'
      - 'tests/pius-x-study-standalone-e2e.mjs'
      - '.github/workflows/pius-x-study-standalone-review.yml'
  pull_request:
    paths:
      - 'previews/pius-x-study/**'
      - 'tests/pius-x-study-standalone-e2e.mjs'
      - '.github/workflows/pius-x-study-standalone-review.yml'
permissions:
  contents: read
jobs:
  offline-visual-novel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Execute the single-file story at phone and desktop sizes
        run: node tests/pius-x-study-standalone-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-study-desktop-mobile-review
          path: artifacts/pius-x-study-review/
          if-no-files-found: warn
          retention-days: 30
