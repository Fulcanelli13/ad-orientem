      - 'tests/pius-x-wave6-five-vatican-documents.mjs'
      - 'tests/pius-x-wave5-bulk-inventory.mjs'
      - 'tests/pius-x-wave6-five-vatican-documents.mjs'
      - 'previews/pius-x-study/spx-model-review-client.js'
      - 'previews/pius-x-study/spx-model-review-style.css'
      - 'tests/pius-x-generative-review-e2e.mjs'
      - 'tools/pius-x-live-eval.mjs'
      - 'tests/pius-x-live-eval-harness.mjs'
      - 'tests/pius-x-live-bilingual-loopback-adapter.mjs'
      - 'tests/pius-x-inchat-bilingual-conversation-specimen.mjs'
      - 'tests/pius-x-primary-witness-contract.mjs'
      - 'tests/pius-x-primary-witness-expansion.mjs'
      - 'tools/pius-x-audit-primary-witnesses.mjs'
      - 'tests/pius-x-primary-witness-webtext-audit.mjs'
      - 'tools/pius-x-primary-coverage-report.mjs'
      - 'tests/pius-x-primary-coverage-report.mjs'
