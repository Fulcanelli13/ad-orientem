permissions:
  contents: read
jobs:
  offline-visual-novel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Execute the single-file story at phone and desktop sizes
        run: node tests/pius-x-study-standalone-e2e.mjs
      - name: Compile the full 82-chapter offline review from immutable source-owner stages
        run: node tools/build-pius-x-expanded-standalone.mjs
      - name: Exercise expanded bilingual dialogue, sources and third-level questions
        run: node tests/pius-x-study-expanded-82-e2e.mjs
      - name: Assemble twelve additional source-linked dialogues without mutating previous 327 replies
        run: node tools/build-pius-x-next12-dialogues.mjs
      - name: Test all 94 subjects, bilingual authorship and offline browser interaction
        run: node tests/pius-x-study-next12-dialogues-e2e.mjs
      - name: Assemble the next twelve pastoral dialogue chapters
        run: node tools/build-pius-x-next12-pastoral-dialogues.mjs
      - name: Browser-test 106 bilingual subjects and immutable original 375 answers
        run: node tests/pius-x-study-next12-pastoral-e2e.mjs
      - name: Build separate P6 voice-review artifact for twelve earlier subjects
        run: node tools/build-pius-x-earlier-94-p6.mjs
      - name: Reconcile 423 source-owned avatar turns with both 433-question catechism indexes without source promotion
        run: node tools/pius-x-p31-cross-source-reconciliation.mjs
      - name: Validate read-only cross-source candidates, editorial-number caveats and zero semantic merges
        run: node tests/pius-x-p31-cross-source-reconciliation.mjs
      - name: Cross-reference 200 existing 1905 source-owner turns against P6 and the 339-question upstream registry
        run: node tools/pius-x-p32-bulk-200-source-crosswalk.mjs
      - name: Test P1 200-turn source identity, research holds and zero artificial semantic merges
        run: node tests/pius-x-p32-bulk-200-source-crosswalk.mjs
      - name: Verify original 1905 Italian Q&A extraction parser without network
        run: python3 tools/formation/pius-x-p33-italian-original-100-audit.py --selftest
      - name: Extract 100 original Italian catechism Q&A witnesses from live museum transcription
        run: python3 tools/formation/pius-x-p33-italian-original-100-audit.py
      - name: Reconcile 100 Italian source witnesses and keep translations, print and pastoral holds unapproved
        run: python3 tests/pius-x-p33-italian-original-100-audit.py
      - name: Align 100 bilingual editorial opening drafts with original Italian witness excerpts as an uncertified claim review packet
        run: node tools/pius-x-p34-bilingual-claim-comparison.mjs
      - name: Browser-test 100-case offline documentary desk, human-review flags and research export
        run: node tests/pius-x-p34-claim-review-e2e.mjs
      - name: Build 35 exact-Italian-phrase-grounded substantive editorial decisions without approvals
        run: node tools/pius-x-p35-substantive-35-editorial-review.mjs
      - name: Browser-test 35 priority case findings and suggested source corrections
        run: node tests/pius-x-p35-substantive-35-editorial-review-e2e.mjs
      - name: Generate eleven bilingual source-limited corrections without mutating original drafts
        run: node tools/pius-x-p36-corrected-bilingual-35-review.mjs
      - name: Browser-test 35-case review including 11 proposed corrections and 24 held originals
        run: node tests/pius-x-p36-bilingual-corrections-e2e.mjs
      - name: Build second-pass Italian-to-bilingual review with 25 original-language anchors
        run: node tools/pius-x-p37-second-pass-eleven.mjs
      - name: Browser-test 11 evidence cases and 3 additive EN/FR refinements with no publication or remote calls
        run: node tests/pius-x-p37-second-pass-eleven-e2e.mjs
      - name: Consolidate source-scope assessments for 89 remaining openings (65 newly inspected, 24 preserved earlier)
        run: node tools/pius-x-p38-bulk-89-remaining-original-text-audit.mjs
      - name: Browser-test the 89-case offline source desk and verify original evidence and bilingual drafts remain intact
        run: node tests/pius-x-p38-bulk-89-review-e2e.mjs
      - name: Verify P1.39 29 bilingual candidate corrections and 36 specialist queue records (structural, not human approval)
        run: node tests/pius-x-p39-bilingual-candidate-queue-contract.mjs
      - name: Verify P1.40 65-answer original-language second-pass partitions (editorial, not human translation approval)
        run: node tests/pius-x-p40-source-second-pass-contract.mjs
      - name: Assemble P1.41 source-anchored 39-case bilingual specialist dossier from original P34 Italian witnesses
        run: node tools/pius-x-p41-build-specialist-bilingual-dossier.mjs
      - name: Verify original Italian text provenance, section boundaries and offline desktop/mobile P1.41 desk
        run: node tests/pius-x-p41-specialist-bilingual-dossier-e2e.mjs
      - name: Prepare exact 39-owner source reconciliation preview and unsigned human specialist decision ledger
        run: node tools/pius-x-p42-source-owner-reconciliation-preview.mjs
      - name: Assert all 39 original source-owner fingerprints, unaffected followups and zero release signoffs
        run: node tests/pius-x-p42-owner-reconciliation-preview-contract.mjs
      - name: Cross-check 39 original Italian questions and answers with proofread 1905 scan-linked Wikisource text
        run: node tools/pius-x-p43-independent-edition-text-crosscheck.mjs
      - name: Verify 39-item digital witness classifications and preserve all print-page and human-approval holds
        run: node tests/pius-x-p43-edition-source-crosswalk-contract.mjs
      - name: Resolve 39 question IDs to 1905 printed scan pages and build offline visual-locator desk
        run: node tools/pius-x-p44-map-39-to-1905-printed-scan-pages.mjs
      - name: Verify P1.44 printed page metadata, 18 priority scan notes and no invented human approvals
        run: node tests/pius-x-p44-printed-page-locator-contract.mjs
      - name: Verify permanent P1.45 39-case human-review packet against source-owner translations and exact scan pages
        run: node tests/pius-x-p45-external-review-packet-contract.mjs
      - name: Build free one-file offline Pius X source-dialogue trial with preserved sprites
        run: node tools/build-pius-x-p26-offline-replay.mjs
      - name: Browser-test offline source dialogue, French/English and original Vatican witnesses
        run: node tests/pius-x-p26-offline-replay-e2e.mjs
      - name: Browser-test staged P2.46 three-turn EN/FR documented dialogue, refusals, reset and two-turn alternate
