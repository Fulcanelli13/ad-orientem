      - 'previews/pius-x-study/spx-model-review-client.js'
      - 'previews/pius-x-study/spx-model-review-style.css'
      - 'tests/pius-x-generative-review-e2e.mjs'
      - 'tools/pius-x-live-eval.mjs'
      - 'tests/pius-x-live-eval-harness.mjs'
      - 'tests/pius-x-live-bilingual-loopback-adapter.mjs'
