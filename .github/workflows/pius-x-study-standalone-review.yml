  push:
    branches:
      - prototype/pius-x-standalone-study-20261021
    paths:
      - 'previews/pius-x-study/**'
      - 'tests/pius-x-study-standalone-e2e.mjs'
      - 'tests/pius-x-study-expanded-82-e2e.mjs'
