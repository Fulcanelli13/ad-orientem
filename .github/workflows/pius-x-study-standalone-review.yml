      - 'tools/spx-p0-editorial-normalization.mjs'
      - 'tools/spx-p2-followup-editorial-layer.mjs'
      - '.github/workflows/pius-x-study-standalone-review.yml'
  pull_request:
    paths:
      - 'previews/pius-x-study/**'
      - 'tests/pius-x-study-standalone-e2e.mjs'
      - 'tests/pius-x-study-expanded-82-e2e.mjs'
      - 'tests/pius-x-study-next12-dialogues-e2e.mjs'
      - 'tests/pius-x-study-next12-pastoral-e2e.mjs'
      - 'tools/build-pius-x-expanded-standalone.mjs'
      - 'tools/build-pius-x-next12-dialogues.mjs'
      - 'tools/build-pius-x-next12-pastoral-dialogues.mjs'
      - 'tools/build-pius-x-earlier-94-p6.mjs'
      - 'tests/pius-x-study-earlier-94-p6-e2e.mjs'
      - 'tests/pius-x-study-free-ask-e2e.mjs'
      - 'tools/pius-x-generative-review.mjs'
      - 'tools/pius-x-source-only-gate.mjs'
      - 'tests/pius-x-source-only-gate.mjs'
