name: Sacred Art Phase 27 — four Ghent IIIF photo comparisons
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase27-ghent-iiif-four.py'
      - '.github/workflows/sacred-art-phase27-ghent-four.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Compare owner-selected photos with four official MSK Gent museum images
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and HTTP dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Validate and retrieve four original museum subjects; no gallery edits
        run: |
          python -m py_compile scripts/sacred-art/phase27-ghent-iiif-four.py
          python scripts/sacred-art/phase27-ghent-iiif-four.py
      - name: Upload temporary museum photos and owner-image comparisons only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase27-four-ghent-images-research-only
          path: artifacts/sacred-art-phase27-ghent/
          retention-days: 7
          if-no-files-found: warn
