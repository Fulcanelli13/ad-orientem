name: Tenebrae shared reader phone parity

on:
  pull_request:
    paths:
      - "src/pray/tenebrae-presentation.js"
      - "src/pray/tenebrae-shared-reader.css"
      - "index.html"
      - "tests/tenebrae-phone-e2e.mjs"
      - ".github/workflows/tenebrae-shared-reader-phone.yml"
  workflow_dispatch:

jobs:
  tenebrae-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify all six 1960 Office routes and shared reader presentation
        run: npm run test:tenebrae-phone
      - name: Save actual Tenebrae phone screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenebrae-shared-reader-phone
          path: artifacts/tenebrae-reader-parity/*.png
          if-no-files-found: ignore
