name: B23 bulk 119 institutional source-screening audit
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-b23-source119.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 119 frozen catalogue identities, split 73 P0 and 46 P2
        run: |
          python -m py_compile scripts/research/sacred_art_source119_screen.py
          python - <<'PY'
          import pathlib,json,collections
          m=json.loads(pathlib.Path('data/research/sacred-art-b23-source119.manifest.json').read_text())
          rows=m['records']
          assert len(rows)==119 and len({r['artwork_id'] for r in rows})==119
          assert collections.Counter(r['kind'] for r in rows)=={'P2_MISSING_IMAGE':46,'P0_LEGACY_PREVIEW_QA':73}
          assert all(r['frozen_decision']!='PERMANENTLY_REJECTED' for r in rows)
          PY
      - name: Fetch only source-page metadata with per-host throttle and 429 stop
        run: python scripts/research/sacred_art_source119_screen.py
      - name: Store research-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-b23-source119-url-metadata-evidence
          path: artifacts/b23-source119/
          retention-days: 40
          if-no-files-found: warn
      - name: Save source response statuses for whole bulk queue
        if: success()
        run: |
          cp artifacts/b23-source119/source_screen.csv data/research/sacred-art-b23-source119.audit.csv
          cp artifacts/b23-source119/source_screen.summary.json data/research/sacred-art-b23-source119.audit-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b23-source119.audit.csv data/research/sacred-art-b23-source119.audit-summary.json
          git commit -m 'research: preserve 119 artwork institutional source metadata screens and no-license holds'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
