name: Sacred Atlas Round 2 acquire two reviewed images
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round2-four-photo-decision-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round2-two-photos.py'
      - '.github/workflows/sacred-atlas-round2-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-exact-source-images:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round02-guadalupe-mariazell-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated conversion dependency
        run: python -m pip install Pillow==11.3.0
      - name: Check exact Commons originals against A100 archive hashes and licences
        run: python tools/atlas/acquire-sacred-atlas-round2-two-photos.py --write
      - name: Commit original image derivatives, gallery records and byte evidence to this PR
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-gallery data/geography/research/sacred-atlas-round2-published-binary-evidence-20261103.v1.json)" ]; then
            echo 'No new images to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/approved-place-gallery.v1.json \
            data/geography/research/sacred-atlas-round2-published-binary-evidence-20261103.v1.json \
            assets/approved/place-gallery/MX-guadalupe-original-tilma-fonseca-mata-2013.webp \
            assets/approved/place-gallery/AT-mariazell-original-magna-mater-launus-2017.webp
          git commit -m "assets(atlas): publish source-verified Guadalupe and Mariazell approved gallery photos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
