name: Missal posture-aware page QA

on:
  pull_request:
    paths:
      - "src/mass/reader-missal-posture-pages.js"
      - "src/mass/reader-missal-integrity.js"
      - "src/mass/reader-special-missal-pages.js"
      - "src/mass/reader-missal-granularity.js"
      - "src/mass/reader-native-preview.js"
      - "src/mass/reader-mode-switch.js"
      - "src/mass/reader-dom.js"
      - "tests/reader-missal-posture-pages.mjs"
      - "tests/reader-special-missal-pages.mjs"
      - "tests/reader-special-missal-subpages.mjs"
      - "tests/reader-prayer-over-people.mjs"
      - "tests/reader-easter-vigil.mjs"
      - "tests/reader-mode-switch.mjs"
      - ".github/workflows/missal-posture-pages-qa.yml"
  workflow_dispatch:

jobs:
  posture-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify sourced posture page boundaries and bilingual preservation
        run: node tests/reader-missal-posture-pages.mjs
      - name: Verify real Lenten Prayer over the People survives Mass Missal
        run: node tests/reader-prayer-over-people.mjs
      - name: Verify intact special-rite prayer pages and unchanged event cursor
        run: node tests/reader-special-missal-subpages.mjs
      - name: Verify Easter Vigil real French/English source-line ownership
        run: node tests/reader-easter-vigil.mjs
      - name: Verify source-owned special-rite page cues
        run: node tests/reader-special-missal-pages.mjs
      - name: Verify canonical mode-switch and card anchors unchanged
        run: node tests/reader-mode-switch.mjs
      - name: Verify Mass form/rite model invariants
        run: node tests/reader-model.mjs
      - name: Verify cue/posture ownership invariants
        run: node tests/reader-cue-state.mjs
