  workflow_dispatch:
jobs:
  research-bridge-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pius-x-conversation-intent-bridge.mjs
      - run: node tests/pius-x-triad-links.mjs
      - run: node tests/pius-x-26turn-source-evidence.mjs
      - run: node tests/pius-x-sacraments-100family-source-screen.mjs
      - run: node tests/pius-x-20path-consolidation.mjs
      - run: node tests/pius-x-bilingual-dialogue-choices.mjs
      - run: node tests/pius-x-200turn-three-way-crosswalk.mjs
      - name: Stage exact P2 Apostolate owner for AQ04 and AQ05 (read-only)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '0a920793bcdf40cc053ad0aff31132ade8185a33'
          test "$(git rev-parse FETCH_HEAD)" = '0a920793bcdf40cc053ad0aff31132ade8185a33' || {
            echo 'P2 source-owner changed: reconcile and repin before the SPX Canon gate' >&2
            exit 1
          }
          for file in \
            src/apostolate/corpus.js \
            src/apostolate/contracts.js \
            src/apostolate/source-registry.js \
            src/learn/ask-church-source-digest.js
          do
            dest="research-out/pr1402-spx-owner/$file"
            mkdir -p "$(dirname "$dest")"
            git show "FETCH_HEAD:$file" > "$dest"
          done
      - run: node tests/pius-x-print-canon-denzinger-release-gate.mjs
      - run: node tests/pius-x-20path-editorial-review.mjs
      - run: node tests/pius-x-100answer-editorial-release-triage.mjs
      - run: node tests/pius-x-first40-italian-claim-review.mjs
      - run: node tests/pius-x-ten-conversation-content-pilot.mjs
      - run: node tests/pius-x-batch50-content-acceptance.mjs
      - run: node tests/pius-x-batch2-production-acceptance.mjs
      - run: node tests/pius-x-1905-batch3-content-acceptance.mjs
      - run: node tests/pius-x-1905-batch4-content-acceptance.mjs

  long-1905-index-extraction:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser self-test
        run: python tools/formation/extract-pius-x-1905-crosswalk.py --selftest
      - name: Fetch and extract 993 historical source question witnesses
        run: python tools/formation/extract-pius-x-1905-crosswalk.py --out research-out/pius-x-1905-to-1912-lexical-candidates.v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-1905-to-1912-research-candidates
          path: research-out/*.json
          if-no-files-found: warn
          retention-days: 30

  feast-and-salzano-locator-census:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser self-test
        run: python tools/formation/extract-pius-x-feasts-salzano.py --selftest
      - name: Index feast chapters and editor-numbered Salzano witnesses
        run: python tools/formation/extract-pius-x-feasts-salzano.py --out research-out/pius-x-feasts-salzano-locators.v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-feasts-salzano-source-locators
          path: research-out/pius-x-feasts-salzano-locators.v1.json
          if-no-files-found: warn
          retention-days: 30

  shared-router-pr1443-integration-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage exact pinned PR 1443 router (read-only; no duplicate catalog)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 'b4dd46743d641bfaa6076c6bb2fd8641c47077b6'
          test "$(git rev-parse FETCH_HEAD)" = "b4dd46743d641bfaa6076c6bb2fd8641c47077b6" || {
            echo 'PR #1443 moved; reconcile and repin its reviewed router before rerunning' >&2
            exit 1
          }
          for file in \
            src/learn/living-church-shared-question-router.js \
            src/learn/living-church-hybrid-question-router.js \
            data/learn/living-church-shared-question-routing-pilot.v1.json \
            data/learn/living-church-symbolic-concepts.v1.json
          do
            dest="research-out/pr1443-router/$file"
            mkdir -p "$(dirname "$dest")"
            git show "FETCH_HEAD:$file" > "$dest"
          done
      - name: Execute 48 authored SPX utterances against both real router implementations
        run: node tests/pius-x-pr1443-router-integration-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-pr1443-48-router-diagnostic
          path: research-out/pius-x-pr1443-48-router-diagnostic.v1.json
          if-no-files-found: warn
          retention-days: 30

  shared-router-pr1443-historical-bridge-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage approved research-only historical navigation bridge from router owner
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '854325df75671882d378b510fcc1af33fc30ba65'
          test "$(git rev-parse FETCH_HEAD)" = "854325df75671882d378b510fcc1af33fc30ba65" || {
            echo 'PR #1443 changed; reconcile and repin this acceptance test' >&2
            exit 1
          }
          for file in \
            src/learn/living-church-shared-question-router.js \
            src/learn/living-church-hybrid-question-router.js \
            data/learn/living-church-shared-question-routing-pilot.v1.json \
            data/learn/living-church-symbolic-concepts.v1.json \
            data/learn/living-church-pius-x-historical-passage-pointers.v1.json
          do
            dest="research-out/pr1443-router-new/$file"
            mkdir -p "$(dirname "$dest")"
            git show "FETCH_HEAD:$file" > "$dest"
          done
      - name: Measure held-out question routing and source-identity safety
        run: node tests/pius-x-pr1443-184topic-bridge-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-pr1443-184topic-heldout-48-results
          path: research-out/pius-x-pr1443-184topic-heldout-48.v1.json
          if-no-files-found: warn
          retention-days: 30

  shared-router-source-aware-48-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact router-owner source-aware branch commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '66a0dbd041e7f3f8c8b57f317c5c21286fa8287d'
          test "$(git rev-parse FETCH_HEAD)" = "66a0dbd041e7f3f8c8b57f317c5c21286fa8287d" || exit 1
          for file in \
            src/learn/living-church-shared-question-router.js \
            src/learn/living-church-hybrid-question-router.js \
            src/learn/living-church-historical-focus.js \
            data/learn/living-church-shared-question-routing-pilot.v1.json \
            data/learn/living-church-symbolic-concepts.v1.json \
            data/learn/living-church-pius-x-historical-passage-pointers.v1.json
          do
            dest="research-out/pr1443-router-source-aware/$file"
            mkdir -p "$(dirname "$dest")"
            git show "FETCH_HEAD:$file" > "$dest"
          done
      - name: Regress 48 original questions against source-aware retrieval
        run: node tests/pius-x-pr1443-source-aware-48-regression.mjs
      - name: Probe three new document-first questions in English and French
        run: node tests/pius-x-document-first-unscripted-router-6.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-source-aware-48-regression
          path: |
            research-out/pius-x-pr1443-source-aware-heldout-48.v1.json
            research-out/pius-x-document-first-unscripted-router-6.v1.json
          if-no-files-found: warn
          retention-days: 30

  pius-x-visual-novel-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium
      - name: Validate actual St Pius X visual-novel on phone and desktop
        run: node tests/pius-x-20path-visual-novel-browser.mjs
      - name: Stage exact five approved St Pius X sprites for deep dialogue browser review
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '2245d762237ef36fc778200ab2b3d536c342d2d4'
          test "$(git rev-parse FETCH_HEAD)" = '2245d762237ef36fc778200ab2b3d536c342d2d4' || exit 1
          mkdir -p research-out/pius-x-depth12-review-sprites
          git show 'FETCH_HEAD:previews/visible-mass-3d/assets/living-church/manifest.json' > research-out/pius-x-depth12-review-sprites/manifest.json
