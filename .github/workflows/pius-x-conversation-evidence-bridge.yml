name: Pius X source-to-question evidence bridge
on:
  pull_request:
    paths:
      - 'data/learn/research/pius-x-p0-p1-intent-evidence-bridge-20261019.v1.json'
      - 'data/learn/research/pius-x-64-family-evidence-screen-20261019.v1.json'
      - 'data/learn/research/pius-x-26-exact-pairs-reviewed-20261019.v1.json'
      - 'data/learn/research/pius-x-conversation-expansion-48-20261019.v1.json'
      - 'data/learn/research/pius-x-expansion-48-passage-review-20261019.v1.json'
      - 'data/learn/research/pius-x-112-cohort-coverage-baseline-20261019.v1.json'
      - 'data/learn/research/pius-x-two-cross-family-intent-joins-20261019.v1.json'
      - 'data/learn/research/pius-x-proof-of-answerability-12case-20261019.v1.json'
      - 'data/learn/research/pius-x-12case-paraphrases-followups-20261019.v1.json'
      - 'data/learn/research/pius-x-pr1443-184topic-bridge-measured-outcome-20261019.v1.json'
      - 'data/learn/research/pius-x-p1-short-catechism-topical-review-20261019.v1.json'
      - 'data/learn/research/pius-x-p1-first24-italian-text-review-20261019.v1.json'
      - 'data/learn/research/pius-x-p1-next40-italian-text-review-20261019.v1.json'
      - 'data/learn/research/pius-x-1912-catechism-edition-discrepancy-hold-20261019.v1.json'
      - 'data/learn/research/pius-x-p1-original-source-support-wave1-20261019.v1.json'
      - 'data/learn/research/pius-x-salzano-editorial-numbering-hold-20261019.v1.json'
      - 'data/learn/research/pius-x-source-question-census-20261019.v1.json'
      - 'data/learn/research/pius-x-1912-digital-question-fingerprints-part1-20261019.v1.json'
      - 'data/learn/research/pius-x-1912-digital-question-fingerprints-part2-20261019.v1.json'
      - 'data/learn/research/pius-x-1905-1912-calibration-crosswalk-20261019.v1.json'
      - 'data/learn/ltfaith-pius-x-it-witness-index.v1.json'
      - 'data/learn/ltfaith-pius-x-en-witness-index.v1.json'
      - 'tests/pius-x-conversation-intent-bridge.mjs'
      - 'tests/pius-x-pr1443-router-integration-diagnostic.mjs'
      - 'tests/pius-x-pr1443-184topic-bridge-acceptance.mjs'
      - 'tools/formation/extract-pius-x-1905-crosswalk.py'
      - 'tools/formation/extract-pius-x-feasts-salzano.py'
      - '.github/workflows/pius-x-conversation-evidence-bridge.yml'
  workflow_dispatch:
jobs:
  research-bridge-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pius-x-conversation-intent-bridge.mjs

  long-1905-index-extraction:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser self-test
        run: python tools/formation/extract-pius-x-1905-crosswalk.py --selftest
      - name: Fetch and extract 993 historical source question witnesses
        run: python tools/formation/extract-pius-x-1905-crosswalk.py --out research-out/pius-x-1905-to-1912-lexical-candidates.v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-1905-to-1912-research-candidates
          path: research-out/*.json
          if-no-files-found: warn
          retention-days: 30

  feast-and-salzano-locator-census:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser self-test
        run: python tools/formation/extract-pius-x-feasts-salzano.py --selftest
      - name: Index feast chapters and editor-numbered Salzano witnesses
        run: python tools/formation/extract-pius-x-feasts-salzano.py --out research-out/pius-x-feasts-salzano-locators.v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-feasts-salzano-source-locators
          path: research-out/pius-x-feasts-salzano-locators.v1.json
          if-no-files-found: warn
          retention-days: 30

  shared-router-pr1443-integration-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage exact pinned PR 1443 router (read-only; no duplicate catalog)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 'b4dd46743d641bfaa6076c6bb2fd8641c47077b6'
          test "$(git rev-parse FETCH_HEAD)" = "b4dd46743d641bfaa6076c6bb2fd8641c47077b6" || {
            echo 'PR #1443 moved; reconcile and repin its reviewed router before rerunning' >&2
            exit 1
          }
          for file in \
            src/learn/living-church-shared-question-router.js \
            src/learn/living-church-hybrid-question-router.js \
            data/learn/living-church-shared-question-routing-pilot.v1.json \
            data/learn/living-church-symbolic-concepts.v1.json
          do
            dest="research-out/pr1443-router/$file"
            mkdir -p "$(dirname "$dest")"
            git show "FETCH_HEAD:$file" > "$dest"
          done
      - name: Execute 48 authored SPX utterances against both real router implementations
        run: node tests/pius-x-pr1443-router-integration-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-pr1443-48-router-diagnostic
          path: research-out/pius-x-pr1443-48-router-diagnostic.v1.json
          if-no-files-found: warn
          retention-days: 30

  shared-router-pr1443-historical-bridge-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage approved research-only historical navigation bridge from router owner
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '854325df75671882d378b510fcc1af33fc30ba65'
          test "$(git rev-parse FETCH_HEAD)" = "854325df75671882d378b510fcc1af33fc30ba65" || {
            echo 'PR #1443 changed; reconcile and repin this acceptance test' >&2
            exit 1
          }
          for file in \
            src/learn/living-church-shared-question-router.js \
            src/learn/living-church-hybrid-question-router.js \
            data/learn/living-church-shared-question-routing-pilot.v1.json \
            data/learn/living-church-symbolic-concepts.v1.json \
            data/learn/living-church-pius-x-historical-passage-pointers.v1.json
          do
            dest="research-out/pr1443-router-new/$file"
            mkdir -p "$(dirname "$dest")"
            git show "FETCH_HEAD:$file" > "$dest"
          done
      - name: Measure held-out question routing and source-identity safety
        run: node tests/pius-x-pr1443-184topic-bridge-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pius-x-pr1443-184topic-heldout-48-results
          path: research-out/pius-x-pr1443-184topic-heldout-48.v1.json
          if-no-files-found: warn
          retention-days: 30
