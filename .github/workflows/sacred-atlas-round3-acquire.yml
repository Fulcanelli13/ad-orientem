name: Sacred Atlas Round 3 acquire two reviewed images
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round3-four-photo-decision-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round3-two-photos.py'
      - '.github/workflows/sacred-atlas-round3-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-exact-source-images:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round03-rocamadour-goa-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: python -m pip install Pillow==11.3.0
      - name: Acquire two pinned Commons originals with SHA-1/licence/dimensions gates
        run: python tools/atlas/acquire-sacred-atlas-round3-two-photos.py --write
      - name: Commit the local WebPs, gallery records and provenance evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-gallery data/geography/research/sacred-atlas-round3-published-binary-evidence-20261103.v1.json)" ]; then
            echo 'No new images to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/approved-place-gallery.v1.json \
            data/geography/research/sacred-atlas-round3-published-binary-evidence-20261103.v1.json \
            assets/approved/place-gallery/FR-rocamadour-black-madonna-gaige-2019.webp \
            assets/approved/place-gallery/IN-goa-francis-xavier-silver-casket-irvin-2012.webp
          git commit -m "assets(atlas): publish pinned Rocamadour and Goa gallery photographs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
