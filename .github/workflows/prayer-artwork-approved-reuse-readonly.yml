name: Prayer approved-art reuse contract (read only)
on:
  pull_request:
    paths:
      - 'data/prayer/artwork-editorial-20261031/approved-existing-art-reassignments-wave1.v1.json'
      - 'tests/prayer-artwork-reuse-wave1-contract.mjs'
      - 'data/prayer/artwork-editorial-20261031/approved-existing-art-reassignments-wave2.v1.json'
      - 'tests/prayer-artwork-reuse-wave2-contract.mjs'
      - '.github/workflows/prayer-artwork-approved-reuse-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-linked art mapping validation
        run: node --test tests/prayer-artwork-reuse-wave1-contract.mjs tests/prayer-artwork-reuse-wave2-contract.mjs
