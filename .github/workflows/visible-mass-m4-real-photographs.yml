name: Visible Mass M4 real panorama orientation review
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "previews/visible-mass-3d/visible-mass-m4-panorama.mjs"
      - "previews/visible-mass-3d/visible-mass-m5-photographs.mjs"
      - "previews/visible-mass-3d/sanctuary-hotspot-pilot.html"
      - "tests/visible-mass-m4-real-photo-browser.mjs"
      - "tests/visible-mass-m4-live-network.mjs"
      - "tests/visible-mass-m4-offline-file-browser.mjs"
      - "tools/build-visible-mass-m4-offline.mjs"
      - "tools/acquire-visible-mass-360-panorama.py"
      - ".github/workflows/visible-mass-m4-real-photographs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-mass-m4-originals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-photo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch original photographed scenes and verify source provenance
        run: |
          python -m pip install Pillow requests
          python tools/acquire-visible-mass-360-panorama.py
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('dist/visible-mass/panorama-sources')
          meta=json.loads((p/'metadata.json').read_text())
          for key in ('brompton360','newman360'):
              image=meta[key]
              assert image['width']==2*image['height'],key
              assert image['width']>=2048,key
              assert image['license']=='CC BY-SA 3.0',key
              assert (p/image['file']).stat().st_size>100_000,key
              assert 'commons.wikimedia.org' in image['commons_page'],key
          print('Original photographic assets verified; independent licence approval remains required')
          PY
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Check both real images, orientation and photographic attribution
        env:
          AO_M4_REAL_DIR: dist/visible-mass/panorama-sources
        run: node tests/visible-mass-m4-real-photo-browser.mjs
      - name: Verify live Commons HTTPS delivery and browser CORS without test intercepts
        run: node tests/visible-mass-m4-live-network.mjs
      - name: Prepare bounded licensed photographic assets for the single HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('dist/visible-mass/panorama-sources')
          for key in ('brompton360','newman360'):
              with Image.open(root/f'{key}.jpg') as image:
                  image.thumbnail((2048,1024),Image.Resampling.LANCZOS)
                  assert image.size==(2048,1024),image.size
                  image.save(root/f'{key}-review.jpg','JPEG',quality=84,optimize=True,progressive=True)
          PY
      - name: Verify separately attributed P6/M5 close photo originals
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('dist/visible-mass/panorama-sources')
          meta=json.loads((root/'metadata.json').read_text())
          for key in ('newman_altar1','newman_altar2','newman_altar3','newman_apse','newman_pulpit'):
              photo=meta[key]
              assert photo['license']=='CC BY 4.0',(key,photo['license'])
              assert 'zairon' in photo['artist'].lower(),(key,photo['artist'])
              assert 'commons.wikimedia.org/wiki/File:' in photo['commons_page'],key
              assert (root/photo['file']).stat().st_size>80_000,key
          for key in ('brompton_altar1','brompton_altar2','brompton_lady','brompton_heart'):
              photo=meta[key]
              assert photo['license']=='CC BY-SA 4.0',(key,photo['license'])
              assert 'andyscott' in photo['artist'].lower(),(key,photo['artist'])
              assert 'commons.wikimedia.org/wiki/File:' in photo['commons_page'],key
              assert (root/photo['file']).stat().st_size>80_000,key
          print('M5: nine restored close photographs have independent Commons authorship and licence')
          PY
      - name: Install single-file module bundler
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0 esbuild@0.25.12
      - name: Package combined genuine 360° and close-photo M5 review
        run: node tools/build-visible-mass-m4-offline.mjs
      - name: Browser-test desktop and phone from file:// with internet disconnected
        run: node tests/visible-mass-m4-offline-file-browser.mjs
      - name: Upload unified M5 original photographic visitor
        uses: actions/upload-artifact@v4
        with:
          name: The-Visible-Mass-M5-Combined-Photographic-Review-Offline
          path: dist/visible-mass/The_Visible_Mass_M5_Combined_Photographic_Review_Offline.html
          retention-days: 30
          if-no-files-found: error
      - name: Upload one-file M4 original photographic reviewer
        uses: actions/upload-artifact@v4
        with:
          name: The-Visible-Mass-M4-Photographic-Review-Offline
          path: dist/visible-mass/The_Visible_Mass_M4_Photographic_Review_Offline.html
          retention-days: 30
          if-no-files-found: error
      - name: Preserve original-image desktop and phone review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Visible-Mass-M4-Real-Photos-Review
          path: |
            dist/visible-mass/m4-real-photo-qa/**
            dist/visible-mass/m4-live-delivery/**
            dist/visible-mass/m4-offline-file-qa/**
            dist/visible-mass/panorama-sources/metadata.json
          retention-days: 30
          if-no-files-found: warn
