name: Visible Mass M4 real panorama orientation review
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "previews/visible-mass-3d/visible-mass-m4-panorama.mjs"
      - "previews/visible-mass-3d/sanctuary-hotspot-pilot.html"
      - "tests/visible-mass-m4-real-photo-browser.mjs"
      - "tests/visible-mass-m4-live-network.mjs"
      - "tools/acquire-visible-mass-360-panorama.py"
      - ".github/workflows/visible-mass-m4-real-photographs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-mass-m4-originals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-photo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch original photographed scenes and verify source provenance
        run: |
          python -m pip install Pillow requests
          python tools/acquire-visible-mass-360-panorama.py
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('dist/visible-mass/panorama-sources')
          meta=json.loads((p/'metadata.json').read_text())
          for key in ('brompton360','newman360'):
              image=meta[key]
              assert image['width']==2*image['height'],key
              assert image['width']>=2048,key
              assert image['license']=='CC BY-SA 3.0',key
              assert (p/image['file']).stat().st_size>100_000,key
              assert 'commons.wikimedia.org' in image['commons_page'],key
          print('Original photographic assets verified; independent licence approval remains required')
          PY
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Check both real images, orientation and photographic attribution
        env:
          AO_M4_REAL_DIR: dist/visible-mass/panorama-sources
        run: node tests/visible-mass-m4-real-photo-browser.mjs
      - name: Verify live Commons HTTPS delivery and browser CORS without test intercepts
        run: node tests/visible-mass-m4-live-network.mjs
      - name: Preserve original-image desktop and phone review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Visible-Mass-M4-Real-Photos-Review
          path: |
            dist/visible-mass/m4-real-photo-qa/**
            dist/visible-mass/m4-live-delivery/**
            dist/visible-mass/panorama-sources/metadata.json
          retention-days: 30
          if-no-files-found: warn
