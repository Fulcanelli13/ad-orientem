name: Temporary thin HTML audit
on:
  push:
    branches: [performance/thin-html-safe-extraction-20261009]
    paths:
      - .github/workflows/temporary-thin-html-audit.yml
      - tools/audit-thin-html.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/audit-thin-html.mjs
