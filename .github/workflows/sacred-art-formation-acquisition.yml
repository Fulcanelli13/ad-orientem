name: Sacred art — Formation and sacramental scenes
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - "tools/calendar/acquire-sacred-art-formation.py"
      - "data/learn/sacred-art-formation-targets.v1.json"
      - ".github/workflows/sacred-art-formation-acquisition.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sacred-art-formation-subjects
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow numpy
      - name: Collect source-specific CC0 paintings for 23 Formation topics
        run: python tools/calendar/acquire-sacred-art-formation.py
      - name: Preserve original JPEGs, source identity, failures, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-formation-originals
          path: artifacts/sacred-art-wide/formation/
          if-no-files-found: warn
          retention-days: 30
