name: Divine Office annual readiness register — no publication
on:
  pull_request:
    paths:
      - 'src/office/annual-readiness-register.js'
      - 'src/office/source-section-resolver.js'
      - 'src/office/mass-host-source-bridge.js'
      - 'src/office/structured-hour-draft.js'
      - 'src/office/precedence-review.js'
      - 'src/office/reviewed-hour-handoff.js'
      - 'src/office/annual-research-sweep.js'
      - 'src/office/universal-source-descriptors.js'
      - 'tests/divine-office-universal-source-descriptors.mjs'
      - 'data/office/research/2026-office-pilot-ordo-roster.json'
      - 'tests/divine-office-research-roster.mjs'
      - 'scripts/office/sweep-annual-research.mjs'
      - 'tests/divine-office-reviewed-hour-handoff.mjs'
      - 'tests/divine-office-annual-research-sweep.mjs'
      - 'tests/divine-office-precedence-review.mjs'
      - 'tests/divine-office-mass-bridge-and-hour-draft.mjs'
      - 'tests/divine-office-source-section-resolver.mjs'
      - 'src/office/annual-capture-ledger.js'
      - 'scripts/office/emit-annual-capture-ledger.mjs'
      - 'tests/divine-office-annual-capture-ledger.mjs'
      - 'data/office/source-capture-ledgers/**'
      - 'scripts/office/build-annual-readiness-register.mjs'
      - 'tests/divine-office-annual-readiness-register.mjs'
      - '.github/workflows/office-annual-readiness.yml'
      - 'docs/DIVINE-OFFICE-ANNUAL-RELEASE-REGISTER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annual-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile-time and completeness contracts
        run: |
          node --check src/office/annual-readiness-register.js
          node --check src/office/source-section-resolver.js
          node --test tests/divine-office-source-section-resolver.mjs
          node --check src/office/mass-host-source-bridge.js
          node --check src/office/structured-hour-draft.js
          node --test tests/divine-office-mass-bridge-and-hour-draft.mjs
          node --check src/office/precedence-review.js
          node --test tests/divine-office-precedence-review.mjs
          node --check src/office/reviewed-hour-handoff.js
          node --test tests/divine-office-reviewed-hour-handoff.mjs
          node --check src/office/annual-research-sweep.js
          node --check scripts/office/sweep-annual-research.mjs
          node --test tests/divine-office-annual-research-sweep.mjs
          node --check src/office/universal-source-descriptors.js
          node --test tests/divine-office-universal-source-descriptors.mjs
          node --test tests/divine-office-research-roster.mjs
          node --check src/office/annual-capture-ledger.js
          node --check scripts/office/emit-annual-capture-ledger.mjs
          node --test tests/divine-office-annual-capture-ledger.mjs
          node --check scripts/office/build-annual-readiness-register.mjs
          node --test tests/divine-office-annual-readiness-register.mjs
      - name: Generate 2026 and leap-year 2028 preflight inventories in ephemeral scratch
        run: |
          OUT="$RUNNER_TEMP/office-readiness"
          node scripts/office/build-annual-readiness-register.mjs --year 2026 --out "$OUT"
          node scripts/office/build-annual-readiness-register.mjs --year 2028 --out "$OUT"
          OUTPUT="$OUT" node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for(const [year,days] of [[2026,365],[2028,366]]){
              const d=JSON.parse(readFileSync(process.env.OUTPUT+"/"+year+"-office-annual-readiness.json","utf8"));
              const s=JSON.parse(readFileSync(process.env.OUTPUT+"/"+year+"-office-annual-exceptions.json","utf8"));
              if(d.rows.length!==days*24||d.summary.planned!==days*24||
                 d.summary.civilDays!==days||d.summary.rawCaptured!==0||
                 d.summary.notGenerated!==days*24||
                 d.summary.liturgicallyCertified!==0||
                 d.summary.approved!==0||d.summary.published!==0||
                 d.release.publicRouteEnabled||d.release.canPublish||
                 s.exceptions.allYearDiscrepanciesActuallyChecked!==false)
                   throw Error("OFFICE_ANNUAL_INVENTORY_RELEASE_GATES_NOT_SATISFIED");
              console.log("OFFICE_ANNUAL_INVENTORY_ASSERTIONS",year,days*24,
                "planned/none approved/none published");
            }
          '
      - name: Execute no-download annual Office selection sweeps
        run: |
          set -euo pipefail
          node scripts/office/sweep-annual-research.mjs \
            --year 2026 --out "$RUNNER_TEMP/office-selection-2026.json"
          node scripts/office/sweep-annual-research.mjs \
            --year 2028 --out "$RUNNER_TEMP/office-selection-2028.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for(const [year,days] of [[2026,365],[2028,366]]){
              const doc=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
                "/office-selection-"+year+".json","utf8"));
              if(doc.summary.days!==days||
                doc.summary.plannedLocaleSlots!==days*8*3||
                doc.summary.researchCandidateHours!==0||
                doc.summary.withheldHours!==days*8||
                doc.summary.proposedFixedSanctoralPaths!==days||
                doc.summary.proposedAdventTemporalPaths!==(year===2026?26:22)||
                doc.summary.totalUnverifiedSourcePathLeads!==(year===2026?391:388)||
                doc.summary.sourceFilesVerifiedByThisSweep!==0||
                doc.summary.independentlyCertifiedHours!==0||
                doc.summary.publishedHours!==0||
                doc.allYearLiturgicalDiscrepanciesActuallyChecked!==false)
                throw Error("OFFICE_ANNUAL_SWEEP_FABRICATED_COVERAGE");
            }
          '
      - name: Verify evidence-scoped six-date Office candidate pilot
        run: |
          node scripts/office/sweep-annual-research.mjs \
            --year 2026 \
            --office-days data/office/research/2026-office-pilot-ordo-roster.json \
            --out "$RUNNER_TEMP/office-six-date-research-sweep.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const d=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
              "/office-six-date-research-sweep.json","utf8"));
            if(d.summary.submittedOfficeResearchDays!==6||
               d.summary.sourceWitnessDays!==6||
               d.summary.sourceHeadingsObserved!==34||
               d.summary.researchCandidateHours!==15||
               d.summary.withheldHours!==2905||
               d.summary.completeTrilingualHours!==0||
               d.summary.independentlyCertifiedHours!==0||
               d.summary.publishedHours!==0||
               d.allYearLiturgicalDiscrepanciesActuallyChecked!==false)
              throw Error("OFFICE_RESEARCH_WITNESS_SCOPE_OR_RELEASE_FABRICATED");
          '
      # Outputs remain ephemeral runner scratch. No source or report upload.
      - name: Rehydrate historical 168 verified source hashes from committed metadata ONLY
        run: |
          set -euo pipefail
          LEDGER="data/office/source-capture-ledgers/2026/2026-capture-45.json"
          node scripts/office/build-annual-readiness-register.mjs \
            --year 2026 --out "$RUNNER_TEMP/office-from-committed-ledger" \
            --ledger-file "$LEDGER"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {validateAnnualCaptureLedger} from "./src/office/annual-capture-ledger.js";
            const ledger=JSON.parse(readFileSync("data/office/source-capture-ledgers/2026/2026-capture-45.json","utf8"));
            validateAnnualCaptureLedger(ledger);
            const out=process.env.RUNNER_TEMP+"/office-from-committed-ledger";
            const d=JSON.parse(readFileSync(out+"/2026-office-annual-readiness.json","utf8"));
            const s=d.summary;
            if(s.rawCaptured!==168||s.notGenerated!==8592||
               s.datesWithAnyRawEvidence!==7||
               s.liturgicallyCertified!==0||s.approved!==0||
               s.published!==0||d.release.publicRouteEnabled||d.release.canPublish)
              throw Error("OFFICE_COMMITTED_METADATA_PROVENANCE_IMPORT_INVALID");
            console.log("OFFICE_COMMITTED_LEDGER_VERIFIED",JSON.stringify({
              immutableBatch:ledger.batchId,
              metadataOnlyHashes:ledger.verifiedRawSourceCount,
              recordsSha256:ledger.recordsSha256,
              annualCapture:s.rawCaptured,unreviewed:s.notGenerated,
              approved:s.approved,published:s.published
            }));
          '
      # No artifact upload, no public Office route, no scheduled scraping.
