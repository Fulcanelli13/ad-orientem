name: B40 Wuilleret Commons original versus museum-published painting crossmatch
on:
  push:
    branches: [research/sacred-art-b40-27-commons-accession-image-screen-20261024]
    paths: [.github/workflows/ao-art-b40-wuilleret-commons-crossmatch.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b40-wuilleret-commons-vs-museum-crosscheck
  cancel-in-progress: false
jobs:
  exact-object-photo-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b40-27-commons-accession-image-screen-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare scientific image decoders and hold checks
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'pymupdf>=1.24,<1.30'
          node tests/sacred-art-b39-27-evidence-integrity.mjs
          python -m py_compile scripts/research/sacred_art_b40_crossmatch_wuilleret_commons.py
      - name: Independently compare faithful Commons source to captioned full museum painting
        run: python scripts/research/sacred_art_b40_crossmatch_wuilleret_commons.py
      - name: Mandatory unpublished original archive and remote SHA reread
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/research/sacred_art_release_archive_gate.py --wave b40-sik-crossmatch --source-dir artifacts/b40-wuilleret-commons-original-museum-crossmatch
      - name: Commit compact independent source evidence and rights hold
        run: |
          set -euo pipefail
          cp artifacts/b40-wuilleret-commons-original-museum-crossmatch/source-results.csv data/research/sacred-art-b40-wuilleret-commons-crossmatch-results.csv
          cp artifacts/b40-wuilleret-commons-original-museum-crossmatch/source-summary.json data/research/sacred-art-b40-wuilleret-commons-crossmatch-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b40-wuilleret-commons-crossmatch-results.csv data/research/sacred-art-b40-wuilleret-commons-crossmatch-summary.json
          git commit -m 'research: B40 Commons SIK original crossmatched to Musée gruérien full painting, SHA archived'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b40-27-commons-accession-image-screen-20261024
            git rebase origin/research/sacred-art-b40-27-commons-accession-image-screen-20261024
            git push origin HEAD:research/sacred-art-b40-27-commons-accession-image-screen-20261024 && exit 0
            sleep 3
          done
          exit 1
