name: Sacred Art Walters 42 official static CSV join (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-walters-42-official-csv-20261030.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-walters-42-official-csv
  cancel-in-progress: false

jobs:
  reconcile-numeric-identity-and-object-relationships:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original 2455 frozen editorial choices
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Official museum 42-object numeric identity, accession and relationship join
        run: node scripts/art/reconcile-walters-42-static-csv-20261030.mjs
      - name: Assert source decisions and photo/production rights remain gated
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('data/calendar/sacred-art-phase1-walters-42-official-csv-report-20261030.v1.json','utf8'));
          if(r.rows.length!==42 || r.counts.frozenSourceCards!==42 ||
             r.counts.originalConditionalDecisions!==2 ||
             r.counts.exactObjectIdAccessionTitlePurlMatch +
             r.counts.foundNumericIdButDifferentMetadata +
             r.counts.absentNumericObjectId!==42 ||
             r.rows.some(x=>x.newPhysicalUniqueWorkCertified!==false ||
             x.canonical383Match!==false || x.selectedImageBytesVisuallyChecked!==false ||
             x.imageRightsCertified!==false || x.frozenEditorialChoiceChanged!==false ||
             x.productionMutation!==false) ||
             r.release.productionMutation!==false)throw Error('Walters official source merge gate failed');
          console.log(JSON.stringify(r.counts,null,2));
          NODE
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-walters-42-official-csv-report-20261030.v1.json
          git diff --cached --check
          git commit -m "research(sacred-art): preserve official Walters 42 source-id accession relationships [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
