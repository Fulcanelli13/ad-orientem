name: Sacred Art Good Friday exact San Polo XII Home reuse
on:
  pull_request:
    paths:
      - 'src/home/released-class-i-good-friday-san-polo-2026.js'
      - 'src/home/approved-dated-artwork-2026.js'
      - 'tests/home-class-i-good-friday-san-polo-reuse.mjs'
      - 'tests/home-class-i-good-friday-san-polo-phone.mjs'
      - 'tests/home-2026-annual-artwork-coverage.mjs'
      - '.github/workflows/sacred-art-class-i-good-friday-san-polo-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-photo-scoped-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/home/released-class-i-good-friday-san-polo-2026.js
          node --check src/home/approved-dated-artwork-2026.js
          node tests/home-class-i-good-friday-san-polo-reuse.mjs
          node tests/home-2026-annual-artwork-coverage.mjs
  good-friday-home-phone:
    needs: exact-photo-scoped-rights
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - run: node tests/home-class-i-good-friday-san-polo-phone.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-friday-2026-san-polo-home-phone
          path: artifacts/home-good-friday-san-polo-phone/
          if-no-files-found: warn
          retention-days: 14
