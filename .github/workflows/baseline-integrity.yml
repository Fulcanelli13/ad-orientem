name: Baseline integrity

on:
  push:
    branches:
      - main
      - migration/v43.33
    paths:
      - 'legacy/v43.33.parts/**'
      - 'tools/reassemble-v43.33.mjs'
      - '.github/workflows/baseline-integrity.yml'
      - 'docs/CANONICAL-BASELINE.md'
  pull_request:
    paths:
      - 'legacy/v43.33.parts/**'
      - 'tools/reassemble-v43.33.mjs'
      - '.github/workflows/baseline-integrity.yml'
      - 'docs/CANONICAL-BASELINE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify frozen v43.33
        run: node tools/reassemble-v43.33.mjs

      - name: Confirm frozen baseline cannot replace production
        shell: bash
        run: |
          test -f index.html
          grep -q 'data-ao-r17-browser-entry' index.html
          echo "Frozen v43.33 verified as historical baseline only; production index.html is immutable from this workflow."
