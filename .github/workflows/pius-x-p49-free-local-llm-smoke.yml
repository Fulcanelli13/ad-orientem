name: Pius X actual free local model smoke (not release)

# This heavyweight, genuine-model runner should NEVER repeat on unrelated PR
# commits. Trigger explicitly by editing its driver script on the research
# branch, or by workflow_dispatch once it exists on the default branch.
on:
  push:
    branches:
      - prototype/pius-x-source-constrained-composer-20261023
    paths:
      - 'tools/pius-x-p49-real-local-model-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spx-p49-local-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p49-real-local-model:
    # Standard Linux runner on this PUBLIC repository: no paid model/API usage.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AO_SPX_MODEL_URL: http://127.0.0.1:8766/v1/chat/completions
      AO_SPX_MODEL: Qwen2.5-0.5B-Instruct-Q4_K_M
      AO_SPX_REVIEW_MODE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build unchanged 106-subject 423-node source owner in runner
        run: |
          node tools/build-pius-x-expanded-standalone.mjs
          node tools/build-pius-x-next12-dialogues.mjs
          node tools/build-pius-x-next12-pastoral-dialogues.mjs
          node tools/build-pius-x-earlier-94-p6.mjs
      - name: Build free local open-weight model runtime from public source
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/spx-llama.cpp
          cmake -S /tmp/spx-llama.cpp -B /tmp/spx-llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/spx-llama.cpp/build --target llama-server -j 4
          test -x /tmp/spx-llama.cpp/build/bin/llama-server
      - name: Download licensed 0.5B Q4_K_M model and verify upstream SHA256
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 \
            -o /tmp/spx-qwen-0.5b.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          printf '%s\n' '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /tmp/spx-qwen-0.5b.gguf' | sha256sum -c -
      - name: Start localhost-only real inference server
        run: |
          nohup /tmp/spx-llama.cpp/build/bin/llama-server \
            -m /tmp/spx-qwen-0.5b.gguf --alias "${AO_SPX_MODEL}" \
            --host 127.0.0.1 --port 8766 -c 4096 -t 4 -ngl 0 \
            > /tmp/spx-p49-server.log 2>&1 &
          for i in $(seq 1 70); do
            if curl --silent --fail http://127.0.0.1:8766/health > /dev/null; then
              echo "Local model server ready"
              exit 0
            fi
            sleep 2
          done
          tail -100 /tmp/spx-p49-server.log
          exit 1
      - name: Run real 3-turn English and French SPX composer/verifier sessions
        run: node tools/pius-x-p49-real-local-model-smoke.mjs
      - name: Archive real model output (unapproved research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spx-p49-real-openweight-inference-no-approvals
          path: |
            artifacts/pius-x-real-local-eval/
          if-no-files-found: warn
          retention-days: 7
