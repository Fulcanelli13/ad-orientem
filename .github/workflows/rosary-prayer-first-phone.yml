name: Rosary prayer-first phone acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/pray/presentation-runtime.js"
      - "src/pray/devotional-methods-styles.js"
      - "tests/rosary-methods-prayer-first-phone.mjs"
      - ".github/workflows/rosary-prayer-first-phone.yml"
  workflow_dispatch:

jobs:
  rosary-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: 320/390/430 prayer-first method, preserved source and canonical donor
        run: node tests/rosary-methods-prayer-first-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosary-methods-prayer-first-phone
          path: artifacts/rosary-methods-phone/
          retention-days: 30
          if-no-files-found: warn
