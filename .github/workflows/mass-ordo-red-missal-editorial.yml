name: Red Missal 2013 Ordo Missae Editorial Gate

on:
  pull_request:
    paths:
      - "data/research/mass-ordo-red-missal-2013-editorial.v1.json"
      - "data/mass/canonical-text-corrections.v1.json"
      - "src/mass/canonical-text-corrections.js"
      - "src/mass/reader-text.js"
      - "tests/canonical-text-corrections.mjs"
      - "tests/mass-ordo-red-missal-editorial.mjs"
      - ".github/workflows/mass-ordo-red-missal-editorial.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-red-missal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canonical source correction integrity
        run: node tests/canonical-text-corrections.mjs
      - name: All Ordinary reader cards unchanged in structure
        run: node tests/reader-text.mjs
      - name: Red Missal English editorial and Low/Sung EN/FR reader checks
        run: node tests/mass-ordo-red-missal-editorial.mjs
      - name: Retain 256-cue editorial worklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-ordo-red-missal-256-cue-worklist
          path: artifacts/mass-ordo-red-missal/256-cue-editorial-worklist.json
          if-no-files-found: warn
          retention-days: 30
