name: Prayer Wave 1 - Angelus and Rosary photo proof
on:
  push:
    branches:
      - feature/prayer-wave1-angelus-rosary-proof-20261028
    paths:
      - .github/workflows/prayer-wave1-angelus-rosary-art-proof-20261028.yml
      - src/pray/wave1-angelus-rosary-art-proof.js
      - src/pray/presentation-runtime.js
      - assets/pray/hero-proof/angelus-v3-paint-only-*
      - assets/pray/hero-proof/rosary-yorck-complete-*
      - tests/pray-wave1-angelus-rosary-art-proof.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-real-existing-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zero-cost existing browser test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate JS and both original reader experiences at 320, 390 and 1440 px
        run: |
          node --check src/pray/wave1-angelus-rosary-art-proof.js
          node --check src/pray/presentation-runtime.js
          node --check tests/pray-wave1-angelus-rosary-art-proof.mjs
          node tests/pray-wave1-angelus-rosary-art-proof.mjs
      - name: Permanently archive the twelve device screenshots and SHA-256 hashes
        if: success()
        run: |
          mkdir -p assets/staged/prayer-wave1-angelus-rosary-device-qa-20261028
          for which in angelus rosary; do
            for state in collapsed expanded; do
              for width in 320 390 1440; do
                cp "artifacts/prayer-wave1-angelus-rosary-proof/${which}-${state}-${width}.png" "assets/staged/prayer-wave1-angelus-rosary-device-qa-20261028/${which}-${state}-${width}.png"
              done
            done
          done
          (
            cd assets/staged/prayer-wave1-angelus-rosary-device-qa-20261028
            sha256sum *.png > SCREENSHOT-SHA256.txt
          )
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-wave1-angelus-rosary-device-qa-20261028
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(pray art): archive Angelus and Rosary real device screenshots"
          git pull --rebase origin feature/prayer-wave1-angelus-rosary-proof-20261028
          git push origin HEAD:feature/prayer-wave1-angelus-rosary-proof-20261028
      - name: Review-only screenshots (secondary copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-wave1-angelus-rosary-qa-${{ github.run_id }}
          path: artifacts/prayer-wave1-angelus-rosary-proof/
          retention-days: 3
          if-no-files-found: warn
