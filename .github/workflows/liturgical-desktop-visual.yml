name: Liturgical desktop visual parity

on:
  pull_request:
    paths:
      - "src/mass/reader-dom.js"
      - "src/mass/reader-native-preview.js"
      - "src/pray/tenebrae-presentation.js"
      - "src/pray/tenebrae-shared-reader.css"
      - "tests/reader-liturgical-desktop-parity.mjs"
      - ".github/workflows/liturgical-desktop-visual.yml"
  workflow_dispatch:

jobs:
  desktop-liturgical-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check Mass and special-rite desktop layouts and capture actual screens
        run: node tests/reader-liturgical-desktop-parity.mjs
      - name: Upload desktop screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-liturgical-desktop-1440
          path: artifacts/liturgical-desktop-review/
          if-no-files-found: ignore
          retention-days: 14
