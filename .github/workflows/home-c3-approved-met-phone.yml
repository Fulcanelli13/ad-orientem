name: Approved Met Angelus/Adoration — actual Home phone artwork QA
on:
  pull_request:
    paths:
      - "src/home/c3-gallery.js"
      - "src/home/c3-styles.js"
      - "assets/staged/sacred-art-met-approved/**"
      - "tests/home-c3-approved-met-phone.mjs"
      - ".github/workflows/home-c3-approved-met-phone.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-home-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture actual Home carousel at 320px and 390px (not mock layouts)
        run: node tests/home-c3-approved-met-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-met-two-actual-home-phone-qa
          path: artifacts/approved-met-two-home-qa/
          retention-days: 14
          if-no-files-found: warn
