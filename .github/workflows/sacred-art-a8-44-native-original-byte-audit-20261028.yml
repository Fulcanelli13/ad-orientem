name: Sacred Art 44 approved originals - read-only byte and edge evidence

on:
  push:
    branches:
      - research/prayer-existing-sacred-art-mosaic-20261028
    paths:
      - .github/workflows/sacred-art-a8-44-native-original-byte-audit-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sacred-art-a8-original-byte-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-image-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research-only source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install image-edge preview dependency (no paid services)
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download originals transiently, hash bytes, and prepare full-image edge-review sheets
        run: |
          python -m py_compile scripts/research/sacred_art_a8_44_native_original_probe_20261028.py
          python scripts/research/sacred_art_a8_44_native_original_probe_20261028.py
      - name: Upload temporary RESEARCH QA evidence only (never full-size masters)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-art-a8-native-evidence-${{ github.run_id }}
          path: artifacts/sacred-art-a8-44-native-check/
          if-no-files-found: warn
          retention-days: 3
