name: Sacred Atlas R35 — manually recover frozen original JPEGs (no publication)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py'
      - 'tests/sacred-atlas-r35-manual-original-retention-test.py'
      - '.github/workflows/sacred-atlas-r35-manual-original-recovery.yml'
  workflow_dispatch:
    inputs:
      batch:
        description: 'One compliant, no-retry Wikimedia pass; probe first; remainder only after successful probe'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - remainder
          - all
permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned decoder for synthetic-only offline tests
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify frozen owner selections, opt-in retention and tamper rejection
        run: |
          python -m py_compile tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py
          python tests/sacred-atlas-r35-manual-original-retention-test.py

  manual-one-pass-download:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Query only pinned Commons originals, stop immediately on HTTP 429
        env:
          R35_BATCH: ${{ inputs.batch }}
        run: |
          case "$R35_BATCH" in
            probe) python tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py --verify-originals --retain-verified-originals --start-index 0 --max-files 1 ;;
            remainder) python tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py --verify-originals --retain-verified-originals --start-index 1 --max-files 18 ;;
            all) python tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py --verify-originals --retain-verified-originals --start-index 0 --max-files 19 ;;
            *) echo 'Invalid batch' >&2; exit 1 ;;
          esac
      - name: Retain SHA-1-verified images and failure report as short-lived workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-atlas-r35-${{ inputs.batch }}-originals
          path: |
            /tmp/ao-sacred-atlas-owner-approved19/report.json
            /tmp/ao-sacred-atlas-owner-approved19/originals/*.jpg
            /tmp/ao-sacred-atlas-owner-approved19/previews/*.webp
          if-no-files-found: warn
          retention-days: 7
