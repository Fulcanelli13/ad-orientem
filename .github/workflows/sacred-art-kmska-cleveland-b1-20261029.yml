name: Sacred Art — KMSKA/Cleveland exact-source painting discovery
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - scripts/art/sacred-art-kmska-cleveland-b1-20261029.py
      - .github/workflows/sacred-art-kmska-cleveland-b1-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-kmska-cleveland-b1
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only published OAI/CC0 APIs; no source images downloaded
        run: |
          python -m py_compile scripts/art/sacred-art-kmska-cleveland-b1-20261029.py
          python scripts/art/sacred-art-kmska-cleveland-b1-20261029.py --kmska-pages 24 --cleveland-per-query 50 --kmska-manifests-max 60 --delay 0.13
      - name: Validate no stale museum IDs, no publishing and exact licence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/calendar/sacred-art-kmska-cleveland-first-review-20261029.v1.json').read_text())
          assert d['baselineCanonical']==383 and d['imagesDownloaded']==0
          assert d['editorialImports']==0 and d['productionImports']==0
          assert len({x['id'] for x in d['records']})==len(d['records'])
          for r in d['records']:
            assert r['provider'] in ['Cleveland','KMSKA']
            assert not r['productionReleased'] and r['editorialSelection'] is None
            if r['previewRightsVerified']:
              assert r['previewURL'] and r['sourceImageRights'] != 'UNVERIFIED'
            if r['provider']=='KMSKA':
              assert r['sourceOaiId'].startswith('oai:datahub.vlaamsekunstcollectie.be:kmska.be:')
          assert len(d['records'])==d['counts']['kmskaMetadataLeads']+d['counts']['clevelandCC0ImagePreviews']
          print('VALIDATED',d['counts'])
          PY
          git diff --exit-code -- data/calendar/sacred-art-curator-queues-383-20261029.v1.json
      - name: Archive source catalogue on research branch only
        if: always()
        run: |
          if [ ! -f data/calendar/sacred-art-kmska-cleveland-first-review-20261029.v1.json ]; then exit 0; fi
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-kmska-cleveland-first-review-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): archive KMSKA and Cleveland source painting leads with photo rights"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
