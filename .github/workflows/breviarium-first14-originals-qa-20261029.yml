name: Sacred Art Breviarium - first 14 source-original image QA
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/breviarium-first14-originals-qa-20261029.yml
      - scripts/art/breviarium-first14-source-originals-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-breviarium-first14-originals
  cancel-in-progress: false
jobs:
  batch-download-and-permanent-review-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify 14 exact-source original images without automatic approval
        run: |
          python -m py_compile scripts/art/breviarium-first14-source-originals-20261029.py
          python scripts/art/breviarium-first14-source-originals-20261029.py
      - name: Commit original file bytes and native photo inspection evidence
        if: always()
        run: |
          if [ ! -d assets/staged/sacred-art-breviarium-wave1-native-20261029 ]; then exit 0; fi
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/sacred-art-breviarium-wave1-native-20261029/
          git diff --cached --check
          if git diff --cached --quiet; then echo "No verified originals recovered"; exit 0; fi
          git commit -m "research(sacred art): archive verified Breviarium W1 Commons originals and native QA"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
