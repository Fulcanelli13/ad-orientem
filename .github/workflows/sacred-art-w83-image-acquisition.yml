name: Sacred Art W83 Researched Images
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - tools/calendar/acquire-sacred-art-w83-researched.py
      - .github/workflows/sacred-art-w83-image-acquisition.yml
permissions:
  contents: read
jobs:
  source-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - name: Download exact-object source files, validate pixels and SHA
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w83-researched.py
          python tools/calendar/acquire-sacred-art-w83-researched.py
      - name: Archive uncropped review photos, original bytes and source ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w83-researched-source-images
          path: |
            artifacts/sacred-art-w83-image-acquisition/
            docs/research/review-galleries/acquired/
          retention-days: 30
          if-no-files-found: warn
