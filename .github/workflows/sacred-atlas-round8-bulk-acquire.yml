name: Sacred Atlas Round 8 source-verified bulk acquisition
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round8-bulk-38-cover-manifest-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round8-bulk-38-covers.py'
      - '.github/workflows/sacred-atlas-round8-bulk-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-locked-original-covers:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round08-bulk-38-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install Pillow==11.3.0
      - name: Validate exact originals and acquire 38 preapproved covers in bounded partitions
        run: python tools/atlas/acquire-sacred-atlas-round8-bulk-38-covers.py
      - name: Commit only source-verified WebP binaries, canonical cover registry, and held-source evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-media/ data/geography/research/sacred-atlas-round8-bulk-38-cover-evidence-20261103.v1.json)" ]; then
            echo "No verified new covers"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/ \
            data/geography/approved-place-media.v1.json \
            data/geography/research/sacred-atlas-round8-bulk-38-cover-evidence-20261103.v1.json
          git commit -m "assets(atlas): source-verified bulk Round 8 Place covers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
