name: B23 P2 three exact Commons-source image retrievals
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-b23-p2-commons3.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-b23-p2-commons-throttled
  cancel-in-progress: false
jobs:
  metadata-gated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Verify exact three candidates, throttle and gate each image by source licence
        run: |
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('data/research/sacred-art-b23-p2-commons3.manifest.json').read_text())
          assert len(m['records'])==3
          assert len({r['record_id'] for r in m['records']})==3
          assert all(r['api_type']=='commons' and r['download_gate']=='METADATA_FIRST' for r in m['records'])
          PY
          python scripts/research/sacred_art_acquire.py \
            --manifest data/research/sacred-art-b23-p2-commons3.manifest.json \
            --output artifacts/b23-p2-commons3 \
            --max-files 3 \
            --max-bytes 85000000 \
            --prior-audit data/research/no-prior-b23p2.csv
      - name: Retain source evidence temporarily (no app publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-b23-p2-three-commons-originals-and-audit
          path: artifacts/b23-p2-commons3/
          retention-days: 7
          if-no-files-found: warn
      - name: P0 gate - archive unchanged acquisition files in an unpublished GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_release_archive_gate.py --wave b23p2 --source-dir artifacts/b23-p2-commons3
      - name: Preserve outcome audit regardless of eligibility or HTTP 429
        if: success()
        run: |
          cp artifacts/b23-p2-commons3/Acquisition_results.csv data/research/sacred-art-b23-p2-commons3.audit.csv
          cp artifacts/b23-p2-commons3/Acquisition_summary.json data/research/sacred-art-b23-p2-commons3.audit-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b23-p2-commons3.audit.csv data/research/sacred-art-b23-p2-commons3.audit-summary.json
          git commit -m 'research: preserve three Commons source licence, hash and 429 statuses'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
