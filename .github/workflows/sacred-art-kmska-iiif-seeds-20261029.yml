name: Sacred Art — KMSKA exact IIIF painting image evidence
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - .github/workflows/sacred-art-kmska-iiif-seeds-20261029.yml
      - scripts/art/sacred-art-kmska-source-manifest-probe-20261029.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/art/sacred-art-kmska-source-manifest-probe-20261029.py
          python scripts/art/sacred-art-kmska-source-manifest-probe-20261029.py
      - name: Save exact source and rights results
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/calendar/sacred-art-kmska-verified-sacred-manifest-probe-20261029.v1.json'))
          assert len(d['records'])==3 and d['imageDownloads']==0
          print([(x['inventory'],x['manifestRightsVerified']) for x in d['records']])
          PY
          git config user.name "Ad Orientem art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-kmska-verified-sacred-manifest-probe-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): archive rights evidence for three KMSKA sacred paintings"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
