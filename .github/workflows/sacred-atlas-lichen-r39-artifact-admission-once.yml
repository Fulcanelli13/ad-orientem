name: Sacred Atlas Licheń R39 — admit one previously verified photo (one shot)
# Restricted workflow-path-bound PR open/change transport from existing GitHub artifact.
# A first run caught obsolete R29 test; this update is one correction rerun only.
# Asset/registry-only bot commit does not retrigger because the file path filter is fixed.
# No network photography download; only owned GitHub artifact.
# TEMPORARY: MUST remove this workflow from the PR before main merge.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/sacred-atlas-lichen-r39-artifact-admission-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  source-locked-lichen-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/sacred-atlas-lichen-first-cover-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Recover only stored, already SHA-verified Licheń original from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ao-r39-source
          gh run download 41991685670 --repo Fulcanelli13/ad-orientem --name sacred-atlas-r37-first-frozen-photo-diagnostic --dir /tmp/ao-r39-source
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          root=Path('/tmp/ao-r39-source/originals')
          chosen=root/'8b0763b7f61a150002a67fb922ee73313ff866f4.jpg'
          if not chosen.is_file():raise SystemExit('STOP_EXACT_ORIGINAL_NOT_PRESENT')
          b=chosen.read_bytes()
          assert len(b)==6685696 and sha1(b).hexdigest()=='8b0763b7f61a150002a67fb922ee73313ff866f4', 'SOURCE_LOCK_MISMATCH'
          assert len(list(root.glob('*.jpg')))==1, 'UNEXPECTED_EXTRA_SOURCE_FILES'
          print('R39 exact original byte lock PASS',len(b))
          PY
      - name: Stage only fully documented source — existing R29 release gates
        run: |
          set -euo pipefail
          python tests/sacred-atlas-r29-mpo-byte-stage-test.py
          python tools/atlas/stage-sacred-atlas-r29-owner-selected-originals.py \
            --source-dir /tmp/ao-r39-source/originals \
            --output-dir /tmp/ao-r39-previews \
            --apply
      - name: Check frozen owner selections, precise source and publication invariant
        run: |
          set -euo pipefail
          node tests/sacred-atlas-r28-owner-approved19-source-contract.mjs
          node tests/sacred-atlas-r29-exact-offline-release-contract.mjs
          node tests/sacred-atlas-r30-all19-commons-source-page-contract.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          media=json.loads(Path('data/geography/approved-place-media.v1.json').read_text())
          assert len(media['items'])==380, 'WRONG_NUMBER_OF_APPROVED_COVERS'
          rec=next(x for x in media['items'] if x['place_id']=='place:PL:lichen-marian-basilica')
          assert rec['source_sha1']=='8b0763b7f61a150002a67fb922ee73313ff866f4'
          assert rec['credit']=='Bialo-zielony' and rec['license']=='CC-BY-SA-3.0'
          assert rec['asset_path'].startswith('assets/approved/place-media/pf-')
          b=Path(rec['asset_path']).read_bytes()
          assert hashlib.sha256(b).hexdigest()==rec['derivative_sha256']
          assert b.startswith(b'RIFF') and b[8:12]==b'WEBP'
          print('R39 exactly 1 licensed cover, attribution, derivative and SHA-256 PASS')
          PY
      - name: Commit only the newly admitted cover and canonical register to PR branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          media=json.loads(Path('data/geography/approved-place-media.v1.json').read_text())
          row=next(x for x in media['items'] if x['place_id']=='place:PL:lichen-marian-basilica')
          Path('/tmp/ao-r39-asset-path.txt').write_text(row['asset_path'])
          PY
          asset="$(cat /tmp/ao-r39-asset-path.txt)"
          git add -- data/geography/approved-place-media.v1.json "$asset"
          git diff --cached --quiet && { echo "No verified photo changes found" >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(atlas): admit verified Licheń first-choice photo with full credit'
          git push origin HEAD:refs/heads/release/sacred-atlas-lichen-first-cover-20261105
