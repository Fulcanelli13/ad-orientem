name: Sacred Art NGA 126 official object data reconcile (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-nga126-official-opendata-20261029.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-nga126-official-reconcile
  cancel-in-progress: false

jobs:
  reconcile-nga-object-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm frozen editorial and artwork identity gates
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Acquire official free NGA CC0 metadata without storing source CSV in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nga-20261029"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
            "https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects.csv" \
            -o "$RUNNER_TEMP/nga-20261029/objects.csv"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
            "https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/object_associations.csv" \
            -o "$RUNNER_TEMP/nga-20261029/object_associations.csv"
          wc -c "$RUNNER_TEMP/nga-20261029/"*.csv
      - name: Reconcile all 126 object IDs and accessions to official NGA dataset
        shell: bash
        run: |
          set -euo pipefail
          node scripts/art/reconcile-nga-opendata-126-20261029.mjs \
            --objects="$RUNNER_TEMP/nga-20261029/objects.csv" \
            --associations="$RUNNER_TEMP/nga-20261029/object_associations.csv" \
            --output="data/calendar/sacred-art-phase1-nga126-official-csv-report-20261029.v1.json"
      - name: Require every result to preserve original review and unreleased status
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const path='data/calendar/sacred-art-phase1-nga126-official-csv-report-20261029.v1.json';
          const r=JSON.parse(readFileSync(path,'utf8'));
          if(r.rows.length!==126 || r.counts.frozenNgaSourceCards!==126 || r.counts.productionImports!==0 ||
            r.rows.some(x=>x.sourcePhotoCertified || x.photoRightsCertified || x.nativeVisualCertified ||
              x.countedAsNewDistinctPhysicalPainting || x.productionMutation || x.matchedToCanonical383)) {
            throw Error('NGA report violates frozen source count or no-release gates');
          }
          console.log(JSON.stringify(r.counts,null,2));
          NODE
      - name: Permanently commit only compact verified source-identity report to draft research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-nga126-official-csv-report-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Research report unchanged"
            exit 0
          fi
          git commit -m "research(sacred-art): preserve exact NGA Open Data object and accession audit [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
