name: Sacred art — selected Commons source evidence
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - "tools/calendar/acquire-selected-commons-evidence.py"
      - "data/calendar/sacred-art-user-235-subject-decisions-20261012.v1.json"
      - "data/calendar/sacred-art-masterpiece-selected-source-triage-20261012.v1.json"
      - ".github/workflows/sacred-art-selected-commons-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire-private-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - name: Wikimedia API original-file metadata and hash check
        run: |
          python -m py_compile tools/calendar/acquire-selected-commons-evidence.py
          python tools/calendar/acquire-selected-commons-evidence.py
      - name: Verify art source SHA and no release promotion
        if: always()
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('artifacts/sacred-art-commons-evidence')
          if not (p/'report.json').exists(): raise SystemExit('No image source report')
          j=json.loads((p/'report.json').read_text())
          assert j['summary']['requested']==3
          assert j['summary']['published']==0
          for r in j['results']:
              assert not r['publicationApproved']
              assert not r['cropApproved']
              assert not r['commerceRightsCleared']
              if r['status']!='COMMONS_ORIGINAL_ACQUIRED_FOR_REVIEW':continue
              img=(p/r['imageFilename']).read_bytes()
              assert hashlib.sha256(img).hexdigest()==r['sha256']
              assert hashlib.sha1(img).hexdigest()==r['sha1']
              assert (p/r['previewFilename']).is_file()
              assert r['licensingGate']=='PD_ART_CROSS_JURISDICTION_AND_SOURCE_PHOTO_REVIEW_PENDING'
          print('PASS Commons source-byte provenance and license holds')
          PY
      - name: Preserve source-only downloads, rights and inspection record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-commons-12oct-originals-license-hold
          path: artifacts/sacred-art-commons-evidence/
          retention-days: 30
          if-no-files-found: warn
