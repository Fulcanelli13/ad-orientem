name: Schola selected 1962 calendar-year Proper match

on:
  pull_request:
    paths:
      - 'scripts/schola/build-2026-selected-repertoire.mjs'
      - 'scripts/mass/audit-2026-april-paschal-trilingual.mjs'
      - 'src/mass/1962-april-paschal-archival-witnesses.js'
      - 'src/mass/1962-april-paschal-proper-correction.js'
      - 'src/mass/reader-proper-runtime-recovery.js'
      - 'src/mass/proper-reader-slots.js'
      - 'tests/mass-1962-april-paschal-three-source-regression.mjs'
      - 'data/research/schola-2026-april-1962-vatican-page-image-evidence.v1.json'
      - 'src/mass/reader-schola-selected-queue-crosswalk.js'
      - 'src/mass/reader-schola-selected-full-source-crosswalk.js'
      - 'src/mass/reader-schola-selected-pregospel-review.js'
      - 'scripts/schola/build-2026-selected-pregospel-queue.mjs'
      - 'tests/reader-schola-selected-pregospel-review.mjs'
      - 'src/mass/reader-schola-2026-release-worklist.js'
      - 'scripts/schola/build-2026-score-publication-worklist.mjs'
      - 'tests/reader-schola-2026-release-worklist.mjs'
      - 'src/mass/1962-plural-martyr-french-source.js'
      - 'tests/1962-perpetua-felicity-english-named-source-regression.mjs'
      - 'scripts/schola/reconcile-2026-completion-exceptions.mjs'
      - 'tests/schola-2026-completion-source-exceptions.mjs'
      - 'scripts/schola/build-2026-five-pinned-source-gap-dispositions.mjs'
      - 'tests/schola-2026-five-pinned-source-gap-dispositions.mjs'
      - 'data/research/schola-2026-five-pinned-source-gap-evidence.v1.json'
      - 'data/research/schola-2026-five-source-liturgical-family-corroboration.v1.json'
      - 'tests/schola-2026-five-source-liturgical-family-corroboration.mjs'
      - 'data/research/schola-2026-five-family-section-inheritance.v1.json'
      - 'tests/schola-2026-five-family-section-inheritance.mjs'
      - 'scripts/schola/group-2026-pregospel-source-owner-holds.mjs'
      - 'tests/schola-2026-pregospel-source-owner-groups.mjs'
      - 'data/research/schola-2026-seven-common-historical-section-evidence.v1.json'
      - 'scripts/schola/build-2026-seven-common-ember-review.mjs'
      - 'tests/schola-2026-seven-common-ember-review.mjs'
      - 'data/research/schola-2026-27-selected-variant-owner-candidates.v1.json'
      - 'data/research/schola-2026-july07-original-1962-1961-printed-identity.v1.json'
      - 'tests/schola-2026-july07-original-source-identity.mjs'
      - 'scripts/schola/reconcile-2026-27-variant-source-candidates.mjs'
      - 'tests/schola-2026-27-variant-owner-candidates.mjs'
      - 'src/mass/reader-proper-first60-print-review.js'
      - 'scripts/schola/build-2026-proper-first60-print-review.mjs'
      - 'tests/reader-proper-first60-print-review.mjs'
      - 'src/mass/reader-proper-first60-antiphon-text.js'
      - 'scripts/schola/build-2026-first60-antiphon-text-gate.mjs'
      - 'tests/reader-proper-first60-antiphon-text.mjs'
      - 'src/mass/reader-proper-introit-full-sung-latin.js'
      - 'tests/reader-proper-introit-full-sung-latin.mjs'
      - 'src/mass/reader-proper-first60-print-proof-gate.js'
      - 'scripts/schola/build-2026-first51-print-proof-gate.mjs'
      - 'tests/reader-proper-first60-print-proof-gate.mjs'
      - 'src/mass/reader-proper-first12-1961-facsimile-locators.js'
      - 'tests/reader-proper-first12-facsimile-locators.mjs'
      - 'tests/schola-2026-pinned-review-queue-lock.mjs'
      - 'data/research/schola-2026-pinned-selected-mass-review-lock.v1.json'
      - 'tests/reader-proper-first60-collation-workbench.mjs'
      - 'tools/mass/proper-1961-first60-collation.html'
      - 'tests/reader-schola-selected-full-source-crosswalk.mjs'
      - 'scripts/schola/build-1962-full-coverage.mjs'
      - 'tests/reader-schola-selected-queue-crosswalk.mjs'
      - 'data/research/mass-music-1962-91-inline-review-queue.v1.json'
      - '.github/workflows/schola-selected-1962-annual-join.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-year:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Guard original 1961 GABC archive and source-first match semantics
        run: |
          node tests/reader-proper-gabc-bulk-join.mjs
          node tests/reader-schola-selected-queue-crosswalk.mjs
          node tests/reader-schola-selected-full-source-crosswalk.mjs
          node tests/reader-schola-selected-pregospel-review.mjs
          node tests/1962-perpetua-felicity-english-named-source-regression.mjs
          node tests/reader-schola-2026-release-worklist.mjs
          node tests/reader-schola-pre-gospel-source-boundary.mjs
          node tests/reader-inline-chant-bulk-91-source-queue.mjs
      - name: Reuse the SHA-authenticated full 1962 Latin source cache
        uses: actions/cache@v4
        with:
          path: .cache/schola-pinned-1962/
          key: schola-1962-ad8783641455bae38a8eb5782b34241a7b3ff2ef-v1
      - name: Rebuild and verify 1049 pinned Latin source-to-GABC matches
        run: node scripts/schola/build-1962-full-coverage.mjs
      - name: Audit exact 13-14-29 April Paschal LIVE source texts and adjacent dates (LAT EN FR)
        run: |
          node scripts/mass/audit-2026-april-paschal-trilingual.mjs
          node tests/mass-1962-april-paschal-three-source-regression.mjs
      - name: Capture real 2026 selected Mass of day and join all 1049 source witnesses
        run: node scripts/schola/build-2026-selected-repertoire.mjs
      - name: Review actual selected pre-Gospel scores against cached immutable Latin sources
        run: node scripts/schola/build-2026-selected-pregospel-queue.mjs
      - name: Source-preserving editorial workbench and syntax acceptance
        run: node tests/reader-proper-first60-collation-workbench.mjs
      - name: Generate first 60 source-backed Proper print-collation candidates
        run: node scripts/schola/build-2026-proper-first60-print-review.mjs
      - name: Verify review-only publication boundary
        run: node tests/reader-proper-first60-print-review.mjs
      - name: Compare entire first-60 GABC antiphon text against 1962 selected Latin (no music approval)
        run: |
          node scripts/schola/build-2026-first60-antiphon-text-gate.mjs
          node tests/reader-proper-first60-antiphon-text.mjs
      - name: Guard complete Introit sung words against GABC shorthand and missing doxologies
        run: node tests/reader-proper-introit-full-sung-latin.mjs
      - name: Audit printed-score proof and produce first 12 source-folio review priorities
        run: |
          node scripts/schola/build-2026-first51-print-proof-gate.mjs
          node tests/reader-proper-first60-print-proof-gate.mjs
      - name: Confirm original printed 1961 facsimiles for first 12 reviewed scores
        run: node tests/reader-proper-first12-facsimile-locators.mjs
      - name: Lock 365 pinned selected Mass identities and stable source-reviewed first60 priorities
        run: node tests/schola-2026-pinned-review-queue-lock.mjs
      - name: Build consolidated 2026 worklist and 24 pre-Gospel print-review leads
        run: node scripts/schola/build-2026-score-publication-worklist.mjs
      - name: Reconcile closeout exceptions from existing annual evidence, with no acquisition or publication
        run: |
          node scripts/schola/reconcile-2026-completion-exceptions.mjs
          node tests/schola-2026-completion-source-exceptions.mjs
      - name: Reconcile five absent pinned Latin source families against original archival tree (15 real 2026 dates)
        run: |
          node scripts/schola/build-2026-five-pinned-source-gap-dispositions.mjs
          node tests/schola-2026-five-pinned-source-gap-dispositions.mjs
          node tests/schola-2026-five-source-liturgical-family-corroboration.mjs
          node tests/schola-2026-five-family-section-inheritance.mjs
      - name: Group 128 dated pre-Gospel ownership holds by original authenticated section donor
        run: |
          node scripts/schola/group-2026-pregospel-source-owner-holds.mjs
          node tests/schola-2026-pregospel-source-owner-groups.mjs
      - name: Adjudicate seven historical Commons and distinct Pentecost Ember source roles (research only)
        run: |
          node scripts/schola/build-2026-seven-common-ember-review.mjs
          node tests/schola-2026-seven-common-ember-review.mjs
      - name: Cross-examine 27 selected historical-Common differences with dated Latin and external source holds
        run: |
          node scripts/schola/reconcile-2026-27-variant-source-candidates.mjs
          node tests/schola-2026-27-variant-owner-candidates.mjs
      - name: Guard original 7 July 1962 Missal and 1961 Graduale source roles (research only)
        run: node tests/schola-2026-july07-original-source-identity.mjs
      - name: Upload original 60 Proper and additional 24 pre-Gospel review packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schola-2026-actual-selected-proper-gabc
          path: .tmp/schola-1962-selected-annual/
          if-no-files-found: warn
          retention-days: 30

  paschal-april-fast-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture exact 2026 Paschal saint-day source texts and adjoining controls
        run: |
          node scripts/mass/audit-2026-april-paschal-trilingual.mjs
          node tests/mass-1962-april-paschal-three-source-regression.mjs
      - name: Upload seven-day LAT EN FR native DayResolver original witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-2026-april-original-paschal-selected-source
          path: .tmp/mass-april-1962/trilingual-dayresolver-snapshots.json
          if-no-files-found: warn
          retention-days: 14
