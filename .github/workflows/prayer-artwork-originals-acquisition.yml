name: Prayer first-batch photo originals (research only)
on:
  push:
    branches:
      - research/prayer-artwork-approved-reuse-wave1-20261031
    paths:
      - .github/workflows/prayer-artwork-originals-acquisition.yml
      - scripts/art/acquire-prayer-originals-batch01.py
      - data/prayer/artwork-editorial-20261101/commons-originals-batch01-20261101.v1.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prayer-artwork-originals-batch01
  cancel-in-progress: true

jobs:
  archive-unapproved-originals:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-approved-reuse-wave1-20261031
          persist-credentials: true
      - name: Archive exact Wikimedia source originals (no release)
        id: acquire
        continue-on-error: true
        run: |
          python3 scripts/art/acquire-prayer-originals-batch01.py --download --limit 12
      - name: Prove Prayer public release manifest remains unchanged
        run: |
          node --input-type=module - <<'JS'
          import {PRAYER_RELEASED_IMAGE_ASSETS_V1} from './src/pray/artwork-release-runtime.js';
          if (Object.keys(PRAYER_RELEASED_IMAGE_ASSETS_V1).length) throw new Error('Source acquisition must not publish Prayer images');
          JS
      - name: Preserve verified original bytes and rights metadata on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prayer/artwork-editorial-20261101/commons-originals-batch01-acquisition-results.v1.json
          if test -d assets/staged/prayer-artwork-originals-20261101; then
            git add -- assets/staged/prayer-artwork-originals-20261101
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'research(prayer-art): archive checksum-verified Wikimedia originals without publication'
            git push origin HEAD:refs/heads/research/prayer-artwork-approved-reuse-wave1-20261031
          fi
      - name: Publish temporary recovery copy (not canonical storage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-art-source-acquisition-b01
          path: |
            data/prayer/artwork-editorial-20261101/commons-originals-batch01-acquisition-results.v1.json
          retention-days: 1
          if-no-files-found: warn
      - name: Report acquisition errors accurately
        if: steps.acquire.outcome == 'failure'
        run: |
          echo 'Acquisition source errors were recorded; no source has been promoted to production.'
          exit 1
