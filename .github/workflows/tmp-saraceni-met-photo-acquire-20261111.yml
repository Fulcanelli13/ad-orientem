name: Temporary exact Saraceni MET 1971.93 source acquisition
on:
  push:
    branches:
      - feat/sacred-art-class-i-saraceni-20261111
    paths:
      - '.github/workflows/tmp-saraceni-met-photo-acquire-20261111.yml'
permissions:
  contents: write
jobs:
  acquire-exact-met-cc0-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact preserved Commons Met CC0 source and verify original bytes
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          import os,hashlib,json,urllib.request
          from pathlib import Path
          from PIL import Image
          path=Path("assets/home/class-i-2026/saraceni-paradise-met-1971-93-original.jpg")
          proof=Path("data/artwork/releases/2026-11-01-saraceni-met-cc0-byte-proof.v1.json")
          url="https://upload.wikimedia.org/wikipedia/commons/b/b2/Paradise_MET_DT1448.jpg"
          req=urllib.request.Request(url,headers={"User-Agent":"AdOrientemArtSourceAudit/1.0 (source provenance verification)"})
          with urllib.request.urlopen(req,timeout=80) as f:
              assert f.status==200 and f.headers.get("content-type","").lower().startswith("image/jpeg")
              contents=f.read(5_000_000)
          assert len(contents)==2879956,(len(contents),"expected source byte size")
          digest=hashlib.sha1(contents).hexdigest()
          assert digest=="93deaea4c939effc7e1668ce52ea7e079c352600",digest
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(contents)
          with Image.open(path) as im:
              im.verify()
          with Image.open(path) as im:
              assert im.size==(3273,3695),im.size
          assert contents[:2]==b"\\xff\\xd8" and contents[-2:]==b"\\xff\\xd9"
          proof.parent.mkdir(parents=True,exist_ok=True)
          metadata={
            "schema":"AO_CLASS_I_SARACENI_MET_CC0_EXACT_SOURCE_BYTES_V1",
            "date":"2026-11-01","principalId":"sancti:11-01:1:w","properPath":"Sancti/11-01",
            "selectedTitle":"Paradise","selectedArtist":"Carlo Saraceni",
            "museum":"Metropolitan Museum of Art","accession":"1971.93","metObjectId":437607,
            "museumObjectUrl":"https://www.metmuseum.org/art/collection/search/437607",
            "commonsFilePage":"https://commons.wikimedia.org/wiki/File:Paradise_MET_DT1448.jpg",
            "sourceImageUrl":url,
            "licence":"Met Open Access CC0 via Met-origin Wikimedia Commons donated file",
            "photoSourceOriginalSha1":digest,
            "photoSourceOriginalSha256":hashlib.sha256(contents).hexdigest(),
            "sourceBytes":len(contents),"sourceDimensions":[3273,3695],
            "publishedAsset":str(path),"publishedUnmodifiedOriginal":True,
            "newArtworkSelection":False,"ownerCropApprovalCreated":False
          }
          proof.write_text(json.dumps(metadata,indent=2,ensure_ascii=False)+"\\n",encoding="utf8")
          print(json.dumps(metadata,sort_keys=True))
          PY
      - name: Commit verified source JPEG only on isolated feature branch
        shell: bash
        run: |
          set -eu
          git config user.name 'ad-orientem-source-acquisition[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/home/class-i-2026/saraceni-paradise-met-1971-93-original.jpg data/artwork/releases/2026-11-01-saraceni-met-cc0-byte-proof.v1.json
          git diff --cached --quiet && exit 1
          git commit -m 'Acquire byte-verified Met CC0 Paradise original for frozen All Saints painting'
          git push origin HEAD:feat/sacred-art-class-i-saraceni-20261111
