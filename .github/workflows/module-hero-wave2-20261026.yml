name: Module hero wave 2 preserved originals (read-only)
# Archived source bytes live permanently on their named research branch.
# Default-branch CI is deliberately read-only; new acquisition belongs to
# separate reviewed research commits, never to this production workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read permanently preserved, unapproved research originals
        uses: actions/checkout@v4
        with:
          ref: research/module-hero-wave2-20261026
          path: art-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Verify original image bytes, source SHA-256 and existing preview evidence
        run: |
          python scripts/art/verify-research-archive-readonly.py \
            --archive-root art-research \
            --source-prefix assets/staged/module-hero-wave2 \
            --min-originals 6 \
            --report data/research/module-hero-acquisition-wave2-20261026.json \
            --check-previews
      - name: Never treat source research as publication permission
        run: echo "Original photographs preserved at no added storage cost; all visual, licence, frame/crop and app release approvals remain on hold."
