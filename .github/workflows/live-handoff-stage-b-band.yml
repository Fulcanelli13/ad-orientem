name: LIVE handoff Stage B visual band shell

on:
  pull_request:
    paths:
      - 'src/mass/reader-live-handoff-band.js'
      - 'src/mass/reader-live-handoff-source-crosswalk.js'
      - 'src/mass/reader-live-handoff-geometry.js'
      - 'src/mass/browser-entry.js'
      - 'tests/reader-live-handoff-band-shell.mjs'
      - '.github/workflows/live-handoff-stage-b-band.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source-gated band and native entry
        run: |
          node --check src/mass/reader-live-handoff-band.js
          node --check src/mass/browser-entry.js
          node --check tests/reader-live-handoff-band-shell.mjs
      - name: Run shell, source-drift, 1962 geometry and rail immutability tests
        run: |
          node --test tests/reader-live-handoff-band-shell.mjs
          node tests/reader-live-handoff-final-geometry.mjs
