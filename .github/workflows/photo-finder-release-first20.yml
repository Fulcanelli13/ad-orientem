name: Photo Finder one-shot verified 20-cover release branch
on:
  push:
    branches:
      - 'research/photo-finder-release-20261030-*'
    paths:
      - 'data/geography/research/photo-finder-20261030/.release-first20'
permissions:
  contents: write
concurrency:
  group: ao-photo-finder-first20-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified-first20-covers:
    if: github.repository == 'Fulcanelli13/ad-orientem' && github.ref == 'refs/heads/research/photo-finder-release-20261030-b1'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check explicit one-shot request and guarded repository
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/photo-finder-release-20261030-b1'
          test "$(cat data/geography/research/photo-finder-20261030/.release-first20)" = 'VERIFY_AND_COMMIT_FIRST_20_SELECTED_COVERS_ONLY_2026-10-30'
          node tests/production-tree-hygiene.mjs
          python tests/photo-finder-451-intake-test.py -v
          python tools/directory/release-photo-finder-decisions.py --plan
      - name: Install verified image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Verify Commons originals and stage exact selected first 20 covers
        run: |
          set -euo pipefail
          python tools/directory/release-photo-finder-decisions.py \
            --role cover --offset 0 --limit 20 \
            --output-dir /tmp/ao-photo-finder-first20 \
            --apply
          python - <<'PY'
          import json
          a=json.load(open('/tmp/ao-photo-finder-first20/verification-report.json'))
          assert a['schema']=='AO_FINDER_SELECTED_PHOTO_STAGE_V1'
          assert a['status']=='APP_FILES_UPDATED'
          assert a['attempted']==20
          assert 1<=a['verified']<=20, 'Zero verified originals; do not push a research-only release'
          assert a['new_files_in_app_tree']==a['verified']
          for r in a['media_records']:
              p=r['item']
              assert p['status']=='APPROVED'
              assert p['rights_verified'] and p['subject_verified'] and p['crop_reviewed']
              assert p['asset_path'].startswith('assets/approved/place-media/pf-')
              assert r['rank']==1
          print('PUBLISHABLE_VERIFIED_ASSETS',a['verified'],'HOLDS',len(a['exceptions']))
          PY
      - name: Commit only verified WebPs and existing canonical approved-cover registry
        run: |
          set -euo pipefail
          git config user.name 'Ad Orientem photo release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/geography/approved-place-media.v1.json
          git add -- assets/approved/place-media/pf-*.webp
          python - <<'PY'
          import json,subprocess
          a=json.load(open('/tmp/ao-photo-finder-first20/verification-report.json'))
          expected={'data/geography/approved-place-media.v1.json'}
          expected|={r['item']['asset_path'] for r in a['media_records']}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged==expected,(sorted(staged),sorted(expected))
          print('COMMIT_VERIFIED_PATHS',len(staged))
          PY
          git diff --cached --check
          git commit -m "Geography: release first checksum-verified Photo Finder covers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
