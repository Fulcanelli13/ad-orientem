jobs:
  bulk-site-spatial-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate original CL2 through CL7 and source chain
        run: |
          python3 tools/directory/validate-cl3-reconciliation.py
          python3 tools/directory/validate-cl4-owner-screening.py
          python3 tools/directory/validate-cl5-provisional-intake.py
          python3 tools/directory/validate-cl6-source-reconciliation.py
          python3 tools/directory/validate-cl7-final-gaps.py
      - name: Rebuild source-evidence database from CL2 through CL23
        run: |
          python3 tools/directory/rebuild-cl7-research-index.py --output /tmp/ao-cl23.sqlite
          python3 tools/directory/audit-cl-completeness.py --db /tmp/ao-cl23.sqlite --output-dir /tmp/ao-cl8
          python3 tools/directory/audit-cl9-owner-evidence.py --db /tmp/ao-cl23.sqlite --cl8-csv /tmp/ao-cl8/missal_1962_reconciliation.csv --out-dir /tmp/ao-cl9
          python3 tools/directory/adjudicate-cl10-missal-evidence.py --db /tmp/ao-cl23.sqlite --cl9-csv /tmp/ao-cl9/cl9_432_mass_candidates.csv --out-dir /tmp/ao-cl10
          python3 tools/directory/reconcile-cl11-owner-sources.py --db /tmp/ao-cl23.sqlite --cl9-csv /tmp/ao-cl9/cl9_432_mass_candidates.csv --out-dir /tmp/ao-cl11
          python3 tools/directory/reconcile-cl12-singletons.py --db /tmp/ao-cl23.sqlite --cl9-csv /tmp/ao-cl9/cl9_432_mass_candidates.csv --out-dir /tmp/ao-cl12
          python3 tools/directory/reconcile-cl13-remaining-1962.py --db /tmp/ao-cl23.sqlite --cl9-csv /tmp/ao-cl9/cl9_432_mass_candidates.csv --out-dir /tmp/ao-cl13
          python3 tools/directory/reconcile-cl14-fssp-owner-site-evidence.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl14
          python3 tools/directory/triage-cl15-1962-holds.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl15
          python3 tools/directory/reconcile-cl16-priority-one.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl16
          python3 tools/directory/reconcile-cl17-release-gates.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl17
          python3 tools/directory/reconcile-cl18-calendar-address.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl18
          python3 tools/directory/reconcile-cl19-remaining-site-sources.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl19
          python3 tools/directory/reconcile-cl20-geospatial-candidates.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl20
          python3 tools/directory/reconcile-cl21-entrance-evidence.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl21
          python3 tools/directory/reconcile-cl22-correct-chapel.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl22
          python3 tools/directory/reconcile-cl23-full-spatial-screen.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl23
          python3 tools/directory/reconcile-cl24-site-exceptions.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl24
          python3 tools/directory/reconcile-cl25-seven-spatial-exceptions.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl25
          python3 tools/directory/reconcile-cl26-final-geo-and-dated-external.py --db /tmp/ao-cl23.sqlite --out-dir /tmp/ao-cl26
