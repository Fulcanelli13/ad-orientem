          assert db.execute('SELECT COUNT(*) FROM cl21_entrance_evidence WHERE actual_door_gps_approved=1 OR public_pin_approved=1').fetchone()[0]==0
          j22=json.loads(Path('/tmp/ao-cl22/cl22_summary.json').read_text())
          assert j22['source_place_ids_reconciled']==2
          assert j22['new_potsdam_correct_chapel_osm_building_way']==301020129
          assert j22['excluded_wrong_potsdam_quiet_chapel_way']==31290074
          assert 15<j22['distance_between_distinct_chapel_building_references_m']<25
