name: Explore P68 rights and object-photo binding checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/approved-sacred-object-acquisition-p68.v1.json'
      - 'tools/acquire-sacred-object-photos-p68.py'
      - 'src/find/place-profiles.js'
      - 'src/find/place-editorial-presentation.js'
      - 'src/find/heritage-style.js'
      - 'tests/explore-p68-sacred-object-photo-binding.mjs'
      - '.github/workflows/explore-p68-approved-object-photos.yml'
permissions:
  contents: read
jobs:
  binding-and-editorial-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline exact object, photographer and licence-manifest gates
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/acquire-sacred-object-photos-p68.py --check-manifest
          node tests/explore-p68-sacred-object-photo-binding.mjs
      - name: Existing source-owned Place regressions
        run: |
          node tests/explore-p67-relic-indoor-placement.mjs
          node tests/explore-p66-editorial-relic-cards.mjs
          node tests/explore-r69-multi-place-gallery.mjs

