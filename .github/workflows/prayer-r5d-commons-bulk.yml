name: Prayer R5D Commons 20-work research acquisition
on:
  pull_request:
    paths:
      - scripts/prayer-r5d-commons-bulk-acquire.py
      - .github/workflows/prayer-r5d-commons-bulk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    name: Commons research batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        batch: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Acquire and audit ten approved Commons objects
        run: python scripts/prayer-r5d-commons-bulk-acquire.py ${{ matrix.batch }}
      - name: Preserve source evidence (not publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-r5d-commons-${{ matrix.batch }}
          path: r5d-commons-${{ matrix.batch }}/
          retention-days: 14
          if-no-files-found: error
