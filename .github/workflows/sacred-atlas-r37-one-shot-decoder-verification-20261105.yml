name: Sacred Atlas R37 — one-time JPEG/MPO source verification (no publication)
# One opening event only. No push/synchronize/reopen/schedule/dispatch.
# Temporary research workflow: remove before merging decoder fix.
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/sacred-atlas-r37-one-shot-decoder-verification-20261105.yml'

permissions:
  contents: read

jobs:
  decoder-and-one-source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/sacred-atlas-r35-jpeg-mpo-and-failclosed-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Run offline synthetic decoder/hash/429/failure-gate tests
        run: |
          python -m py_compile tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py
          python tests/sacred-atlas-r35-manual-original-retention-test.py
      - name: Single original source attempt — no retries, mirrors or publication
        run: |
          python tools/atlas/verify-sacred-atlas-r28-approved19-source-originals.py \
            --verify-originals --retain-verified-originals --start-index 0 --max-files 1
      - name: Upload source report and checksum verified original if any
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-atlas-r37-first-frozen-photo-diagnostic
          path: |
            /tmp/ao-sacred-atlas-owner-approved19/report.json
            /tmp/ao-sacred-atlas-owner-approved19/originals/*.jpg
            /tmp/ao-sacred-atlas-owner-approved19/previews/*.webp
          retention-days: 7
          if-no-files-found: warn
