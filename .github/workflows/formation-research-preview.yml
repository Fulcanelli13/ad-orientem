name: Formation research preview checks
on:
  pull_request:
    paths:
      - 'src/learn/catechism-guided-study.js'
      - 'src/learn/catechism-guided-reader.js'
      - 'tests/catechism-guided-study.mjs'
      - 'src/learn/formation-research-preview.js'
      - 'src/learn/formation-recovery-review.js'
      - 'tests/formation-recovery-review.mjs'
      - 'tests/formation-123-claim-gates.mjs'
      - 'tests/formation-master-inventory.mjs'
      - 'tests/learn-faith-54-recovery.mjs'
      - 'tests/learn-faith-certification-019-054.mjs'
      - 'tests/learn-faith-certification-001-018.mjs'
      - 'data/learn/learn-the-faith-certification-001-018.v1.json'
      - 'tests/learn-faith-55-course-reconciliation.mjs'
      - 'data/learn/learn-the-faith-55-proposed-reconciliation-2026-10-09.v1.json'
      - 'data/learn/learn-the-faith-certification-019-054.v1.json'
      - 'tests/learn-faith-54-citation-witnesses.mjs'
      - 'data/learn/ltfaith-pius-x-en-witness-index.v1.json'
      - 'data/learn/ltfaith-54-claim-citation-crosswalk.v1.json'
      - 'data/learn/learn-the-faith-recovered-54.v1.json'
      - 'docs/FORMATION-MASTER-INVENTORY-2026-10-09.md'
      - 'data/learn/content-ownership-registry.v1.json'
      - 'data/learn/formation-123-source-claim-gates-2026-10-09.v1.json'
      - 'src/learn/formation-research-preview-data.js'
      - 'src/learn/browser-entry.js'
      - 'tests/formation-research-preview.mjs'
      - 'tests/formation-forensic-recovery.mjs'
      - 'data/learn/forensic-recovery-register-2026-10-08.v1.json'
      - 'data/learn/formation-recoverable-research-ledger-2026-10-08.v1.json'
      - 'docs/FORMATION-FORENSIC-RECOVERY-2026-10-08.md'
      - 'docs/FORMATION-RECOVERABLE-RESEARCH-2026-10-08.md'
      - 'data/learn/biblical-patristic-answers.v1.json'
      - 'data/learn/contemporary-controversies-unassociated-source-map-2026-10-08.v1.json'
      - 'data/learn/contemporary-controversies-bulk-21-debates-2026-10-08.v1.json'
      - 'data/learn/contemporary-controversies-reconciliation.v1.json'
      - 'tests/contemporary-controversies-21-source-scaffold.mjs'
      - 'data/learn/baq-sdv-claim-provenance-audit-2026-10-08.v1.json'
      - 'tests/baq-sdv-source-attribution.mjs'
      - 'data/learn/sedevacantism-preconciliar-debates.v1.json'
      - 'data/learn/biblical-patristic-and-sedevacantist-question-supplement.v1.json'
      - 'data/learn/traditional-mass-objections-*.json'
      - 'data/learn/traditionis-custodes-debates.v1.json'
      - 'data/learn/church-crisis-canonical.v1.json'
      - 'data/learn/church-crisis-reconciliation.v1.json'
      - 'tests/traditional-mass-objections-reconciliation.mjs'
      - 'tests/traditionis-custodes-debates.mjs'
      - '.github/workflows/formation-research-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bilingual source-linked Formation preview
        run: node tests/formation-research-preview.mjs
      - name: Verify forensic A/C/TLM recovery holds and surviving 102 research records
        run: node tests/formation-forensic-recovery.mjs
      - name: Check gated Catechism guided-study data adapter and 433-question ownership
        run: node tests/catechism-guided-study.mjs
      - name: Check archival 54 to proposed 55 title and 433 distinct question-owner crosswalk
        run: node tests/learn-faith-55-course-reconciliation.mjs
      - name: Verify Learn the Faith lessons 1–18 and source distinctions
        run: node tests/learn-faith-certification-001-018.mjs
      - name: Verify Learn the Faith lessons 19–54, 122 sourced bilingual claims
        run: node tests/learn-faith-certification-019-054.mjs
      - name: Check source-first recovery review (102 research records)
        run: node tests/formation-recovery-review.mjs
      - name: Bulk-validate all 21 unresolved controversy source maps
        run: node tests/contemporary-controversies-21-source-scaffold.mjs
      - name: Verify all 123 source-claim audit gates without claiming certification
        run: node tests/formation-123-claim-gates.mjs
      - name: Reconcile all Formation owners and recoverable archived lesson branches
        run: node tests/formation-master-inventory.mjs
      - name: Verify all 54 archived Catechism lesson versions are preserved without new public routes
        run: node tests/learn-faith-54-recovery.mjs
      - name: Verify 433 pinned Catechism question locations and lesson-specific citation crosswalk
        run: node tests/learn-faith-54-citation-witnesses.mjs
      - name: Check Traditional Mass objections and canonical ownership
        run: node tests/traditional-mass-objections-reconciliation.mjs
      - name: Check 30 BAQ/SDV sources and opponent attribution
        run: node tests/baq-sdv-source-attribution.mjs
      - name: Check Traditionis custodes bilingual debate sources
        run: node tests/traditionis-custodes-debates.mjs
