  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-original-source-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical owner and unapproved source pack
        run: node tests/formation-canonical-synthesis-batch3.mjs
      - name: Check ten bounded primary disputes and all release holds
        run: node tests/formation-primary-context-review-4.mjs
      - name: Check thirteen additional original-opponent-context dossiers and all release holds
        run: node tests/formation-primary-context-review-5.mjs
      - name: Check 26 additional apologetics original-opponent passages and all release holds
        run: node tests/formation-primary-context-review-6.mjs
      - name: Check all 77 formerly unreviewed owners against original and opposing documents
        run: node tests/formation-primary-context-review-7.mjs
      - name: Reconcile all 141 Formation owners and 564 claim sections against six reviewer ledgers
        run: node tests/formation-141-claim-scope-matrix.mjs
  qa-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bilingual source-linked Formation preview
        run: node tests/formation-research-preview.mjs
      - name: Verify forensic A/C/TLM recovery holds and surviving 102 research records
        run: node tests/formation-forensic-recovery.mjs
      - name: Inspect legacy Catechism navigation hooks
        run: node tests/catechism-legacy-runtime-inspection.mjs
      - name: Check practical 181-claim release acceptance and seven bilingual corrections
        run: node tests/catechism-guided-practical-release-acceptance.mjs
      - name: Check gated Catechism guided-study data adapter and 433-question ownership
        run: node tests/catechism-guided-study.mjs
      - name: Check archival 54 to proposed 55 title and 433 distinct question-owner crosswalk
        run: node tests/learn-faith-55-course-reconciliation.mjs
      - name: Verify Learn the Faith lessons 1–18 and source distinctions
        run: node tests/learn-faith-certification-001-018.mjs
      - name: Verify original-language Italian and English passage evidence for lessons 1–18
        run: node tests/learn-faith-italian-passage-evidence-001-018.mjs
      - name: Verify all 433 Italian source locations and 181 bilingual claim links
        run: node tests/learn-faith-italian-source-433.mjs
      - name: Check authorized 1913 French witness and ten bilingual precision edits without false approval
        run: node tests/learn-faith-french-historic-witness-review.mjs
      - name: Check Italian independent digital source numbering errors and nonpublication
        run: node tests/learn-faith-secondary-italian-digital-audit.mjs
      - name: Validate all 433 provisional French 1913 scan-page candidate locators
        run: node tests/learn-faith-french-1913-all-433-page-locators.mjs
      - name: Check 70 photographed French 1913 QA and 1912 Italian original-print acquisition holds
        run: node tests/learn-faith-fr-1913-priority-70-photographic-review.mjs
      - name: Check scanned 1913 French printed page evidence and historic nuptial-date variant
        run: node tests/learn-faith-french-1913-printed-pages.mjs
      - name: Verify completed 125-claim source-scope desk review and publication holds
        run: node tests/learn-faith-125-source-scope-desk-review.mjs
      - name: Verify Learn the Faith lessons 19–54, 122 sourced bilingual claims
        run: node tests/learn-faith-certification-019-054.mjs
      - name: Check source-first recovery review (102 research records)
        run: node tests/formation-recovery-review.mjs
      - name: Check first ten substantive bilingual canonical syntheses against their original sources
        run: node tests/formation-canonical-synthesis-batch1.mjs
      - name: Validate 20 sourced bilingual canonical answers
        run: node tests/formation-canonical-synthesis-batch2.mjs
      - name: Validate all 53 canonical research-linked bilingual dossiers
        run: node tests/formation-canonical-synthesis-batch3.mjs
      - name: Validate new source-first Catholic foundation articles for previously unlinked owners
        run: node tests/formation-canonical-sourcefirst-batch4.mjs
      - name: Validate all 60 canonical Apologetics direct-answer drafts
        run: node tests/formation-canonical-sourcefirst-batch5.mjs
      - name: Validate all 141 canonical Formation source-linked bilingual drafts
        run: node tests/formation-crisis-sourcefirst-all-42.mjs
      - name: Audit first-party sources and remaining certification holds
        run: node tests/formation-primary-context-review.mjs
      - name: Validate firsthand proportionalist case and 1962 schema review
        run: node tests/formation-primary-context-review-2.mjs
      - name: Validate primary Catholic and traditionalist original-argument debates
        run: node tests/formation-primary-context-review-3.mjs
      - name: Validate ten pastoral governance primary-document debates and release locks
        run: node tests/formation-primary-context-review-4.mjs
      - name: Validate all remaining thirteen research-linked Crisis dossiers and fifth source review
        run: node tests/formation-primary-context-review-5.mjs
      - name: Validate direct opponent arguments in 19 Apologetics dossiers against original texts
        run: node tests/formation-primary-context-review-6.mjs
      - name: Verify seventh Formation original-context ledger and 19 source-first bilingual revisions
        run: node tests/formation-primary-context-review-7.mjs
      - name: Assert all 141 dossiers and 564 claim sections have accurate source-review scope accounting
        run: node tests/formation-141-claim-scope-matrix.mjs
      - name: Bulk-validate all 21 unresolved controversy source maps
        run: node tests/contemporary-controversies-21-source-scaffold.mjs
      - name: Verify all 123 source-claim audit gates without claiming certification
        run: node tests/formation-123-claim-gates.mjs
      - name: Reconcile all Formation owners and recoverable archived lesson branches
        run: node tests/formation-master-inventory.mjs
      - name: Verify all 141 dossier research evidence tiers and no false publication
        run: node tests/formation-141-absorption-evidence.mjs
      - name: Verify all 54 archived Catechism lesson versions are preserved without new public routes
        run: node tests/learn-faith-54-recovery.mjs
      - name: Verify 433 pinned Catechism question locations and lesson-specific citation crosswalk
        run: node tests/learn-faith-54-citation-witnesses.mjs
      - name: Check Traditional Mass objections and canonical ownership
        run: node tests/traditional-mass-objections-reconciliation.mjs
      - name: Check 30 BAQ/SDV sources and opponent attribution
        run: node tests/baq-sdv-source-attribution.mjs
      - name: Check Traditionis custodes bilingual debate sources
        run: node tests/traditionis-custodes-debates.mjs
