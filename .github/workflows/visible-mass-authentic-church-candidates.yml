name: Visible Mass authentic church candidates
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "tools/build-visible-mass-authentic-church-candidates.py"
      - ".github/workflows/visible-mass-authentic-church-candidates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - run: python -m py_compile tools/build-visible-mass-authentic-church-candidates.py
      - run: python -u tools/build-visible-mass-authentic-church-candidates.py
      - name: Validate embedded thumbnails
        run: |
          test -s dist/visible-mass/Visible_Mass_Authentic_Church_Candidates.html
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/visible-mass/Visible_Mass_Authentic_Church_Candidates.html').read_text()
          assert p.count('data:image/jpeg;base64,') >= 10
          print('Photos',p.count('data:image/jpeg;base64,'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Visible-Mass-Authentic-Church-Research
          path: |
            dist/visible-mass/Visible_Mass_Authentic_Church_Candidates.html
            dist/visible-mass/church-candidates-report.json
          if-no-files-found: error
