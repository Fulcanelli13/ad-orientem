name: Sacred Art — Rijksmuseum CC0 visual-review B2
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - .github/workflows/sacred-art-rijks-visual-review-b2-20261029.yml
      - scripts/art/sacred-art-rijks-rights-gated-review-b2-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-rijks-visual-review-b2
  cancel-in-progress: true
jobs:
  rijks-cc0-research-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image preview renderer only
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify restricted-image and rights-only source gates
        run: |
          python -m py_compile scripts/art/sacred-art-rijks-rights-gated-review-b2-20261029.py
          python scripts/art/sacred-art-rijks-rights-gated-review-b2-20261029.py --offline-smoke
      - name: Prepare official source metadata and CC0-only whole-image research sheets
        run: |
          python scripts/art/sacred-art-rijks-rights-gated-review-b2-20261029.py --max-objects 8 --max-images 2 --delay 0.15 --timeout 16
      - name: Verify no false legal, aesthetic or production promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/calendar/sacred-art-rijks-rights-gated-review-b2-20261029.v1.json').read_text())
          assert d['scope']['registeredSourceProgrammes']==186
          assert d['scope']['baselineCanonicalArtworks']==383
          assert d['scope']['recordsScreened']<=140
          assert d['counts']['sourceImageCC0PreviewCount']<=70
          assert d['counts']['newImageAestheticRatings']==0
          assert d['counts']['nativePhotographsCertified']==0
          assert d['counts']['productionReleases']==0
          assert len(d['records'])==d['scope']['recordsScreened']
          assert len({x['sourceObjectId'] for x in d['records']})==len(d['records'])
          assert len(d['contactSheets'])<=3
          assert all(x['aestheticGrade'] is None and not x['humanApproved'] and not x['productionPublished'] for x in d['records'])
          for x in d['records']:
            if x['disposition']=='CC0_RESEARCH_CONTACT_SHEET_ONLY':
              assert x['imageRights']=='CC0_OR_PDM'
              assert x['status']=='CC0_IMAGE'
              assert x['previewURL'].startswith('https://iiif.micr.io/')
              assert min(x['nativeSourceDimensions'].values())>=1800
          print('VALIDATED',d['counts'])
          PY
          git diff --exit-code -- data/calendar/sacred-art-curator-queues-383-20261029.v1.json data/calendar/sacred-art-licence-first-383-exact-source-audit-20261029.v1.json data/calendar/sacred-art-institution-source-priority-registry-20261029.v1.json
      - name: Preserve evidence, visual review sheets and errors permanently in Git
        if: always()
        run: |
          if [ ! -f data/calendar/sacred-art-rijks-rights-gated-review-b2-20261029.v1.json ]; then
            echo 'No report created'; exit 0
          fi
          git config user.name "Ad Orientem sacred art source research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-rijks-rights-gated-review-b2-20261029.v1.json docs/SACRED_ART_RIJKS_RIGHTS_GATED_REVIEW_B2_20261029.md
          if [ -d assets/staged/sacred-art-rijks-b2-20261029 ]; then git add assets/staged/sacred-art-rijks-b2-20261029/; fi
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changed evidence'; exit 0; fi
          git commit -m "research(art): persist verified Rijks image rights and full-field aesthetic research previews"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
