name: Directory corpus audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/directory/**"
      - "data/directory/**"
      - ".github/workflows/directory-corpus-audit.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-source-corpus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [fssp, icksp, ibp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser scraper dependency
        if: matrix.source == 'fssp'
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser-backed official sources
        if: matrix.source == 'fssp'
        run: npx playwright install --with-deps chromium
      - name: Import official source corpus
        run: |
          if test "${{ matrix.source }}" != "icksp"; then
            npm run directory:import:${{ matrix.source }}
            exit
          fi
          # A failed official connection never becomes a schedule-less record.
          # Retry transient transport failures only; authentication/HTTP
          # denials, schema drift and partial data still fail this source audit.
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run directory:import:icksp 2>&1 | tee "$RUNNER_TEMP/icksp-source-audit.log"; then
              exit 0
            fi
            if test "$attempt" -eq 3 ||
               ! grep -Eq 'UND_ERR_CONNECT_TIMEOUT|ETIMEDOUT|ECONNRESET|EAI_AGAIN' "$RUNNER_TEMP/icksp-source-audit.log"; then
              echo "::error::ICKSP official acquisition failed; no live corpus certified"
              exit 1
            fi
            echo "::warning::ICKSP transient official source connection failure, retry $attempt/3"
            sleep 5
          done
      - name: Print import report
        run: cat data/directory/generated/${{ matrix.source }}/import-report.v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: directory-${{ matrix.source }}-live-audit
          path: data/directory/generated/${{ matrix.source }}/
          if-no-files-found: error
          retention-days: 14
