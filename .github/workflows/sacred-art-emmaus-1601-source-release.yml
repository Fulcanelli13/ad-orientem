name: Sacred Art 2026 Easter Monday Caravaggio 1601 NG172
on:
  pull_request:
    paths:
      - 'src/home/released-class-i-caravaggio-emmaus-2026.js'
      - 'src/home/approved-dated-artwork-2026.js'
      - 'assets/home/class-i-2026/caravaggio-emmaus-ng172-1601-fullframe-2400.webp'
      - 'data/artwork/releases/source-masters/caravaggio-emmaus-ng172-london-1601-original.jpg'
      - 'data/artwork/releases/2026-04-06-caravaggio-ng172-1601-byte-proof.v1.json'
      - 'tests/home-class-i-emmaus-*.mjs'
      - 'tests/home-class-i-caravaggio-emmaus-phone.mjs'
      - 'tests/home-approved-dated-2026-browser.mjs'
      - 'tests/home-2026-annual-artwork-coverage.mjs'
      - 'tools/build-web-preview.mjs'
      - '.github/workflows/sacred-art-emmaus-1601-source-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-1601-original-and-curated-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 1601 National Gallery original source not 1606 Milan
        run: |
          node --check src/home/released-class-i-caravaggio-emmaus-2026.js
          node --check src/home/approved-dated-artwork-2026.js
          node tests/home-class-i-emmaus-ng172-2026.mjs
          node tests/home-2026-annual-artwork-coverage.mjs
          node tests/home-2026-frozen-selected-source-gate.mjs
      - name: Verify exact WEBP in curated Pages while archive stays private
        run: |
          node tools/build-web-preview.mjs
          node tests/home-class-i-emmaus-ng172-pages-payload.mjs
  real-home-phone-image:
    needs: exact-1601-original-and-curated-pages
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - run: node tests/home-class-i-caravaggio-emmaus-phone.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-i-caravaggio-ng172-2026-04-06-320-390
          path: artifacts/home-class-i-caravaggio-emmaus-phone/
          if-no-files-found: warn
          retention-days: 14
