name: Mass — Calendar preflight context
on:
  push:
    branches: [feat/mass-preflight-calendar-context-20261011]
  pull_request:
    paths:
      - "src/mass/calendar-preflight-context.js"
      - "src/mass/full-mass-preflight.js"
      - "src/mass/full-mass-preflight-styles.js"
      - "src/mass/browser-entry.js"
      - "tests/mass-calendar-preflight-context.mjs"
      - "tests/full-mass-preflight-phone-e2e.mjs"
      - ".github/workflows/mass-calendar-preflight.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Source syntax
        run: |
          node --check src/mass/calendar-preflight-context.js
          node --check src/mass/full-mass-preflight.js
          node --check src/mass/full-mass-preflight-styles.js
          node --check src/mass/browser-entry.js
      - name: Read-only source and selected Proper invariant
        run: |
          node tests/mass-calendar-preflight-context.mjs
          node tests/full-mass-preflight.mjs
          node tests/observed-mass-source.mjs
      - run: npx playwright install --with-deps chromium
      - name: Full Mass 390px preparation and source/date/rite handoffs
        run: node tests/full-mass-preflight-phone-e2e.mjs
