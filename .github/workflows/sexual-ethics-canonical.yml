name: Sexual Ethics canonical and source audit
on:
  pull_request:
    paths:
      - 'src/learn/sexual-ethics.js'
      - 'src/learn/sexual-ethics-data/**'
      - 'tests/sexual-ethics*.mjs'
      - 'data/learn/sexual-ethics-opponent-source-audit.v1.json'
      - 'data/learn/sexual-ethics-*.json'
      - '.github/workflows/sexual-ethics-canonical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing 150-question validation
        run: node tests/sexual-ethics.mjs
      - name: Canonical dossier and source-audit regression
        run: node tests/sexual-ethics-canonical-50.mjs
      - name: Primary-author source evidence and provenance boundaries
        run: node tests/sexual-ethics-opponent-primary.mjs
      - name: High-priority stage-specific evidence and exact locator integrity
        run: node tests/sexual-ethics-stage-evidence-high24.mjs
      - name: Complete eight-stage source chain integrity for all 55 debates
        run: node tests/sexual-ethics-stage-evidence-55.mjs
      - name: Substantive primary-text corrections and high-stakes reader assertions
        run: node tests/sexual-ethics-substantive-highstakes.mjs
      - name: All 55 argument-scope certification readiness and bilingual corrections
        run: node tests/sexual-ethics-certification-readiness-v3.mjs
      - name: Full 55-argument editorial evidence and non-catalogue citation audit
        run: node tests/sexual-ethics-certification-audit-55.mjs
      - name: Original-passage verdicts and certification integrity
        run: node tests/sexual-ethics-evidence-v2.mjs
      - name: Six-debate original-passage-scope evidence and non-certification gate
        run: node tests/sexual-ethics-original-passage-scope-batch-v4.mjs
      - name: High-stakes source-scope bulk review, 56 bilingual stages
        run: node tests/sexual-ethics-highstakes-original-source-v1.mjs
      - name: Moral-reasoning bulk original-source classification, 80 stages
        run: node tests/sexual-ethics-moral-reasoning-source-batch-v1.mjs
      - name: Practical relationships, marriage and chastity original-scope batch (120 stages)
        run: node tests/sexual-ethics-practical-relationships-120-stage-v1.mjs
      - name: Last fourteen public debates: 112 bilingual source-stage findings
        run: node tests/sexual-ethics-last14-public-source-scope-v1.mjs
      - name: Final three archive-only debate stage source findings (24 stages)
        run: node tests/sexual-ethics-final-three-archived-scope-v1.mjs
      - name: All 95 short questions, original primary-source scope and 193 links
        run: node tests/sexual-ethics-95-short-answers-original-source-v1.mjs
      - name: Second original passage pass over 95 questions (72 bounded checks)
        run: node tests/sexual-ethics-95-short-answers-original-source-v2.mjs
      - name: Original source passage confirmation for CSE015 and CSE144
        run: node tests/sexual-ethics-short-answer-passage-confirmations-v1.mjs
