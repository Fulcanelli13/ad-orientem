name: Sacred Art Phase 44 — 23 official photo sources (research only)
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase44-23-source-image-probe.py'
      - '.github/workflows/sacred-art-phase44-23-photo-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch23:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source/photo inspection dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=11,<13'
      - name: Probe 4 official IIIF and 19 low-resolution institutional leads
        run: |
          python -m py_compile scripts/sacred-art/phase44-23-source-image-probe.py
          python scripts/sacred-art/phase44-23-source-image-probe.py
      - name: Retain research evidence only, no app/public assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-phase44-bulk23-official-source-research-only
          path: artifacts/sacred-art-phase44-23/
          retention-days: 14
          if-no-files-found: warn
