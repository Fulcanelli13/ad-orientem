name: Living Church P3 original character-stage acceptance

on:
  pull_request:
    paths:
      - "assets/living-church/**"
      - "data/learn/living-church-character-assets.v1.json"
      - "src/learn/living-church-character-folio.js"
      - "src/learn/living-church-ask-integration.js"
      - "src/learn/visible-mass-review.js"
      - "tests/living-church-character-*.mjs"
      - ".github/workflows/living-church-character-p3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  approved-sprites-and-original-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and approved sprite bank/source tests
        run: |
          node --check src/learn/living-church-character-folio.js
          node --check src/learn/visible-mass-review.js
          node tests/living-church-character-folio.mjs
          node tests/living-church-ask-native-return.mjs
          node tests/living-church-visible-mass-adapter.mjs
          node tests/ask-church-objective-engine.mjs
          node tests/visible-mass-guided-folio.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Actual app-shell/photographic viewer/three characters at 390 and 1280
        run: node tests/living-church-character-phone.mjs
      - name: Preserve original P2 source and return acceptance
        run: node tests/living-church-ask-real-shell.mjs
