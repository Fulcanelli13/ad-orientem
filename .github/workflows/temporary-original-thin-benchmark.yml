name: Temporary original-to-thin network comparison
on:
  push:
    branches: [performance/thin-html-safe-extraction-20261009]
    paths: [.github/workflows/temporary-original-thin-benchmark.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover immutable original production HTML
        run: |
          git fetch --depth=1 origin 04d35e1af50c3026d768d63ca961b0d4d65806eb
          git show 04d35e1af50c3026d768d63ca961b0d4d65806eb:index.html >/tmp/ad-orientem-original-2mb.html
          wc -c /tmp/ad-orientem-original-2mb.html index.html
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Measure original 2.5MB vs packed 491KB on phone conditions
        env:
          AO_THIN_BASELINE_PATH: /tmp/ad-orientem-original-2mb.html
          AO_THIN_NETWORK_LATENCY: "80"
        run: node tests/thin-html-browser-e2e.mjs
