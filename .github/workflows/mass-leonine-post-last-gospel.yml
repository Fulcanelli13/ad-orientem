name: Leonine prayers after Last Gospel — real Low Mass reader
on:
  pull_request:
    paths:
      - "src/mass/reader-post-low-mass.js"
      - "src/mass/reader-dom.js"
      - "src/mass/reader-native-preview.js"
      - "src/pray/horarium-leonine-source-blocks.js"
      - "src/pray/canonical-data.js"
      - "tests/home-customs-post-low-mass-leonine.mjs"
      - "tests/reader-leonine-after-last-gospel-phone.mjs"
      - ".github/workflows/mass-leonine-post-last-gospel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-reader-leonine:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Existing prayers and First Friday source contract
        run: node tests/home-customs-post-low-mass-leonine.mjs
      - run: npx playwright install --with-deps chromium
      - name: Low Mass Leonine after Last Gospel at 320/390px LIVE/MISSAL EN/FR
        run: node tests/reader-leonine-after-last-gospel-phone.mjs
