name: Sacred Atlas Round 10 selected old CC URL recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round10-http-cc-recovery-manifest-20261104.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round10-http-cc-covers.py'
      - '.github/workflows/sacred-atlas-round10-http-cc-acquire.yml'
permissions:
  contents: write
jobs:
  verify-seven-exact-source-covers:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round10-http-cc-recovery-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned decoder
        run: python -m pip install Pillow==11.3.0
      - name: Independently verify original rights, source bytes, author, SHA1 and full-frame derivatives
        run: python tools/atlas/acquire-sacred-atlas-round10-http-cc-covers.py
      - name: Commit only verified Place covers and release evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-media/ data/geography/research/sacred-atlas-round10-http-cc-recovery-evidence-20261104.v1.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/place-media/ \
            data/geography/approved-place-media.v1.json \
            data/geography/research/sacred-atlas-round10-http-cc-recovery-evidence-20261104.v1.json
          git commit -m "assets(atlas): verify source and recover legacy unported CC links"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
