name: Sacred Art — KMSKA through Flemish OAI and Cleveland CC0 access
on:
  push:
    branches: [research/prayer-artwork-pristine-registry-bulk-20261028]
    paths:
      - .github/workflows/sacred-art-kmska-cleveland-interfaces-20261029.yml
      - scripts/art/sacred-art-kmska-cleveland-interface-probe-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-art-kmska-cleveland-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/art/sacred-art-kmska-cleveland-interface-probe-20261029.py
          python scripts/art/sacred-art-kmska-cleveland-interface-probe-20261029.py
      - name: Preserve actual access outcomes
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/calendar/sacred-art-kmska-cleveland-interfaces-20261029.v1.json'))
          assert len(d['sources'])==6 and d['imagesDownloaded']==0
          print([(x['name'],x['status']) for x in d['sources']])
          PY
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-kmska-cleveland-interfaces-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): archive Flemish OAI and Cleveland exact feed schema"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
