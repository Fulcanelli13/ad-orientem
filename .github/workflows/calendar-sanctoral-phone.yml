name: Calendar living saints phone acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/calendar/calendar-runtime.js"
      - "src/calendar/observed-commemoration-labels.js"
      - "src/home/today-v2-sections.js"
      - "tests/calendar-p0-home-commemoration-phone.mjs"
      - "src/calendar/sanctoral-day-ui.js"
      - "src/calendar/reviewed-sanctoral-cards.js"
      - "data/calendar/living-sanctoral-read-model.v1.json"
      - "tests/calendar-sanctoral-phone-acceptance.mjs"
      - ".github/workflows/calendar-sanctoral-phone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanctoral-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real mobile Day interface, 320 / 390 / 430px
        run: node tests/calendar-sanctoral-phone-acceptance.mjs
      - name: Historic 1962 commemoration parity Home and Calendar
        run: node tests/calendar-p0-home-commemoration-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-sanctoral-phone-evidence
          path: |
            artifacts/calendar-sanctoral-phone/
            artifacts/p0-calendar-home/
          retention-days: 30
          if-no-files-found: warn
