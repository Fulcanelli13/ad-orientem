name: Directory canonical Places Wikidata Commons Openverse photo contracts
on:
  pull_request:
    paths:
      - tools/directory/discover-open-place-media.py
      - tests/directory-photo-discovery-test.py
      - .github/workflows/directory-canonical-place-photo-discovery.yml
      - tools/directory/build-p79-place-photo-review.mjs
      - docs/research/directory/p79-canonical-place-photo-review.html
      - docs/research/directory/P79-PLACE-PHOTO-REVIEW.md
      - tests/p79-place-photo-review-contract.mjs
      - tools/directory/release-p79-approved-photos.py
      - tests/p79-place-photo-release-test.py
      - tools/directory/stage-bulk-place-photos.py
      - docs/DIRECTORY-CANONICAL-PLACE-PHOTO-PIPELINE.md
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate legacy R49 and canonical Place intake
        run: |
          set -euo pipefail
          python -m py_compile tools/directory/discover-open-place-media.py
          python tests/directory-photo-discovery-test.py -v
          node tests/production-tree-hygiene.mjs
      - name: Check frozen P79 candidate reviewer against source records
        run: |
          node tools/directory/build-p79-place-photo-review.mjs --check
          node tests/p79-place-photo-review-contract.mjs
          python tests/p79-place-photo-release-test.py -v
