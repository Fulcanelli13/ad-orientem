name: Diagnose index monolith
on:
  push:
    branches:
      - diagnostic/index-monolith-audit
    paths:
      - .github/workflows/diagnose-index-monolith.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=[
              "src/mass/browser-entry.js",
              "AO_EMERGENCY_STABLE_V4333",
              "ao-haptics-enabled",
              "data-live-form",
          ]
          print("INDEX_BYTES", len(s.encode("utf-8")))
          for term in terms:
              positions=[]
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  positions.append(i)
                  start=i+len(term)
              print("\nTERM",repr(term),"COUNT",len(positions),"POSITIONS",positions[:20])
              for n,i in enumerate(positions[:6],1):
                  a=max(0,i-700); b=min(len(s),i+len(term)+1200)
                  snippet=s[a:b].replace("\n","\\n")
                  print(f"SNIPPET {term} #{n} @ {i}: {snippet}")
          PY
