name: Coello museum IIIF fidelity reference archive (research only)
on:
  push:
    branches: [research/module-hero-pd-masters-20261026]
    paths:
      - '.github/workflows/research-coello-toledo-iiif-20261027.yml'
      - 'scripts/art/acquire-coello-pristine-research.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coello-toledo-iiif-20261027
  cancel-in-progress: false
jobs:
  preserve-museum-photo-references:
    if: github.ref == 'refs/heads/research/module-hero-pd-masters-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/module-hero-pd-masters-20261026
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Obtain the two exact Toledo institutional versions
        run: python scripts/art/acquire-coello-pristine-research.py --source toledo
      - name: Assert existing Commons source preserved, museum photo identities and no release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('assets/staged/module-hero-coello-20261027/acquisition-manifest.json')
          j=json.loads(p.read_text())
          assert j['accession']=='Toledo Museum of Art 1981.44'
          assert j['pristine_quality_approved'] is False
          assert j['publication_rights_approved'] is False
          assert j['app_release_approved'] is False
          rows=j['original_files']
          assert len(rows)==3, [x['path'] for x in rows]
          assert {x.get('iiif_id') for x in rows if x.get('iiif_id')}=={'19775','48017'}
          assert any(x.get('source_sha1')=='dcbbf752ed5c4089efa877f67c83b48033cdf180' for x in rows)
          for row in rows:
            raw=pathlib.Path(row['path']).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==row['sha256']
          print('Three pristine SOURCE BYTES preserved; ZERO pristine/publication approvals')
          PY
          test "${GITHUB_REF}" = 'refs/heads/research/module-hero-pd-masters-20261026'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/staged/module-hero-coello-20261027/coello-toledo-iiif-19775-original.jpg
          git add -f assets/staged/module-hero-coello-20261027/coello-toledo-iiif-48017-original.jpg
          git add -f assets/staged/module-hero-coello-20261027/acquisition-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(art): preserve exact institutional Coello color references unapproved'
            git push origin HEAD:research/module-hero-pd-masters-20261026
          fi
