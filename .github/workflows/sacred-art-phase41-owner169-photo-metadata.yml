name: Sacred Art Phase 41 — 169 owner-selected photo metadata (research only)
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase41-owner169-photo-rights-bulk.py'
      - '.github/workflows/sacred-art-phase41-owner169-photo-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk-photo-metadata:
    name: Crosswalk Commons metadata and museum IIIF photo rights without image downloads
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded HTTP dependency
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Audit every handpicked selected source, research only
        run: |
          python -m py_compile scripts/sacred-art/phase41-owner169-photo-rights-bulk.py
          python scripts/sacred-art/phase41-owner169-photo-rights-bulk.py
      - name: Retain source and rights evidence, no image assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-phase41-owner169-source-photo-metadata-research-only
          path: artifacts/sacred-art-phase41-owner169-photo-audit/
          retention-days: 14
          if-no-files-found: warn
