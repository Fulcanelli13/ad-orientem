name: Sacred Art Class I-IV 60-source photo approval B01
on:
  push:
    branches: [research/sacred-art-b56-classi-53-hero-selector-20261024]
    paths:
      - ".github/workflows/ao-art-class-i-iv-60-photo-review.yml"
      - "previews/class-i-iv-60-photo-approval-template.html"
      - "scripts/research/class_i_iv_60_photo_release_review.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - name: Recover verified existing B56 53-date original photo previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_b56_53_hero_selector.py
      - name: Assemble 60 unique photo release decisions
        run: python scripts/research/class_i_iv_60_photo_release_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: AO-2026-Class-I-IV-60-Photos-B01
          path: artifacts/class-i-iv-60-photo-release-review/
          retention-days: 14
          if-no-files-found: error
