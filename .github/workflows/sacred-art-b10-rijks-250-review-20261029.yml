name: Sacred Art B10 - Rijksmuseum 250 exact image rights and gallery
on:
  push:
    branches: [research/sacred-art-b10-getty-20261029]
    paths:
      - scripts/art/sacred-art-b10-rijks-250-verified-review-20261029.py
      - .github/workflows/sacred-art-b10-rijks-250-review-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-b10-rijks-250
  cancel-in-progress: true
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b10-getty-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provide existing Rijks image-review runtime
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build Batch 10 from source-verified Rijks paintings
        run: |
          python -m py_compile scripts/art/sacred-art-b10-rijks-250-verified-review-20261029.py
          python -u scripts/art/sacred-art-b10-rijks-250-verified-review-20261029.py
      - name: Validate new gallery, user decisions, exact image rights and zero mutations
        run: |
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          d=json.load(open('data/calendar/sacred-art-b10-rijks-250-rights-verified-source-20261029.v1.json'))
          a=d['rows'];c=d['counts']
          assert d['completeBatchReady'] and len(a)==250,c
          assert c['priorReviewIDsExcluded']==1455
          assert c['historicalRijksUserRatingsExcluded']==137
          assert c['priorB7SelectionsPreserved']==42 and c['priorB8SelectionsPreserved']==54
          assert c['productionImageOriginalDownloads']==c['productionImports']==0
          assert len({r['id'] for r in a})==len({r['previewURL'] for r in a})==250
          assert all(x['id']=='rijks:'+x['objectId'] for x in a)
          assert all(x['sourceRights']=='RIJKSMUSEUM_EXACT_OBJECT_EDM_PDM_MATCHED_IIIF' for x in a)
          assert all(x['previewURL'].startswith('https://iiif.micr.io/') for x in a)
          assert all(min(x['nativeSourceDimensions'].values())>=1500 for x in a)
          assert all(x['imageRightsVerified'] and not x['productionImported'] for x in a)
          h=Path('docs/SACRED_ART_RIJKSMUSEUM_250_IMPORT_REVIEW_B10_20261029.html').read_text()
          m=re.search(r'<script id="catalog-data" type="application/json">(.*?)</script>',h,re.S)
          assert m and json.loads(m.group(1))==a
          assert "batchId:'B10'" in h and 'const PAGE_SIZE=50;' in h
          assert 'IMPORT_WITH_CORRECTIONS' in h and 'seenPages.length<TOTAL_PAGES' in h
          assert d['hash']==hashlib.sha256(json.dumps([x['id'] for x in a],separators=(',',':')).encode()).hexdigest()
          js=re.search(r'</script><script>(.*?)</script></body></html>',h,re.S)
          assert js
          Path('/tmp/ao-b10-rijks-gallery.js').write_text(js.group(1))
          print('PASS 250 Rijks verified religious paintings with full EDMPDM image rights')
          PY
          node --check /tmp/ao-b10-rijks-gallery.js
      - name: Archive finished B10 research review only
        if: success()
        run: |
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b10-rijks-250-rights-verified-source-20261029.v1.json
          git add docs/SACRED_ART_B10_RIJKSMUSEUM_SOURCE_QA_20261029.md
          git add docs/SACRED_ART_RIJKSMUSEUM_250_IMPORT_REVIEW_B10_20261029.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): archive B10 250 verified Rijks sacred paintings review"
          git pull --rebase origin research/sacred-art-b10-getty-20261029
          git push origin HEAD:research/sacred-art-b10-getty-20261029
