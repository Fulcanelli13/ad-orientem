name: Sacred Atlas actual Place folio phone matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/find/heritage-presentation.js"
      - "src/find/explore-presentation.js"
      - "src/find/explore-atlas-layout-style.js"
      - "src/find/explore-map-first-v2-style.js"
      - "src/find/heritage-style.js"
      - "src/find/place-editorial-presentation.js"
      - "tests/explore-folio-phone-visual-20261031.mjs"
      - ".github/workflows/explore-folio-phone-visual-20261031.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  place-folio-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture 72 genuine Explore Place phone frames
        run: node tests/explore-folio-phone-visual-20261031.mjs
      - name: Preserve captures and QA measurements even if acceptance fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explore-folio-phone-20261031
          path: artifacts/explore-folio-phone-20261031/
          if-no-files-found: warn
          retention-days: 30
