name: Sacred Places P45 bulk 150 evidence
on:
  pull_request:
    paths:
      - 'data/geography/research/sacred-places-p45-first150-source-evidence.v1.json'
      - 'tests/sacred-places-p45-bulk150-evidence.mjs'
      - '.github/workflows/sacred-places-p45-bulk150.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-150-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 150 immutable candidate rows and source evidence
        run: node tests/sacred-places-p45-bulk150-evidence.mjs
