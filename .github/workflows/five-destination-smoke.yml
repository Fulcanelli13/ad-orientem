name: Five-destination boot smoke
on:
  pull_request:
    paths:
      - 'src/app/browser-entry.js'
      - 'src/app/contracts.js'
      - 'src/home/**'
      - 'tests/five-destination-smoke.mjs'
      - '.github/workflows/five-destination-smoke.yml'
permissions:
  contents: read
# Cancel obsolete revisions of the same pull request; never cancel manual or main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/five-destination-smoke.mjs
