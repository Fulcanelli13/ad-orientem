name: Native Back and Formation return acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/native-back.js"
      - "src/app/browser-entry.js"
      - "src/app/host-adapter.js"
      - "src/settings/browser-entry.js"
      - "src/learn/browser-entry.js"
      - "src/learn/latin-course-v2.js"
      - "tests/navigation-settings-return-phone.mjs"
      - "tests/navigation-native-back-phone.mjs"
      - "tests/navigation-native-back-mass.mjs"
      - "tests/navigation-latin-settings-return-phone.mjs"
      - ".github/workflows/navigation-native-back-phone.yml"
permissions:
  contents: read
jobs:
  native-back-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Native Back in LIVE refusal and safe leaving
        run: node tests/navigation-native-back-mass.mjs
      - name: Settings Formation return, module owners and Home on phones
        run: node tests/navigation-settings-return-phone.mjs
      - name: Android browser Back, book navigation and Formation restoration
        run: node tests/navigation-native-back-phone.mjs
      - name: P3 Latin exact return at 320px/390px in English and French
        run: node tests/navigation-latin-settings-return-phone.mjs
