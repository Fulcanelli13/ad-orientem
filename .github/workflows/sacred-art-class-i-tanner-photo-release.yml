name: Sacred Art Class I Tanner real source photo release
on:
  pull_request:
    paths:
      - 'src/home/released-class-i-tanner-nicodemus-2026.js'
      - 'src/home/approved-dated-artwork-2026.js'
      - 'assets/home/class-i-2026/tanner-nicodemus-1899-pafa-1900-1-original.jpg'
      - 'data/artwork/releases/2026-05-25-tanner-nicodemus-2400-source.v1.json'
      - 'data/artwork/releases/2026-05-25-tanner-nicodemus-photo-byte-proof.v1.json'
      - 'tests/home-class-i-tanner-exact-local-original.mjs'
      - 'tests/home-class-i-tanner-photo-phone.mjs'
      - 'tests/home-two-class-i-exact-source-previews-2026.mjs'
      - '.github/workflows/sacred-art-class-i-tanner-photo-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-object-photo-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/home/released-class-i-tanner-nicodemus-2026.js
          node --check src/home/approved-dated-artwork-2026.js
          node tests/home-class-i-tanner-exact-local-original.mjs
          node tests/home-two-class-i-exact-source-previews-2026.mjs
          node tests/home-2026-annual-artwork-coverage.mjs
  home-real-phone:
    needs: exact-object-photo-source
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - run: node tests/home-class-i-tanner-photo-phone.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-class-i-tanner-phone
          path: artifacts/home-tanner-local-phone/
          if-no-files-found: warn
          retention-days: 14
