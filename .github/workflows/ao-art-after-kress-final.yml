name: Sacred Art 451-artwork final gap after Kress
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-art-after-kress-final.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile new Kress institutional original-like JPEG and lock 47 missing items
        run: |
          python -m py_compile scripts/research/sacred_art_catalogue_after_kress.py
          python scripts/research/sacred_art_catalogue_after_kress.py
      - name: Persist stable-ID audit and gap queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-catalogue451-after-b22kress.csv data/research/sacred-art-catalogue451-after-b22kress.summary.json data/research/sacred-art-missing47-after-b22kress.csv
          git commit -m 'research: reconcile whole catalogue: 336 with image or preview and 47 pending'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
