name: Sacred Atlas Round 4 acquire the reviewed Chartres original
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round4-four-photo-decision-20261103.v1.json'
      - 'tools/atlas/acquire-sacred-atlas-round4-one-photo.py'
      - '.github/workflows/sacred-atlas-round4-acquire.yml'
permissions:
  contents: write
jobs:
  acquire-exact-source-image:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/sacred-atlas-round04-chartres-du-pilier-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: python -m pip install Pillow==11.3.0
      - name: Acquire the exact original Commons file with SHA-1, licence and dimension gates
        run: python tools/atlas/acquire-sacred-atlas-round4-one-photo.py --write
      - name: Commit uncropped WebP, gallery entry and provenance evidence
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/approved/place-gallery data/geography/research/sacred-atlas-round4-published-binary-evidence-20261103.v1.json)" ]; then
            echo 'No new image to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/approved-place-gallery.v1.json \
            data/geography/research/sacred-atlas-round4-published-binary-evidence-20261103.v1.json \
            assets/approved/place-gallery/FR-chartres-notre-dame-du-pilier-go69-2020.webp
          git commit -m "assets(atlas): publish source-verified Chartres Notre-Dame du Pilier"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
