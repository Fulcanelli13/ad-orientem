name: Sacred Atlas Round 19 — offline 15-original evidence and photo reviewer
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round19-*.json'
      - 'data/geography/research/sacred-atlas-round19-*.html'
      - 'tools/atlas/audit-sacred-atlas-altoetting15-originals.py'
      - 'tests/sacred-atlas-round19-altoetting15-evidence-contract.mjs'
      - '.github/workflows/sacred-atlas-round19-offline.yml'
permissions:
  contents: read
jobs:
  altotting15-evidence-contract:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'research/sacred-atlas-round19-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm original bytes digest and photo review source identities
        run: node tests/sacred-atlas-round19-altoetting15-evidence-contract.mjs
      - name: Verify bounded Commons original audit code without network
        run: |
          python tools/atlas/audit-sacred-atlas-altoetting15-originals.py --self-test
          python tools/atlas/audit-sacred-atlas-altoetting15-originals.py --dry-run
