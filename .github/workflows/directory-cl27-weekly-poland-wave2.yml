name: CL27 Polish Wave2 five-site first-party source gate
on:
  pull_request:
    paths:
      - 'data/directory/cl27-weekly-mass-poland-wave2-20261110.v1.json'
      - 'src/find/tlm-weekly-source-poland-wave2.js'
      - 'src/find/preliminary-directory-r49.js'
      - 'tests/tlm-cl27-weekly-source-poland-wave2.mjs'
      - 'tests/directory-b91-three-published-provisional-sites.mjs'
      - '.github/workflows/directory-cl27-weekly-poland-wave2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-operator-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate five exact Polish CL2 source identities, schedules, English and French
        run: node tests/tlm-cl27-weekly-source-poland-wave2.mjs
      - name: Confirm previous 26 source programmes and worldwide physical directory
        run: |
          node tests/tlm-cl27-weekly-source-poland.mjs
          node tests/tlm-cl27-weekly-source-supplement.mjs
          node tests/tlm-cl27-weekly-source-programme.mjs
          node tests/directory-b91-three-published-provisional-sites.mjs
      - name: Verify curated GitHub Pages graph, not private research workbooks
        run: |
          node tools/build-web-preview.mjs
          test -f dist/web-preview/data/directory/cl27-weekly-mass-poland-wave2-20261110.v1.json
          test -f dist/web-preview/src/find/tlm-weekly-source-poland-wave2.js
          test ! -d dist/web-preview/data/directory/research/cl27-current-firstparty-20261104
