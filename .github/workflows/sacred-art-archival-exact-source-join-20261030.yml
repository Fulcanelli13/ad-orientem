name: Sacred Art archival 383 to accepted 856 exact-source crosswalk (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-archival-exact-source-join-20261030.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-archival-exact-source-join
  cancel-in-progress: false

jobs:
  research-only-exact-source-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen editorial baseline
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Compare archived canonical source pages against all accepted source pages
        run: node scripts/art/crossmatch-archived-provenance-to-accepted856-20261030.mjs
      - name: Enforce no-promotion and source lineage
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('data/calendar/sacred-art-phase1-archive-exact-source-to-accepted856-20261030.v1.json','utf8')),s=j.counts;
          if(s.accepted!==856||s.lockedCanonical!==383||
            s.alreadyLinkedInOriginalCrosswalk!==72||s.unlinkedInOriginalCrosswalk!==784||
            s.canonicalMissingSourcePage!==289||s.archivalSourcePageLeads!==179||
            s.newLinksWrittenToLockedCrosswalk!==0||
            s.exactPhotoRightsCertified!==0||s.productionImports!==0||
            j.candidates.some(c=>c.identityAddedToLockedCrosswalk!==false||
              c.exactPhotoRightsCertified!==false||c.visualCertified!==false||
              c.productionMutation!==false)||j.release.productionMutation!==false)
             throw Error('Original artwork and release protections violated');
          console.log(JSON.stringify(s,null,2));
          NODE
      - name: Commit reversible exact-source evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-archive-exact-source-to-accepted856-20261030.v1.json
          git diff --cached --check
          git commit -m "research(sacred-art): exact archival-source matches to frozen 856 [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
