name: Temporary exact Caravaggio NG172 source acquisition
on:
  push:
    branches: ['feat/sacred-art-class-i-emmaus-1601-20261111']
    paths: ['.github/workflows/tmp-caravaggio-ng172-acquire-20261111.yml']
permissions:
  contents: write
jobs:
  acquire-museum-identified-original:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and decode the 1601 London work, excluding 1606 Milan version
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          from PIL import Image,ImageOps
          from io import BytesIO
          url="https://upload.wikimedia.org/wikipedia/commons/c/c0/Supper_at_Emmaus-Caravaggio_%281601%29.jpg"
          req=urllib.request.Request(url,headers={"User-Agent":"AdOrientemSourceAudit/1.0 (historical original verification)"})
          with urllib.request.urlopen(req,timeout=90) as response:
              assert response.status==200
              original=response.read(16_000_000)
          assert 6_000_000<len(original)<12_000_000,len(original)
          assert original[:2]==bytes.fromhex("ffd8") and original[-2:]==bytes.fromhex("ffd9")
          source=Path("data/artwork/releases/source-masters/caravaggio-emmaus-ng172-london-1601-original.jpg")
          public=Path("assets/home/class-i-2026/caravaggio-emmaus-ng172-1601-fullframe-2400.webp")
          proof=Path("data/artwork/releases/2026-04-06-caravaggio-ng172-1601-byte-proof.v1.json")
          source.parent.mkdir(parents=True,exist_ok=True)
          public.parent.mkdir(parents=True,exist_ok=True)
          proof.parent.mkdir(parents=True,exist_ok=True)
          source.write_bytes(original)
          with Image.open(BytesIO(original)) as im:
              im.verify()
          with Image.open(BytesIO(original)) as im:
              assert im.size==(11412,8117),im.size
              im=ImageOps.exif_transpose(im).convert("RGB")
              im.thumbnail((2400,2400),Image.Resampling.LANCZOS)
              assert im.size==(2400,1707),im.size
              im.save(public,format="WEBP",quality=86,method=6,exact=True)
          derivative=public.read_bytes()
          assert derivative[:4]==b"RIFF" and derivative[8:12]==b"WEBP"
          with Image.open(public) as verify:
              verify.verify()
          with Image.open(public) as verify:
              assert verify.size==(2400,1707),verify.size
          out={
             "schema":"AO_CLASS_I_EMMAUS_NG172_1601_SOURCE_AND_MOBILE_BYTES_V1",
             "date":"2026-04-06","principalId":"tempora:Pasc0-1:1:w",
             "properPath":"Tempora/Pasc0-1",
             "frozenTitle":"The Supper at Emmaus","frozenArtist":"Caravaggio",
             "physicalWork":"National Gallery, London, NG172, 1601",
             "physicalWorkReference":"https://www.nationalgallery.org.uk/paintings/michelangelo-merisi-da-caravaggio-the-supper-at-emmaus",
             "sameTitleExcluded":"Caravaggio 1606 Supper at Emmaus, Pinacoteca di Brera 2296",
             "physicalVersionOwnerApprovalPreviouslyRecorded":False,
             "commonsFilePage":"https://commons.wikimedia.org/wiki/File:Supper_at_Emmaus-Caravaggio_(1601).jpg",
             "commonsOriginalUrl":url,
             "photographRights":"Wikimedia Commons PDM/PD-Art faithful reproduction; U.S. public domain, other jurisdictions may restrict 2D photographic reproductions",
             "sourceOriginalArchive":str(source),
             "sourceDimensions":[11412,8117],
             "sourceBytes":len(original),
             "sourceSha1":hashlib.sha1(original).hexdigest(),
             "sourceSha256":hashlib.sha256(original).hexdigest(),
             "publishedHomeImage":str(public),
             "publishedImageDimensions":[2400,1707],
             "publishedImageBytes":len(derivative),
             "publishedImageSha256":hashlib.sha256(derivative).hexdigest(),
             "mobileDerivative":"Uncropped proportion-preserving 2400px long-edge WEBP from verified original",
             "newPaintingTitleOrArtistSelection":False,
             "cropOwnerApprovalCreated":False
          }
          proof.write_text(json.dumps(out,indent=2,ensure_ascii=False)+chr(10),encoding="utf8")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Commit verified archive and mobile derivative on this branch only
        shell: bash
        run: |
          set -eu
          git config user.name 'ad-orientem-source-acquisition[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artwork/releases/source-masters/caravaggio-emmaus-ng172-london-1601-original.jpg assets/home/class-i-2026/caravaggio-emmaus-ng172-1601-fullframe-2400.webp data/artwork/releases/2026-04-06-caravaggio-ng172-1601-byte-proof.v1.json
          git diff --cached --quiet && exit 1
          git commit -m 'Acquire Caravaggio 1601 London NG172 source and full-frame lightweight original derivative'
          # Preserve other contributor edits made while the image was downloading.
          git fetch origin feat/sacred-art-class-i-emmaus-1601-20261111
          git rebase origin/feat/sacred-art-class-i-emmaus-1601-20261111
          git push origin HEAD:feat/sacred-art-class-i-emmaus-1601-20261111
