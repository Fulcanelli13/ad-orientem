name: Mass Moments Study Integration
on:
  pull_request:
    paths:
      - 'src/learn/mass-formation.js'
      - 'src/learn/mass-explorer.js'
      - 'tests/mass-explorer-phone-e2e.mjs'
      - 'src/learn/mass-moments-study.js'
      - 'src/learn/mass-formation-scripture-context.js'
      - 'tests/mass-moments-study.mjs'
      - 'tests/mass-moments-phone.mjs'
      - '.github/workflows/mass-moments-study.yml'
  push:
    branches:
      - 'feature/mass-moments-study-links-20261016'
    paths:
      - 'src/learn/mass-formation.js'
      - 'src/learn/mass-moments-study.js'
      - 'src/learn/mass-formation-scripture-context.js'
      - 'tests/mass-moments-study.mjs'
      - 'tests/mass-moments-phone.mjs'
      - '.github/workflows/mass-moments-study.yml'
permissions:
  contents: read
jobs:
  study-navigation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/learn/mass-moments-study.js
      - run: node --check src/learn/mass-formation.js
      - run: node tests/mass-moments-study.mjs
      - run: node tests/mass-formation.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/mass-formation-scripture-phone.mjs
      - run: node tests/mass-moments-phone.mjs
      - run: node tests/mass-explorer-phone-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-explorer-p1-visuals
          path: artifacts/mass-explorer-p1/
          if-no-files-found: warn
          retention-days: 14
