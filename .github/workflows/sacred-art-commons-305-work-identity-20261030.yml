name: Sacred Art Commons 305 structured physical-work leads (€0 research)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-commons-305-work-identity-20261030.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sacred-art-commons-305-work-identity
  cancel-in-progress: false

jobs:
  extract-commons-digital-representation-work-qids:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect frozen canonical and editorial decisions
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Resolve structured Wikimedia Commons digital representation of artwork claims
        run: node scripts/art/reconcile-commons-305-artwork-statements-20261030.mjs
      - name: Publish compact counts and keep Wikidata leads research-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='data/calendar/sacred-art-phase1-commons-305-structured-work-leads-20261030.v2.json';
          const j=JSON.parse(readFileSync(p,'utf8')),c=j.counts;
          if(j.rows.length!==305 || c.sourceCards!==305 || c.sourceFilesWithP6243SpecificArtworkId<1 ||
            c.mediaInfoEntitiesResolved+c.mediaInfoMissing+c.queryFailures+c.upstreamUnverifiedNotQueried!==305 ||
            c.exactMuseumPhysicalPaintingMatchesEstablished!==0 ||
            c.canonical383NewIdentityLinks!==0 ||
            c.photoRightsCertified!==0 || c.productionImports!==0 ||
            j.rows.some(r=>r.newCanonical383Link!==false ||
              r.physicalPaintingSameAsCanonical383!==false || r.productionMutation!==false ||
              r.fileRightsCertified!==false || r.originalPhotoVisuallyCertified!==false) ||
            j.release.productionMutation!==false)throw Error('Commons artwork identity leads violated no-promotion/identity gate');
          const summary={schema:'AO_SACRED_ART_COMMONS_305_WORK_QID_SUMMARY_V1',
            at:j.generatedAt,upstreamAudit:j.upstreamAudit,
            researchLedger:p,counts:c,sameWorkMediaGroups:j.sameWorkMediaGroups,
            statementsNotCertifiedAsMuseumPhysicalObject:true,
            sourcePhotoLicenseAndVisualStillUncertified:true,productionMutation:false};
          writeFileSync('data/calendar/sacred-art-phase1-commons-305-work-qid-summary-20261030.v2.json',
            JSON.stringify(summary,null,2)+'\n',{flag:'wx'});
          console.log('Commons structured work Q ID results:',JSON.stringify(c,null,2));
          NODE
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-phase1-commons-305-structured-work-leads-20261030.v2.json
          git add data/calendar/sacred-art-phase1-commons-305-work-qid-summary-20261030.v2.json
          git diff --cached --check
          git commit -m "research(sacred-art): record Commons 305 digital representation work Q ID leads [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
