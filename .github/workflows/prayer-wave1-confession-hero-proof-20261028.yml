name: Prayer Wave 1 - Confession opt-in hero browser proof
on:
  push:
    branches:
      - feature/prayer-wave1-confession-hero-proof-20261028
    paths:
      - .github/workflows/prayer-wave1-confession-hero-proof-20261028.yml
      - src/pray/confession-wave1-hero-proof.js
      - src/pray/presentation-runtime.js
      - assets/pray/hero-proof/**
      - tests/pray-confession-wave1-hero-proof.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-default-off-and-three-responsive-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing free test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-fund --no-audit @playwright/test@1.55.0
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript and test the real existing Confession module
        run: |
          node --check src/pray/confession-wave1-hero-proof.js
          node --check src/pray/presentation-runtime.js
          node --check tests/pray-confession-wave1-hero-proof.mjs
          node tests/pray-confession-wave1-hero-proof.mjs
      - name: Archive three screenshot proofs in the review branch, not just expiring artifacts
        if: success()
        run: |
          mkdir -p assets/staged/prayer-wave1-confession-qa-20261028
          for width in 320 390 1440; do
            cp "artifacts/prayer-wave1-confession-proof/flagged-${width}.png" "assets/staged/prayer-wave1-confession-qa-20261028/flagged-${width}.png"
          done
          (
            cd assets/staged/prayer-wave1-confession-qa-20261028
            sha256sum flagged-320.png flagged-390.png flagged-1440.png > SCREENSHOT-SHA256.txt
          )
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-wave1-confession-qa-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "research(pray art): preserve revised Confession hero screenshots with checksums"
          git pull --rebase origin feature/prayer-wave1-confession-hero-proof-20261028
          git push origin HEAD:feature/prayer-wave1-confession-hero-proof-20261028
      - name: Temporary visual acceptance screenshots (not sole artwork archive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-confession-review-screens-${{ github.run_id }}
          path: artifacts/prayer-wave1-confession-proof/
          retention-days: 3
          if-no-files-found: warn
