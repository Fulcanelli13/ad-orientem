name: Sacred art — selected masterpieces image review
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - "tools/calendar/acquire-selected-masterpiece-review.py"
      - "data/calendar/sacred-art-user-235-subject-decisions-20261012.v1.json"
      - "data/calendar/sacred-art-masterpiece-selected-source-triage-20261012.v1.json"
      - ".github/workflows/sacred-art-selected-masterpiece-acquisition.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selected-masterpiece-art-acquisition
  cancel-in-progress: true
jobs:
  acquire-selected-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Parse check and source-locked art acquisition
        run: |
          python -m py_compile tools/calendar/acquire-selected-masterpiece-review.py
          python tools/calendar/acquire-selected-masterpiece-review.py
      - name: Verify source bytes and no publication promotion
        if: always()
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("artifacts/sacred-art-selected-review")
          f=p/"acquisition-report.json"
          if not f.exists(): raise SystemExit("No acquisition report was produced")
          j=json.loads(f.read_text())
          assert j["summary"]["requested"]==3
          assert j["status"]=="REVIEW_ARCHIVE_ONLY_NO_PRODUCTION_APPROVAL"
          assert j["summary"]["productionApproved"]==0
          for row in j["results"]:
              assert row["productionApproved"] is False
              assert row["phoneCropApproved"] is False
              assert row["homeMasterpieceApproved"] is False
              if row["status"]!="SOURCE_IMAGE_ACQUIRED_REVIEW_ONLY": continue
              data=(p/row["imageFilename"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==row["imageSha256"]
              assert len(data)==row["imageBytes"]
              assert row["width"]>=800 and row["height"]>=800
              assert len(row["previews"])==3
              for v in row["previews"].values(): assert (p/v).exists()
          assert (p/"review-gallery.html").exists()
          print("PASS selected original evidence, image hashes, explicit unapproved crop/release status")
          PY
      - name: Upload originals and visual review gallery (not public app assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-masterpieces-12oct-qa-originals-and-gallery
          path: artifacts/sacred-art-selected-review/
          retention-days: 30
          if-no-files-found: warn

  acquire-selected-missing-review:
    # Wikimedia Commons blocked imageinfo requests with HTTP 429 on 13 October.
    # Keep this fail-closed source recovery as an explicitly dispatched job;
    # ordinary catalogue edits must not re-request rate-limited originals.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validation dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Recover four exact Commons originals without publishing
        run: |
          python -m py_compile tools/calendar/acquire-selected-missing-originals.py
          python tools/calendar/acquire-selected-missing-originals.py
      - name: Verify hash and source provenance report
        if: always()
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path("artifacts/sacred-art-selected-originals-recovery")
          j=json.loads((p/"acquisition-report.json").read_text())
          assert j["requested"]==4 and j["productionApproved"] is False
          assert j["newUserArtworkChoices"]==0
          assert j["legalAndAestheticReleaseGates"]=="NOT_CLEARED"
          for x in j["results"]:
              assert x["publicationApproved"] is False
              if x["status"]!="SHA256_VERIFIED_REVIEW_ORIGINAL_NOT_PRODUCTION":continue
              raw=(p/x["sourceFile"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==x["originalSha256"]
              assert (p/x["previewFile"]).is_file()
          print("SELECTED_ORIGINALS_RECOVERY",j["recovered"],"/",j["requested"])
          PY
      - name: Upload separate review-only source masters and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-missing-sacred-art-originals-review-only
          path: artifacts/sacred-art-selected-originals-recovery/
          retention-days: 30
          if-no-files-found: warn
