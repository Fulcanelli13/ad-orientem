name: Temporary packed startup verification
on:
  push:
    branches: [performance/thin-html-safe-extraction-20261009]
    paths: [.github/workflows/temporary-pack-classic-js.yml]
permissions:
  contents: write
jobs:
  generate-verify:
    if: github.ref == 'refs/heads/performance/thin-html-safe-extraction-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/thin-html-safe-extraction-20261009
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve 89-request baseline
        run: cp index.html /tmp/ad-orientem-thin-baseline.html
      - name: Create one parser-ordered executable JS bundle
        run: |
          node tools/pack-extracted-classic-js.mjs --apply
          node tools/pack-extracted-classic-js.mjs --verify
          node tools/extract-thin-html-shell.mjs --verify
          node tests/startup-payload-contract.mjs
          node --check ao-packed-*.js
      - name: Install browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compare mobile network and run App acceptance
        env:
          AO_THIN_BASELINE_PATH: /tmp/ad-orientem-thin-baseline.html
          AO_THIN_NETWORK_LATENCY: "80"
        run: |
          node tests/thin-html-browser-e2e.mjs
          node tests/per-icon-svg-e2e.mjs
          node tests/external-svg-sprite-e2e.mjs
          node tests/route-lazy-browser-e2e.mjs
          npm run test:app-shell-contract
          npm run test:rc-interaction-qa
          npm run test:phone
      - name: Commit tested bundle to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ao-packed-*.js data/presentation/startup-thin-shell.v1.json
          git diff --cached --stat
          git commit -m "Preserve parser-order script execution with a single cacheable classic boot bundle"
          git push origin HEAD:refs/heads/performance/thin-html-safe-extraction-20261009
