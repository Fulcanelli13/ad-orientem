name: Prayer artwork runtime parity (draft research)

on:
  push:
    branches:
      - research/prayer-existing-artwork-coverage-first-20261030
    paths:
      - '.github/workflows/prayer-art-runtime-parity-20261030.yml'
      - 'tests/prayer-art-runtime-parity.mjs'
      - 'tests/prayer-chaplet-artwork-contract.mjs'
      - 'tests/prayer-art-dom-evidence.mjs'
      - 'tests/prayer-angelus-art-units.mjs'
      - 'tests/prayer-master-map-reconciliation.mjs'
      - 'src/pray/**'
      - 'data/prayer/artwork-editorial-20261030/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-card-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime stage coverage without publishing imagery
        run: node tests/prayer-art-runtime-parity.mjs
      - name: Verify five chaplet stage pools and positive-only approval states
        run: node tests/prayer-chaplet-artwork-contract.mjs
      - name: Verify Angelus and Regina scene identities against canonical Latin
        run: node tests/prayer-angelus-art-units.mjs
      - name: Verify 275 master positions and strict 267-slot approval gates
        run: node tests/prayer-master-map-reconciliation.mjs
      - name: Inspect live Prayer owners without claiming photograph release
        run: node tests/prayer-art-dom-evidence.mjs && node --check src/pray/presentation-runtime.js && node --check src/pray/novena-runtime.js && node --check src/pray/traditional-pray-runtime.js
