name: App convergence

on:
  pull_request:
    paths:
      - "src/app/**"
      - "src/mass/browser-entry.js"
      - "index.html"
      - "package.json"
      - "data/presentation/app-release-gate.v1.json"
      - "tests/app-release-gate.mjs"
      - "tests/app-shell-*.mjs"
      - "tests/reader-phone-acceptance.mjs"
      - "tests/production-tree-hygiene.mjs"
      - "docs/APP-CONVERGENCE.md"
      - ".github/workflows/app-convergence.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/mass/browser-entry.js"
      - "index.html"
      - "package.json"
      - "data/presentation/app-release-gate.v1.json"
      - "tests/app-release-gate.mjs"
      - "tests/app-shell-*.mjs"
      - "tests/reader-phone-acceptance.mjs"
      - "tests/production-tree-hygiene.mjs"
      - "docs/APP-CONVERGENCE.md"
      - ".github/workflows/app-convergence.yml"

jobs:
  app-shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:app-shell-contract
      - run: npm run test:tree-hygiene
      - run: npm run check:app-release

  app-shell-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
      - run: node tests/app-shell-visible-owner-e2e.mjs
      - run: node tests/app-shell-journey-e2e.mjs
