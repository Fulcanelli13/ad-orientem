name: App convergence

on:
  pull_request:
    paths:
      - "src/app/**"
      - "src/calendar/**"
      - "src/home/**"
      - "src/learn/**"
      - "src/pray/**"
      - "src/settings/**"
      - "src/mass/browser-entry.js"
      - "index.html"
      - "package.json"
      - "data/presentation/app-release-gate.v1.json"
      - "tests/app-release-gate.mjs"
      - "tests/presentation-fx.mjs"
      - "tests/app-shell-*.mjs"
      - "tests/nonmass-d3-d6-*.mjs"
      - "tests/learn-*.mjs"
      - "tests/settings-*.mjs"
      - "tests/reader-phone-acceptance.mjs"
      - "tests/source-transport-compat.mjs"
      - "tests/field-current-week-e2e.mjs"
      - "tests/release-candidate-field-qa.mjs"
      - "tests/release-candidate-interaction-qa.mjs"
      - "tests/production-tree-hygiene.mjs"
      - "docs/APP-CONVERGENCE.md"
      - ".github/workflows/app-convergence.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/calendar/**"
      - "src/home/**"
      - "src/learn/**"
      - "src/mass/browser-entry.js"
      - "index.html"
      - "package.json"
      - "data/presentation/app-release-gate.v1.json"
      - "tests/app-release-gate.mjs"
      - "tests/presentation-fx.mjs"
      - "tests/app-shell-*.mjs"
      - "tests/nonmass-d3-d6-*.mjs"
      - "tests/learn-*.mjs"
      - "tests/settings-*.mjs"
      - "tests/reader-phone-acceptance.mjs"
      - "tests/production-tree-hygiene.mjs"
      - "docs/APP-CONVERGENCE.md"
      - ".github/workflows/app-convergence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:app-shell-contract
      - run: npm run test:tree-hygiene
      - run: npm run test:app-live-guards
      - run: npm run test:presentation-fx
      - run: npm run test:home-owner
      - run: npm run test:home-presentation
      - run: npm run test:home-enrichers
      - run: npm run test:settings-owner
      - run: npm run test:nonmass-convergence
      - run: npm run test:pray-owner
      - run: npm run test:learn-owner
      - run: npm run test:source-transport
      - run: npm run check:app-release

  app-shell-phone:
    # Validate actual phone journeys on PRs, not only after merging into main.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: app-shell-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rc-interaction-qa
      - run: npm run test:phone
      - run: node tests/app-shell-journey-e2e.mjs
      - run: npm run test:field-current-week
      - run: npm run test:rc-field-qa
