name: App convergence

on:
  pull_request:
    paths:
      - "src/app/**"
      - "tests/app-shell-contract.mjs"
      - "docs/APP-CONVERGENCE.md"
      - ".github/workflows/app-convergence.yml"
  push:
    branches:
      - integration/final-app-shell-phase1
    paths:
      - "src/app/**"
      - "tests/app-shell-contract.mjs"
      - "docs/APP-CONVERGENCE.md"
      - ".github/workflows/app-convergence.yml"

jobs:
  app-shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/app-shell-contract.mjs
