name: ICRSP 6–29 November 2026 sourced Mass and independent Ordo intake
on:
  pull_request:
    paths:
      - "src/calendar/icrsp-france-ordo-evidence.js"
      - "src/calendar/icrsp-france-ordo-intake-status.js"
      - "src/mass/independent-ordo-source-gate.js"
      - "src/mass/1962-oration-limit-review.js"
      - "src/mass/1962-nov09-theodore-commemoration.js"
      - "tests/1962-nov09-theodore-commemoration.mjs"
      - "tests/icrsp-2026-nov09-rubric-hold-phone.mjs"
      - "data/research/icrsp-france-ordo-2026-11-09-29-independent.v1.json"
      - "tests/icrsp-france-21day-independent-source-gate.mjs"
      - "src/mass/icrsp-first-friday-entry.js"
      - "src/mass/ordo-mass-completeness.js"
      - "tests/mass-ordo-completeness.mjs"
      - "tests/icrsp-2026-nov07-phone-e2e.mjs"
      - "src/mass/reader-native-preview.js"
      - "src/mass/icrsp-nov06-pro-papa-orations.js"
      - "src/mass/icrsp-nov08-sunday-pro-papa.js"
      - "tests/icrsp-2026-nov08-sunday-phone-e2e.mjs"
      - "src/mass/browser-entry.js"
      - "tests/icrsp-nov06-pro-papa-orations.mjs"
      - "src/home/today-h4-view.js"
      - "src/home/browser-entry.js"
      - "tests/icrsp-2026-november-ordo-home.mjs"
      - "tests/icrsp-2026-november-ordo-phone-e2e.mjs"
      - ".github/workflows/icrsp-november-2026-actual-mass.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  institute-ordo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Independently audit 21 original dated institute Ordo records and enforce unverified local-Mass holds
        run: node tests/icrsp-france-21day-independent-source-gate.mjs
      - name: Exact 6–7 November source and Home contract
        run: node tests/icrsp-2026-november-ordo-home.mjs
      - name: Source-confirmed Pro Papa Collect, Secret, Postcommunion and reader boundaries
        run: node tests/icrsp-nov06-pro-papa-orations.mjs
      - name: Source-Ordo completeness for 6 and 7 November and negative cases
        run: node tests/mass-ordo-completeness.mjs
      - name: Existing H7 Home contract
        run: node tests/home-h4-door.mjs
      - run: npx playwright install --with-deps chromium
      - name: Phone Home to source-attested Sacred Heart votive selector
        run: node tests/icrsp-2026-november-ordo-phone-e2e.mjs
      - name: Phone Home to actual First Saturday Immaculate Heart source
        run: node tests/icrsp-2026-nov07-phone-e2e.mjs
      - name: Phone ICRSP Sunday 8 Nov source and second papal Postcommunion NEXT
        run: node tests/icrsp-2026-nov08-sunday-phone-e2e.mjs
      - name: Source-check St Theodore three orations and original Roman Low Mass-only scope
        run: node tests/1962-nov09-theodore-commemoration.mjs
      - name: Phone Nov 9 II-class rubric conflict remains visible without a fabricated three-orations Mass
        run: node tests/icrsp-2026-nov09-rubric-hold-phone.mjs
