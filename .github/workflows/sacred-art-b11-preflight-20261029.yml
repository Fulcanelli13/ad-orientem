name: Sacred Art B11 — official image source preflight
on:
  push:
    branches: [research/sacred-art-b11-20261029]
    paths:
      - scripts/art/sacred-art-b11-source-preflight-20261029.py
      - .github/workflows/sacred-art-b11-preflight-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b11-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate access and image rights fields
        run: python -u scripts/art/sacred-art-b11-source-preflight-20261029.py
      - name: Preserve source-access findings
        run: |
          git config user.name "Ad Orientem sacred art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b11-source-access-probe-20261029.v1.json
          git diff --cached --check
          git commit -m "research(art): record official B11 rights and images source preflight"
          git pull --rebase origin research/sacred-art-b11-20261029
          git push origin HEAD:research/sacred-art-b11-20261029
