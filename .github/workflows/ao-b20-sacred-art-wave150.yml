name: Ad Orientem B20 sacred art wave150 acquisition
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b20-sacred-art-wave150-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screen-and-acquire:
    # Historical acquisition: avoid re-downloading originals merely because the protective workflow was merged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Resolve 150 existing sources and download eligible originals
        run: |
          python scripts/research/sacred_art_acquire.py \
            --manifest data/research/sacred-art-b20-wave150.manifest.json \
            --output artifacts/art-wave150 \
            --max-files 50 \
            --max-bytes 650000000
      - name: Preserve source audit and downloaded research originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-b20-wave150-source-screen-and-originals
          path: artifacts/art-wave150/
          retention-days: 7
          if-no-files-found: warn
      - name: P0 gate - archive unchanged acquisition files in an unpublished GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_release_archive_gate.py --wave b20 --source-dir artifacts/art-wave150
