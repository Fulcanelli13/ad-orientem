name: Ad Orientem — GitHub Pages release

# Publish from GitHub only. No Vercel CLI or deployment hook.
# Runtime-change filter avoids costly rebuilds for research-only updates.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sacred-music.html'
      - 'sw.js'
      - '*.css'
      - '*.js'
      - '*.png'
      - '*.webmanifest'
      - 'assets/**'
      - '!assets/staged/**'
      - 'src/**'
      - 'data/**'
      - '!data/geography/research/**'
      - '!data/directory/research/**'
      - 'data/directory/research/canonical-g0-site-admissions-b84-b90-20261026.v1.json'
      - '!data/research/**'
      - 'data/research/mass-special-rite-music-events-20261019.v1.json'
      - 'tools/build-web-preview.mjs'
      - 'tools/prepare-github-pages-release.mjs'
      - 'tools/check-github-pages-live.mjs'
      - '.github/workflows/github-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/github-pages.yml'
      - 'tools/prepare-github-pages-release.mjs'
      - 'tools/check-github-pages-live.mjs'
      - 'tools/build-web-preview.mjs'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ad-orientem-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static GitHub Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public postdeploy smoke code
        run: node --check tools/check-github-pages-live.mjs
      - name: Build allowlisted static release
        run: node tools/build-web-preview.mjs
      - name: Validate base path, noindex, release safety and 1GB Pages cap
        run: node tools/prepare-github-pages-release.mjs
      # CI-only experiment. This never runs for main/Pages deployment.
      - name: Build single-entry ESM bundle (PR pilot only)
        if: github.event_name == 'pull_request'
        run: npx --yes esbuild@0.25.12 src/mass/browser-entry.js --bundle --platform=browser --format=esm --target=es2022 --minify --outfile=dist/web-preview/ao-r17-entry.bundle.experimental.js --log-level=warning
      - name: Prepare paired baseline and bundled HTML (PR pilot only)
        if: github.event_name == 'pull_request'
        run: node tools/prepare-esm-bundle-pilot.mjs
      - name: Install Playwright (PR pilot only)
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Benchmark 320/390px bundled Home, Calendar and Mass door (PR pilot only)
        if: github.event_name == 'pull_request'
        run: node tests/pages-esm-bundle-pilot-phone.mjs
      - name: Retain ESM A/B evidence (PR pilot only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-esm-bundle-pilot
          path: artifacts/pages-esm-bundle-pilot/
          retention-days: 14
          if-no-files-found: warn
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-preview

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish site
        id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live GitHub Pages publication
        env:
          GITHUB_PAGES_URL: ${{ steps.pages.outputs.page_url }}
        run: node tools/check-github-pages-live.mjs
