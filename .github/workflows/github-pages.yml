name: Ad Orientem — GitHub Pages release

# Publish from GitHub only. No Vercel CLI or deployment hook.
# Runtime-change filter avoids costly rebuilds for research-only updates.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sacred-music.html'
      - 'sw.js'
      - '*.css'
      - '*.js'
      - '*.png'
      - '*.webmanifest'
      - 'assets/**'
      - '!assets/staged/**'
      - 'src/**'
      - 'data/**'
      - '!data/geography/research/**'
      - '!data/directory/research/**'
      - 'data/directory/research/canonical-g0-site-admissions-b84-b90-20261026.v1.json'
      - '!data/research/**'
      - 'data/research/mass-special-rite-music-events-20261019.v1.json'
      - 'tools/build-web-preview.mjs'
      - 'tools/prepare-github-pages-release.mjs'
      - 'tools/check-github-pages-live.mjs'
      - 'tools/github-pages-release-proof.mjs'
      - '.github/workflows/github-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/github-pages.yml'
      - 'tools/prepare-github-pages-release.mjs'
      - 'tools/check-github-pages-live.mjs'
      - 'tools/github-pages-release-proof.mjs'
      - 'tests/github-pages-release-proof.test.mjs'
      - 'tools/build-web-preview.mjs'
      - 'tests/prayer-stations-curated-release-hold.mjs'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR preflight cannot cancel an ongoing main production release.
# Allow the active production upload+deploy+smoke to finish even if main advances.
concurrency:
  group: ad-orientem-github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build static GitHub Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public postdeploy smoke code
        run: node --check tools/check-github-pages-live.mjs && node --check tools/prepare-github-pages-release.mjs && node --check tools/github-pages-release-proof.mjs
      - name: Reject stale source SHA, workflow run and changed critical assets
        run: node --test tests/github-pages-release-proof.test.mjs
      - name: Build allowlisted static release
        run: node tools/build-web-preview.mjs
      - name: Validate base path, noindex, release safety and 1GB Pages cap
        run: node tools/prepare-github-pages-release.mjs
      - name: Verify fourteen archived Stations photographs cannot leak into Pages
        run: node tests/prayer-stations-curated-release-hold.mjs
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-preview

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish site
        id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live GitHub Pages publication
        env:
          GITHUB_PAGES_URL: ${{ steps.pages.outputs.page_url }}
        run: node tools/check-github-pages-live.mjs
