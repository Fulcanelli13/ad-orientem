name: Ad Orientem — GitHub Pages release

# Publish from GitHub only. No Vercel CLI or deployment hook.
# Runtime-change filter avoids costly rebuilds for research-only updates.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sacred-music.html'
      - 'sw.js'
      - '*.css'
      - '*.js'
      - '*.png'
      - '*.webmanifest'
      - 'assets/**'
      - '!assets/staged/**'
      - 'src/**'
      - 'data/**'
      - '!data/geography/research/**'
      - '!data/directory/research/**'
      - 'data/directory/research/canonical-g0-site-admissions-b84-b90-20261026.v1.json'
      - '!data/research/**'
      - 'data/research/mass-special-rite-music-events-20261019.v1.json'
      - 'tools/build-web-preview.mjs'
      - 'tools/prepare-github-pages-release.mjs'
      - 'tools/check-github-pages-live.mjs'
      - 'tools/github-pages-release-proof.mjs'
      - 'tests/icrsp-france-21day-independent-source-gate.mjs'
      - 'src/calendar/icrsp-france-ordo-intake-status.js'
      - 'src/calendar/icrsp-france-ordo-evidence.js'
      - 'src/mass/independent-ordo-source-gate.js'
      - 'src/mass/1962-oration-limit-review.js'
      - 'src/mass/1962-nov09-theodore-commemoration.js'
      - 'tests/1962-nov09-theodore-commemoration.mjs'
      - 'tests/icrsp-2026-nov09-rubric-hold-phone.mjs'
      - 'src/home/today-h4-view.js'
      - 'data/research/icrsp-france-ordo-2026-11-09-29-independent.v1.json'
      - 'tests/github-pages-phone-live-acceptance.mjs'
      - 'tests/pray-holy-face-1895-french-live-pages-phone.mjs'
      - 'tests/pray-public-pages-library-witness-phone-20261111.mjs'
      - 'tests/installed-pages-live-phone.mjs'
      - 'tests/pray-three-mass-sequences-live-pages-phone.mjs'
      - '.github/workflows/github-pages.yml'
  pull_request:
    paths:
      - 'sw.js'
      - 'tests/offline-snapshot-e2e.mjs'
      - '.github/workflows/github-pages.yml'
      - 'tools/prepare-github-pages-release.mjs'
      - 'tools/check-github-pages-live.mjs'
      - 'tools/github-pages-release-proof.mjs'
      - 'tests/github-pages-release-proof.test.mjs'
      - 'tests/github-pages-phone-live-acceptance.mjs'
      - 'tests/pray-holy-face-1895-french-live-pages-phone.mjs'
      - 'tests/pray-public-pages-library-witness-phone-20261111.mjs'
      - 'tests/installed-pages-live-phone.mjs'
      - 'tools/build-web-preview.mjs'
      - 'tests/prayer-stations-curated-release-hold.mjs'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR preflight cannot cancel an ongoing main production release.
# Allow the active production upload+deploy+smoke to finish even if main advances.
concurrency:
  group: ad-orientem-github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build static GitHub Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public postdeploy smoke code
        run: node --check tools/check-github-pages-live.mjs && node --check tools/prepare-github-pages-release.mjs && node --check tools/github-pages-release-proof.mjs
      - name: Reject stale source SHA, workflow run and changed critical assets
        run: node --test tests/github-pages-release-proof.test.mjs
      - name: Fail the release for missing ICRSP source expectations or falsely certified unreviewed Masses
        run: node tests/icrsp-france-21day-independent-source-gate.mjs
      - name: Fail release for missing 9 Nov St Theodore 1962 Low Mass oration source
        run: node tests/1962-nov09-theodore-commemoration.mjs
      - name: Verify St Martin 1962 source Gloria against conflicting upstream Proper
        run: node tests/1962-st-martin-gloria-source.mjs
      - name: Validate public 390px LIVE/Missal and returning-user phone smoke code
        run: node --check tests/github-pages-phone-live-acceptance.mjs && node --check tests/pray-holy-face-1895-french-live-pages-phone.mjs && node --check tests/pray-public-pages-library-witness-phone-20261111.mjs
      - name: Validate public committed offline snapshot and consent test code
        run: node --check tests/installed-pages-live-phone.mjs && node --check tests/offline-snapshot-e2e.mjs && node tests/installed-pages-first-boot-retry-contract.mjs
      - name: Build allowlisted static release
        run: node tools/build-web-preview.mjs
      - name: Validate base path, noindex, release safety and 1GB Pages cap
        run: node tools/prepare-github-pages-release.mjs
      - name: Verify fourteen archived Stations photographs cannot leak into Pages
        run: node tests/prayer-stations-curated-release-hold.mjs
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-preview

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish site
        id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live GitHub Pages publication
        env:
          GITHUB_PAGES_URL: ${{ steps.pages.outputs.page_url }}
        run: node tools/check-github-pages-live.mjs

  public-phone:
    name: Verify deployed 390px LIVE Missal Schola EN FR and returning user
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise published phone reader and original GitHub Pages service worker
        env:
          AO_PAGES_URL: https://fulcanelli13.github.io/ad-orientem/
        run: node tests/github-pages-phone-live-acceptance.mjs
      - name: Verify original French 1895 Holy Face Novena all nine days live on 320/390 EN/FR phones
        env:
          AO_PAGES_URL: https://fulcanelli13.github.io/ad-orientem/
        run: node tests/pray-holy-face-1895-french-live-pages-phone.mjs
      - name: Check real public Prayer Library English/French source and Communion fallback at 320/390
        env:
          AO_PAGES_URL: https://fulcanelli13.github.io/ad-orientem/
        run: node tests/pray-public-pages-library-witness-phone-20261111.mjs
      - name: Preserve public deployment phone screenshots and read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-public-phone-enfr-390
          path: artifacts/github-pages-phone/
          if-no-files-found: warn
          retention-days: 14

  public-prayer-sequences:
    name: Verify public PRAY three Mass sequences 320/390 EN/FR
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify exact deployed source, all three appointed Sequentiae, EN/FR 320/390px
        env:
          AO_PAGES_URL: https://fulcanelli13.github.io/ad-orientem/
        run: node tests/pray-three-mass-sequences-live-pages-phone.mjs

  public-offline:
    name: Verify public staged snapshot, offline reload and update settings
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify first completed public snapshot, disconnected Home and Settings
        run: node tests/installed-pages-live-phone.mjs
      - name: Preserve live disconnected phone, version and settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-public-offline-snapshot
          path: test-output/installed-pages-phone/
          if-no-files-found: warn
          retention-days: 14
