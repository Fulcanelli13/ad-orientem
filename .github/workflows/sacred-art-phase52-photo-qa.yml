name: Sacred Art Phase 52 — source photo QA (research only)
on:
  push:
    branches:
      - research/sacred-art-phase48-crosswalk-recovery-20261108
    paths:
      - 'data/artwork/phase52-toulouse-photographic-acquisition.v1.json'
      - 'scripts/art/phase52_acquire_photo.py'
      - '.github/workflows/sacred-art-phase52-photo-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: phase52-photo-check
  cancel-in-progress: true
jobs:
  verify-photos:
    name: Check exact source photograph bytes; research artifact only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review-only image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Parse manifest without downloading or publishing
        run: python scripts/art/phase52_acquire_photo.py --dry-run --out phase52-review-output
      - name: Acquire two photo originals; verify source SHA1, pixels and dimensions; build side-by-side reviewer sheets
        run: python scripts/art/phase52_acquire_photo.py --out phase52-review-output
      - name: Preserve any verified photograph and contact sheet privately even if another download fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase52-toulouse-source-photo-review
          path: |
            phase52-review-output/*-contact-sheet.jpg
            phase52-review-output/*-candidate.jpg
            phase52-review-output/*-owner-original.jpg
            phase52-review-output/run-report.json
            phase52-review-output/PHOTO-LICENSE-AND-STATUS.txt
          retention-days: 1
          if-no-files-found: warn
