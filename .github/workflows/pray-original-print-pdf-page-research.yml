name: Prayer original printed PDF page research
on:
  pull_request:
    paths:
      - 'tools/pray/scan-original-print-pages.mjs'
      - 'data/pray/original-print-witness-locators-20261029.v1.json'
      - '.github/workflows/pray-original-print-pdf-page-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-print-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify free source PDF tools and deterministic matcher
        run: |
          command -v curl
          command -v pdftotext
          command -v pdfinfo
          command -v pdftoppm
          node tools/pray/scan-original-print-pages.mjs --self-test
      - name: Screen full 72-day original PDF page-text layer, four book cohorts
        run: node tools/pray/scan-original-print-pages.mjs --out /tmp/pray-print-scan
      - name: Archive metadata and small source-page review images, not original PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pray-original-pdf-72-day-research
          path: |
            /tmp/pray-print-scan/original-print-pdf-page-research.json
            /tmp/pray-print-scan/*.png
          retention-days: 3
