name: Ad Orientem B21 museum-first acquisition
on:
  push:
    branches:
      - research/b19-original-image-acquisition-probe-20261023
    paths:
      - .github/workflows/ao-b21-museum95-acquisition.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire-museum-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoding dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Acquire from museum Open Access APIs after per-object rights check
        run: |
          python scripts/research/sacred_art_acquire.py \
            --manifest data/research/sacred-art-b21-museum95.manifest.json \
            --output artifacts/sacred-art-b21-museum95 \
            --max-files 75 \
            --max-bytes 950000000
      - name: Upload originals and audit (research only; do not publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-orientem-b21-museum95-originals-and-audit
          path: artifacts/sacred-art-b21-museum95/
          retention-days: 7
          if-no-files-found: warn
      - name: P0 gate - archive unchanged acquisition files in an unpublished GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_release_archive_gate.py --wave b21 --source-dir artifacts/sacred-art-b21-museum95
