name: Prayer — both R33 Easter Vigil Litanies source and phone
on:
  pull_request:
    branches:
      - main
      - feat/pray-rogations-full-latin-litany-reader-20261110
    paths:
      - 'src/pray/easter-vigil-two-litanies.v1.js'
      - 'src/pray/presentation-runtime.js'
      - 'src/pray/litany-1962-use-policy.js'
      - 'data/presentation/reader-easter-vigil.v1.json'
      - 'sw.js'
      - 'tests/pray-easter-vigil-litanies-source-20261110.mjs'
      - 'tests/pray-easter-vigil-litanies-phone-20261110.mjs'
      - '.github/workflows/pray-easter-vigil-both-litanies.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-easter-vigil-litanies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pray-easter-vigil-litanies-source-20261110.mjs
      - run: node tests/pray-penitential-litany-tenebrae-source-faces-v1.mjs
  complete-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Both original Litany parts on EN/FR 320px and 390px phones
        run: node tests/pray-easter-vigil-litanies-phone-20261110.mjs
