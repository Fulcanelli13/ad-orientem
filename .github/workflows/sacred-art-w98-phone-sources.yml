name: Sacred Art W98 Mobile Source Image Acquisition
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - data/calendar/sacred-art-review-uploads/20261016-w98-mobile-original-icon-podesti-photo-retrieval.v1.json
      - tools/calendar/acquire-sacred-art-w98-phone-originals.py
      - .github/workflows/sacred-art-w98-phone-sources.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Acquire three Commons originals and render contain-fit phone proofs
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w98-phone-originals.py
          python tools/calendar/acquire-sacred-art-w98-phone-originals.py
      - name: Archive full source bytes and 390 px phone previews for offline visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w98-mobile-390px-original-photo-proofs
          path: artifacts/sacred-art-w98-mobile-source-photo-proof/
          retention-days: 30
          if-no-files-found: warn
