name: ICRSP B23 one-time source scan archival
on:
  push:
    branches: [governance/icrsp-source-inventory-1665]
    paths:
      - '.github/workflows/icrsp-b23-archive-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/icrsp-source-inventory-1665
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover five successful read-only B23 source-scan shards
        uses: actions/download-artifact@v4
        with:
          run-id: 40305221241
          github-token: ${{ github.token }}
          repository: Fulcanelli13/ad-orientem
          pattern: icrsp-b23-*
          path: /tmp/icrsp-b23
          merge-multiple: false
      - name: Reconcile all 233 source IDs and preserve nonprose evidence
        run: |
          python tools/icrsp/consolidate_b23_233_source_signals.py \
            --input-dir /tmp/icrsp-b23 \
            --manifest data/source-text/icrsp-france-b22-233-distinct-source-body-scan-queue.v1.json \
            --output data/source-text/icrsp-france-b23-233-automated-commentary-signals.v1.json
      - name: Make only the source metadata durable in this research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-text/icrsp-france-b23-233-automated-commentary-signals.v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(icrsp): archive 233 automated article source-body signal records'
          git pull --rebase origin governance/icrsp-source-inventory-1665
          git push origin HEAD:refs/heads/governance/icrsp-source-inventory-1665
