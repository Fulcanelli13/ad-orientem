name: Promote reviewed shrine photographs (exact IDs only)
on:
  pull_request:
    paths:
      - "scripts/promote_reviewed_shrine_photos.py"
      - "data/geography/research/shrine-seven-photo-recovery-20261021.v1.json"
      - ".github/workflows/shrine-photo-reviewed-promotion.yml"
permissions:
  contents: write
jobs:
  promote-after-verified-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/shrines-pilgrimages-marian-editorial-inventory-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Revalidate original Commons SHA1/licences and materialize five reviewed images
        run: python scripts/promote_reviewed_shrine_photos.py
      - name: Commit exact reviewed WebP assets and source metadata to the PR head
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_REF" --no-tags
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$REMOTE_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "PR head changed; refusing to push stale photo data."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/approved/place-media/FR-sanctuaire-notre-dame-de-laghet.webp
          git add -- assets/approved/place-media/FR-sanctuary-of-our-lady-of-rocamadour.webp
          git add -- assets/approved/place-media/IE-lough-derg-station-island.webp
          git add -- assets/approved/place-media/IE-croagh-patrick-murrisk-pilgrimage-base.webp
          git add -- assets/approved/place-media/IE-st-peters-oliver-plunkett-drogheda.webp
          git add -- data/geography/approved-place-media.v1.json
          git add -- data/shrines/editorial-master-inventory-20261021.v1.json
          git add -- tests/shrine-marian-editorial-inventory-contract.mjs
          if git diff --cached --quiet; then
            echo "Already promoted; no changes needed."
            exit 0
          fi
          git commit -m "Explore: publish five inspected site photos with verified Commons provenance"
          git push origin "HEAD:refs/heads/$TARGET_REF"
