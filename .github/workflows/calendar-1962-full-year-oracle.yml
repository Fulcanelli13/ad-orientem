name: Calendar 1962 full-year oracle

on:
  pull_request:
    paths:
      - "tools/calendar/full-year-1962-oracle.mjs"
      - ".github/workflows/calendar-1962-full-year-oracle.yml"
      - "ao-boot-*.js"
      - "data/calendar/1962-ordo-corrections.v1.json"
      - "tests/calendar-ordo-corrections.mjs"
      - "tests/calendar-1962-rogations-commemoration-e2e.mjs"
      - "tools/calendar/secondary-1962-oracle.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-2024-2027:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check local 1962 source registry
        run: |
          node tests/calendar-ordo-corrections.mjs
          npm run test:calendar
      - name: Check Mass-reader and Proper contracts
        run: |
          npm run test:reader
          npm run test:reader-rogations
          npm run test:proper
          npm run test:app-shell-contract
          npm run test:reader-proper-recovery
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Check production Mass reader and shell on phones
        run: |
          node tests/reader-phone-acceptance.mjs
          node tests/app-shell-final-e2e.mjs
      - name: Verify Rogation ordinary Proper and privileged commemoration prayers
        run: node tests/calendar-1962-rogations-commemoration-e2e.mjs
      - name: Inspect both full civil years against independent 1962 calendar
        run: node tools/calendar/full-year-1962-oracle.mjs --strict
      - name: Reconcile full years with independent second 1962 calendar
        run: node tools/calendar/secondary-1962-oracle.mjs
      - name: Upload independent calendar audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-1962-full-year-comparison
          path: |
            artifacts/calendar-1962-full-year-audit.json
            artifacts/calendar-1962-secondary-reconciliation.json
          if-no-files-found: error
