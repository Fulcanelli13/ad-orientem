name: Mass exact-source icon phone geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/mass/reader-rail-anchors.js'
      - 'tests/reader-rail-source-geometry-phone.mjs'
      - '.github/workflows/mass-source-icon-geometry-phone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Inspect source-anchored priest and faithful artwork at 320px and 390px
        run: node tests/reader-rail-source-geometry-phone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-exact-source-icon-phone-geometry
          path: artifacts/mass-source-rail-geometry/
          if-no-files-found: warn
          retention-days: 7
