name: Approved Mass source discovery

on:
  pull_request:
    paths:
      - "tools/directory/discover-approved-mass-worldwide.mjs"
      - "tests/directory-approved-mass-discovery.mjs"
      - ".github/workflows/approved-mass-discovery.yml"
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes, comma separated (set all to inspect entire approved directory)"
        default: "all"
        required: true
        type: string
      max_pages:
        description: "Maximum number of country list pages (up to 200)"
        default: "200"
        required: true
        type: string
      max_details:
        description: "Maximum venue detail pages to inspect"
        default: "0"
        required: true
        type: string

concurrency:
  group: approved-mass-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install source reader and browser
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Offline parser and provenance regression
        run: |
          node tests/directory-approved-mass-discovery.mjs
          node tests/directory-approved-mass-crosswalk.mjs
      - name: Bounded source snapshot (research only)
        if: github.event_name == 'workflow_dispatch'
        env:
          COUNTRY_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.countries || 'all' }}
          PAGE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages || '200' }}
          DETAIL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_details || '25' }}
        run: |
          mkdir -p out/source-discovery
          node tools/directory/discover-approved-mass-worldwide.mjs \
            --remote \
            --countries="$COUNTRY_CODES" \
            --max-pages="$PAGE_LIMIT" \
            --max-details="$DETAIL_LIMIT" \
            --delay-ms=1800 \
            --out=out/source-discovery/approved-mass-candidates.json
      - name: Reconcile research candidates against all active Find records
        if: github.event_name == 'workflow_dispatch'
        run: |
          node tools/directory/reconcile-approved-mass-candidates.mjs \
            out/source-discovery/approved-mass-candidates.json \
            out/source-discovery/approved-mass-crosswalk.json
      - name: Upload unpublished source-discovery candidates
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: approved-mass-source-discovery
          path: |
            out/source-discovery/approved-mass-candidates.json
            out/source-discovery/approved-mass-crosswalk.json
          if-no-files-found: warn
          retention-days: 14

