name: Approved Mass source discovery

on:
  pull_request:
    paths:
      - "tools/directory/discover-approved-mass-worldwide.mjs"
      - "tests/directory-approved-mass-discovery.mjs"
      - ".github/workflows/approved-mass-discovery.yml"
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes, comma separated (set all to inspect entire approved directory)"
        default: "all"
        required: true
        type: string
      max_pages:
        description: "Maximum number of country list pages (up to 200)"
        default: "200"
        required: true
        type: string
      max_details:
        description: "Maximum venue detail pages to inspect"
        default: "0"
        required: true
        type: string

jobs:
  research-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline parser and provenance regression
        run: node tests/directory-approved-mass-discovery.mjs
      - name: Bounded source snapshot (research only)
        env:
          COUNTRY_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.countries || 'all' }}
          PAGE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages || '200' }}
          DETAIL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_details || '0' }}
        run: |
          mkdir -p out/source-discovery
          node tools/directory/discover-approved-mass-worldwide.mjs \
            --remote \
            --countries="$COUNTRY_CODES" \
            --max-pages="$PAGE_LIMIT" \
            --max-details="$DETAIL_LIMIT" \
            --delay-ms=1800 \
            --out=out/source-discovery/approved-mass-candidates.json
      - name: Upload unpublished source-discovery candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-mass-source-discovery
          path: out/source-discovery/approved-mass-candidates.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit staged source census to PR research folder
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && success()
        run: |
          mkdir -p data/directory/research
          cp out/source-discovery/approved-mass-candidates.json data/directory/research/approved-mass-worldwide-candidates-20261009.v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory/research/approved-mass-worldwide-candidates-20261009.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "research(directory): capture source-only approved Mass worldwide census"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          fi
