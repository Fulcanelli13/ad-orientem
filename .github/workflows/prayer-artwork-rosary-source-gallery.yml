name: Prayer Rosary source-photo QA gallery (unpublished)
on:
  push:
    branches: [research/prayer-artwork-approved-reuse-wave1-20261031]
    paths:
      - .github/workflows/prayer-artwork-rosary-source-gallery.yml
      - scripts/art/build-prayer-rosary-staging-gallery.mjs
      - data/prayer/artwork-editorial-20261101/photo-release-acquisition-queue-267-20261101.v1.json
      - data/prayer/artwork-editorial-20261101/prayer-rosary-b02-acquisition-results.v1.json
      - assets/staged/prayer-artwork-originals-20261101/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prayer-artwork-rosary-source-gallery
  cancel-in-progress: true
jobs:
  render-gallery:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-approved-reuse-wave1-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged B02 bytes and publication lock before gallery
        run: node --test tests/prayer-artwork-rosary-b02-acquisition-contract.mjs
      - name: Generate 11-mystery contact sheet from actual staged photographs
        run: node scripts/art/build-prayer-rosary-staging-gallery.mjs
      - name: Verify public Prayer image manifest remains empty
        run: |
          node --input-type=module - <<'JS'
          import {PRAYER_RELEASED_IMAGE_ASSETS_V1} from './src/pray/artwork-release-runtime.js';
          if(Object.keys(PRAYER_RELEASED_IMAGE_ASSETS_V1).length!==0) throw new Error('Source gallery cannot publish images');
          JS
      - name: Commit QA gallery only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/research/prayer-rosary-source-contact-gallery-20261101.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(prayer-art): update source-photo QA gallery without publishing images'
            git pull --rebase origin research/prayer-artwork-approved-reuse-wave1-20261031
            git push origin HEAD:refs/heads/research/prayer-artwork-approved-reuse-wave1-20261031
          fi
