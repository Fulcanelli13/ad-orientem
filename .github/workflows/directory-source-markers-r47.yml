name: Directory R47 Direct Source Coordinates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover exact provider venue coordinates
        run: node tools/directory/recover-original-markers-r47.mjs ${{ matrix.shard }}
      - name: Upload original source markers for deduplication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r47-original-source-coordinates-${{ matrix.shard }}
          path: ${{ runner.temp }}/r47-original-${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: warn
