name: Archived module hero originals — 20 source-integrity and visual-review pack
on:
  pull_request:
    paths:
      - "scripts/art/module-hero-twenty-source-originals-review.py"
      - ".github/workflows/module-hero-20-originals-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-twenty-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Reconstruct archived originals, verify declared SHA256/pixels and inspect
        run: python scripts/art/module-hero-twenty-source-originals-review.py
      - name: Keep only review sheets, never publish the master originals
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-hero-20-originals-visual-review
          path: artifacts/module-hero-originals-20-inspection/
          retention-days: 14
          if-no-files-found: warn
