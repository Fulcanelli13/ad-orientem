name: Sacred Places bulk screening P39 (read-only)
on:
  pull_request:
    paths:
      - "tools/geography/sacred-places-bulk-screen.mjs"
      - "tests/sacred-places-bulk-screen.mjs"
      - "data/geography/research/sacred-places-p39-global500-open68-reconciliation.v1.json"
      - ".github/workflows/sacred-places-p39-bulk-screen.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all source-of-truth reconciliation invariants offline
        run: node tests/sacred-places-bulk-screen.mjs
      - name: Dry-run bounded research scope
        run: node tools/geography/sacred-places-bulk-screen.mjs --dry-run
      - name: Screen all 68 remaining cases on OSM (zero publication)
        run: node tools/geography/sacred-places-bulk-screen.mjs --network
      - name: Temporary transport for reviewed permanent archival commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p39-68-osm-research-evidence-not-canonical
          path: data/geography/research/sacred-places-p39-open68-osm-evidence.v1.json
          if-no-files-found: ignore
          retention-days: 1
