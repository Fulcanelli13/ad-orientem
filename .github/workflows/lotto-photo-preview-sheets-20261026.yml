name: Lotto original photograph visual-review sheets
on:
  push:
    branches: [main]
    paths: [.github/workflows/lotto-photo-preview-sheets-20261026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - run: cp scripts/art/make-module-hero-review-previews.py /tmp/qa-lotto.py
      - name: Build visually inspectable comparisons from actual two original photos
        env:
          AO_HERO_PREVIEW_INPUT: assets/staged/module-hero-comparisons
        run: |
          git fetch origin research/lotto-rosary-photo-comparison-20261026
          git switch -C research/lotto-rosary-photo-comparison-20261026 origin/research/lotto-rosary-photo-comparison-20261026
          python /tmp/qa-lotto.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/staged/module-hero-preview-jpegs/
          git commit -m "research(art): unenhanced small previews and native detail crops of two Lotto photos"
          git push origin research/lotto-rosary-photo-comparison-20261026
      - run: echo "No painting hero swap and no visual QA autopromotion."
