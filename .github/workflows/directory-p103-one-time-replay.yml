name: Directory P103 one-time clean photo release replay
on:
  pull_request:
    paths:
      - .github/workflows/directory-p103-one-time-replay.yml
permissions:
  contents: write
jobs:
  replay-only-p102-delta:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p103-three-directory-photos-clean-main-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Fetch immutable P102 source history (includes P99 source ancestor)
        run: git fetch --depth=100 origin release/p102-three-approved-directory-church-photos-20261029
      - name: Replay only P102 changes onto squash-merged P99 main
        shell: bash
        run: |
          git cat-file -e c38a0ef2d88d70724ced1ab392d122521362a9e0^{commit}
          git cat-file -e eeb5560ad2d461fdc3b0bdd80713dde590274d1c^{commit}
          git diff --binary c38a0ef2d88d70724ced1ab392d122521362a9e0 eeb5560ad2d461fdc3b0bdd80713dde590274d1c > /tmp/p102-only.patch
          test -s /tmp/p102-only.patch
          git apply --3way --index /tmp/p102-only.patch
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'media(directory): replay only three source-verified P102 photo covers onto main'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
