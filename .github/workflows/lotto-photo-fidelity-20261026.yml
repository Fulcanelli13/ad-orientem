name: Lotto Rosary archived original-photo fidelity (read-only, €0)
on:
  push:
    branches: [main]
    paths: [.github/workflows/lotto-photo-fidelity-20261026.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/lotto-photo-fidelity-20261026.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-preserved-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact production workflow revision
        uses: actions/checkout@v4
      - name: Checkout already archived research originals; never write or publish
        uses: actions/checkout@v4
        with:
          ref: research/lotto-rosary-photo-comparison-20261026
          path: lotto-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Run shared permanent research archive verifier against all three originals
        run: |
          python scripts/art/verify-research-archive-readonly.py \
            --archive-root lotto-research \
            --source-prefix assets/staged/module-hero-comparisons \
            --min-originals 3 \
            --report data/research/lotto-rosary-photo-comparison-20261026.json \
            --report data/research/lotto-rosary-yorck-third-witness-20261026.json \
            --check-previews
      - name: Verify three preserved photos against archive source metadata and SHA-256
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          research=Path("lotto-research")
          root=research.resolve()
          report=json.loads((research/"data/research/lotto-rosary-photo-comparison-20261026.json").read_text())
          assert report["type"]=="frozen selection reproduction comparison ONLY"
          assert report["primary_approved_artist"]=="Lorenzo Lotto"
          assert report["editorial_change"] is False
          rows=report["results"]
          assert len(rows)==2 and {r["filename"] for r in rows}=={
              "Lorenzo_lotto,_madonna_del_rosario,_1539,_01.jpg",
              "Lorenzo_lotto,_madonna_del_rosario,_1539,_11.jpg",
          }
          for item in rows:
              assert item["status"]=="STAGED_NOT_APPROVED"
              assert item["licence"]=="CC BY 3.0" and item["photographer"]=="Sailko"
              assert item["credit_required"] is True and item["edit_disclosure_required"] is True
              assert item["visual_quality_passed"] is False
              assert item["source_page"].startswith("https://commons.wikimedia.org/wiki/File")
              path=(research/item["path"]).resolve()
              assert path.is_relative_to(root/"assets/staged/module-hero-comparisons")
              data=path.read_bytes()
              assert len(data)==item["bytes"]
              assert hashlib.sha256(data).hexdigest()==item["sha256"]
              with Image.open(path) as im:
                  assert im.format=="JPEG" and im.size==(item["width"],item["height"])
                  im.verify()
          third=json.loads((research/"data/research/lotto-rosary-yorck-third-witness-20261026.json").read_text())
          assert third["editorial_selection_changed"] is False and third["app_published"] is False
          assert third["painting_fidelity"]=="PENDING HUMAN VISUAL COMPARISON"
          assert third["rights_validation"]=="PD-Art; jurisdiction check remains"
          path=(research/third["path"]).resolve()
          assert path.is_relative_to(root/"assets/staged/module-hero-comparisons")
          data=path.read_bytes()
          assert len(data)==third["bytes"]
          assert hashlib.sha256(data).hexdigest()==third["sha256"]
          with Image.open(path) as im:
              assert im.format=="JPEG" and im.size==(third["width"],third["height"])
              im.verify()
          print("PASS three permanently archived Lotto research originals (checksum, dimensions, provenance).")
          print("Source licence assertions are recorded metadata, NOT new licensing decisions.")
          print("Visual quality, photo rights, credit layout, cropping and app publication remain held.")
          PY
