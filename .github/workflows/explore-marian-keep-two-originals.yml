name: Explore — two historical KEEP Marian object photographs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'tools/explore-marian-keep-two-acquire.py'
      - 'data/geography/research/marian-keep-two-release-source-pins-20261101.v1.json'
      - 'data/geography/approved-place-gallery.v1.json'
      - 'tests/explore-marian-keep-two-first-gallery.mjs'
      - 'tests/explore-p77-reviewed-place-photos.mjs'
      - '.github/workflows/explore-marian-keep-two-originals.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ao-marian-keep-two-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  acquire-verify-and-stage:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/explore-marian-object-keep-two-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch exactly two named original photos with native SHA1 and rights verification
        run: python tools/explore-marian-keep-two-acquire.py
      - name: Test local image bytes, exact Place, source, licence and previous gallery regression
        run: |
          node tests/explore-marian-keep-two-first-gallery.mjs
          node tests/explore-p77-reviewed-place-photos.mjs
          node tests/explore-approved-gallery-cover-reuse-20261031.mjs
      # Source discovery/verification is read-only. Exact verified originals are
      # staged as review artifacts; publication remains a separate approved PR.
      - name: Stage verified original photographs for explicit review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marian-keep-two-reviewed-originals
          path: |
            assets/approved/place-gallery/PL-jasna-gora-venerated-black-madonna-icon-2024.webp
            assets/approved/place-gallery/DE-altoetting-venerated-black-madonna-2013.webp
            data/geography/approved-place-gallery.v1.json
          if-no-files-found: warn
          retention-days: 7
