name: Directory P102 exact staged-to-approved WebP restoration
on:
  pull_request:
    paths:
      - tools/directory/restore-p102-approved-webp.py
      - data/directory/research/p102-three-photo-approved-media-source-lock.json
      - .github/workflows/directory-p102-restored-photos.yml
permissions:
  contents: write
jobs:
  restore-byte-identical-media:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p102-three-approved-directory-church-photos-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Fetch original P101 stage branch with pinned commit history
        run: git fetch --depth=30 origin research/p101-three-verified-directory-derivatives-20261029
      - name: Restore byte-identical source-checked WebPs
        run: python3 tools/directory/restore-p102-approved-webp.py
      - name: Commit permanent approved-path bytes and audit (metadata remains separately reviewed)
        shell: bash
        run: |
          git add assets/approved/place-media/US-st-john-cantius-chicago.webp \
            assets/approved/place-media/IT-san-canziano-padova.webp \
            assets/approved/place-media/FR-saint-bruno-bordeaux.webp \
            data/directory/research/p102-three-photo-approved-bytes-audit.json
          if git diff --cached --quiet; then
            echo "Approved-path binary files already match exact expected hashes"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'media(directory): restore exact three approved-path WebP bytes from P101'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
