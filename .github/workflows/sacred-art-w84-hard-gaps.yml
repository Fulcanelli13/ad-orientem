name: Sacred Art W84 Hard Gap Images
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - tools/calendar/acquire-sacred-art-w84-hard-gaps.py
      - .github/workflows/sacred-art-w84-hard-gaps.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - name: Acquire W84 exact physical originals as image bytes
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w84-hard-gaps.py
          python tools/calendar/acquire-sacred-art-w84-hard-gaps.py
      - name: Preserve checksummed originals and uncropped review reproductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w84-hard-gap-source-images
          path: |
            artifacts/sacred-art-w84-image-acquisition/
            docs/research/review-galleries/acquired/
          retention-days: 30
          if-no-files-found: warn
