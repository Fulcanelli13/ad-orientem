name: Prayer Sacred Art - B2 acquire 14 image source groups
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/prayer-art-b2-bulk-acquisition-20261028.yml
      - scripts/art/prayer-sacred-art-bulk-acquisition-b2-20261028.py
      - data/research/prayer-sacred-art-bulk-acquisition-b2-20261028.v1.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prayer-art-b2-native-source-intake
  cancel-in-progress: false
jobs:
  discover-and-archive-exact-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free offline image verification dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Bulk source discovery and native-only acquisition
        run: |
          python -m py_compile scripts/art/prayer-sacred-art-bulk-acquisition-b2-20261028.py
          python scripts/art/prayer-sacred-art-bulk-acquisition-b2-20261028.py
      - name: Archive source files and research records persistently, without fees
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-art-bulk-acquisition-b2-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then echo "No new source evidence"; exit 0; fi
          git commit -m "research(prayer art): preserve 14-case native-source acquisition results and SHA proofs"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
