name: Mass Batch A focused acceptance

on:
  pull_request:
    paths:
      - "src/mass/reader-liturgical-theme.js"
      - "src/mass/reader-dom.js"
      - "src/mass/reader-icons.js"
      - "src/mass/reader-gesture-matrix.js"
      - "data/mass/gesture-matrix.v1.json"
      - "tests/mass-batch-a-theme-icons.mjs"
      - "tests/reader-dom.mjs"
      - "tests/reader-native-preview.mjs"
      - "tests/reader-rubric-events.mjs"
      - ".github/workflows/mass-batch-a.yml"
      - "tests/mass-batch-a-schola-nav.mjs"
      - "tests/mass-visual-acceptance.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mass-batch-a:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Liturgical-theme and frozen-master binding gates
        run: |
          node tests/mass-batch-a-theme-icons.mjs
          node tests/reader-icons.mjs
          node tests/reader-dom.mjs
          node tests/reader-native-preview.mjs
          node tests/reader-rubric-events.mjs

  real-shell-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Schola-to-section real-shell navigation
        run: node tests/mass-batch-a-schola-nav.mjs
      - name: Full Mass visual acceptance with bounded locator waits
        run: node tests/mass-visual-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-batch-a-visual
          path: artifacts/visual-acceptance
          if-no-files-found: warn

