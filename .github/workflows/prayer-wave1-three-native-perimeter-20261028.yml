name: Prayer Wave 1 - three hero native perimeter sheets
on:
  push:
    branches:
      - research/prayer-existing-sacred-art-mosaic-20261028
    paths:
      - .github/workflows/prayer-wave1-three-native-perimeter-20261028.yml
      - scripts/art/prayer-wave1-three-native-perimeter-20261028.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ao-prayer-wave1-native-perimeter-20261028
  cancel-in-progress: false

jobs:
  generate-native-research-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only research branch
        uses: actions/checkout@v4
        with:
          ref: research/prayer-existing-sacred-art-mosaic-20261028
      - name: Install Pillow from existing free tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify pinned SHA256 and make visual research sheets
        run: |
          python -m py_compile scripts/art/prayer-wave1-three-native-perimeter-20261028.py
          python scripts/art/prayer-wave1-three-native-perimeter-20261028.py
      - name: Preserve research QA sheets permanently in branch, never in production
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-wave1-native-perimeter-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then echo "No review changes"; exit 0; fi
          git commit -m "research(prayer art): archive three sha-pinned native perimeter contact sheets"
          git pull --rebase origin research/prayer-existing-sacred-art-mosaic-20261028
          git push origin HEAD:research/prayer-existing-sacred-art-mosaic-20261028
