name: Today v2 — canonical homepage convergence

on:
  push:
    branches: [feat/today-v2-complete-convergence-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Today component and ESM syntax
        run: |
          node --check src/home/presentation.js
          node --check src/home/browser-entry.js
          node --check src/home/today-v2-styles.js
          node --check src/home/today-v2-sections.js
          node tests/today-v2-convergence.mjs
      - name: Core Home ownership and R17 resume
        run: |
          node tests/home-presentation.mjs
          node tests/home-owner.mjs
          node tests/home-enrichers.mjs
      - name: Design tokens and Calendar source
        run: |
          node tests/design-system-coherence.mjs
          node tests/calendar-liturgical-year.mjs
