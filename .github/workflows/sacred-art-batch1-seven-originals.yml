name: Sacred Art Batch 1 — seven original photo source QA (private)
on:
  push:
    branches:
      - research/sacred-art-batch1-seven-physical-photos-20261108
    paths:
      - 'data/artwork/batch1-seven-photos-acquisition.v1.json'
      - 'scripts/art/batch1_seven_original_photo_qa.py'
      - 'tests/sacred-art-batch1-seven-sources.mjs'
      - '.github/workflows/sacred-art-batch1-seven-originals.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sacred-art-batch1-seven-sources
  cancel-in-progress: true
jobs:
  private-original-source-qa:
    name: Archive selected original sources, no publication
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical source identities, 26 placements, no-release policy
        run: node tests/sacred-art-batch1-seven-sources.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image QA dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Validate script syntax
        run: python -m py_compile scripts/art/batch1_seven_original_photo_qa.py
      - name: Execute acquisition dry run
        run: python scripts/art/batch1_seven_original_photo_qa.py --dry-run
      - name: Acquire six specified original files with rate limiting; retain seventh no-source hold
        run: python scripts/art/batch1_seven_original_photo_qa.py
      - name: Upload private source QA evidence even on partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-seven-source-original-qa-private
          path: |
            artifacts/sacred-art-batch1-seven/*
          retention-days: 14
          if-no-files-found: warn
