name: Temporary startup split on isolated review branch
on:
  push:
    branches:
      - performance/split-startup-payload-20261009
    paths:
      - tools/split-production-html.mjs
      - .github/workflows/temporary-startup-split.yml
permissions:
  contents: write
jobs:
  split-and-validate:
    if: github.ref == 'refs/heads/performance/split-startup-payload-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/split-startup-payload-20261009
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Split the large HTML without changing script execution order
        run: |
          node tools/split-production-html.mjs --apply > /tmp/ao-split-report.json
          node -e 'let a=require("/tmp/ao-split-report.json"); console.log("HTML BEFORE",a.originalHtmlBytes,"HTML AFTER",a.reducedHtmlBytes,"EXTRACTED",a.extractedCount,"GIN ORIGINAL",a.originalGzipBytes,"GIN AFTER",a.reducedGzipBytes); console.log("RETAINED",JSON.stringify(a.retainedLargeBlocks))'
          node tools/split-production-html.mjs --verify > /tmp/ao-split-verify.log
          cat /tmp/ao-split-verify.log | tail -3
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate application and phone acceptance against split HTML
        run: |
          npm run test:app-shell-contract
          npm run test:source-transport
          npm run test:rc-interaction-qa
          npm run test:phone
      - name: Commit validated generated startup chunks to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/presentation/startup-split-report.v1.json
          find . -maxdepth 1 -type f -name 'ao-boot-*' -print0 | xargs -0 -r git add --
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Split oversized boot HTML into ordered cacheable assets (validated)"
            git push origin HEAD:refs/heads/performance/split-startup-payload-20261009
          fi
