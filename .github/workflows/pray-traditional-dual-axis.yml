name: Traditional daily dual-axis phone acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pray/traditional-pray-runtime.js"
      - "src/pray/daily-ux-pilot.js"
      - "tests/pray-daily-ux-pilot-contract.mjs"
      - "tests/pray-daily-ux-pilot-phone.mjs"
      - "src/pray/traditional-pray-styles.js"
      - "src/pray/devotional-sequence-adapter.js"
      - "tests/pray-traditional-dual-axis-phone.mjs"
      - ".github/workflows/pray-traditional-dual-axis.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node tests/pray-guided-cards.mjs
      - run: node tests/pray-traditional-life.mjs
      - run: node tests/pray-daily-ux-pilot-contract.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/pray-traditional-dual-axis-phone.mjs
      - name: Compare source-owned 11/13 card and continuous daily readers
        run: node tests/pray-daily-ux-pilot-phone.mjs
      - name: Preserve French phone reader screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traditional-daily-dual-axis-phone
          path: |
            artifacts/pray-traditional-daily/
            artifacts/pray-daily-ux-pilot/
          if-no-files-found: warn
          retention-days: 21
