name: Traditional daily dual-axis phone acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pray/traditional-pray-runtime.js"
      - "src/pray/traditional-pray-styles.js"
      - "src/pray/devotional-sequence-adapter.js"
      - "src/pray/litany-responsive.js"
      - "tests/litany-call-response-phone.mjs"
      - "tests/pray-traditional-dual-axis-phone.mjs"
      - ".github/workflows/pray-traditional-dual-axis.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node tests/pray-guided-cards.mjs
      - run: node tests/pray-traditional-life.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/pray-traditional-dual-axis-phone.mjs
      - name: 320/390/430 litany call & response, source-identical EN/FR/LA
        run: node tests/litany-call-response-phone.mjs
      - name: Preserve litany call & response screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litany-call-response-phone
          path: artifacts/litany-call-response-phone
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve French phone reader screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traditional-daily-dual-axis-phone
          path: artifacts/pray-traditional-daily
          if-no-files-found: warn
          retention-days: 21
