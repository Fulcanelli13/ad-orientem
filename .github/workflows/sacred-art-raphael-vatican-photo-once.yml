name: Sacred Art Raphael Vatican one-time source acquisition
on:
  push:
    branches:
      - 'release/sacred-art-raphael-transfiguration-20261111'
    paths:
      - 'data/artwork/releases/2026-03-01-raphael-transfiguration-vatican-source.v1.json'
      - '.github/workflows/sacred-art-raphael-vatican-photo-once.yml'
permissions:
  contents: write
concurrency:
  group: ao-raphael-vatican-photo-once
  cancel-in-progress: false
jobs:
  acquire-source-only:
    if: github.repository == 'Fulcanelli13/ad-orientem' && github.ref == 'refs/heads/release/sacred-art-raphael-transfiguration-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact frozen 2026 target and source metadata
        run: |
          python - <<'PY'
          import json
          p='data/artwork/releases/2026-03-01-raphael-transfiguration-vatican-source.v1.json'
          x=json.load(open(p))
          assert x['date']=='2026-03-01' and x['principalId']=='tempora:Quad2-0:1:v'
          assert x['properPath']=='Tempora/Quad2-0'
          assert x['paintingTitle']=='The Transfiguration' and x['paintingArtist']=='Raphael'
          assert 'MV.40333' in x['canonicalObject']
          assert 'Dulwich' in x['riskNotes'][0] and x['ownerNewPaintingApproval'] is False
          assert x['sourcePhotoExpectedDimensions']==[3737,5691]
          assert x['sourcePhotoDirect'].startswith('https://upload.wikimedia.org/wikipedia/commons/e/eb/')
          PY
      - name: Acquire exact original Commons image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/home/class-i-2026
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -A 'AdOrientemSacredArt/1.0 (+https://github.com/Fulcanelli13/ad-orientem)' \
            'https://upload.wikimedia.org/wikipedia/commons/e/eb/Raffael-verkl%C3%A4rung-christi.jpg' \
            -o /tmp/raphael-vatican-raw.jpg
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          from PIL import Image
          m=json.load(open('data/artwork/releases/2026-03-01-raphael-transfiguration-vatican-source.v1.json'))
          src=pathlib.Path('/tmp/raphael-vatican-raw.jpg')
          data=src.read_bytes()
          assert 2500000<=len(data)<=7500000, 'Unexpected Commons source byte length: '+str(len(data))
          with Image.open(src) as image:
            assert image.format=='JPEG' and list(image.size)==m['sourcePhotoExpectedDimensions'], 'Wrong source / painting dimensions'
            image.verify()
          with Image.open(src) as image:
            image.load()
          dst=pathlib.Path(m['targetOriginal'])
          shutil.copyfile(src,dst)
          out=pathlib.Path('data/artwork/releases/2026-03-01-raphael-vatican-photo-byte-proof.v1.json')
          proof={'schema':'AO_RAPHAEL_2026_VATICAN_PHOTO_BYTE_PROOF_V1',
            'paintingIdentity':m['canonicalObject'],
            'sourceFile':m['sourcePhotoFilePage'],'sourceDirect':m['sourcePhotoDirect'],
            'localImage':m['targetOriginal'],'sha1':hashlib.sha1(data).hexdigest(),
            'sha256':hashlib.sha256(data).hexdigest(),
            'bytes':len(data),'dimensions':m['sourcePhotoExpectedDimensions'],
            'originalKeptUnaltered':True,'sourceIsArtbookScanNotMuseumMaster':True,
            'publicCalendarDisplayReleased':False,'browserCropReviewed':False,
            'ownerNewArtworkDecision':False,'rights':m['sourcePhotoRights']}
          out.write_text(json.dumps(proof,indent=2,ensure_ascii=False)+'\n')
          print('RAPHAEL_VATICAN_BYTE_VERIFIED',proof['sha1'],proof['sha256'],proof['bytes'])
          PY
      - name: Commit verified original and source hash proof only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ad Orientem exact source acquisition'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/home/class-i-2026/raphael-transfiguration-vatican-original.jpg \
            data/artwork/releases/2026-03-01-raphael-vatican-photo-byte-proof.v1.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Sacred Art: retain exact Vatican Raphael artwork JPEG and calculated source hashes'
          git push origin 'HEAD:release/sacred-art-raphael-transfiguration-20261111'
