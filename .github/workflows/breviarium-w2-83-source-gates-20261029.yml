name: Sacred Art Breviarium - Wave 2 eighty-three source identity guards
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/breviarium-w2-83-source-gates-20261029.yml
      - scripts/art/validate-breviarium-w2-83-cross-registry-20261029.mjs
      - data/calendar/sacred-art-breviarium-83-w2-cross-registry-institutional-leads-20261029.v1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-83-source-reconciliation-and-frozen-identity-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
