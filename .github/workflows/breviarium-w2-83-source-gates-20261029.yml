          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect 83 artwork identities, 22 heroes and 103 bans
        run: |
          node --check scripts/art/validate-breviarium-w2-83-cross-registry-20261029.mjs
          node scripts/art/validate-breviarium-w2-83-cross-registry-20261029.mjs
