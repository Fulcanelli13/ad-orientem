name: Sacred Art - Breviarium Gallery Structure Probe
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - scripts/art/breviarium-gallery-probe-20261029.py
      - .github/workflows/breviarium-gallery-probe-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-external-gallery-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python scripts/art/breviarium-gallery-probe-20261029.py
      - name: Persist gallery DOM evidence
        if: always()
        run: |
          if [ ! -f assets/staged/sacred-art-breviarium-source-audit-20261029/structure.json ]; then exit 0; fi
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/sacred-art-breviarium-source-audit-20261029/structure.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(sacred art): archive source-gallery DOM structure"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
