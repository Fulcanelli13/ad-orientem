name: Explore diocesan OSM first 100 live candidates
on:
  push:
    branches:
      - "feature/tlm-visual-fallback-20261030"
    paths:
      - ".github/workflows/explore-diocesan-osm-first100.yml"
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/explore-diocesan-osm-first100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: explore-diocesan-osm-100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    if: >-
      (github.event_name == 'push' &&
       github.ref_name == 'feature/tlm-visual-fallback-20261030') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feature/tlm-visual-fallback-20261030')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scanner
        run: node --check tools/directory/diocesan-osm-candidate-scan.mjs
      - name: Screen first 100 existing provisional sites with OpenStreetMap
        run: >-
          node tools/directory/diocesan-osm-candidate-scan.mjs
          --offset=0 --limit=100
          --output=data/directory/research/diocesan-osm-candidates-0000-100.v1.json
      - name: Validate source identities and candidate-only status
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const file='data/directory/research/diocesan-osm-candidates-0000-100.v1.json';
          const report=JSON.parse(fs.readFileSync(file,'utf8'));
          const ledger=JSON.parse(fs.readFileSync('data/directory/research/diocesan-coordinate-quality-audit-20261031.v1.json','utf8'));
          const known=new Set(ledger.records.map(r=>r.physical_group_id));
          assert.equal(report.schema,'AO_DIOCESAN_OVERPASS_PIN_CANDIDATES_V1');
          assert.equal(report.source_count,442);
          assert.equal(report.offset,0);
          assert.equal(report.limit,100);
          assert.equal(report.rows.length,100);
          assert.equal(new Set(report.rows.map(r=>r.physical_group_id)).size,100);
          assert.ok(report.rows.every(r=>known.has(r.physical_group_id)));
          assert.ok(report.rows.every(r=>r.promote_automatically===false && r.photo_approved===false));
          assert.ok(report.rows.every(r=>r.candidates.every(c=>c.review_status==='CANDIDATE_ONLY_NOT_VERIFIED_NOT_PHOTO_APPROVED')));
          assert.ok(report.rows.some(r=>r.candidates.length>0),'No live OSM candidates returned');
          console.log(JSON.stringify(report.summary));
          NODE
      - name: Permanently commit research output to existing PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory/research/diocesan-osm-candidates-0000-100.v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Explore research: first 100 OSM candidate records (not pin/photo approvals)"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Short-lived emergency fallback if branch write fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-diocesan-osm-first100
          path: data/directory/research/diocesan-osm-candidates-0000-100.v1.json
          if-no-files-found: ignore
          retention-days: 2
