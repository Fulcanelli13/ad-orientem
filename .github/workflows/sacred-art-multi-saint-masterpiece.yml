name: Sacred art — multi-saint museum original
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - "tools/calendar/acquire-multi-saint-masterpiece.py"
      - ".github/workflows/sacred-art-multi-saint-masterpiece.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Retrieve Cleveland museum original and verify source image
        run: python tools/calendar/acquire-multi-saint-masterpiece.py
      - name: Preserve research source and reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-multi-saint-masterpiece
          path: artifacts/sacred-art-multi-saint/
          retention-days: 30
          if-no-files-found: warn
