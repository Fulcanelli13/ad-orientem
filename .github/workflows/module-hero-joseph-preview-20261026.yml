name: Saint Joseph original-image detail review
on:
  push:
    branches: [main]
    paths: [.github/workflows/module-hero-joseph-preview-20261026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unchanged-original-review:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Carry original-safe preview generator
        run: cp scripts/art/make-module-hero-review-previews.py /tmp/joseph-preview.py
      - name: Generate small previews on the permanent original research branch
        run: |
          git fetch origin research/module-hero-joseph-original-20261026
          git switch -C research/module-hero-joseph-original-20261026 origin/research/module-hero-joseph-original-20261026
          python /tmp/joseph-preview.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/staged/module-hero-preview-jpegs/
          git commit -m "research(art): add untouched-source St Joseph full and native detail previews"
          git push origin research/module-hero-joseph-original-20261026
      - run: echo "Research previews only. No source retouch, approval or deployment."
