name: Sacred Art Unified Acquisition
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - tools/calendar/acquire-sacred-art-unified-curator.py
      - .github/workflows/sacred-art-unified-image-acquisition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - name: Acquire first source-linked paintings with source-image proofs
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-unified-curator.py
          python tools/calendar/acquire-sacred-art-unified-curator.py --start 1 --end 30 --max-records 130 --search
      - name: Save full source and uncropped previews for verified research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-unified-acquisition-001-030
          path: |
            artifacts/sacred-art-unified-acquisition/
            docs/research/review-galleries/acquired/
          retention-days: 30
          if-no-files-found: warn
