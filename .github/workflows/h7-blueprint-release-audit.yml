name: H7 blueprint — Calendar Mass door and performance baseline
on:
  pull_request:
    paths:
      - "src/home/browser-entry.js"
      - "src/home/today-h4-view.js"
      - "src/calendar/calendar-runtime.js"
      - "tests/h7-blueprint-release-audit.mjs"
      - ".github/workflows/h7-blueprint-release-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Calendar Day to H7 Mass door and lab timing at 390 and 320 px
        run: node tests/h7-blueprint-release-audit.mjs
      - name: Retain screenshots and timing measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-blueprint-release-audit
          path: artifacts/h7-blueprint-release/
          retention-days: 30
          if-no-files-found: warn
