name: Calendar phone month controls

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/calendar/calendar-runtime.js"
      - "src/calendar/ordo-mass-facts.js"
      - "src/calendar/ordo-1962-ordinary-rule-review.js"
      - "tests/calendar-ordo-1962-rules.mjs"
      - "tests/calendar-ordo-mass-facts.mjs"
      - "src/calendar/ordo-1962-preface-review.js"
      - "tests/calendar-ordo-1962-preface-review.mjs"
      - "tests/calendar-phone-month-controls.mjs"
      - ".github/workflows/calendar-phone-month-controls.yml"
  workflow_dispatch:

jobs:
  month-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Source-bounded 1962 Mass Ordo contract
        run: node tests/calendar-ordo-mass-facts.mjs
      - name: Source-bounded 1962 Preface rubric selection
        run: node tests/calendar-ordo-1962-preface-review.mjs
      - name: Source-bounded 1962 universal rubrics
        run: node tests/calendar-ordo-1962-rules.mjs
      - name: Actual Today inline Calendar at 320/390/430
        run: node tests/calendar-phone-month-controls.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-phone-month-controls
          path: artifacts/calendar-phone-month-controls/
          retention-days: 30
          if-no-files-found: warn
