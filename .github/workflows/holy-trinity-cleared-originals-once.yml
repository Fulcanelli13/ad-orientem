name: Holy Trinity six - one-time CC0 artwork originals acquisition

on:
  push:
    branches:
      - curation/holy-trinity-six-20261113
    paths:
      - .github/workflows/holy-trinity-cleared-originals-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trinity-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codec
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and QA 3 CC0 sources only
        run: python scripts/art/acquire-holy-trinity-cleared-images-20261114.py
      - name: Preserve original files and separate mobile WebP research derivatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ao-trinity-three-cc0-research-originals-and-webp
          path: trinity-cleared-acquisition/
          if-no-files-found: warn
          retention-days: 30
