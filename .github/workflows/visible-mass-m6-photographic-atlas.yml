name: Visible Mass M6 photographic atlas research
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "previews/visible-mass-3d/M6_PHOTOGRAPHIC_ATLAS_COVERAGE_20261018.v1.json"
      - "previews/visible-mass-3d/m6-atlas-review-template.html"
      - "previews/visible-mass-3d/M6_Photo_Review_112_Sources_20261018.html"
      - "previews/visible-mass-3d/Ad_Orientem_M6_Acquired_Photo_Review_112.html"
      - "tests/visible-mass-m6-comparison-browser.mjs"
      - "tests/visible-mass-m6-comparative-batch-contract.mjs"
      - "previews/visible-mass-3d/M6_COMPARATIVE_P0_BATCH15_UNAPPROVED_20261018.v1.json"
      - "tests/visible-mass-m6-photo-atlas-contract.mjs"
      - "tests/visible-mass-m6-atlas-review-browser.mjs"
      - "tools/build-visible-mass-m6-atlas-review.mjs"
      - ".github/workflows/visible-mass-m6-photographic-atlas.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard 170 canonical objects, 13 zones, image provenance and draft status
        run: |
          node tests/visible-mass-m6-photo-atlas-contract.mjs
          node tests/visible-mass-m6-comparative-batch-contract.mjs
      - name: Build standalone research review gallery
        run: node tools/build-visible-mass-m6-atlas-review.mjs
      - name: Validate self-contained data on file origin
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          node tests/visible-mass-m6-atlas-review-browser.mjs
          node tests/visible-mass-m6-comparison-browser.mjs
      - name: Save reviewable photographic coverage atlas
        uses: actions/upload-artifact@v4
        with:
          name: Visible-Mass-M6-Photographic-Atlas-Review
          path: dist/visible-mass/The_Visible_Mass_M6_Photographic_Atlas_Review.html
          if-no-files-found: error
          retention-days: 30
