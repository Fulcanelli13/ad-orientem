name: Sacred Art W100 Netti and Langlois Museum Image Probes
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - data/calendar/sacred-art-review-uploads/20261016-w100-netti-langlois-photo-probes.v1.json
      - tools/calendar/research-sacred-art-w100-netti-langlois-endpoints.py
      - .github/workflows/sacred-art-w100-source-probes.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: |
          python -m py_compile tools/calendar/research-sacred-art-w100-netti-langlois-endpoints.py
          python tools/calendar/research-sacred-art-w100-netti-langlois-endpoints.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w100-netti-langlois-museum-photo-source-leads
          path: artifacts/sacred-art-w100-institutional-image-endpoints/
          retention-days: 30
          if-no-files-found: warn
