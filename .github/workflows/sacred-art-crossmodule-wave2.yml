name: Sacred Art — canonical cross-module links
on:
  pull_request:
    paths:
      - 'src/art/sacred-art-crossmodule-links-v1.js'
      - 'src/home/c3-gallery.js'
      - 'src/home/today-h4-view.js'
      - 'tests/sacred-art-crossmodule-links-wave2.mjs'
      - '.github/workflows/sacred-art-crossmodule-wave2.yml'
  push:
    branches:
      - feat/sacred-art-category-matching-wave1-20261108
    paths:
      - 'src/art/sacred-art-crossmodule-links-v1.js'
      - 'src/home/c3-gallery.js'
      - 'src/home/today-h4-view.js'
      - 'tests/sacred-art-crossmodule-links-wave2.mjs'
      - '.github/workflows/sacred-art-crossmodule-wave2.yml'
permissions:
  contents: read
jobs:
  canonical-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rosary, Bible Atlas, Mass and Calendar identities
        run: node tests/sacred-art-crossmodule-links-wave2.mjs
      - name: Verify existing 989 / 267 registry and released gallery
        run: |
          node tests/sacred-art-category-match-wave1.mjs
          node tests/sacred-art-released-category-navigation.mjs
      - name: Verify browser source parses
        run: |
          node --check src/art/sacred-art-crossmodule-links-v1.js
          node --check src/home/c3-gallery.js
          node --check src/home/today-h4-view.js
      - name: Build GitHub Pages preview without research JSON
        run: |
          node tools/build-web-preview.mjs
          test -f dist/web-preview/src/art/sacred-art-crossmodule-links-v1.js
          test ! -e dist/web-preview/data/artwork/sacred-art-category-match-989-267.v1.json
