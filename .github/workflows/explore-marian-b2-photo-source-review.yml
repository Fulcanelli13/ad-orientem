name: Explore Marian B2 photo source review (no publication)
on:
  pull_request:
    paths:
      - "data/geography/research/explore-major-marian-b2-photo-candidates.v1.json"
      - "scripts/stage_shrine_photo_candidates.py"
      - ".github/workflows/explore-marian-b2-photo-source-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-evidence-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch precise Commons originals, validate licencing metadata and generate review contact sheet
        env:
          SHRINE_PHOTO_MANIFEST: data/geography/research/explore-major-marian-b2-photo-candidates.v1.json
          SHRINE_PHOTO_OUT: artifacts/marian-b2-photo-source-review
        run: python scripts/stage_shrine_photo_candidates.py
      - name: Preserve unapproved exact-site source evidence for editorial inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-marian-b2-photo-review-unapproved
          path: artifacts/marian-b2-photo-source-review
          if-no-files-found: warn
          retention-days: 30
