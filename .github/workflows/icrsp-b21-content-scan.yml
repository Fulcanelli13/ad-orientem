name: ICRSP B21 real source-body lexical triage (140 pages)
on:
  push:
    branches: [governance/icrsp-source-inventory-1665]
    paths: ['.github/workflows/icrsp-b21-content-scan.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icrsp-b21-lexical
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/icrsp-source-inventory-1665
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_icrsp_b21_lexical_scan_contract.py' -v
      - run: |
          python tools/icrsp/scan_commentary_topic_signals.py \
            --manifest data/source-text/icrsp-france-b20-sanctoral-temporal-160-content-selection.v1.json \
            --reviewed data/source-text/icrsp-france-b21-ten-additional-commentary-claim-leads.v1.json \
            --shard ${{ matrix.shard }} --shards 4 --delay 3.5 --output icrsp-b21-lexical-${{ matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icrsp-b21-lexical-${{ matrix.shard }}
          path: icrsp-b21-lexical-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: warn
  consolidate:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    needs: [scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/icrsp-source-inventory-1665
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: icrsp-b21-lexical-*
          path: /tmp/icrsp-b21
      - run: |
          python tools/icrsp/consolidate_b21_topic_signals.py \
            --input-dir /tmp/icrsp-b21 \
            --cohort data/source-text/icrsp-france-b20-sanctoral-temporal-160-content-selection.v1.json \
            --reviewed data/source-text/icrsp-france-b21-ten-additional-commentary-claim-leads.v1.json \
            --out data/source-text/icrsp-france-b21-140-automated-commentary-signals.v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: icrsp-b21-140-validated-lexical-evidence
          path: data/source-text/icrsp-france-b21-140-automated-commentary-signals.v1.json
          retention-days: 90
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-text/icrsp-france-b21-140-automated-commentary-signals.v1.json
          git commit -m "research(icrsp): preserve 140 source-body lexical triage records"
          git pull --rebase origin governance/icrsp-source-inventory-1665
          git push origin HEAD:governance/icrsp-source-inventory-1665
