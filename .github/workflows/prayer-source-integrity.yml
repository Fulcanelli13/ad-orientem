name: Prayer source integrity

on:
  pull_request:
    paths:
      - 'src/pray/**'
      - 'data/pray/**'
      - 'tests/pray-72-original-print-witness-cohorts.mjs'
      - 'tests/pray-source-integrity-crosslane-gate.mjs'
      - 'tests/pray-litany-novena-bulk-witness-20261029.mjs'
      - 'tests/pray-72-original-print-witness-cohorts.mjs'
      - '.github/workflows/prayer-source-integrity.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/pray/**'
      - 'data/pray/**'
      - 'tests/pray-source-integrity-crosslane-gate.mjs'
      - '.github/workflows/prayer-source-integrity.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Prayer source integrity across existing ledgers
        run: node tests/pray-source-integrity-crosslane-gate.mjs && node tests/pray-litany-novena-bulk-witness-20261029.mjs && node tests/pray-72-original-print-witness-cohorts.mjs
