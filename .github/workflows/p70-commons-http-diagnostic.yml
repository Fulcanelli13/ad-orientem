name: P70 Commons HTTP diagnosis (six source queries)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p70-commons-http-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect-source-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sample real Commons response status and retry headers, no writes
        run: |
          python - <<'PY'
          import importlib.util,time
          from urllib.error import HTTPError,URLError
          spec=importlib.util.spec_from_file_location("p69","tools/discover-sacred-media-p69.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          tasks,_,_=mod.planned_rows(0,150)
          by_id={x["entity_id"]:x for x in tasks}
          ids=[
            "place:IE:ballintubber-abbey-church",
            "place:AG:holy-family-cathedral-st-johns",
            "place:AR:basilica-of-our-lady-of-lujan",
            "place:BR:aparecida-national-shrine",
            "relic:IT:basilica-san-domenico-bologna",
            "relic:FR:crown-of-thorns-paris"
          ]
          for id in ids:
            x=by_id.get(id)
            if not x:
              print("DIAG_NOT_IN_PLAN",id,flush=True);continue
            try:
              r=mod.commons_query(x["search_query"],request_timeout=10)
              print("DIAG_HTTP_OK",id,"pages",len(r.get("query",{}).get("pages",[])),flush=True)
            except HTTPError as e:
              print("DIAG_HTTP_ERROR",id,"status",e.code,"retry_after",e.headers.get("Retry-After"),
                    "x_cache",e.headers.get("X-Cache"),flush=True)
            except (URLError,TimeoutError,ValueError) as e:
              print("DIAG_OTHER_ERROR",id,type(e).__name__,str(e)[:120],flush=True)
            time.sleep(2)
          PY
