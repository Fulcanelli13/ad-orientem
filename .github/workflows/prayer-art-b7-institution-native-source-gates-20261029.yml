name: Prayer Sacred Art B7 - three institutional photo source gates
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/prayer-art-b7-institution-native-source-gates-20261029.yml
      - scripts/art/prayer-art-b7-three-institution-photo-acquisition-20261029.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-prayer-b7-three-institution-native-sources
  cancel-in-progress: false
jobs:
  check-three-exact-institutional-artworks:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free pinned Pillow for original-byte validation
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Acquire institution-marked images or preserve source holds
        run: |
          python -m py_compile scripts/art/prayer-art-b7-three-institution-photo-acquisition-20261029.py
          python scripts/art/prayer-art-b7-three-institution-photo-acquisition-20261029.py
      - name: Preserve research records and exact original candidates in Git
        if: always()
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-art-b7-three-institution-native-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then echo "No new institutional-source evidence"; exit 0; fi
          git commit -m "research(prayer art): archive B7 three institutional photo source gates and original candidates"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
