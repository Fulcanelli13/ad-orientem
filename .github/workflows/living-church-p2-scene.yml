name: Living Church P2 three-guide review
on:
  pull_request:
    paths:
      - "previews/visible-mass-3d/living-church-character-scene.mjs"
      - "previews/visible-mass-3d/living-church-pius-ten-review.mjs"
      - "tests/living-church-pius-ten-review.mjs"
      - "tests/living-church-pius-ten-scene-browser.mjs"
      - "previews/visible-mass-3d/living-church-catechism-native.mjs"
      - "previews/visible-mass-3d/visible-mass-living-church-adapter.mjs"
      - "tests/living-church-catechism-native.mjs"
      - "previews/visible-mass-3d/living-church-objective-director.mjs"
      - "src/learn/ask-church-objective-engine.js"
      - "src/learn/ask-church-source-digest.js"
      - "data/learn/ask-church-app-route-survey.v1.json"
      - "tests/living-church-ask-objectives.mjs"
      - "previews/visible-mass-3d/living-church-conversation-trail.mjs"
      - "tests/living-church-conversation-trail.mjs"
      - "previews/visible-mass-3d/living-church-grounded-answer.mjs"
      - "tests/living-church-grounded-answers.mjs"
      - "previews/visible-mass-3d/living-church-formation-p1-evidence.mjs"
      - "data/learn/mass-formation-campion.v1.json"
      - "tests/living-church-formation-p1-evidence.mjs"
      - "previews/visible-mass-3d/living-church-answer-verifier.mjs"
      - "tests/living-church-answer-verifier.mjs"
      - "data/learn/living-church-p8-mass-chat-witness-review.v1.json"
      - "tests/living-church-p8-mass-review-queue.mjs"
      - "data/learn/living-church-p9-mass-witness-loci.v1.json"
      - "tests/living-church-p9-mass-witness-loci.mjs"
      - "data/learn/mass-explorer-approved-studies.v1.json"
      - "data/learn/mass-formation-approved-passages.v1.json"
      - "previews/visible-mass-3d/sanctuary-hotspot-pilot.html"
      - "tests/living-church-character-scene.mjs"
      - "previews/visible-mass-3d/assets/living-church/**"
      - ".github/workflows/living-church-p2-scene.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gated-review-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript source
        run: |
          node --check previews/visible-mass-3d/living-church-character-scene.mjs
          node --check previews/visible-mass-3d/living-church-pius-ten-review.mjs
          node tests/living-church-pius-ten-review.mjs
          node --check tests/living-church-character-scene.mjs
          node --check previews/visible-mass-3d/living-church-catechism-native.mjs
          node tests/living-church-catechism-native.mjs
          node tests/living-church-ask-objectives.mjs
          node tests/living-church-conversation-trail.mjs
          node tests/living-church-grounded-answers.mjs
          node tests/living-church-formation-p1-evidence.mjs
          node tests/living-church-answer-verifier.mjs
          node tests/living-church-p8-mass-review-queue.mjs
          node tests/living-church-p9-mass-witness-loci.mjs
          node tests/living-church-visible-mass-adapter.mjs
      - name: Stage immutable Pius X Formation owner draft, do not duplicate its content
        run: |
          mkdir -p research-out
          git fetch --no-tags --depth=1 origin 0b4de3b50d1cfb88ecfe30038dae493e6d2eeb13
          test "$(git rev-parse FETCH_HEAD)" = "0b4de3b50d1cfb88ecfe30038dae493e6d2eeb13"
          git show FETCH_HEAD:data/learn/research/pius-x-ten-conversation-content-pilot-20261019.v1.json > research-out/pius-x-ten-review-source.json
          node tests/living-church-pius-ten-review.mjs research-out/pius-x-ten-review-source.json
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Test review-only scene at phone and desktop sizes
        run: node tests/living-church-character-scene.mjs
      - name: Test source-owned Pius X conversation scene with original approved sprites
        run: node tests/living-church-pius-ten-scene-browser.mjs
      - name: Preserve visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-church-p2-phone-desktop-sprites
          path: artifacts/living-church-p2/*.png
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-church-pius-ten-editorial-scenes
          path: artifacts/living-church-pius-review/*.png
          if-no-files-found: warn
          retention-days: 14
