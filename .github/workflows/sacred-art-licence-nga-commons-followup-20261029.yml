name: Sacred Art — licence followup only seven Commons and NGA policy
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - scripts/art/sacred-art-licence-first-filetitle-nga-followup-20261029.py
      - .github/workflows/sacred-art-licence-nga-commons-followup-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-file-specific-reuse-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclassify seven exact Commons files and NGA US policy links without images
        run: |
          python -m py_compile scripts/art/sacred-art-licence-first-filetitle-nga-followup-20261029.py
          python scripts/art/sacred-art-licence-first-filetitle-nga-followup-20261029.py
      - name: Permanently archive final 383 licence inventory and holds
        if: always()
        run: |
          if ! grep -q 'AO_SACRED_ART_LICENCE_FIRST_383_20261029_V2' data/calendar/sacred-art-licence-first-383-exact-source-audit-20261029.v1.json; then exit 1; fi
          git config user.name "Ad Orientem licence research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-licence-first-383-exact-source-audit-20261029.v1.json data/calendar/sacred-art-licence-first-383-review-20261029.csv data/calendar/sacred-art-licence-first-383-holds-20261029.csv
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(sacred art): finalize licensing-only 383-work exact source and rights holds"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
