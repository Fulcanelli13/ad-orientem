name: Apply emergency stable v43.33 hotfix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_emergency_stable_v4333.py
      - tools/apply_mass_source_fetch_resilience.py
      - tools/apply_*integrity.py
      - tools/test_mass_text_proper_integrity.py
      - tools/test_mass_liturgical_fixtures.py
      - tools/test_mass_real_corpus_contract.py
      - tools/extract_mass_proper_corpus.py
      - tools/select_mass_corpus_fixtures.py
      - tools/extract_mass_appointment_contract.py
      - tools/extract_mass_source_loader_contract.py
      - preview/START_PREVIEW.cmd
      - preview/PREVIEW_SERVER.ps1
  pull_request:
    branches: [main]
    paths:
      - tools/apply_emergency_stable_v4333.py
      - tools/apply_*integrity.py
      - tools/test_mass_text_proper_integrity.py
      - tools/test_mass_liturgical_fixtures.py
      - tools/test_mass_real_corpus_contract.py
      - tools/extract_mass_proper_corpus.py
      - tools/select_mass_corpus_fixtures.py
      - tools/extract_mass_appointment_contract.py
      - tools/extract_mass_source_loader_contract.py
      - .github/workflows/apply-emergency-stable-v4333.yml

permissions:
  contents: write

jobs:
  patch-production-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch under validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded emergency patch
        run: python tools/apply_emergency_stable_v4333.py

      - name: Run Mass text/Proper integrity harness
        run: python tools/test_mass_text_proper_integrity.py

      - name: Run representative liturgical fixtures
        run: python tools/test_mass_liturgical_fixtures.py

      - name: Extract embedded Proper corpus catalogue
        run: python tools/extract_mass_proper_corpus.py

      - name: Select real corpus regression fixtures
        run: python tools/select_mass_corpus_fixtures.py

      - name: Cross-check real corpus against production resolver
        run: python tools/test_mass_real_corpus_contract.py

      - name: Extract Preface and Canon appointment evidence
        run: python tools/extract_mass_appointment_contract.py

      - name: Extract Mass source loader contract
        run: python tools/extract_mass_source_loader_contract.py

      - name: Extract Mass text/Proper diagnostic
        run: python tools/diagnose_mass_text_proper.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, compiled = 0, skipped = 0, failures = [];
          while ((m = re.exec(html))) {
            const attrs = m[1] || '';
            const code = m[2] || '';
            if (/\bsrc\s*=/.test(attrs) || /type\s*=\s*["'](?:application\/json|application\/ld\+json|text\/template)["']/i.test(attrs)) {
              skipped++;
              continue;
            }
            try { new Function(code); compiled++; }
            catch (e) { failures.push({id:(attrs.match(/id=["']([^"']+)/i)||[])[1]||null,error:e.message}); }
          }
          console.log({compiled, skipped, failures});
          if (failures.length) process.exit(1);
          NODE

      - name: Verify emergency invariants
        shell: bash
        run: |
          grep -q 'ao-v4333-emergency-stable-js' index.html
          grep -q 'cleanLiteralFragments();reconcileSurfaces();installSwipe();' index.html
          grep -q 'overscroll-behavior-y:none!important' index.html
          grep -q "let lastAt=0,lastSource='',enabled=false,installed=false;" index.html
          grep -q 'lab-prayer-flip \[hidden\]{display:none!important}' index.html
          git diff --check -- index.html data/mass-proper-corpus.json data/mass-proper-fixtures.json data/mass-appointment-contract.json data/mass-source-loader-contract.json

      - name: Smoke-test packaged preview server
        shell: bash
        run: |
          pwsh -NoProfile -File preview/PREVIEW_SERVER.ps1 -Port 8765 >/tmp/ao-preview.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          OK=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/index.html -o /tmp/ao-preview-index.html; then
              OK=1
              break
            fi
            sleep 0.5
          done
          if [ "$OK" != "1" ]; then
            cat /tmp/ao-preview.log || true
            exit 1
          fi
          test -s /tmp/ao-preview-index.html
          grep -qi '<html' /tmp/ao-preview-index.html

      - name: Upload testable PR preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ad-orientem-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            index.html
            data/mass-proper-corpus.json
            data/mass-proper-fixtures.json
            data/mass-appointment-contract.json
            data/mass-source-loader-contract.json
            docs/MASS-TEXT-PROPER-COMPACT.txt
            preview/START_PREVIEW.cmd
            preview/PREVIEW_SERVER.ps1
          retention-days: 7
          if-no-files-found: error

      - name: Commit production index, corpus fixtures, appointment evidence and diagnostic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- index.html data/mass-proper-corpus.json data/mass-proper-fixtures.json data/mass-appointment-contract.json data/mass-source-loader-contract.json docs/MASS-TEXT-PROPER-COMPACT.txt)" ]; then
            echo 'Production Mass corpus, appointment evidence and diagnostic already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/mass-proper-corpus.json data/mass-proper-fixtures.json data/mass-appointment-contract.json data/mass-source-loader-contract.json docs/MASS-TEXT-PROPER-COMPACT.txt
          git commit -m 'diagnostic: refresh Mass appointment evidence and implementation [skip ci]'
          git push origin HEAD:main
