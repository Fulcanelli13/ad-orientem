name: One-time Sacred Art approved original transfer (research only)
on:
  push:
    branches: [research/sacred-art-b56-classi-53-hero-selector-20261024]
    paths:
      - .github/workflows/sacred-art-approved-source-transfer.yml
      - scripts/research/stage_approved_art_originals.py
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Fulcanelli13/ad-orientem'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch two exact museum CC0 images and create human QA edge sheets
        run: python scripts/research/stage_approved_art_originals.py
      - name: Commit temporary source transfer into research branch only, NOT production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/_art_transfer_quarantine_20261028/
          git commit -m 'research(sacred-art): stage two CC0 originals for private archive inspection'
          git push origin "HEAD:$GITHUB_REF_NAME"
