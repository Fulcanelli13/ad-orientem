name: B31 research-only bulk acquisition of 29 P0 recorded source candidates
on:
  push:
    branches: [research/sacred-art-b31-p0-29-candidates-20261024]
    paths:
      - .github/workflows/ao-art-b31-bulk29-candidate-archive.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-b31-source29-once
  cancel-in-progress: false
jobs:
  acquire-and-archive-b31:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b31-p0-29-candidates-20261024
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder only
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Preflight immutable source scope and no prior archived SHA duplication
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/sacred_art_b31_acquire29.py scripts/research/sacred_art_release_archive_gate.py
          python - <<'PY'
          import csv,json
          from pathlib import Path
          base=Path('data/research')
          with (base/'sacred-art-b30-remaining51-p0-acquisition-gates.csv').open(newline='',encoding='utf-8') as f:
              q=list(csv.DictReader(f))
          assert len(q)==51
          remaining=[r for r in q if r['disposition']=='EXACT_SOURCE_CANDIDATE_NOT_FROZEN_SELECTED']
          assert len(remaining)==29 and len({r['artwork_id'] for r in remaining})==29
          assert len({r['candidate_original_sha_from_gallery_key'] for r in remaining})==29
          assert all(r['new_candidate_as_approved_selected_original']=='NO'
                     and r['publication_rights_approved']=='NO'
                     and r['historically_selected_original_sha256']=='UNRECORDED'
                     for r in remaining)
          PY
      - name: Recover only exact candidate files after current Commons licence and file-byte hash verification
        run: |
          python scripts/research/sacred_art_b31_acquire29.py
      - name: Mandatory draft GitHub Release archive with download and every-image SHA verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/research/sacred_art_release_archive_gate.py \
            --wave b31-p0-29-candidates --source-dir artifacts/b31-29-existing-original-candidates
      - name: Commit compact per-artwork results only; do not commit binaries or modify frozen selections
        run: |
          set -euo pipefail
          cp artifacts/b31-29-existing-original-candidates/acquisition-results.csv data/research/sacred-art-b31-29-candidate-results.csv
          cp artifacts/b31-29-existing-original-candidates/acquisition-summary.json data/research/sacred-art-b31-29-candidate-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b31-29-candidate-results.csv data/research/sacred-art-b31-29-candidate-summary.json
          git commit -m 'research: B31 acquired P0 alternative original source files without selected-art promotion'
          for attempt in 1 2 3; do
            git fetch origin research/sacred-art-b31-p0-29-candidates-20261024
            git rebase origin/research/sacred-art-b31-p0-29-candidates-20261024
            git push origin HEAD:research/sacred-art-b31-p0-29-candidates-20261024 && exit 0
            sleep 4
          done
          exit 1
      - name: Keep a short-lived convenience export of the published research audit, not image originals
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-b31-29-research-only-audit
          path: |
            artifacts/b31-29-existing-original-candidates/acquisition-results.csv
            artifacts/b31-29-existing-original-candidates/acquisition-summary.json
          retention-days: 30
          if-no-files-found: error
