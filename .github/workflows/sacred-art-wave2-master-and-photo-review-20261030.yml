name: Sacred Art Wave 2 · 3 updated queues + 371-photo review batches (€0)

on:
  push:
    branches:
      - research/sacred-art-phase1-consolidation-20261029
    paths:
      - .github/workflows/sacred-art-wave2-master-and-photo-review-20261030.yml
      - scripts/art/create-sacred-art-wave2-master-and-galleries-20261030.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ao-sacred-art-wave2-master-and-review
  cancel-in-progress: false

jobs:
  produce-reconciled-master-and-two-human-review-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-phase1-consolidation-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain all frozen user approval and rejection decisions
        run: node scripts/art/validate-editorial-phase1-20261029.mjs
      - name: Update master + exactly 3 queues and generate batches 02/03
        run: node scripts/art/create-sacred-art-wave2-master-and-galleries-20261030.mjs
      - name: Verify no duplicates or premature photo publication
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const a="data/calendar/sacred-art-master-v2/";
          const j=JSON.parse(readFileSync(a+"master.json","utf8"));
          const s=JSON.parse(readFileSync(a+"summary.json","utf8"));
          const c=s.counts;
          if(j.registry.length!==3205||j.operationalWorks.length!==989||
             c.initialQualityReview73Protected!==73||
             c.sourceGroupsRechecked!==493||
             c.movedFromRightsToPhotoQa!==331||
             c.currentMuseumImageCandidates!==40||
             c.deferredAttributionOrConflict!==20||
             c.transientMuseumApiExceptions!==102||
             c.queuePhotoQaOrRepair!==548||
             c.queueRightsOrAlternative!==441||
             c.queueReadyToPublish!==0||
             s.batch02.size!==200||s.batch03.size!==171||
             new Set([...s.batch02.sourceRecords,...s.batch03.sourceRecords]).size!==371||
             s.batch02.sourceRecords.some(x=>new Set(j.reviewBatch.map(r=>r.id)).has(x))||
             s.batch03.sourceRecords.some(x=>new Set(j.reviewBatch.map(r=>r.id)).has(x))||
             j.operationalWorks.some(x=>x.userPhotoQualityApproval||x.productionReleased||
               x.exactPhotoRightsCertifiedForSelectedBytes)||
             c.pristinePhotoApprovals!==0||
             c.productionImports!==0||c.costEur!==0||
             j.release.original73ReviewContentsUnchanged!==true)
              throw Error("Source, photo and user-review release invariants failed");
          console.log(JSON.stringify(c,null,2));
          NODE
      - name: Commit master and bulk galleries permanently, not temporary artifacts
        run: |
          set -euo pipefail
          git config user.name "Ad Orientem sacred-art research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-master-v2/ docs/SACRED_ART_WAVE2_PRISTINE_REVIEW_BATCH02_20261030.html docs/SACRED_ART_WAVE2_PRISTINE_REVIEW_BATCH03_20261030.html
          git diff --cached --check
          git commit -m "research(sacred-art): Wave 2 master + 3 queues + 371 review candidates [skip ci]"
          git pull --rebase origin research/sacred-art-phase1-consolidation-20261029
          git push origin HEAD:research/sacred-art-phase1-consolidation-20261029
