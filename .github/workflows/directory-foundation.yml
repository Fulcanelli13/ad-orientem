name: Directory foundation

on:
  pull_request:
    paths:
      - "data/directory/**"
      - "data/geography/**"
      - "data/shrines/**"
      - "data/explore/**"
      - "tests/european-relic-census.mjs"
      - "tests/sacred-geography-atlas.mjs"
      - "src/calendar/**"
      - "tests/pilgrimage-associations.mjs"
      - "data/customs/**"
      - "tests/customs-atlas-place-pins.mjs"
      - "tests/explore-place-profiles.mjs"
      - "src/find/**"
      - "tools/directory/**"
      - "tools/atlas/**"
      - "tests/relic-subject-census.mjs"
      - "tests/worldwide-relic-subject-census.mjs"
      - "tests/worldwide-relic-subject-census-wave2.mjs"
      - "tests/worldwide-relic-subject-census-wave3.mjs"
      - "tests/worldwide-relic-subject-census-wave4.mjs"
      - "tests/worldwide-relic-subject-census-wave5.mjs"
      - "tests/worldwide-relic-subject-census-wave6.mjs"
      - "tests/relic-census-selection-triage.mjs"
      - "tests/relic-atlas-publication-selection.mjs"
      - "docs/research/relic-atlas-publication-gate-v1.md"
      - "docs/research/sacred-atlas-worldwide-relic-census-v1.md"
      - "package.json"
      - "tests/directory-*.mjs"
      - "tests/explore-surface.mjs"
      - "tests/customs-atlas.mjs"
      - ".github/workflows/directory-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "data/directory/**"
      - "data/geography/**"
      - "data/shrines/**"
      - "data/explore/**"
      - "tests/european-relic-census.mjs"
      - "tests/sacred-geography-atlas.mjs"
      - "src/calendar/**"
      - "tests/pilgrimage-associations.mjs"
      - "data/customs/**"
      - "tests/customs-atlas-place-pins.mjs"
      - "tests/explore-place-profiles.mjs"
      - "src/find/**"
      - "tools/directory/**"
      - "tools/atlas/**"
      - "tests/relic-subject-census.mjs"
      - "tests/worldwide-relic-subject-census.mjs"
      - "tests/worldwide-relic-subject-census-wave2.mjs"
      - "tests/worldwide-relic-subject-census-wave3.mjs"
      - "tests/worldwide-relic-subject-census-wave4.mjs"
      - "tests/worldwide-relic-subject-census-wave5.mjs"
      - "tests/worldwide-relic-subject-census-wave6.mjs"
      - "tests/relic-census-selection-triage.mjs"
      - "tests/relic-atlas-publication-selection.mjs"
      - "docs/research/relic-atlas-publication-gate-v1.md"
      - "docs/research/sacred-atlas-worldwide-relic-census-v1.md"
      - "package.json"
      - "tests/directory-*.mjs"
      - ".github/workflows/directory-foundation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  directory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:directory
      - run: npm run test:find
      - run: npm run atlas:check-baselines
      - run: npm run test:atlas-census
      - run: node tests/relic-subject-census.mjs
      - run: node tests/worldwide-relic-subject-census.mjs
      - run: node tests/worldwide-relic-subject-census-wave2.mjs
      - run: node tests/worldwide-relic-subject-census-wave3.mjs
      - run: node tests/worldwide-relic-subject-census-wave4.mjs
      - run: node tests/worldwide-relic-subject-census-wave5.mjs
      - run: node tests/worldwide-relic-subject-census-wave6.mjs
      - run: node tests/relic-census-selection-triage.mjs
      - run: node tests/relic-atlas-publication-selection.mjs
      - run: npm run test:explore-surface
      - run: npm run test:customs-atlas
      - run: npm run test:explore-geography
      - run: npm run test:explore-place-profiles
      - run: node tests/customs-atlas-place-pins.mjs
      - run: node tests/pilgrimage-associations.mjs
      - run: node tests/sacred-geography-atlas.mjs
      - run: node --check src/calendar/browser-entry.js
      - run: node --check src/calendar/pilgrimage-places.js
      - run: node --check src/find/customs-atlas-filters.js
      - run: node --check src/find/explore-presentation.js
      - run: node tests/directory-worldwide-coverage.mjs
      - run: node tools/directory/audit-worldwide-corpus.mjs
      - run: node --check src/find/browser-entry.js
