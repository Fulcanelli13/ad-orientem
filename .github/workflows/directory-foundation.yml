name: Directory foundation

on:
  pull_request:
    paths:
      - "data/directory/**"
      - "src/find/**"
      - "tools/directory/**"
      - "tests/directory-*.mjs"
      - "package.json"
      - ".github/workflows/directory-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "data/directory/**"
      - "src/find/**"
      - "tools/directory/**"
      - "tests/directory-*.mjs"
      - "package.json"
      - ".github/workflows/directory-foundation.yml"

jobs:
  directory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:directory
