name: Directory foundation

on:
  pull_request:
    paths:
      - "data/directory/**"
      - "src/find/**"
      - "tools/directory/**"
      - "tests/directory-*.mjs"
      - ".github/workflows/directory-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "data/directory/**"
      - "src/find/**"
      - "tools/directory/**"
      - "tests/directory-*.mjs"
      - ".github/workflows/directory-foundation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  directory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:directory
      - run: npm run test:find
      - run: node --check src/find/browser-entry.js
