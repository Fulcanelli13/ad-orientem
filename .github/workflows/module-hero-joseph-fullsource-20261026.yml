name: Saint Joseph high-fidelity original source (€0)
on:
  push:
    branches: [main]
    paths: [.github/workflows/module-hero-joseph-fullsource-20261026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Download verified full source under 24MiB cap, never use thumbnail
        env:
          AO_MASTER_MAX_BYTES: '25165824'
        run: |
          python scripts/art/acquire-module-hero-masters.py --module joseph --download > data/research/module-hero-joseph-acquisition-20261026.json
      - name: Produce native-pixel quality evidence without enhancing painting
        run: python scripts/art/review-module-hero-quality.py --module joseph
      - name: Preserve 19.75MB original in permanent zero-cost research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c research/module-hero-joseph-original-20261026
          git add -f assets/staged/module-hero-masters/joseph.jpg assets/staged/module-hero-quality-reviews/ data/research/module-hero-joseph-acquisition-20261026.json
          git commit -m "research(art): archive National Gallery Saint Joseph original and SHA256, visual QA pending"
          git push --set-upstream origin research/module-hero-joseph-original-20261026
      - name: Production remains blocked
        run: echo "No visual-licence-crop approval and no app release."
