name: M6 B19 one-object photograph review
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "tools/visible-mass-m6-single-object-b19-visual-sprint.py"
      - ".github/workflows/visible-mass-m6-b19-single-object-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image inspection requirements
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 requests==2.32.5
      - name: Inspect only exact Catholic object photo sources
        run: python tools/visible-mass-m6-single-object-b19-visual-sprint.py
      - name: Retain photographs, attribution and source contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M6-B19-One-Object-Corporal-Purificator-Cards
          path: dist/visible-mass/m6-b19-single-object-review/
          if-no-files-found: warn
          retention-days: 30
