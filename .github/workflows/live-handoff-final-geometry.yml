name: LIVE handoff final sanctuary geometry contract

on:
  pull_request:
    paths:
      - 'src/mass/reader-live-handoff-geometry.js'
      - 'tests/reader-live-handoff-final-geometry.mjs'
      - '.github/workflows/live-handoff-final-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-neutral final sanctuary geometry
        run: |
          node --check src/mass/reader-live-handoff-geometry.js
          node --check tests/reader-live-handoff-final-geometry.mjs
          node tests/reader-live-handoff-final-geometry.mjs
