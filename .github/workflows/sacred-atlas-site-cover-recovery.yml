name: Sacred Atlas — recover 125 missing exact-location photographs

on:
  push:
    branches:
      - research/explore-precise-sacred-subject-photo-search-20261031
    paths:
      - tools/sacred-atlas-site-cover-recovery.mjs
      - data/geography/research/sacred-atlas-site-cover-recovery-125.v1.json
      - .github/workflows/sacred-atlas-site-cover-recovery.yml

permissions:
  contents: write

concurrency:
  group: sacred-atlas-location-photo-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/explore-precise-sacred-subject-photo-search-20261031
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact-site and licence regression tests
        run: node tools/sacred-atlas-site-cover-recovery.mjs --selftest
      - name: Rate-limited Commons recovery, 125 unresolved Places
        run: node tools/sacred-atlas-site-cover-recovery.mjs
      - name: Verify no source lookup promotes a photograph to publication
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const x=JSON.parse(readFileSync("data/geography/research/sacred-atlas-site-cover-recovery-125.results.json"));
            if(x.results.length!==125||x.summary.published!==0||x.summary.bytes_downloaded!==0)process.exit(1);
            if(new Set(x.results.map(r=>r.place_id)).size!==125)process.exit(1);
            if(x.results.some(r=>r.candidates.some(c=>c.site_verified||c.published||c.underlying_artwork_rights_verified||c.original_bytes_verified)))process.exit(1);
            console.log(x.summary);
          '
      - name: Persist gap evidence on research branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/research/sacred-atlas-site-cover-recovery-125.results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(atlas): preserve 125 Place cover recovery findings"
          git fetch origin research/explore-precise-sacred-subject-photo-search-20261031
          git rebase origin/research/explore-precise-sacred-subject-photo-search-20261031
          git push origin HEAD:research/explore-precise-sacred-subject-photo-search-20261031
