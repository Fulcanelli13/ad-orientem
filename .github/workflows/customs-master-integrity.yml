name: Customs Master Identity and Source Audit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "data/customs/master/**"
      - "tests/customs-master-integrity.mjs"
      - "tests/customs-ultra-master-v2-integrity.mjs"
      - "tests/customs-full-registry-census.mjs"
      - "tests/customs-wave-a-bulk-reconciliation.mjs"
      - "tests/customs-a1-evidence-indulgence-gate.mjs"
      - "tests/customs-a23-258-and-primary-facsimile-gate.mjs"
      - "tests/customs-weiser-original-page-sweep-20261029.mjs"
      - "tests/customs-a1-final66-and-identity-board-gate.mjs"
      - "tests/customs-a23-96-original-page-audit-gate.mjs"
      - "tests/customs-a23-second61-source-gates.mjs"
      - "tests/customs-408-complete-source-disposition-gates.mjs"
      - "tests/customs-all408-bulk-review-and-identity-gates.mjs"
      - "tests/customs-existing22-bilingual-variants-gate.mjs"
      - "data/customs/master/customs-existing22-bilingual-calendar-variants-20261029.v1.json"
      - "tests/customs-calendar-40-bilingual-content-preview.mjs"
      - "data/customs/master/customs-22-existing-owner-bilingual-variants-20261029.v1.json"
      - "data/customs/master/customs-calendar-bilingual-content-40-20261029.v1.json"
      - "docs/CUSTOMS_CALENDAR_40_BILINGUAL_CONTENT_PREVIEW_20261029.html"
      - "data/customs/master/customs-all408-consolidated-editorial-decision-ledger-20261029.v1.json"
      - "data/customs/master/customs-all47-owner-action-comparisons-20261029.v1.json"
      - "data/customs/master/customs-12-clusters-action-scope-review-20261029.v1.json"
      - "docs/CUSTOMS_ALL_408_SINGLE_BULK_EDITORIAL_REVIEW_20261029.html"
      - "data/calendar/customs-18-bilingual-staged-context-20261029.v1.json"
      - "src/calendar/customs-research-preview.js"
      - "tests/calendar-customs-18-bilingual-staged-context.mjs"
      - "tests/calendar-customs-40-dynamic-day-preview.mjs"
      - "data/customs/indulgence-grant-research-seed-20261029.v1.json"
      - "tests/customs-pitre-1900-wave05-editorial-staging-integrity.mjs"
      - "tests/customs-weiser-readiness-pages.mjs"
      - ".github/workflows/customs-master-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable review inventory, P1 holds and identity relationships
        run: |
          node --check tests/customs-master-integrity.mjs
          node tests/customs-master-integrity.mjs
      - name: Verify independent customs research census and historical recovery
        run: |
          node --check tests/customs-full-registry-census.mjs
          node tests/customs-full-registry-census.mjs
      - name: Verify original Weiser page backlog and 408-source group readiness
        run: |
          node --check tests/customs-weiser-readiness-pages.mjs
          node tests/customs-weiser-readiness-pages.mjs
      - name: Verify original Pitrè 1900 recovered-OCR staging and zero promotion
        run: |
          node --check tests/customs-pitre-1900-new-ocr-stage01.mjs
          node tests/customs-pitre-1900-new-ocr-stage01.mjs
          node --check tests/customs-pitre-1900-new-ocr-stage02.mjs
          node tests/customs-pitre-1900-new-ocr-stage02.mjs
          node --check tests/customs-pitre-1900-original-ocr-wave03.mjs
          node tests/customs-pitre-1900-original-ocr-wave03.mjs
      - name: Verify user-supplied original Pitrè page checks and source provenance
        run: |
          node --check tests/customs-pitre-1900-uploaded-original-facsimile-audit.mjs
          node tests/customs-pitre-1900-uploaded-original-facsimile-audit.mjs
      - name: Verify Pitrè 17 P1 original pages and 364 remaining source search candidates
        run: |
          node --check tests/customs-pitre-1900-p1-17-and-page-queue-364.mjs
          node tests/customs-pitre-1900-p1-17-and-page-queue-364.mjs
      - name: Verify Pitrè complete old 129 original-folio evidence and new 277 pending queue
        run: |
          node --check tests/customs-pitre-1900-original-scan-full-129-folio-integrity.mjs
          node tests/customs-pitre-1900-original-scan-full-129-folio-integrity.mjs
      - name: Verify Pitrè seven original 1900 sections and 156 remaining source pages
        run: |
          node --check tests/customs-pitre-1900-new-121-original-folio-source-gate.mjs
          node tests/customs-pitre-1900-new-121-original-folio-source-gate.mjs
      - name: Verify entire Pitrè 1900 original 422-row printed-folio audit and zero outstanding pages
        run: |
          node --check tests/customs-pitre-1900-final-422-original-page-evidence-complete.mjs
          node tests/customs-pitre-1900-final-422-original-page-evidence-complete.mjs
      - name: Verify 105 newly mined Pitrè original chapter observations and 105 image holds
        run: |
          node --check tests/customs-pitre-1900-wave04-unmined-105-integrity.mjs
          node tests/customs-pitre-1900-wave04-unmined-105-integrity.mjs
      - name: Verify Pitrè Wave05 195 evidence leads, 132 staged records, 63 holds
        run: |
          node --check tests/customs-pitre-1900-wave05-editorial-staging-integrity.mjs
          node tests/customs-pitre-1900-wave05-editorial-staging-integrity.mjs
      - name: Verify Pitrè Wave06 rendered-source preview audit and original anchor corrections
        run: |
          node --check tests/customs-pitre-1900-wave06-source-image-preview.mjs
          node tests/customs-pitre-1900-wave06-source-image-preview.mjs
      - name: Verify Pitrè Wave07 132 noncanonical catalogued research rows, all 60 chapter IDs
        run: |
          node --check tests/customs-pitre-1900-wave07-132-catalogue-integration.mjs
          node tests/customs-pitre-1900-wave07-132-catalogue-integration.mjs
      - name: Verify Pitrè Wave08 63 deferred cases, source recoveries, XI/XLI chapter identity and 560-page gap audit
        run: |
          node --check tests/customs-pitre-1900-wave08-63-holds-and-560-page-census.mjs
          node tests/customs-pitre-1900-wave08-63-holds-and-560-page-census.mjs
      - name: Verify Pitrè Wave09 200-page original scan coverage, 51 evidence records and 12 absent folios
        run: |
          node --check tests/customs-pitre-1900-wave09-200-page-source-integrity.mjs
          node tests/customs-pitre-1900-wave09-200-page-source-integrity.mjs
      - name: Verify 150-candidate customs consolidation and unchanged master release gates
        run: |
          node --check tests/customs-unified-identity-consolidation-cohort01.mjs
          node tests/customs-unified-identity-consolidation-cohort01.mjs
      - name: Verify final-copy five Calendar candidates are bilingual, sourced and unpublished
        run: |
          node --check tests/customs-calendar-five-release-candidates.mjs
          node tests/customs-calendar-five-release-candidates.mjs
      - name: Verify consolidated 408-group bulk review queue and 3703 source-row nonpromotion
        run: |
          node --check tests/customs-wave-a-bulk-reconciliation.mjs
          node tests/customs-wave-a-bulk-reconciliation.mjs
      - name: Verify A1 all-150 evidence dossiers and source-bound indulgence seed
        run: |
          node --check tests/customs-a1-evidence-indulgence-gate.mjs
          node tests/customs-a1-evidence-indulgence-gate.mjs
      - name: Verify all 408 full-queue groups, twelve original facsimiles, 23 grant cases
        run: |
          node --check tests/customs-a23-258-and-primary-facsimile-gate.mjs
          node tests/customs-a23-258-and-primary-facsimile-gate.mjs
      - name: Verify 72 new direct original Weiser source-image checks, 84 cumulative, 66 pending
        run: |
          node --check tests/customs-weiser-original-page-sweep-20261029.mjs
          node tests/customs-weiser-original-page-sweep-20261029.mjs
      - name: Verify full A1 150 original-source action checks and publication-safe identity board
        run: |
          node --check tests/customs-a1-final66-and-identity-board-gate.mjs
          node tests/customs-a1-final66-and-identity-board-gate.mjs
      - name: Verify 96 first-hand A2/A3 source screens with 162 remaining and no fabricated approvals
        run: |
          node --check tests/customs-a23-96-original-page-audit-gate.mjs
          node tests/customs-a23-96-original-page-audit-gate.mjs
      - name: Verify second A2/A3 61 primary-page checks and 307 cumulative groups
        run: |
          node --check tests/customs-a23-second61-source-gates.mjs
          node tests/customs-a23-second61-source-gates.mjs
      - name: Verify all 408 source-review dispositions with one disclosed scan failure
        run: |
          node --check tests/customs-408-complete-source-disposition-gates.mjs
          node tests/customs-408-complete-source-disposition-gates.mjs
      - name: Verify all 408 editorial cases, 47 owner matches, 12 clusters, and offline review export
        run: |
          node --check tests/customs-all408-bulk-review-and-identity-gates.mjs
          node tests/customs-all408-bulk-review-and-identity-gates.mjs
      - name: Verify 18 bilingual Calendar-shaped customs and 1962 movable feast safety
        run: |
          node --check src/calendar/customs-research-preview.js
          node --check tests/calendar-customs-18-bilingual-staged-context.mjs
          node tests/calendar-customs-18-bilingual-staged-context.mjs
      - name: Verify 40 bilingual Calendar contents with twelve existing owners and no new publication
        run: |
          node --check tests/customs-calendar-40-bilingual-content-preview.mjs
          node tests/customs-calendar-40-bilingual-content-preview.mjs
      - name: Verify date-aware Customs variant research projection with 1962 calendar anchors
        run: |
          node --check src/calendar/customs-research-preview.js
          node --check tests/calendar-customs-40-dynamic-day-preview.mjs
          node tests/calendar-customs-40-dynamic-day-preview.mjs
      - name: Verify 22 bilingual Calendar content variants under 12 existing published Customs
        run: |
          node --check tests/customs-existing22-bilingual-variants-gate.mjs
          node tests/customs-existing22-bilingual-variants-gate.mjs
      - name: Verify all 3,703 preserved source observations, 17 source screens, 79 dedup cases and bounded indulgence claims
        run: |
          node --check tests/customs-ultra-master-v2-integrity.mjs
          node tests/customs-ultra-master-v2-integrity.mjs
