name: Promote seven reviewed Marian site photos (one-shot)
on:
  pull_request:
    paths:
      - "scripts/promote_major_marian_b2_photos.py"
      - "data/geography/research/explore-major-marian-b2-photo-candidates.v1.json"
      - ".github/workflows/explore-marian-b2-reviewed-promotion.yml"
permissions:
  contents: write
jobs:
  promote-exact-site-only:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/explore-major-shrines-world-guides-b2-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Re-verify seven original Commons files and materialize exactly seven reviewed local photos
        env:
          SHRINE_PHOTO_MANIFEST: data/geography/research/explore-major-marian-b2-photo-candidates.v1.json
          SHRINE_PHOTO_OUT: artifacts/marian-b2-photo-source-review
        run: python scripts/promote_major_marian_b2_photos.py
      - name: Commit only accepted photo bytes, metadata, editorial coverage and affected regression tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_REF" --no-tags
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_HEAD" ]; then
            echo "PR head changed: refusing stale promotion and overwrite"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/approved/place-media/GB-walsingham-catholic-shrine.webp
          git add -- assets/approved/place-media/AT-mariazell-basilica.webp
          git add -- assets/approved/place-media/US-champion-shrine.webp
          git add -- assets/approved/place-media/PL-kalwaria-zebrzydowska.webp
          git add -- assets/approved/place-media/CO-las-lajas-ipiales.webp
          git add -- assets/approved/place-media/HR-national-shrine-of-our-lady-of-marija-bistrica.webp
          git add -- assets/approved/place-media/IN-basilica-of-our-lady-of-good-health-vailankanni.webp
          git add -- data/geography/approved-place-media.v1.json
          git add -- data/shrines/editorial-master-inventory-20261021.v1.json
          git add -- tests/shrine-marian-editorial-inventory-contract.mjs
          git add -- tests/explore-surface.mjs
          git add -- tests/explore-photo-research.mjs
          git add -- tests/explore-photo-r59.mjs
          git add -- tests/explore-r64-illustrated-ireland.mjs
          git add -- tests/explore-r65-ireland-five-places.mjs
          git add -- tests/explore-r68-photo-gallery.mjs
          git add -- tests/explore-r69-multi-place-gallery.mjs
          git add -- tests/sacred-geography-r70-six-global-sites.mjs
          git add -- tests/explore-shrine-illustrated-folios-phone.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Explore: publish seven authentic illustrated Marian shrines with exact Commons rights"
          git push origin "HEAD:refs/heads/$TARGET_REF"
