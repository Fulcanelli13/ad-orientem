name: Sacred Atlas R21 — offline 26-site source review contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/geography/research/sacred-atlas-round21-*.json'
      - 'data/geography/research/sacred-atlas-undecided66-bulk-photo-review-20261104.html'
      - 'tests/sacred-atlas-round21-bulk-source-contract.mjs'
      - 'tools/atlas/recover-sacred-atlas-26-commons-search.py'
      - '.github/workflows/sacred-atlas-round21-offline.yml'
permissions:
  contents: read
jobs:
  review-without-external-source-requests:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'research/sacred-atlas-round21-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm 66 Place review and no incorrect image promotions
        run: node tests/sacred-atlas-round21-bulk-source-contract.mjs
      - name: Verify source query implementation offline
        run: |
          python tools/atlas/recover-sacred-atlas-26-commons-search.py --self-test
          python tools/atlas/recover-sacred-atlas-26-commons-search.py --dry-run
