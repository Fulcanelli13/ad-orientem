name: P107 four pinned Commons alternatives and New Brighton dedup
on:
  pull_request:
    paths:
      - data/directory/research/p107-four-commons-original-alternatives.v1.json
      - tools/directory/build-p107-four-alternative-webps.py
      - .github/workflows/directory-p107-four-alternatives.yml
permissions:
  contents: write
jobs:
  acquire-four-source-pinned-originals:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/p107-alternate-church-photos-newbrighton-reconcile-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Retrieve exact pinned Commons JPEG files and generate full-frame WebP
        run: python tools/directory/build-p107-four-alternative-webps.py
      - name: Archive exact originals and SHA-256 outputs in free Git research branch
        shell: bash
        run: |
          git add docs/research/directory/p107-alternative-originals-20261030/ \
            docs/research/directory/p107-four-alternatives-contact-sheet.jpg \
            assets/staged/directory-p107/ \
            data/directory/research/p107-four-webp-stage-audit.v1.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'research(directory): archive four exact source-verified alternatives and mobile review'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
