name: Sacred Art Phase 39 — fourteen official-source probes (research only)
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase39-fourteen-source-probe.py'
      - '.github/workflows/sacred-art-phase39-fourteen-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal HTTP client
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Query public official metadata only
        run: |
          python -m py_compile scripts/sacred-art/phase39-fourteen-source-probe.py
          python scripts/sacred-art/phase39-fourteen-source-probe.py
      - name: Retain source diagnostics separately from curation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-phase39-fourteen-source-metadata-research-only
          path: artifacts/sacred-art-phase39-fourteen-source-probe/
          retention-days: 7
          if-no-files-found: warn
