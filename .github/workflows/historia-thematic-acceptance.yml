name: Historia thematic research acceptance
on:
  push:
    branches:
      - research/historia-thematic-episodes-20261021
    paths:
      - '.github/workflows/historia-thematic-acceptance.yml'
      - 'src/scripture/**'
      - 'data/research/historia-salutis-thematic-*.json'
      - 'data/research/historia-salutis-thematic-*.md'
      - 'research/historia-thematic-*'
      - 'research/historia-priority16-*'
      - 'data/research/historia-priority16-*'
      - 'data/research/historia-salutis-priority16-*'
      - 'tests/historia-priority16-*.mjs'
      - 'prototypes/historia-salutis-p3-continuous-reader-20261021.html'
      - 'tests/historia-thematic-*.mjs'
  pull_request:
    paths:
      - '.github/workflows/historia-thematic-acceptance.yml'
      - 'src/scripture/**'
      - 'data/research/historia-salutis-thematic-*'
      - 'tests/historia-thematic-*.mjs'
      - 'research/historia-priority16-*'
      - 'data/research/historia-priority16-*'
      - 'data/research/historia-salutis-priority16-*'
      - 'tests/historia-priority16-*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static and source-parity contract tests
        run: |
          node --check src/scripture/historia-thematic-collections.js
          node --check src/scripture/browser-entry.js
          node --check src/scripture/library.js
          node --check tests/historia-thematic-phone-e2e.mjs
          node tests/historia-thematic-collections.mjs
          node tests/historia-thematic-inapp-bridge.mjs
          node tests/historia-thematic-reciprocal-navigation.mjs
          node tests/historia-thematic-expansion-preflight.mjs
          node tests/historia-thematic-expansion-adapter.mjs
          node tests/historia-thematic-source-gaps.mjs
          node tests/historia-thematic-batch2-witness.mjs
          node tests/historia-thematic-composite.mjs
          node tests/historia-thematic-editorial-boundaries.mjs
          node tests/historia-thematic-all217-witness.mjs
          node tests/historia-thematic-150-editorial-triage.mjs
          node tests/historia-thematic-adjudication.mjs
          node tests/historia-priority16-economical-selections.mjs
          node tests/historia-priority16-parallel-reconciliation.mjs
          node tests/historia-priority16-four-integrity.mjs
          node tests/historia-thematic-priority16-economical.mjs
  browser:
    needs: node-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing app dependencies
        run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Real phone-size Chromium Scripture / covenant / return acceptance
        run: node tests/historia-thematic-phone-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historia-thematic-phone-review
          path: test-output/historia-thematic/*.png
          if-no-files-found: warn
