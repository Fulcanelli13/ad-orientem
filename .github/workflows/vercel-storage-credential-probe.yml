name: Vercel storage cleanup authorization probe

on:
  push:
    branches:
      - ops/vercel-storage-cleanup-20261028
    paths:
      - .github/workflows/vercel-storage-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check availability of pre-existing Vercel maintenance credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_MAINTENANCE_TOKEN_UNAVAILABLE"
            exit 0
          fi
          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/vercel-team-probe.json" --write-out '%{http_code}' --max-time 15 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            'https://api.vercel.com/v2/teams/team_2FBUStphArtJeTaH3FYDpdwb')"
          if [ "$http_code" = "200" ]; then
            echo "VERCEL_MAINTENANCE_TOKEN_VALID"
          else
            echo "VERCEL_MAINTENANCE_TOKEN_NOT_AUTHORIZED_HTTP_$http_code"
          fi
          rm -f "$RUNNER_TEMP/vercel-team-probe.json"
