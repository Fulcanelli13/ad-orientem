name: Proper corpus validation

on:
  push:
    branches:
      - research/core-201-350-resolved-propers
    paths:
      - "tools/build_core_proper_corpus.mjs"
      - ".github/workflows/proper-corpus-validation.yml"

jobs:
  validate-resolved-propers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Resolve seven-year validation corpus
        run: node tools/build_core_proper_corpus.mjs --discovery-start=2020-01-01 --discovery-end=2026-12-31
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-proper-corpus-validation
          path: artifacts/core-proper-corpus/
          if-no-files-found: error
          retention-days: 14
