name: Prayer eight museum originals — offline QA only
on:
  pull_request:
    paths:
      - "data/prayer/artwork-editorial-20261101/museum-eight-38-position-photo-preflight-20261103.v1.json"
      - "data/prayer/artwork-editorial-20261101/gallery-archive-crosswalk-267-20261103.v1.json"
      - "scripts/art/prayer-eight-museum-originals-bulk-qa.mjs"
      - ".github/workflows/prayer-eight-museum-originals-bulk-qa.yml"
  workflow_dispatch:
jobs:
  eight-work-contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download and verify selected museum originals into ephemeral artifacts
        run: node scripts/art/prayer-eight-museum-originals-bulk-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prayer-eight-museum-originals-contact-sheet
          path: artifacts/prayer-museum-eight/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 4
