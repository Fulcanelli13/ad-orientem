name: Mass 1962 Preface source decision gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'src/mass/1962-preface-decision.js'
      - 'src/mass/reader-proper-runtime-recovery.js'
      - 'src/mass/proper-reader-slots.js'
      - 'tests/reader-proper-runtime-recovery.mjs'
      - 'tests/mass-1962-lent-preface-recovery.mjs'
      - 'tests/mass-1962-lent-preface-production.mjs'
      - 'tests/mass-1962-preface-decision.mjs'
      - '.github/workflows/mass-1962-preface-decision.yml'
jobs:
  verify-preface-owner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/mass/1962-preface-decision.js
      - run: node tests/mass-1962-preface-decision.mjs
      - run: node tests/proper-reader-slots.mjs
      - run: node tests/reader-proper-runtime-recovery.mjs
      - name: Authenticate trilingual Lenten Preface source recovery
        run: node tests/mass-1962-lent-preface-recovery.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit all 22 2026 Lenten production reader Prefaces
        run: node tests/mass-1962-lent-preface-production.mjs
