name: 1962 Calendar year audit

on:
  pull_request:
    branches: [main]
    paths:
      - "src/calendar/**"
      - "data/calendar/1962-year-independent-checks-*.json"
      - "tests/calendar-1962-full-year-audit.mjs"
      - "tools/calendar/report-sacred-art-liturgical-priorities.mjs"
      - "data/calendar/sacred-art-liturgical-priorities.v1.json"
      - "data/calendar/sacred-art-first-class-2026-research-crosswalk.v1.json"
      - "data/calendar/sacred-art-1962-exact-feast-source-links.v1.json"
      - ".github/workflows/calendar-1962-year-audit.yml"
  workflow_dispatch:

concurrency:
  group: 1962-calendar-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  year-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:calendar
      - run: npx playwright install --with-deps chromium
      - name: Exhaustive 2026 production resolver sweep and independent checkpoints
        run: node tests/calendar-1962-full-year-audit.mjs
      - name: Match each actual 1962 observed day to source-linked artwork
        if: always()
        run: |
          node tools/calendar/audit-sacred-art-modules.mjs
          if [ -f artifacts/calendar-oracle/1962-2026-full-year-audit.json ]; then
            node tools/calendar/report-sacred-art-liturgical-priorities.mjs --year-audit artifacts/calendar-oracle/1962-2026-full-year-audit.json
          else
            node tools/calendar/report-sacred-art-liturgical-priorities.mjs
          fi
      - name: Upload rank-by-rank sacred-art coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-1962-artwork-coverage
          path: |
            artifacts/sacred-art-coverage/liturgical-priority-v1.json
            artifacts/sacred-art-coverage/liturgical-priority-v1.md
          if-no-files-found: warn
      - name: Publish findings even if audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-1962-2026-audit
          path: artifacts/calendar-oracle/1962-2026-full-year-audit.json
          if-no-files-found: warn
