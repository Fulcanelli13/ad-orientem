name: 1962 Calendar year audit

on:
  pull_request:
    branches: [main]
    paths:
      - "src/calendar/**"
      - "data/calendar/living-sanctoral-read-model.v1.json"
      - "data/calendar/living-sanctoral-modern-observances.review.v1.json"
      - "data/calendar/cum-sanctissima-protected-third-class.review.v1.json"
      - "tests/calendar-living-traditional-year-reconciliation.mjs"
      - "tests/calendar-living-traditional-future-years.mjs"
      - "data/calendar/1962-year-independent-checks-*.json"
      - "tests/calendar-1962-full-year-audit.mjs"
      - "src/calendar/ordo-1962-preface-review.js"
      - "tests/calendar-ordo-1962-preface-review.mjs"
      - ".github/workflows/calendar-1962-year-audit.yml"
  workflow_dispatch:

concurrency:
  group: 1962-calendar-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  year-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:calendar
      - run: npx playwright install --with-deps chromium
      - name: Strict source-bound 1962 Preface category review
        run: node tests/calendar-ordo-1962-preface-review.mjs
      - name: Exhaustive 2026 production resolver sweep and independent checkpoints
        run: node tests/calendar-1962-full-year-audit.mjs
      - name: Reconcile living saints against every 2026 production day
        run: node tests/calendar-living-traditional-year-reconciliation.mjs
      - name: Verify future 2027–2032 resolved Calendar dates and distant future samples
        run: node tests/calendar-living-traditional-future-years.mjs
      - name: Publish findings even if audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-1962-2026-audit
          path: |
            artifacts/calendar-oracle/1962-2026-full-year-audit.json
            artifacts/calendar-oracle/1962-2026-preface-review.json
            artifacts/calendar-oracle/living-traditional-2026-reconciliation.json
            artifacts/calendar-oracle/living-traditional-future-year-audit.json
          if-no-files-found: warn
