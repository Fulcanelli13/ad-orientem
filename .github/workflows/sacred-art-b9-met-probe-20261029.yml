name: Sacred Art B9 - Met API source probe
on:
  push:
    branches: [research/sacred-art-b9-met-250-20261029]
    paths:
      - scripts/art/sacred-art-b9-met-source-probe-20261029.py
      - .github/workflows/sacred-art-b9-met-probe-20261029.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-b9-met-250-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official Met 2026 search and artwork formats
        run: python scripts/art/sacred-art-b9-met-source-probe-20261029.py
      - name: Save evidence
        run: |
          git config user.name "Ad Orientem sacred art"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/sacred-art-b9-met-source-probe-20261029.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(art): record Met API accessibility and rights fields for B9"
          git pull --rebase origin research/sacred-art-b9-met-250-20261029
          git push origin HEAD:research/sacred-art-b9-met-250-20261029
