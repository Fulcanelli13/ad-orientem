name: Sacred Art W66-W68 coverage, site media and selector

on:
  pull_request:
    branches: [main]
    paths:
      - "data/research/sacred-visual-w66-cross-module-938-visual-demand-preaudit-20261015.v1.json"
      - "tests/sacred-visual-w66-visual-demand-preaudit.mjs"
      - ".github/workflows/sacred-visual-w66-coverage.yml"
      - "data/research/sacred-visual-w67-main-runtime-existing-image-asset-and-legacy-exclusion-audit-20261015.v1.json"
      - "tests/sacred-visual-w67-runtime-source-assets-and-policy-holds.mjs"
      - "data/research/sacred-visual-w68-2026-runtime-proper-and-151-atlas-artwork-crosswalk-20261015.v1.json"
      - "tests/sacred-visual-w68-2026-selector-and-bible-evidence.mjs"
      - "data/research/sacred-art-class-i-53-release-intake-20261017.v1.json"
      - "data/research/sacred-art-class-i-53-unrejected-research-leads-20261017.v1.json"
      - "data/calendar/sacred-art-certified-media.v1.json"
      - "src/calendar/sacred-art-release-selector.js"
      - "tests/sacred-art-class-i-53-release-gates.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-demand-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check counts, non-promotion and no-permission policy
        run: |
          node tests/sacred-visual-w66-visual-demand-preaudit.mjs
          node tests/sacred-visual-w67-runtime-source-assets-and-policy-holds.mjs
          node tests/sacred-visual-w68-2026-selector-and-bible-evidence.mjs
          node tests/sacred-art-class-i-53-release-gates.mjs
