name: Preserved module painting visual previews (read-only)
# Original images and previews already live in two permanent research branches.
# Reconstruct new previews only in a separately reviewed research workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-archived-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read museum-original research archive
        uses: actions/checkout@v4
        with:
          ref: research/module-hero-museum-photos-20261026
          path: museum-research
          persist-credentials: false
      - name: Read public-domain-original research archive
        uses: actions/checkout@v4
        with:
          ref: research/module-hero-pd-masters-20261026
          path: pd-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Check original museum photo SHA-256 and human-unapproved previews
        run: |
          python scripts/art/verify-research-archive-readonly.py \
            --archive-root museum-research \
            --source-prefix assets/staged/module-hero-masters \
            --min-originals 3 \
            --report data/research/module-hero-museum-acquisition-20261026.json \
            --check-previews
      - name: Check original Commons photo SHA-256 and human-unapproved previews
        run: |
          python scripts/art/verify-research-archive-readonly.py \
            --archive-root pd-research \
            --source-prefix assets/staged/module-hero-masters \
            --min-originals 8 \
            --report data/research/module-hero-pd-acquisition-20261026.run.json \
            --check-previews
      - name: No automatic painting selection
        run: echo "Research-original quality still awaits human art, attribution, photograph rights, frame/crop and publication review."
