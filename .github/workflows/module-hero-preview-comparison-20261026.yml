name: Generate painting quality visual previews
on:
  push:
    branches: [main]
    paths: [.github/workflows/module-hero-preview-comparison-20261026.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module-hero-preview-comparison
  cancel-in-progress: false
jobs:
  lightweight-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Preserve script before switching into archived research branches
        run: cp scripts/art/make-module-hero-review-previews.py /tmp/module-hero-preview.py
      - name: Produce visual references on both archived source branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for BR in research/module-hero-museum-photos-20261026 research/module-hero-pd-masters-20261026; do
            git fetch origin "$BR"
            git switch -C "$BR" "origin/$BR"
            python /tmp/module-hero-preview.py
            git add -f assets/staged/module-hero-preview-jpegs/
            if ! git diff --cached --quiet; then
              git commit -m "research(art): add painting fidelity review JPGs, unapproved"
              git push origin "$BR"
            fi
          done
      - name: Do not promote art
        run: echo "Preview rendering is not painting fidelity approval."
