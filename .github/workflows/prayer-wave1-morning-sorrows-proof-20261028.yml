name: Prayer Wave 1 Morning and Sorrows verified photo proofs
on:
  push:
    branches:
      - feature/prayer-wave1-morning-sorrows-proof-20261028
    paths:
      - .github/workflows/prayer-wave1-morning-sorrows-proof-20261028.yml
      - scripts/art/prayer-wave1-morning-sorrows-proofs-20261028.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-morning-sorrows-assets-20261028
  cancel-in-progress: false
jobs:
  archive-review-only-photo-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prayer-wave1-morning-sorrows-proof-20261028
      - name: Install Pillow for no-cost offline image resizing
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Hash exact original masters and produce faithful whole-work proof assets
        run: |
          python -m py_compile scripts/art/prayer-wave1-morning-sorrows-proofs-20261028.py
          python scripts/art/prayer-wave1-morning-sorrows-proofs-20261028.py
      - name: Preserve only review derivatives and checksum manifest in git
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-wave1-morning-sorrows-proof-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(pray): archive source-sha-pinned Morning and Sorrows photo proofs"
          git pull --rebase origin feature/prayer-wave1-morning-sorrows-proof-20261028
          git push origin HEAD:feature/prayer-wave1-morning-sorrows-proof-20261028
