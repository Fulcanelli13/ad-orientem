name: Prayer Holy Face French 1895 all nine first-pass source gate
on:
  pull_request:
    branches: [main]
    paths:
      - "data/pray/research/pray-holy-face-1895-fr-day09-transcribed-first-pass.v1.json"
      - "data/pray/research/pray-holy-face-1895-fr-all-9day-first-pass-index.v1.json"
      - "tests/pray-holy-face-french-1895-all-nine-first-pass-gate.mjs"
      - ".github/workflows/pray-holy-face-1895-all-nine-first-pass-gate.yml"
      - "src/pray/holy-face-janvier-1887-b25.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-janvier-all-nine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  certify-first-pass-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all nine source records, 31 printed pages and fail-closed reader boundary
        run: node tests/pray-holy-face-french-1895-all-nine-first-pass-gate.mjs
      - name: Independently rerun individual first-pass source record regression guards
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            node "tests/pray-holy-face-french-1895-day${i}-research-gate.mjs"
          done
      - name: Preserve original 1895 printed nine-day map and all nine English readers
        run: node tests/pray-holy-face-1895-french-print-source-page-gate.mjs
