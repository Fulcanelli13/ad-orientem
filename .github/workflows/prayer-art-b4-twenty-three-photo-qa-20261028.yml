name: Prayer Sacred Art B4 - 23 native photo bulk inspection
on:
  push:
    branches:
      - research/prayer-artwork-pristine-registry-bulk-20261028
    paths:
      - .github/workflows/prayer-art-b4-twenty-three-photo-qa-20261028.yml
      - scripts/art/prayer-art-b4-twenty-three-native-photo-bulk-qa-20261028.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-prayer-b4-twenty-three-photo-quality
  cancel-in-progress: false
jobs:
  bulk-native-centre-and-edge-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prayer-artwork-pristine-registry-bulk-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free pinned image-verification dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Inspect exact 20 hero sources plus three existing B2 candidates
        run: |
          python -m py_compile scripts/art/prayer-art-b4-twenty-three-native-photo-bulk-qa-20261028.py
          python scripts/art/prayer-art-b4-twenty-three-native-photo-bulk-qa-20261028.py
      - name: Permanently preserve six review sheets and 23-case technical record
        if: always()
        run: |
          git config user.name "Ad Orientem research audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staged/prayer-pristine-bulk-23-photo-inspection-20261028/
          git diff --cached --check
          if git diff --cached --quiet; then echo "No changed native QA evidence"; exit 0; fi
          git commit -m "research(prayer art): preserve 23 native photo quality checks and review panels"
          git pull --rebase origin research/prayer-artwork-pristine-registry-bulk-20261028
          git push origin HEAD:research/prayer-artwork-pristine-registry-bulk-20261028
