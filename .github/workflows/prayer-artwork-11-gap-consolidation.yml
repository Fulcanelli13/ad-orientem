name: Prayer artwork editorial gap reconciliation

on:
  push:
    branches:
      - research/prayer-artwork-gap-consolidation-20261031
    paths:
      - 'data/prayer/artwork-editorial-20261031/**'
      - 'tests/prayer-art-11-gap-66-candidates-policy.mjs'
      - 'tests/prayer-approved-sacred-art-asset-integrity-20261031.mjs'
      - 'src/pray/benediction-mystic-lamb-user-art.v1.js'
      - 'src/pray/st-therese-selected-novena-cover.v1.js'
      - '.github/workflows/prayer-artwork-11-gap-consolidation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/prayer/artwork-editorial-20261031/**'
      - 'tests/prayer-art-11-gap-66-candidates-policy.mjs'
      - 'tests/prayer-approved-sacred-art-asset-integrity-20261031.mjs'
      - 'src/pray/benediction-mystic-lamb-user-art.v1.js'
      - 'src/pray/st-therese-selected-novena-cover.v1.js'
      - '.github/workflows/prayer-artwork-11-gap-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-artwork-approval-and-rights-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/prayer-art-11-gap-66-candidates-policy.mjs
      - run: node tests/prayer-approved-sacred-art-asset-integrity-20261031.mjs
      - name: Assert selected public-domain WebP artwork files exist
        run: |
          test -s assets/prayer/user-approved/benediction-mystic-lamb.webp
          test -s assets/prayer/user-approved/st-therese-lisieux-historical-portrait.webp
          node -e 'const x=require("./assets/prayer/user-approved/source-provenance.v1.json");if(x.images.length!==2)process.exit(1);console.log("Two exact archived public-domain images present")'
      - name: Locate actual St Therese novena routes without changing them
        run: |
          git ls-files 'src/*' | grep -Ei 'novena|devotion' | head -45 || true
          git grep -n -i -e 'lisieux' -e 'therese' -e 'thérèse' -- 'src/**' | head -45 || true
