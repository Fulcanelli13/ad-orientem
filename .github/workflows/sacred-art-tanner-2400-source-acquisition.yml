name: Sacred Art Tanner exact original source acquisition
on:
  push:
    branches:
      - 'release/sacred-art-tanner-nicodemus-original-20261111'
    paths:
      - 'data/artwork/releases/2026-05-25-tanner-nicodemus-2400-source.v1.json'
      - '.github/workflows/sacred-art-tanner-2400-source-acquisition.yml'
permissions:
  contents: write
concurrency:
  group: ao-sacred-art-tanner-original-2026
  cancel-in-progress: false
jobs:
  verify-and-commit-source:
    if: github.repository == 'Fulcanelli13/ad-orientem' && github.ref == 'refs/heads/release/sacred-art-tanner-nicodemus-original-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 2026 frozen selection and expected exact photo identity
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/artwork/releases/2026-05-25-tanner-nicodemus-2400-source.v1.json'))
          assert x['date']=='2026-05-25'
          assert x['principalId']=='tempora:Pasc7-1:1:r'
          assert x['properPath']=='Tempora/Pasc7-1'
          assert x['artworkIdentity']=='Pennsylvania Academy of the Fine Arts, 1900.1, 1899, oil on canvas'
          assert x['originalReportedSha1']=='74da94d7dd9e6cf3a90c05c9146d88a989bbec3f'
          assert x['originalReportedDimensions']==[2400,2100]
          assert x['originalReportedSizeBytes']==5285928
          assert 'Barbara Katus' in x['photographicPhotographerCredit']
          PY
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Acquire exact unaltered source JPEG and verify byte+photo identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/home/class-i-2026
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            -A 'AdOrientemSacredArt/1.0 (+https://github.com/Fulcanelli13/ad-orientem)' \
            'https://upload.wikimedia.org/wikipedia/commons/0/01/Nicodemus_Visiting_Jesus,_by_Henry_Ossawa_Tanner.jpg' \
            -o /tmp/tanner-nicodemus-2400.jpg
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          from PIL import Image
          row=json.load(open('data/artwork/releases/2026-05-25-tanner-nicodemus-2400-source.v1.json'))
          data=pathlib.Path('/tmp/tanner-nicodemus-2400.jpg').read_bytes()
          assert len(data)==row['originalReportedSizeBytes'], 'Image bytes differ from pinned Commons version'
          assert hashlib.sha1(data).hexdigest()==row['originalReportedSha1'], 'Exact original image SHA1 differs'
          with Image.open('/tmp/tanner-nicodemus-2400.jpg') as im:
            assert im.format=='JPEG' and list(im.size)==row['originalReportedDimensions']
            im.verify()
          with Image.open('/tmp/tanner-nicodemus-2400.jpg') as im: im.load()
          path=pathlib.Path(row['stagedLocalOriginal'])
          shutil.copyfile('/tmp/tanner-nicodemus-2400.jpg',path)
          report={'schema':'AO_TANNER_2400_EXACT_SOURCE_BYTE_PROOF_V1','image':str(path),
                  'sha1':hashlib.sha1(data).hexdigest(),'sha256':hashlib.sha256(data).hexdigest(),
                  'bytes':len(data),'dimensions':[2400,2100],'source':row['photographicSourcePage'],
                  'originalWork':row['artworkIdentity'],'photoRights':row['photographicSourceRights'],
                  'ownerPhotoCropApprovalNewlyCreated':False,'visualBrowserReviewComplete':False}
          out=pathlib.Path('data/artwork/releases/2026-05-25-tanner-nicodemus-photo-byte-proof.v1.json')
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('EXACT_PHOTO_SOURCE_VERIFIED',report['sha256'],report['bytes'],report['dimensions'])
          PY
      - name: Commit only verified original photograph and SHA256 provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ad Orientem source-verified image'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/home/class-i-2026/tanner-nicodemus-1899-pafa-1900-1-original.jpg \
            data/artwork/releases/2026-05-25-tanner-nicodemus-photo-byte-proof.v1.json
          git diff --cached --check
          git diff --cached --name-only | grep -Fxq 'assets/home/class-i-2026/tanner-nicodemus-1899-pafa-1900-1-original.jpg'
          git commit -m 'Sacred Art: retain exact Tanner Nicodemus full source photo with verified SHA1 and dimensions'
          git push origin 'HEAD:release/sacred-art-tanner-nicodemus-original-20261111'
