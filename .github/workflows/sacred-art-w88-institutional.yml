name: Sacred Art W88 Institutional Paintings
on:
  push:
    branches: [platform/885-sacred-art-candidates]
    paths:
      - tools/calendar/acquire-sacred-art-w88-institutional.py
      - .github/workflows/sacred-art-w88-institutional.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - name: Download exact museum originals and verify source quality
        run: |
          python -m py_compile tools/calendar/acquire-sacred-art-w88-institutional.py
          python tools/calendar/acquire-sacred-art-w88-institutional.py
      - name: Preserve original photographic bytes, uncropped derivatives and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-w88-museum-image-sources
          path: |
            artifacts/sacred-art-w88/
            docs/research/review-galleries/acquired/
          retention-days: 30
          if-no-files-found: warn
