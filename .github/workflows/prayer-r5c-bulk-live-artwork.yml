name: Prayer R5C bulk cleared artwork phone acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pray/art-slot-map.v1.js'
      - 'src/pray/presentation-runtime.js'
      - 'src/pray/prayer-design-pilot.js'
      - 'src/pray/released-module-photo-styles.js'
      - 'src/pray/novena-runtime.js'
      - 'tests/prayer-r5c-bulk-live-artwork-phone.mjs'
      - 'tests/prayer-r5c-acquisition-queue.mjs'
      - 'data/pray/artwork-r5c-bulk-acquisition-73-source-groups-20261103.v1.json'
      - '.github/workflows/prayer-r5c-bulk-live-artwork.yml'
  push:
    branches: [main]
    paths:
      - 'src/pray/art-slot-map.v1.js'
      - 'src/pray/presentation-runtime.js'
      - 'src/pray/prayer-design-pilot.js'
      - 'src/pray/released-module-photo-styles.js'
      - 'src/pray/novena-runtime.js'
      - 'tests/prayer-r5c-bulk-live-artwork-phone.mjs'
      - 'tests/prayer-r5c-acquisition-queue.mjs'
      - 'data/pray/artwork-r5c-bulk-acquisition-73-source-groups-20261103.v1.json'
      - '.github/workflows/prayer-r5c-bulk-live-artwork.yml'
permissions:
  contents: read
concurrency:
  group: prayer-r5c-artwork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cleared-reader-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Preserve editorial, Angelus, St Joseph and Fr Mateo source contracts
        run: |
          node tests/prayer-artwork-267-integration.mjs
          node tests/prayer-r5c-acquisition-queue.mjs
          node tests/angelus-folio-contract.mjs
          node tests/pray-st-joseph-seven-sorrows-b24.mjs
          node tests/pray-b29-night-home-adoration.mjs
      - run: npx playwright install --with-deps chromium
      - name: Check actual approved artwork placements 320/390 EN/FR
        run: node tests/prayer-r5c-bulk-live-artwork-phone.mjs
      - name: Retain source/photo/phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-r5c-bulk-live-artwork
          path: artifacts/prayer-r5c-bulk-artwork/
          if-no-files-found: warn
          retention-days: 7
