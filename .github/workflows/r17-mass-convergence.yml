name: R17 Mass convergence

on:
  push:
    branches:
      - implementation/r17-mass-convergence
      - implementation/r17-mass-convergence-mainline
  pull_request:
    paths:
      - "src/mass/**"
      - "data/mass/**"
      - "tests/**"
      - "package.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
