name: R17 Mass convergence

on:
  push:
    branches:
      - implementation/r17-mass-convergence
      - implementation/r17-mass-convergence-mainline
  pull_request:
    paths:
      - "src/mass/**"
      - "data/mass/**"
      - "data/presentation/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/r17-mass-convergence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  phone-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
