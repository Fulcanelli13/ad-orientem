name: R17 Mass convergence

on:
  push:
    branches:
      - implementation/r17-mass-convergence
      - implementation/r17-mass-convergence-mainline
  pull_request:
    paths:
      - "src/mass/**"
      - "data/mass/**"
      - "data/presentation/**"
      - "tests/reader-*.mjs"
      - "tests/*mass*.mjs"
      - "tests/proper-*.mjs"
      - "tests/faithful-gesture-cues.mjs"
      - "tests/canonical-text-corrections.mjs"
      - "tests/postcommunion-exit.mjs"
      - "tests/pre-gospel-sequence.mjs"
      - "tests/r17-convergence.mjs"
      - "tests/v1.83-reader-parity.mjs"
      - "tests/app-shell-easter-vigil-e2e.mjs"
      - "tests/app-shell-nuptial-e2e.mjs"
      - "tests/field-current-week-e2e.mjs"
      - "tests/release-candidate-field-qa.mjs"
      - "tests/source-transport-compat.mjs"
      - "tests/sacred-geography-profiles-editorial.mjs"
      - "tests/fixtures/reader-phone-harness.html"
      - "tests/reader-phone-production-card-default.mjs"
      - "index.html"
      - ".github/workflows/required-main-gate.yml"
      - "tests/required-main-gate-contract.mjs"
      - ".github/workflows/r17-mass-convergence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/required-main-gate-contract.mjs
      - run: npm test

  phone-browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
      - name: Retain actual LIVE cinematic phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cinematic-scenes-phone
          path: artifacts/live-cinematics/*.png
          if-no-files-found: warn
          retention-days: 14

  curated65-phone:
    # Deliberately independent of the broad npm test job: an unrelated
    # Shrine corpus assertion must not suppress Mass phone acceptance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/reader-phone-acceptance.mjs
      - run: npm run test:phone-curated65
      # Independently certify Ordinary priest/Schola separation. The broad
      # npm run test:phone sequence can stop earlier on non-Mass regressions;
      # it must not hide an Agnus/Gloria/Creed renderer failure.
      - name: Confirm independent priest and Schola icons on LIVE phone
        run: node tests/reader-priest-chant-phone.mjs
      - run: node tests/reader-phone-production-card-default.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated65-mass-phone-screenshots
          path: artifacts/curated65-phone/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain bilingual Missal book-view phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-missal-phone-book
          path: artifacts/missal-phone-review/
          if-no-files-found: warn
          retention-days: 30
