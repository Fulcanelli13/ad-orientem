name: R17 Mass convergence

on:
  push:
    branches:
      - implementation/r17-mass-convergence
      - implementation/r17-mass-convergence-mainline
  pull_request:
    paths:
      - "src/mass/**"
      - "data/mass/**"
      - "data/presentation/**"
      - "tests/reader-*.mjs"
      - "tests/*mass*.mjs"
      - "tests/proper-*.mjs"
      - "tests/faithful-gesture-cues.mjs"
      - "tests/canonical-text-corrections.mjs"
      - "tests/postcommunion-exit.mjs"
      - "tests/pre-gospel-sequence.mjs"
      - "tests/r17-convergence.mjs"
      - "tests/v1.83-reader-parity.mjs"
      - "tests/app-shell-easter-vigil-e2e.mjs"
      - "tests/app-shell-nuptial-e2e.mjs"
      - "tests/field-current-week-e2e.mjs"
      - "tests/release-candidate-field-qa.mjs"
      - "tests/source-transport-compat.mjs"
      - "tests/sacred-geography-profiles-editorial.mjs"
      - "tests/fixtures/reader-phone-harness.html"
      - "tests/reader-phone-production-card-default.mjs"
      - "index.html"
      - ".github/workflows/required-main-gate.yml"
      - "tests/required-main-gate-contract.mjs"
      - ".github/workflows/r17-mass-convergence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/required-main-gate-contract.mjs
      - name: Audit all 17 unresolved source gesture artwork decisions without runtime promotion
        run: node tests/mass-17-gesture-icon-disposition.mjs
      - name: Preserve seven exact adaptive SVG user-review choices without releasing artwork
        run: node tests/mass-seven-adaptive-svg-user-review.mjs
      - name: Verify six explicitly user-approved 1962 source-owned priest icons and C0169 rejection
        run: node tests/mass-six-user-approved-gesture-icons.mjs
      - name: Verify Leclerc 1661 CC0 historical original bits, rights, and strictly research-only 1962 gesture use
        run: node tests/mass-priest-gesture-p4-original.mjs
      - name: Validate source-owned All Souls selection and native module syntax
        run: |
          node --check src/mass/full-mass-preflight.js
          node --check src/mass/browser-entry.js
          node tests/mass-1962-all-souls-source.mjs
          node tests/mass-1962-all-souls-consecutive-rites.mjs
      - run: npm test

  phone-browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
      - name: Retain actual LIVE cinematic phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cinematic-scenes-phone
          path: artifacts/live-cinematics/*.png
          if-no-files-found: warn
          retention-days: 14

  curated65-phone:
    # Deliberately independent of the broad npm test job: an unrelated
    # Shrine corpus assertion must not suppress Mass phone acceptance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/reader-phone-acceptance.mjs
      - name: Certify Requiem choir posture source cues in LIVE and Missal on phones
        run: node tests/reader-requiem-choir-posture-phone.mjs
      - run: npm run test:phone-curated65
      - name: Certify 1962 Memento and minor elevation rubrics in LIVE and Missal at phone widths
        run: node tests/mass-1962-memento-minor-phone.mjs
      - name: Certify four remaining prescribed priest gesture rubrics at exact source cues
        run: node tests/mass-1962-four-gestures-phone.mjs
      - name: Confirm all 17 unbound gesture cues stay on their original 65-card prayer paragraphs
        run: node tests/mass-17-gesture-source-phone.mjs
      # Independently certify Ordinary priest/Schola separation. The broad
      # npm run test:phone sequence can stop earlier on non-Mass regressions;
      # it must not hide an Agnus/Gloria/Creed renderer failure.
      - name: Confirm independent priest and Schola icons on LIVE phone
        run: node tests/reader-priest-chant-phone.mjs
      - name: Verify selected Gloria/Credo omissions and independent chant windows
        run: node tests/reader-gloria-credo-omission-phone.mjs
      - run: node tests/reader-phone-production-card-default.mjs
      - name: Guard source-preserving English Dies irae translation against unscoped omission note
        run: node tests/1962-all-souls-dies-irae-english-display.mjs
      - name: Gate 1–2 November 2026 source-owned Mass reader readiness
        run: node tests/mass-november-2026-release-gate-e2e.mjs
      - name: Retain November 1–2 evidence even on a failing release gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: november-2026-mass-readiness
          path: |
            artifacts/mass-november-readiness/report.json
            artifacts/mass-november-readiness/all-souls-m*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated65-mass-phone-screenshots
          path: artifacts/curated65-phone/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain all 17 source-paragraph placements and original phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-17-gesture-source-phone
          path: artifacts/mass-17-gesture-source-paragraphs/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve four 1962 priest gesture source-cue phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-1962-four-gestures-phone
          path: artifacts/mass-1962-four-gestures-phone/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain exact 1962 Memento and minor-elevation phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-1962-memento-minor-phone
          path: artifacts/mass-1962-memento-minor-phone/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain bilingual Missal book-view phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-missal-phone-book
          path: artifacts/missal-phone-review/
          if-no-files-found: warn
          retention-days: 30
