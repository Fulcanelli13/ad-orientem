name: Prayer Holy Face 1895 French day-one source hold
on:
  pull_request:
    branches: [main]
    paths:
      - "data/pray/research/pray-holy-face-1895-fr-day01-transcribed-proofread.v1.json"
      - "tests/pray-holy-face-french-1895-day1-research-gate.mjs"
      - ".github/workflows/pray-holy-face-1895-day1-translation-research.yml"
      - "src/pray/holy-face-janvier-1887-b25.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pray-janvier-day01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Certify staged day-one French transcript without changing published languages
        run: node tests/pray-holy-face-french-1895-day1-research-gate.mjs
      - name: Preserve full nine-day French-source admission gate
        run: node tests/pray-holy-face-1895-french-print-source-page-gate.mjs
