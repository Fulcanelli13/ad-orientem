name: B21R2 Cleveland original / print-derivative recovery
on:
  push:
    branches: [research/b19-original-image-acquisition-probe-20261023]
    paths: [.github/workflows/ao-b21r2-cma-print.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-cma-prints:
    # Historical acquisition: avoid re-downloading originals merely because the protective workflow was merged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Ensure only 8 oversized originals and the exact subpart accession are targeted
        shell: bash
        run: |
          python -m py_compile scripts/research/sacred_art_cma_print_recovery.py
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('data/research/sacred-art-b21r2-cleveland9.manifest.json').read_text())
          a=d['records']
          assert len(a)==9 and len({r['asset_source_id'] for r in a})==9
          assert sum(r['planned_retrieval']=='CMA_PRINT_DERIVATIVE_3400PX' for r in a)==8
          assert sum(r['planned_retrieval']=='EXACT_ACCESSION_RECHECK' for r in a)==1
          assert all(r['api_type']=='cleveland' for r in a)
          PY
      - name: Query object rights and download museum prints or exact original if eligible
        run: python scripts/research/sacred_art_cma_print_recovery.py
      - name: Upload research images and audit (never app assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-orientem-b21r2-cma-nine-image-evidence
          path: artifacts/b21r2/
          retention-days: 7
          if-no-files-found: warn
      - name: P0 gate - archive unchanged acquisition files in an unpublished GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/sacred_art_release_archive_gate.py --wave b21r2 --source-dir artifacts/b21r2
      - name: Preserve small audit CSV/JSON in research branch
        if: success()
        shell: bash
        run: |
          cp artifacts/b21r2/Acquisition_results.csv data/research/sacred-art-b21r2-cma9.audit.csv
          cp artifacts/b21r2/Acquisition_summary.json data/research/sacred-art-b21r2-cma9.audit-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/sacred-art-b21r2-cma9.audit.csv data/research/sacred-art-b21r2-cma9.audit-summary.json
          git commit -m 'research: preserve Cleveland CC0 print/original image recovery audit'
          git fetch origin research/b19-original-image-acquisition-probe-20261023
          git rebase origin/research/b19-original-image-acquisition-probe-20261023
          git push origin HEAD:research/b19-original-image-acquisition-probe-20261023
