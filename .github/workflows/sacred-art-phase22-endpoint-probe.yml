name: Sacred Art Phase 22 — French museum endpoint probe
on:
  push:
    branches:
      - research/sacred-art-phase18-iiif-audit-20261106
    paths:
      - 'scripts/sacred-art/phase22-endpoint-probe.py'
      - '.github/workflows/sacred-art-phase22-endpoint-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Probe alternate official API endpoints with bounded response sizes
        run: |
          python -m py_compile scripts/sacred-art/phase22-endpoint-probe.py
          python scripts/sacred-art/phase22-endpoint-probe.py
      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase22-french-endpoint-diagnostics
          path: artifacts/sacred-art-phase22-endpoint-probe/
          retention-days: 7
          if-no-files-found: warn
