name: Archived — Vercel deployment storage audit

# Vercel publication was retired on 4 November 2026.
# This file remains for archival/manual source analysis only.
# Production release acceptance now runs via github-pages.yml and the
# curated GitHub Pages build, including the San Polo artwork leakage gate.
# Never automatically run Vercel-specific budget/deploy workflows on a PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release output excludes only research and staging
        run: node tests/vercel-deployment-storage.mjs
      - name: Verify Catena provenance and 23-chapter lazy-loading contract
        run: node tests/scripture-catena-corpus.mjs
      - name: Verify deployment skip decisions preserve runtime changes
        run: node tests/vercel-build-eligibility.mjs
