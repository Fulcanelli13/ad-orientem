name: Vercel deployment storage budget

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/build-web-preview.mjs"
      - "tests/scripture-catena-corpus.mjs"
      - "src/scripture/catena-inline.js"
      - "tools/vercel-build-eligibility.mjs"
      - "tests/vercel-build-eligibility.mjs"
      - "tests/vercel-deployment-storage.mjs"
      - ".github/workflows/vercel-deployment-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release output excludes only research and staging
        run: node tests/vercel-deployment-storage.mjs
      - name: Verify Catena provenance and 23-chapter lazy-loading contract
        run: node tests/scripture-catena-corpus.mjs
      - name: Verify deployment skip decisions preserve runtime changes
        run: node tests/vercel-build-eligibility.mjs
