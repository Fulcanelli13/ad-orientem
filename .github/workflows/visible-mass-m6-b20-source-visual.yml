name: M6 B20 isolated sanctuary objects
on:
  push:
    branches:
      - feature/visible-mass-3d-explorer-p0
    paths:
      - "tools/visible-mass-m6-b20-isolated-sanctuary-photo-sprint.py"
      - ".github/workflows/visible-mass-m6-b20-source-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source image dependencies
        run: python -m pip install --quiet --disable-pip-version-check Pillow==11.3.0 requests==2.32.5
      - name: Verify Commons licensing and inspect exact source images
        run: python tools/visible-mass-m6-b20-isolated-sanctuary-photo-sprint.py
      - name: Retain rights manifest and actual image contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M6-B20-Sanctuary-Lamp-Altar-Crucifix-Images
          path: dist/visible-mass/m6-b20-single-object/
          if-no-files-found: warn
          retention-days: 30
