name: Sacred Art source-image byte audit (research only)
on:
  push:
    branches:
      - research/sacred-art-b56-classi-53-hero-selector-20261024
    paths:
      - .github/workflows/sacred-art-original-source-audit.yml
      - scripts/research/audit_class_i_original_images.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-original-source-batch3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image parser
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and hash exact originals without approving frames
        run: python scripts/research/audit_class_i_original_images.py --output data/research/sacred-art-20261027-class-i-original-byte-report.v1.json
      - name: Save small provenance JSON only (no binaries or expiring artifacts)
        if: always()
        run: |
          if test -f data/research/sacred-art-20261027-class-i-original-byte-report.v1.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/research/sacred-art-20261027-class-i-original-byte-report.v1.json
            if ! git diff --cached --quiet; then
              git commit -m 'research(sacred-art): source file SHA256 evidence; no image release'
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
