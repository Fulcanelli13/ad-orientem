name: Full Mass catalogue inventory
on:
  pull_request:
    paths:
      - "tests/full-mass-catalogue-inventory.mjs"
      - ".github/workflows/full-mass-catalogue-inventory.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/full-mass-catalogue-inventory.mjs
