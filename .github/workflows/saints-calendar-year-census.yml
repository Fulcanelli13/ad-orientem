name: Saints observed 1962 Calendar census 2026
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/saints-calendar-year-census.mjs'
      - 'tools/saints/project-observed-day-subject-demand.mjs'
      - 'tools/saints/reconcile-2026-cross-owner-evidence.mjs'
      - 'tools/saints/join-historic-components-to-observed-year.mjs'
      - 'tools/saints/build-2026-full-calendar-coverage-matrix.mjs'
      - 'data/saints/full-calendar-exact-source-key-ledger-20261016.v1.json'
      - 'data/saints/observed-2026-twelve-person-source-reconciliation.v1.json'
      - 'tests/saints-twelve-observed-source-resolution.mjs'
      - 'data/saints/historical-v4333-311-components.recovered.v1.json'
      - '.github/workflows/saints-calendar-year-census.yml'
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Read all 365 observed days from existing Calendar resolver
        run: node tests/saints-calendar-year-census.mjs
      - name: Derive source-name and sacred-art demand triage (no identity promotion)
        run: node tools/saints/project-observed-day-subject-demand.mjs
      - name: Download pinned owner-only Calendar and W63 art input (read-only)
        run: |
          mkdir -p artifacts/saints-owner-inputs
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/Fulcanelli13/ad-orientem/622e9073272948e90549851ad30efcf3b7d7ec2a/data/calendar/cum-sanctissima-protected-third-class.review.v1.json" -o artifacts/saints-owner-inputs/calendar-protected-70.json
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/Fulcanelli13/ad-orientem/622e9073272948e90549851ad30efcf3b7d7ec2a/data/calendar/doctors-of-church-roster.review.v1.json" -o artifacts/saints-owner-inputs/calendar-doctors-38.json
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/Fulcanelli13/ad-orientem/8cfaaf62e7d0dee14dbad182e58d0aa8009dfcdb/data/research/sacred-visual-w62-live-route-and-saint-identity-inputs-20261015.v1.json" -o artifacts/saints-owner-inputs/art-w62-historical-expectations.json
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/Fulcanelli13/ad-orientem/8cfaaf62e7d0dee14dbad182e58d0aa8009dfcdb/data/research/sacred-visual-w63-2026-365-date-candidate-image-index-20261015.v1.json" -o artifacts/saints-owner-inputs/art-w63-dated-source-evidence.json
      - name: Join observed 2026 source IDs to protected 1962, Doctors, W62 and W63
        run: node tools/saints/reconcile-2026-cross-owner-evidence.mjs
      - name: Join all 311 committed historical saint-art components to 2026 observed source evidence
        run: node tools/saints/join-historic-components-to-observed-year.mjs
      - name: Compile deduplicated all-365-day Calendar coverage and 42 reference gaps
        run: node tools/saints/build-2026-full-calendar-coverage-matrix.mjs
      - name: Validate twelve archive identity candidates against the generated 42 raw-source gaps
        run: node tests/saints-twelve-observed-source-resolution.mjs
      - name: Keep auditable source-owner census
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saints-2026-observed-source-owner-census
          path: |
            artifacts/saints-calendar-census/*.json
            artifacts/saints-calendar-census/saints-2026-coverage-report.md
          if-no-files-found: warn
          retention-days: 14
