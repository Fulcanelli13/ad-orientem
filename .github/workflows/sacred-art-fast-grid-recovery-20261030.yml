name: Sacred Art fast-grid missing-photo recovery (public repo, €0)
on:
  push:
    branches:
      - research/sacred-art-duplicate-gate-20261030
    paths:
      - scripts/art/recover-sacred-art-fast-grid-missing-20261030.py
      - .github/workflows/sacred-art-fast-grid-recovery-20261030.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-fast-grid-recovery-20261030
  cancel-in-progress: false
jobs:
  embed-missing-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sacred-art-duplicate-gate-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Recover exact-source photo previews into offline HTML
        run: python scripts/art/recover-sacred-art-fast-grid-missing-20261030.py
      - name: Validate original approvals and all gallery counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('data/calendar/sacred-art-master-v2')
          ledger=json.loads((root/'fast-grid-offline-photo-recovery-20261030.v1.json').read_text())
          summary=json.loads((root/'fast-grid-click-review-ui-proof-20261030.v1.json').read_text())
          assert ledger['reviewTotal']==444 and ledger['embeddedTotal']+ledger['missingTotal']==444
          assert ledger['queue1Promotions']==ledger['productionMutations']==ledger['userApprovalsChanged']==0
          assert summary['batches']['01']['previewsEmbedded']==73
          for batch,target in [('02',200),('03',171)]:
              path=Path('docs/SACRED_ART_FAST_GRID_REVIEW_BATCH'+batch+'_20261030.html')
              page=path.read_text()
              m=re.search(r'const data=(\[[\s\S]*?\]);\s*const KEY=',page)
              assert m,'Missing gallery data'
              cards=json.loads(m.group(1))
              embedded=sum((x.get('preview') or '').startswith('data:image/') for x in cards)
              assert len(cards)==target and len({x['id'] for x in cards})==target
              assert embedded==ledger['batches'][batch]['embeddedNow']
              assert embedded==summary['batches'][batch]['previewsEmbedded']
              assert all(x['available'] for x in cards if (x.get('preview') or '').startswith('data:image/'))
          print('Validated',ledger['embeddedTotal'],'embedded gallery images; no publication changes')
          PY
      - name: Preserve recovered review images and proof on research branch
        run: |
          git config user.name "Ad Orientem sacred-art QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SACRED_ART_FAST_GRID_REVIEW_BATCH02_20261030.html docs/SACRED_ART_FAST_GRID_REVIEW_BATCH03_20261030.html data/calendar/sacred-art-master-v2/fast-grid-click-review-ui-proof-20261030.v1.json data/calendar/sacred-art-master-v2/fast-grid-offline-photo-recovery-20261030.v1.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(sacred-art): persist source-bound recovered gallery thumbnails [skip ci]"
            git pull --rebase origin research/sacred-art-duplicate-gate-20261030
            git push origin HEAD:research/sacred-art-duplicate-gate-20261030
          fi
