<script type="application/json" id="canon-payload">{"schema":"ao-canon-eight-direct-review-v1","status":"EDITORIAL_PREVIEW_ONLY_UNPUBLISHED","studies":[{"id":"AO.FORM.CANON.DEEP.01","stage_id":"MF04","block_ids":["AO.SM.B047","AO.SM.B048","AO.SM.B049","AO.SM.B050"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF04-C01","MF04-C02","MF04-C03"],"title":{"en":"At the beginning of the Canon — the whole Church","fr":"Au commencement du Canon — l’Église entière"},"lead":{"en":"The Canon opens not with an isolated prayer for the celebrant but with the offering made for the Church, its shepherds and its members. The prayers for the living and the communion of saints place the sacrifice within the whole Church.","fr":"Le Canon ne s’ouvre pas sur une prière isolée pour le célébrant, mais sur l’offrande présentée pour l’Église, ses pasteurs et ses membres. Les prières pour les vivants et la communion des saints situent le sacrifice au sein de toute l’Église."},"sections":[{"heading":{"en":"Te igitur: praying for the Church","fr":"Te igitur : prier pour l’Église"},"body":{"en":"The first Canon prayer is addressed to the Father through Jesus Christ. The priest asks God to accept the offering and preserve the Church in peace, unity and good governance. The Pope and the local bishop are named within this intercession. These petitions show why the quiet Canon is not a private exercise disconnected from the faithful: the Church prays for her members, her pastors and her visible unity as she offers the sacrifice.","fr":"La première prière du Canon s’adresse au Père par Jésus-Christ. Le prêtre demande à Dieu d’agréer l’offrande et de conserver l’Église dans la paix, l’unité et un bon gouvernement. Le Pape et l’évêque du lieu sont nommés dans cette intercession. Ces demandes montrent pourquoi le Canon récité à voix basse n’est pas un exercice privé séparé des fidèles : l’Église prie pour ses membres, ses pasteurs et son unité visible en offrant le sacrifice."},"claim_ids":["MF04-C01","MF04-C02"]},{"heading":{"en":"The Memento of the living","fr":"Le Mémento des vivants"},"body":{"en":"The Canon then makes room for the remembrance of living persons. Some may be named by the priest; others remain known to God. It is natural for those attending Mass to remember relatives, friends and people entrusted to their prayers. The silence need not be filled with explanations or extra ritual directions: the liturgical text already gives it purpose. This remembrance belongs to the Church's offering, not to a parallel private ceremony added to the Mass.","fr":"Le Canon fait ensuite place au souvenir des personnes vivantes. Certaines peuvent être nommées par le prêtre ; les autres demeurent connues de Dieu. Les fidèles qui assistent à la Messe peuvent naturellement se rappeler leurs proches, leurs amis et ceux qui leur sont confiés. Il n’est pas nécessaire de remplir ce silence d’explications ou d’indications cérémonielles supplémentaires : le texte liturgique lui donne déjà son sens. Ce souvenir appartient à l’offrande de l’Église et n’ajoute pas une cérémonie privée à la Messe."},"claim_ids":["MF04-C02","MF04-C03"]},{"heading":{"en":"Communicantes: communion beyond the congregation","fr":"Communicantes : une communion plus vaste que l’assemblée"},"body":{"en":"Communicantes brings the earthly Church into communion with the Blessed Virgin Mary, Saint Joseph, the named Apostles and Martyrs, and all the saints. The Latin prayer asks that, through their merits and prayers, God protect and help us. Their intercession is requested within worship offered through Jesus Christ, not in place of Him. The priest thus remembers a communion far wider than those physically gathered before the altar.","fr":"Communicantes unit l’Église de la terre à la Bienheureuse Vierge Marie, à saint Joseph, aux Apôtres et Martyrs nommés, et à tous les saints. La prière latine demande à Dieu leur secours par les mérites et les prières des saints. Leur intercession est invoquée dans le culte offert par Jésus-Christ, non à sa place. Le prêtre fait ainsi mémoire d’une communion qui dépasse largement les fidèles présents devant l’autel."},"claim_ids":["MF04-C01","MF04-C02"]},{"heading":{"en":"Hanc igitur: peace and the final journey","fr":"Hanc igitur : la paix et le terme de la vie"},"body":{"en":"The concluding petition of this opening group places the offering before God on behalf of His household, imploring peace in our days and deliverance from eternal condemnation. The priest does not interrupt the Canon to teach an additional lesson: these words are themselves prayer. Read Te igitur, Memento, Communicantes and Hanc igitur together as a movement from the visible Church and its living members toward the wider communion and the hope of salvation.","fr":"La dernière supplication de ce groupe initial présente l’offrande à Dieu pour toute sa famille, en demandant la paix en nos jours et la délivrance de la condamnation éternelle. Le prêtre n’interrompt pas le Canon pour donner une leçon supplémentaire : ces paroles sont elles-mêmes prière. Lisez Te igitur, Memento, Communicantes et Hanc igitur comme un mouvement de l’Église visible et de ses membres vivants vers la communion plus vaste et l’espérance du salut."},"claim_ids":["MF04-C01","MF04-C02"]}]},{"id":"AO.FORM.CANON.DEEP.02","stage_id":"MF05","block_ids":["AO.SM.B051"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF05-C01","MF05-C02"],"title":{"en":"Quam oblationem — before the Consecration","fr":"Quam oblationem — avant la Consécration"},"lead":{"en":"This quiet prayer stands immediately before the words over the bread and wine. The priest asks the Father to accept and bless the offering so that it may become for us the Body and Blood of Christ. The petition prepares us to understand what follows; it is not an additional consecration.","fr":"Cette prière silencieuse précède immédiatement les paroles prononcées sur le pain et le vin. Le prêtre demande au Père d’agréer et de bénir l’offrande afin qu’elle devienne pour nous le Corps et le Sang du Christ. La supplication prépare à comprendre la suite ; elle n’est pas une consécration supplémentaire."},"sections":[{"heading":{"en":"Why the prayer belongs immediately here","fr":"Pourquoi cette prière se trouve ici"},"body":{"en":"The Canon has already presented the offering to God, prayed for the Church, and remembered those for whom the sacrifice is offered. Quam oblationem now approaches the heart of the action. Its request is addressed to the Father: may this offering be blessed and accepted, and may it become the Body and Blood of His beloved Son. Reading this prayer alongside the words of institution that follow helps distinguish a solemn petition from the sacramental Consecration itself. The prayer belongs to the received sequence; it neither replaces Christ’s words nor creates an independent ritual event.","fr":"Le Canon a déjà présenté l’offrande à Dieu, prié pour l’Église et fait mémoire des personnes pour lesquelles le sacrifice est offert. Quam oblationem nous conduit maintenant au cœur de l’action. La demande s’adresse au Père : que cette offrande soit bénie et agréée, et qu’elle devienne le Corps et le Sang de son Fils bien-aimé. Lire cette prière avec les paroles de l’institution qui suivent aide à distinguer une supplication solennelle de la Consécration sacramentelle elle-même. Elle appartient à la succession reçue des prières ; elle ne remplace ni les paroles du Christ ni ne constitue un rite indépendant."},"claim_ids":["MF05-C01"]},{"heading":{"en":"Five descriptions of one offering","fr":"Cinq qualifications d’une seule offrande"},"body":{"en":"The Latin gathers five qualifications of the single offering: benedictam, adscriptam, ratam, rationabilem and acceptabilem. They are not five separate offerings or five consecrations. By this solemn petition the priest asks that the offering be blessed, acknowledged, ratified, reasonable and acceptable to God. The signs of the Cross accompany the prayer; the sacramental words over the bread and chalice come immediately afterwards. This difference matters when reading the Canon in its actual order.","fr":"Le latin réunit cinq qualifications d’une même offrande : benedictam, adscriptam, ratam, rationabilem et acceptabilem. Il ne s’agit ni de cinq offrandes ni de cinq consécrations. Par cette supplication solennelle, le prêtre demande que l’offrande soit bénie, reconnue, ratifiée, raisonnable et agréable à Dieu. Les signes de croix accompagnent la prière ; les paroles sacramentelles sur le pain et le calice viennent immédiatement après. Cette distinction aide à lire le Canon dans son ordre propre."},"claim_ids":["MF05-C01"]},{"heading":{"en":"What the Church means by the change","fr":"Ce que l’Église entend par le changement"},"body":{"en":"The petition concludes by asking that the offering become the Body and Blood of Jesus Christ. Catholic teaching names the change at the Consecration transubstantiation: the substance of bread becomes Christ’s Body and the substance of wine becomes His Blood, while the appearances of bread and wine remain. The whole risen Christ is truly present under either species. Therefore the Eucharist cannot be reduced to a reminder or symbolic gesture. The quiet prayer prepares the mind for this reality, while the priest proceeds to the distinct sacramental words preserved in the Missal.","fr":"La demande s’achève en priant pour que l’offrande devienne le Corps et le Sang de Jésus-Christ. L’Église appelle transsubstantiation le changement accompli à la Consécration : la substance du pain devient le Corps du Christ et celle du vin son Sang, tandis que demeurent les apparences du pain et du vin. Le Christ ressuscité tout entier est réellement présent sous chacune des espèces. L’Eucharistie ne peut donc être réduite à un souvenir ou à un geste symbolique. Cette prière silencieuse prépare l’esprit à cette réalité, puis le prêtre poursuit avec les paroles sacramentelles distinctes du Missel."},"claim_ids":["MF05-C01"]},{"heading":{"en":"Why bread and chalice are consecrated separately","fr":"Pourquoi le pain et le calice sont consacrés séparément"},"body":{"en":"In the Roman Mass, the priest pronounces the words over the Host and then over the chalice. This distinction matters: the separate sacramental appearances of Body and Blood represent Christ’s sacrificial death. It does not mean the risen Lord is divided between the two species, nor that He dies again upon the altar. The prayer Quam oblationem turns toward both Body and Blood before those two acts. Its place makes the unity of the sacrifice and the distinction of the following words intelligible without inventing an extra consecration between them.","fr":"Dans la Messe romaine, le prêtre prononce les paroles d’abord sur l’Hostie, puis sur le calice. Cette distinction est importante : la présence sacramentelle séparée du Corps et du Sang représente la mort sacrificielle du Christ. Elle ne signifie ni que le Seigneur ressuscité soit divisé entre les deux espèces, ni qu’Il meure une nouvelle fois sur l’autel. Quam oblationem oriente déjà la prière vers le Corps et le Sang avant ces deux actes. Sa place rend intelligibles l’unité du sacrifice et la distinction des paroles suivantes, sans imaginer une consécration supplémentaire."},"claim_ids":["MF05-C01","MF05-C02"]},{"heading":{"en":"How to follow without interrupting the Canon","fr":"Comment suivre sans interrompre le Canon"},"body":{"en":"As the priest prays Quam oblationem quietly, attend to the final request: that the offering become for us the Body and Blood of God’s beloved Son. The petition invites reverence and expectation. The separate words spoken next over the Host and the chalice are not repetitions of this request, but the sacramental Consecrations to which it leads. Following the Latin and its translation allows the movement from supplication to the words of Christ to stand out.","fr":"Pendant que le prêtre récite silencieusement Quam oblationem, considérez la demande finale : que l’offrande devienne pour nous le Corps et le Sang du Fils bien-aimé de Dieu. Cette supplication appelle le recueillement et l’attente. Les paroles qui suivent séparément sur l’Hostie et le calice ne répètent pas cette demande : elles sont les Consécrations sacramentelles auxquelles elle conduit. Le latin et sa traduction font apparaître ce passage de la supplication aux paroles du Christ."},"claim_ids":["MF05-C01","MF05-C02"]}]},{"id":"AO.FORM.CANON.DEEP.03","stage_id":"MF05","block_ids":["AO.SM.B052","AO.SM.B053"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF05-C01","MF05-C02","MF05-C03"],"title":{"en":"The Consecration of the Host and chalice","fr":"La Consécration de l’Hostie et du calice"},"lead":{"en":"The Roman Mass preserves the words of Christ over bread and wine in two distinct acts. The change is real, and the faithful adore the whole Christ present under each species. The separate sacramental signs make His sacrifice visible without repeating His death.","fr":"La Messe romaine conserve les paroles du Christ sur le pain et le vin en deux actes distincts. Le changement est réel, et les fidèles adorent le Christ tout entier présent sous chaque espèce. Les signes sacramentels séparés rendent visible son sacrifice sans répéter sa mort."},"sections":[{"heading":{"en":"Why the words of Christ are central","fr":"Pourquoi les paroles du Christ sont essentielles"},"body":{"en":"The preceding petitions of the Canon lead to the words of institution. Over the Host and then the chalice, the celebrant pronounces the sacramental words received from Christ. What happens here is not another sacrifice alongside Calvary: the one sacrifice of the Redeemer is made present sacramentally. The prayer’s own sequence draws a necessary distinction between the priest’s preparations, Christ’s words over each species, and the adoration that follows each Consecration.","fr":"Les supplications précédentes du Canon conduisent aux paroles de l’institution. Sur l’Hostie puis sur le calice, le célébrant prononce les paroles sacramentelles reçues du Christ. Il ne s’agit pas d’un autre sacrifice ajouté à celui du Calvaire : l’unique sacrifice du Rédempteur est rendu présent sacramentellement. La succession même des prières distingue les préparations du prêtre, les paroles du Christ sur chacune des espèces et l’adoration qui suit chaque Consécration."},"claim_ids":["MF05-C01","MF05-C02"]},{"heading":{"en":"The real change and abiding appearances","fr":"Le changement réel et les apparences conservées"},"body":{"en":"The Church calls this change transubstantiation. Bread and wine become the Body and Blood of Jesus Christ in substance, while the sensible appearances remain. Christ is not present only in memory or as a sign of fellowship: He is truly and substantially present under the Eucharistic species. This is why the response of the faithful is adoration rather than merely watching a symbolic gesture.","fr":"L’Église appelle ce changement transsubstantiation. Le pain et le vin deviennent substantiellement le Corps et le Sang de Jésus-Christ, tandis que les apparences sensibles demeurent. Le Christ n’est pas présent seulement dans le souvenir ni comme signe de fraternité : Il est réellement et substantiellement présent sous les espèces eucharistiques. C’est pourquoi la réponse des fidèles est l’adoration, non la simple observation d’un geste symbolique."},"claim_ids":["MF05-C01","MF05-C03"]},{"heading":{"en":"Two species, one risen Lord","fr":"Deux espèces, un seul Seigneur ressuscité"},"body":{"en":"The words are pronounced separately over the Host and the chalice. This sacramental separation represents Christ’s sacrificial death, but it neither divides Him nor repeats His suffering in blood. The whole risen Lord is present under either species. The Roman reader should therefore preserve both Consecrations in their own order while showing how they belong to one sacrifice, never merging the texts into one invented formula.","fr":"Les paroles sont prononcées séparément sur l’Hostie et sur le calice. Cette séparation sacramentelle représente la mort sacrificielle du Christ, mais ne Le divise pas et ne répète pas ses souffrances de manière sanglante. Le Seigneur ressuscité tout entier est présent sous chacune des espèces. Le lecteur romain doit donc conserver les deux consécrations dans leur ordre propre et montrer leur unité dans un seul sacrifice, sans fondre les textes dans une formule inventée."},"claim_ids":["MF05-C01","MF05-C02"]},{"heading":{"en":"The elevations are for adoration","fr":"Les élévations invitent à l’adoration"},"body":{"en":"After each Consecration, the celebrant genuflects, elevates the Sacred Host or chalice for adoration, replaces it, and genuflects again. These acts turn attention toward Christ truly present, not toward a merely symbolic display. The fitting interior response is adoration of the Lord who offered Himself for us. The gestures can be followed in their place without confusing the two Consecrations or treating the elevation as the moment that effects the sacramental change.","fr":"Après chaque Consécration, le célébrant fait la génuflexion, élève la sainte Hostie ou le calice pour l’adoration, le repose et fait de nouveau la génuflexion. Ces gestes orientent vers le Christ réellement présent, non vers une représentation seulement symbolique. La réponse intérieure qui convient est l’adoration du Seigneur qui s’est offert pour nous. On peut suivre ces gestes à leur place sans confondre les deux Consécrations ni croire que l’élévation elle-même accomplit le changement sacramentel."},"claim_ids":["MF05-C03"]}]},{"id":"AO.FORM.CANON.DEEP.04","stage_id":"MF06","block_ids":["AO.SM.B054"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF06-C01","MF06-C02"],"title":{"en":"Unde et memores — remembering and offering","fr":"Unde et memores — faire mémoire et offrir"},"lead":{"en":"After the Consecration, the Church remembers Christ’s saving Passion, Resurrection and Ascension, and continues to offer the sacramental sacrifice. Remembrance here is inseparable from worship and offering.","fr":"Après la Consécration, l’Église fait mémoire de la Passion salvatrice, de la Résurrection et de l’Ascension du Christ, et poursuit l’offrande du sacrifice sacramentel. Le mémorial y demeure inséparable du culte et de l’offrande."},"sections":[{"heading":{"en":"Remembrance within the Canon","fr":"Le mémorial au sein du Canon"},"body":{"en":"Unde et memores follows the Consecration. The priest names the saving events of Christ’s Paschal mystery, not as distant information but in the very prayer of the offering. This memory gives the sacrificial action its Christian meaning. The Church does not present an unrelated object to God after the words of institution: she offers the one Redeemer whose Passion, Resurrection and Ascension she remembers.","fr":"Unde et memores suit la Consécration. Le prêtre rappelle les événements salvifiques du mystère pascal du Christ, non comme des informations lointaines, mais dans la prière même de l’offrande. Ce mémorial donne à l’action sacrificielle son sens chrétien. Après les paroles de l’institution, l’Église ne présente pas à Dieu un objet sans rapport avec celles-ci : elle offre l’unique Rédempteur dont elle célèbre la Passion, la Résurrection et l’Ascension."},"claim_ids":["MF06-C01"]},{"heading":{"en":"The one sacrifice of Christ","fr":"L’unique sacrifice du Christ"},"body":{"en":"When the Canon speaks of offering, it does not imply that Christ must die a second time. The divine Victim is the same Redeemer who offered Himself on Calvary; the mode of offering in the Mass is sacramental and unbloody. Remembering His sacrifice and offering it are thus related aspects of one liturgical mystery. The words must not be understood as another independent consecration taking place after the elevations.","fr":"Quand le Canon parle d’offrande, cela n’implique pas que le Christ doive mourir une deuxième fois. La Victime divine est le même Rédempteur qui s’est offert au Calvaire ; le mode d’offrande dans la Messe est sacramentel et non sanglant. Faire mémoire de son sacrifice et l’offrir sont donc deux aspects liés d’un même mystère liturgique. Ces paroles ne doivent pas être comprises comme une consécration indépendante venant après les élévations."},"claim_ids":["MF06-C01"]},{"heading":{"en":"From the Passion to the promised glory","fr":"De la Passion à la gloire promise"},"body":{"en":"The Roman Canon does not stop its remembrance at Christ’s death. It names His Resurrection and Ascension as well. These mysteries prevent an incomplete picture in which the Mass concerns only a past tragedy. The risen and ascended Lord is the one present in the Eucharistic sacrifice. Following this prayer means keeping His whole saving work before the mind, while the liturgical source continues unchanged toward the subsequent intercessions.","fr":"Le Canon romain ne s’arrête pas à la mort du Christ dans son mémorial. Il nomme également sa Résurrection et son Ascension. Ces mystères évitent de réduire la Messe à une tragédie du passé. Le Seigneur ressuscité et monté aux cieux est Celui qui est présent dans le sacrifice eucharistique. Suivre cette prière, c’est garder à l’esprit l’ensemble de son œuvre salvifique, tandis que le texte liturgique se poursuit sans modification vers les supplications suivantes."},"claim_ids":["MF06-C01"]},{"heading":{"en":"The history of sacrifice is fulfilled here","fr":"L’histoire des sacrifices trouve ici son accomplissement"},"body":{"en":"The next prayer, Supra quae, will name Abel, Abraham and Melchisedech. Unde et memores prepares that remembrance by first naming Christ’s Passion, Resurrection and Ascension and by offering to the Father the holy Victim, the Bread of eternal life and the Chalice of everlasting salvation. The ancient sacrifices are meaningful because they point beyond themselves. Their place in the Canon reveals how the history of offering is brought into relation with the sacrifice of the Redeemer.","fr":"La prière suivante, Supra quae, nommera Abel, Abraham et Melchisédech. Unde et memores prépare ce souvenir en nommant d’abord la Passion, la Résurrection et l’Ascension du Christ, puis en offrant au Père la Victime sainte, le Pain de la vie éternelle et le Calice du salut perpétuel. Les sacrifices anciens ont leur sens parce qu’ils renvoient au-delà d’eux-mêmes. Leur place dans le Canon montre comment l’histoire des offrandes est rapportée au sacrifice du Rédempteur."},"claim_ids":["MF06-C01","MF06-C02"]}]},{"id":"AO.FORM.CANON.DEEP.05","stage_id":"MF06","block_ids":["AO.SM.B055"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF06-C01","MF06-C02","MF06-C03"],"title":{"en":"Supra quae — the sacrifices that point to Christ","fr":"Supra quae — les sacrifices qui annoncent le Christ"},"lead":{"en":"After the Consecration, the Canon asks the Father to look favourably upon the offering, naming Abel, Abraham and Melchisedech. These are not three more sacrifices performed at Mass: they are biblical witnesses through whom the Church contemplates the one sacrifice of Christ.","fr":"Après la Consécration, le Canon demande au Père de regarder favorablement l’offrande et nomme Abel, Abraham et Melchisédech. Ce ne sont pas trois sacrifices supplémentaires célébrés à la Messe : ces figures bibliques aident l’Église à contempler l’unique sacrifice du Christ."},"sections":[{"heading":{"en":"What the prayer asks","fr":"Ce que demande la prière"},"body":{"en":"Supra quae follows the Consecration and the Church’s remembrance of Christ’s Passion, Resurrection and Ascension. Now the priest asks the Father to regard the offering with favour, recalling earlier sacrifices that Scripture associates with acceptance before God. The prayer does not suggest the Eucharistic Victim is uncertain or lacking. The one offered is Christ Himself, and the Roman Canon places this offering within the history of salvation. Its language invites the faithful to see how the former signs find their fulfilment in Him rather than treating them as independent ceremonies inserted into the Mass.","fr":"Supra quae suit la Consécration et le mémorial de la Passion, de la Résurrection et de l’Ascension du Christ. Le prêtre demande maintenant au Père de regarder l’offrande avec faveur en rappelant des sacrifices anciens liés, dans l’Écriture, à l’agrément de Dieu. Cette prière ne suggère pas que la Victime eucharistique soit incertaine ou imparfaite. Celui qui est offert est le Christ Lui-même, et le Canon romain situe cette offrande dans l’histoire du salut. Ce langage invite les fidèles à voir comment les signes anciens trouvent leur accomplissement en Lui, plutôt qu’à les prendre pour des cérémonies indépendantes introduites dans la Messe."},"claim_ids":["MF06-C01","MF06-C02"]},{"heading":{"en":"Why Abel, Abraham and Melchisedech are named","fr":"Pourquoi Abel, Abraham et Melchisédech sont nommés"},"body":{"en":"The three names are part of the received Latin prayer itself. Abel is remembered for an offering accepted by God; Abraham for faithful obedience amid a grave trial; Melchisedech for the figure of a priest offering to God. Each contributes something distinct to the Church’s remembrance of sacrifice. The Roman Canon gathers them into one petition, but does not claim that their offerings were equal to Christ’s. They direct our attention toward a reality greater than any ancient figure: the Eucharistic sacrifice of the Redeemer, which is being offered sacramentally in the Mass.","fr":"Ces trois noms figurent dans la prière latine reçue. Abel rappelle une offrande agréée de Dieu ; Abraham, l’obéissance fidèle au cours d’une grande épreuve ; Melchisédech, la figure d’un prêtre qui offre à Dieu. Chacun apporte une perspective distincte au souvenir du sacrifice dans l’Église. Le Canon romain les rassemble dans une seule supplication, mais ne prétend pas que leurs offrandes égalent celle du Christ. Ils orientent notre regard vers une réalité plus grande que toute figure ancienne : le sacrifice eucharistique du Rédempteur, offert sacramentellement dans la Messe."},"claim_ids":["MF06-C02"]},{"heading":{"en":"One sacrifice, not a repetition of Calvary","fr":"Un sacrifice unique, non une répétition du Calvaire"},"body":{"en":"The mention of these ancient sacrifices must be read together with the Church’s teaching on the Mass. Christ is the same divine Victim offered on Calvary; the Mass does not cause another death of Jesus. His one sacrifice is presented sacramentally and without bloodshed. The references to Abel, Abraham and Melchisedech therefore do not put Christ into a series of merely equivalent victims. Rather, they set the Eucharistic offering against the background of sacred history and help us understand why the Canon speaks of an acceptable sacrifice offered to the Father.","fr":"La mention de ces sacrifices anciens doit être lue à la lumière de l’enseignement de l’Église sur la Messe. Le Christ est la même Victime divine qu’au Calvaire ; la Messe ne provoque pas une nouvelle mort de Jésus. Son sacrifice unique est rendu présent sacramentellement et de manière non sanglante. Les références à Abel, Abraham et Melchisédech ne placent donc pas le Christ dans une succession de victimes simplement équivalentes. Elles situent l’offrande eucharistique dans l’histoire sainte et nous aident à comprendre pourquoi le Canon parle d’un sacrifice agréable présenté au Père."},"claim_ids":["MF06-C01","MF06-C02"]},{"heading":{"en":"From sacrifice to Holy Communion","fr":"Du sacrifice à la sainte Communion"},"body":{"en":"The Eucharistic sacrifice does not end as a remote event that the congregation merely observes. The same Victim offered to the Father is given to the faithful in Holy Communion. Sacrifice and sacred banquet express related aspects of a single mystery rather than two rival accounts of the Mass. Supra quae helps us perceive the continuity of worship throughout the Canon: offering and remembrance lead toward Communion with Christ. The biblical names are not there as decorative history; they prepare the mind to recognise the depth of the gift received.","fr":"Le sacrifice eucharistique ne s’achève pas comme un événement lointain que l’assemblée se contenterait de regarder. La même Victime offerte au Père est donnée aux fidèles dans la sainte Communion. Sacrifice et banquet sacré expriment deux aspects liés d’un même mystère, non deux explications rivales de la Messe. Supra quae aide à percevoir la continuité du culte tout au long du Canon : l’offrande et le mémorial conduisent vers la Communion au Christ. Les noms bibliques ne sont pas de simples ornements historiques ; ils disposent l’esprit à reconnaître la profondeur du don reçu."},"claim_ids":["MF06-C01","MF06-C03"]},{"heading":{"en":"How to read this prayer in the Mass","fr":"Comment lire cette prière pendant la Messe"},"body":{"en":"The Consecration has already taken place when the Canon names Abel, Abraham and Melchisedech. As you read their names in this quiet prayer, consider the Father’s acceptance of the offerings recalled by Scripture and the incomparable sacrifice now presented sacramentally. The priest is not repeating those earlier sacrifices: he asks that God look graciously upon the Eucharistic offering, just as He received the gifts of His servants of old. The comparison leads the mind from biblical history to Christ.","fr":"La Consécration a déjà eu lieu lorsque le Canon nomme Abel, Abraham et Melchisédech. En lisant leurs noms dans cette prière silencieuse, considérez l’agrément des offrandes anciennes rappelées par l’Écriture et le sacrifice incomparable désormais présenté sacramentellement. Le prêtre ne répète pas ces sacrifices passés : il demande à Dieu de regarder favorablement l’offrande eucharistique, comme Il reçut les dons de ses serviteurs d’autrefois. Ce rapprochement conduit de l’histoire biblique au Christ."},"claim_ids":["MF06-C01","MF06-C02"]}]},{"id":"AO.FORM.CANON.DEEP.06","stage_id":"MF06","block_ids":["AO.SM.B056"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF06-C01","MF06-C03"],"title":{"en":"Supplices te rogamus — gifts and Communion","fr":"Supplices te rogamus — les dons et la Communion"},"lead":{"en":"The Canon now prays humbly that the offering reach the heavenly altar and that those who receive from it be filled with blessing and grace. The prayer joins sacrifice, divine worship and the faithful’s Communion.","fr":"Le Canon demande maintenant humblement que l’offrande atteigne l’autel céleste et que ceux qui y participent soient comblés de bénédiction et de grâce. Cette prière unit sacrifice, culte divin et Communion des fidèles."},"sections":[{"heading":{"en":"Why the prayer is humble","fr":"Pourquoi cette prière est humble"},"body":{"en":"Supplices te rogamus begins in a posture of petition: the priest asks Almighty God to command that the offering be borne before His divine majesty. Such language does not suggest that the Eucharistic sacrifice is defective. The Victim offered is Christ Himself. The humility belongs to those who stand before God and seek to receive the fruits of His sacrifice. The prayer's imagery points beyond the visible altar toward heavenly worship.","fr":"Supplices te rogamus commence comme une supplication : le prêtre demande au Dieu tout-puissant de faire porter l’offrande devant sa divine majesté. Ce langage ne suggère pas que le sacrifice eucharistique soit imparfait. La Victime offerte est le Christ Lui-même. L’humilité appartient à ceux qui se tiennent devant Dieu et demandent à recevoir les fruits de son sacrifice. Les images de la prière orientent le regard au-delà de l’autel visible vers le culte céleste."},"claim_ids":["MF06-C01"]},{"heading":{"en":"The earthly and heavenly altar","fr":"L’autel terrestre et l’autel céleste"},"body":{"en":"Supplices te rogamus explicitly asks that these gifts be carried by the hands of God’s holy Angel to His altar on high, before His divine majesty. The prayer uses the language of heavenly worship without identifying that Angel or specifying a physical journey of the Eucharistic species. The petition connects the visible sacrifice of the altar with worship before God and immediately turns toward the blessings sought for those who receive the Body and Blood of Christ.","fr":"Supplices te rogamus demande expressément que ces dons soient portés par les mains du saint Ange de Dieu jusqu’à son autel d’en haut, en présence de sa majesté divine. La prière emploie le langage du culte céleste sans identifier cet Ange ni décrire un déplacement matériel des espèces eucharistiques. Cette supplication relie le sacrifice visible de l’autel au culte rendu devant Dieu, puis demande la bénédiction de ceux qui reçoivent le Corps et le Sang du Christ."},"claim_ids":["MF06-C01"]},{"heading":{"en":"Those who receive are blessed","fr":"Ceux qui communient reçoivent la bénédiction"},"body":{"en":"Supplices te rogamus asks that those who partake of the altar's gift receive heavenly blessing and grace. The faithful's Communion therefore does not sit outside the sacrifice as a separate, unrelated meal. The sacrificial Victim offered to the Father is the same Lord received in the Eucharist. This unity explains why the Canon prays for spiritual fruits in those who receive, while never suggesting that Communion creates another sacrificial offering.","fr":"Supplices te rogamus demande que ceux qui participent au don de l’autel reçoivent la bénédiction et la grâce du ciel. La Communion des fidèles n’est donc pas un repas séparé et sans rapport avec le sacrifice. La Victime sacrificielle offerte au Père est le même Seigneur reçu dans l’Eucharistie. Cette unité explique pourquoi le Canon demande des fruits spirituels pour ceux qui communient, sans jamais suggérer que la Communion constitue une nouvelle offrande sacrificielle."},"claim_ids":["MF06-C03"]},{"heading":{"en":"From the heavenly altar to the communicants","fr":"De l’autel céleste à ceux qui communient"},"body":{"en":"The prayer does not remain with the image of the heavenly altar. It moves to a concrete petition for those who receive the most sacred Body and Blood from the altar: may they be filled with every heavenly blessing and grace. The movement from offering to reception is therefore present in the Latin itself. Read these two halves together before passing to the remembrance of the dead: the sacrifice is offered to God, and its fruits are sought for those who partake.","fr":"La prière ne s’arrête pas à l’image de l’autel céleste. Elle se poursuit par une demande concrète pour ceux qui reçoivent de l’autel le très saint Corps et le Sang : qu’ils soient comblés de toute bénédiction céleste et de toute grâce. Le passage de l’offrande à la réception se trouve donc dans le latin même. Il convient de lire ensemble ces deux parties avant le Mémento des défunts : le sacrifice est offert à Dieu et l’on implore ses fruits pour ceux qui y communient."},"claim_ids":["MF06-C01","MF06-C03"]}]},{"id":"AO.FORM.CANON.DEEP.07","stage_id":"MF04","block_ids":["AO.SM.B057","AO.SM.B058","AO.SM.B059"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF04-C01","MF04-C02","MF04-C03"],"title":{"en":"The departed, the sinners and the gifts of God","fr":"Les défunts, les pécheurs et les dons de Dieu"},"lead":{"en":"Near the end of the Canon, the Church remembers the faithful departed, asks mercy for the living who remain sinners, and acknowledges that every good gift comes from God. These prayers form one movement of humility and hope.","fr":"Vers la fin du Canon, l’Église se souvient des fidèles défunts, implore la miséricorde pour les vivants qui demeurent pécheurs et reconnaît que tout don bon vient de Dieu. Ces prières forment un même mouvement d’humilité et d’espérance."},"sections":[{"heading":{"en":"The Memento of the dead","fr":"Le Mémento des défunts"},"body":{"en":"The Canon prays for the departed who have gone before us in the sign of faith. Names may be remembered by the priest, and the faithful can silently recall those for whom they wish to pray. The Mass does not abandon its sacrificial action when it turns toward the dead: intercession remains within the one offering made through Christ. The silence of this prayer can be received as an invitation to charity for those who have died.","fr":"Le Canon prie pour les défunts qui nous ont précédés, marqués du signe de la foi. Le prêtre peut rappeler leurs noms et les fidèles se souvenir en silence de ceux pour lesquels ils désirent prier. La Messe n’abandonne pas son action sacrificielle lorsqu’elle se tourne vers les morts : l’intercession demeure au sein de l’unique offrande présentée par le Christ. Le silence de cette prière peut être accueilli comme une invitation à la charité envers ceux qui sont décédés."},"claim_ids":["MF04-C01","MF04-C02","MF04-C03"]},{"heading":{"en":"Nobis quoque: mercy for sinners","fr":"Nobis quoque : miséricorde pour les pécheurs"},"body":{"en":"After praying for the dead, the priest turns toward those still on earth, including himself and the faithful, as sinners who hope in God's abundant mercies. The mention of saints here expresses hope of sharing their fellowship; it is not a claim that the congregation has already reached their glory by its own merits. The Church asks to be admitted to communion with them through God's goodness.","fr":"Après la prière pour les défunts, le prêtre se tourne vers ceux qui vivent encore sur la terre, lui-même et les fidèles compris, comme des pécheurs qui espèrent dans l’abondance des miséricordes de Dieu. La mention des saints exprime l’espérance de partager leur compagnie ; elle ne prétend pas que l’assemblée ait déjà atteint leur gloire par ses propres mérites. L’Église demande d’être admise à leur communion par la bonté divine."},"claim_ids":["MF04-C02"]},{"heading":{"en":"Per quem: every gift through Christ","fr":"Per quem : tout don par le Christ"},"body":{"en":"Per quem haec omnia turns from the intercessions of the Canon to the good gifts that God continually creates, sanctifies, gives life to, blesses and bestows upon us through Christ. Its five verbs are distinct, but all are directed to the same divine giver. The words follow the prayer for mercy and the fellowship of the saints and lead directly into the solemn doxology, Per ipsum. The conclusion of the Canon thus moves from petition to praise without ceasing to offer through Christ.","fr":"Per quem haec omnia passe des intercessions du Canon aux biens que Dieu ne cesse de créer, sanctifier, vivifier, bénir et nous accorder par le Christ. Ces cinq verbes sont distincts, mais tous désignent le même dispensateur divin. Ces paroles suivent la demande de miséricorde et de communion avec les saints, puis conduisent directement à la doxologie solennelle, Per ipsum. La fin du Canon passe ainsi de la supplication à la louange, tout en continuant d’offrir par le Christ."},"claim_ids":["MF04-C01","MF04-C02"]},{"heading":{"en":"How these different petitions belong together","fr":"L’unité de ces différentes supplications"},"body":{"en":"The remembrance of the dead, the request for mercy and the acknowledgement of God's gifts are distinct movements. They belong together because the Church never ceases to offer through Christ and to depend on His grace. The faithful can pray for departed loved ones and for their own conversion while following the priest's actual words. The commentary does not assign any separate rite or additional response to these petitions.","fr":"Le souvenir des défunts, la demande de miséricorde et la reconnaissance des dons de Dieu sont des mouvements distincts. Ils s’unissent parce que l’Église ne cesse d’offrir par le Christ et de dépendre de sa grâce. Les fidèles peuvent prier pour leurs proches disparus et pour leur propre conversion en suivant les paroles véritables du prêtre. Le commentaire n’attribue à ces supplications aucun rite séparé ni réponse supplémentaire."},"claim_ids":["MF04-C01","MF04-C03"]}]},{"id":"AO.FORM.CANON.DEEP.08","stage_id":"MF06","block_ids":["AO.SM.B060","AO.SM.B061"],"profile":"ORDINARY_SUNG","use":"FORMATION_ONLY","content_type":"ORIGINAL_EDITORIAL_PARAPHRASE","review_status":"DRAFT_AWAITING_EDITORIAL_APPROVAL","claim_ids":["MF06-C01","MF06-C03"],"title":{"en":"Per ipsum — the Canon offered through Christ","fr":"Per ipsum — le Canon offert par le Christ"},"lead":{"en":"The Canon concludes with a solemn doxology: all honour and glory are given to the Father through Christ in the unity of the Holy Spirit. The final Amen is the liturgical response to this whole Eucharistic prayer.","fr":"Le Canon s’achève par une doxologie solennelle : tout honneur et toute gloire sont rendus au Père par le Christ dans l’unité du Saint-Esprit. L’Amen final est la réponse liturgique à l’ensemble de cette prière eucharistique."},"sections":[{"heading":{"en":"Through Him, with Him and in Him","fr":"Par Lui, avec Lui et en Lui"},"body":{"en":"The concluding words Per ipsum, et cum ipso, et in ipso turn the offering toward the Father through Jesus Christ. The Canon does not end by directing honour to the visible assembly or to the celebrant considered separately from Christ. It expresses the Church's worship of God through the Redeemer, whose one sacrifice the Mass presents sacramentally. This is an especially clear place to recognise the unity of the lengthy preceding Canon.","fr":"Les paroles finales Per ipsum, et cum ipso, et in ipso orientent l’offrande vers le Père par Jésus-Christ. Le Canon ne s’achève pas en rendant l’honneur à l’assemblée visible ni au célébrant considéré séparément du Christ. Il exprime le culte que l’Église rend à Dieu par le Rédempteur, dont la Messe présente sacramentellement l’unique sacrifice. Ce moment permet de reconnaître avec clarté l’unité du long Canon qui précède."},"claim_ids":["MF06-C01"]},{"heading":{"en":"The Father, Son and Holy Spirit","fr":"Le Père, le Fils et le Saint-Esprit"},"body":{"en":"The doxology names the Father, the Son and the unity of the Holy Spirit. It shows the direction of Christian worship: Christ is not another victim alongside many equivalent sacrifices, but the divine Redeemer through whom the Church offers praise and thanksgiving. This brief prayer gathers the sacrificial and Trinitarian meaning of the Canon without adding a second Consecration or recapitulating all the prayers that preceded it.","fr":"La doxologie nomme le Père, le Fils et l’unité du Saint-Esprit. Elle montre l’orientation du culte chrétien : le Christ n’est pas une victime parmi de nombreux sacrifices équivalents, mais le divin Rédempteur par qui l’Église offre louange et action de grâces. Cette brève prière rassemble le sens sacrificiel et trinitaire du Canon sans ajouter une seconde Consécration ni recommencer toutes les prières précédentes."},"claim_ids":["MF06-C01"]},{"heading":{"en":"The response of Amen","fr":"La réponse de l’Amen"},"body":{"en":"The concluding Amen answers the celebrant’s audible or sung Per omnia saecula saeculorum. In the 1962 Roman rite the minister, or the choir in sung celebrations, gives the prescribed response according to the form of Mass; the faithful can unite their assent to it and may join according to established local practice. The response seals the preceding Eucharistic prayer without changing who pronounces the words of Consecration. Its meaning is the Church’s agreement in the praise offered to the Father through Christ.","fr":"L’Amen final répond au Per omnia saecula saeculorum que le célébrant prononce à voix intelligible ou chante. Dans le rite romain de 1962, le servant ou le chœur dans les célébrations chantées donne la réponse prescrite selon la forme de Messe ; les fidèles peuvent s’y unir intérieurement et, selon l’usage local établi, la reprendre. Cette réponse conclut la prière eucharistique sans modifier celui qui prononce les paroles de la Consécration. Elle exprime l’adhésion de l’Église à la louange rendue au Père par le Christ."},"claim_ids":["MF06-C01","MF06-C03"]},{"heading":{"en":"From the Canon toward Communion","fr":"Du Canon vers la Communion"},"body":{"en":"The Canon concludes, but the Mass continues with the Lord’s Prayer and the rites preparing for Communion. The Victim offered to the Father is the same risen Christ received sacramentally in Holy Communion. The concluding doxology directs the whole sacrifice toward God’s glory, while the prayers that follow turn explicitly toward the peace, forgiveness and nourishment sought by those who communicate. These are movements of one liturgical action, not two competing accounts of the Eucharist.","fr":"Le Canon s’achève, mais la Messe se poursuit avec le Notre Père et les rites qui préparent à la Communion. La Victime offerte au Père est le même Christ ressuscité reçu sacramentellement dans la sainte Communion. La doxologie finale oriente tout le sacrifice vers la gloire de Dieu, tandis que les prières suivantes demandent plus explicitement la paix, le pardon et la nourriture de ceux qui communient. Ce sont les mouvements d’une même action liturgique, non deux explications opposées de l’Eucharistie."},"claim_ids":["MF06-C01","MF06-C03"]}]}],"blocks":{"AO.SM.B047":{"title":"Te igitur","blockId":"AO.SM.B047","units":[{"cue":"AO.SM.C0150","latin":"Te igitur, clementíssime Pater, per Iesum Christum, Fílium tuum, Dóminum nostrum, súpplices rogámus, ac pétimus,","english":"Therefore, most merciful Father, through Jesus Christ thy Son our Lord, we humbly pray and beseech thee,","french":"Père très clément, c’est donc vous que nous prions, suppliants, et à qui nous demandons, par Jésus-Christ votre Fils, notre Seigneur,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0151","latin":"uti accepta habeas et benedícas,","english":"that thou wouldst accept and bless,","french":"d’accepter et de bénir,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0152","latin":"hæc ✠ dona, hæc ✠ múnera, hæc ✠ sancta sacrifícia illibáta.","english":"these gifts, these offerings, these holy and unspotted sacrifices.","french":"ces ✠ dons, ces ✠ présents, ces ✠ offrandes saintes et immaculées.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0153","latin":"In primis, quæ tibi offérimus pro Ecclésia tua sancta cathólica: quam pacificáre, custodíre, adunáre et régere dignéris toto orbe terrárum: una cum fámulo tuo Papa nostro N. et Antístite nostro et ómnibus orthodóxis, atque cathólicæ et apostólicae fídei cultóribus.","english":"We offer them up to Thee, in the first place, for Thy Holy Catholic Church, that it may please Thee to grant her peace, to preserve, unite, and govern her throughout the world; as also for Thy servant N. our Pope, and N. our Bishop, and for all orthodox believers and all who profess the Catholic and Apostolic faith.","french":"Tout d’abord, nous vous les offrons pour votre sainte Église catholique : daignez lui donner la paix, la protéger, la réunir et la gouverner par toute la terre ; et en même temps pour votre serviteur notre Pape N., notre évêque N., tous ceux qui enseignent la vraie doctrine, et ceux qui gardent la foi catholique et apostolique.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B048":{"title":"Memento, Domine — Living","blockId":"AO.SM.B048","units":[{"cue":"AO.SM.C0154","latin":"Meménto, Dómine, famulórum famularúmque tuarum N. et N.","english":"Remember, O Lord, thy servants and handmaids N. and N.","french":"Souvenez-vous, Seigneur, de vos serviteurs et de vos servantes N. et N.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0155","latin":"[SILENT COMMEMORATION OF THE LIVING]","english":"[Silent commemoration of the living]","french":"[Commémoration silencieuse des vivants]","clock":"PRIEST_ACTION"},{"cue":"AO.SM.C0156","latin":"et ómnium circumstántium, quorum tibi fides cógnita est et nota devótio, pro quibus tibi offérimus: vel qui tibi ófferunt hoc sacrifícium laudis, pro se suísque ómnibus: pro redemptióne animárum suárum, pro spe salútis et incolumitátis suæ: tibíque reddunt vota sua ætérno Deo, vivo et vero.","english":"and of all here present, whose faith and devotion are known to Thee, for whom we offer, or who offer up to Thee this Sacrifice of praise for themselves and all those dear to them, for the redemption of their souls and the hope of their safety and salvation: who now pay their vows to Thee, the everlasting, living and true God.","french":"et de tous ceux qui nous entourent : vous connaissez leur foi, vous avez éprouvé leur attachement. Nous vous offrons ou ils vous offrent eux-mêmes ce sacrifice de louange, pour eux et pour tous les leurs, pour la rédemption de leurs âmes, dans l’espérance de leur salut et de leur intégrité ; et ils vous adressent leurs prières, à vous, Dieu éternel, vivant et vrai.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B049":{"title":"Communicantes","blockId":"AO.SM.B049","units":[{"cue":"AO.SM.C0157","latin":"Communicántes, et memóriam venerántes, in primis gloriósæ semper Vírginis Maríæ, Genetrícis Dei et Dómini nostri","english":"In communion with, and venerating the memory first of the glorious ever-Virgin Mary, Mother of our God and Lord","french":"Unis dans une même communion, nous vénérons en premier lieu la mémoire de la glorieuse Marie toujours Vierge, Mère de notre Dieu et Seigneur","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0158","latin":"Iesu Christi:","english":"Jesus Christ:","french":"Jésus-Christ :","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0159","latin":"sed et beati Ioseph, eiusdem Virginis Sponsi, et beatórum Apostolórum ac Mártyrum tuórum, Petri et Pauli, Andréæ, Iacóbi, Ioánnis, Thomæ, Iacóbi, Philíppi, Bartholomaei, Matthaei, Simónis et Thaddaei: Lini, Cleti, Cleméntis, Xysti, Cornélii, Cypriáni, Lauréntii, Chrysógoni, Ioánnis et Pauli, Cosmæ et Damiáni: et ómnium Sanctórum tuórum; quorum méritis precibúsque concédas, ut in ómnibus protectiónis tuæ muniámur auxílio.","english":"also of blessed Joseph, her Spouse; and likewise of Thy blessed Apostles and Martyrs, Peter and Paul, Andrew, James, John, Thomas, James, Philip, Bartholomew, Matthew, Simon and Thaddeus, Linus, Cletus, Clement, Sixtus, Cornelius, Cyprian, Lawrence, Chrysogonus, John and Paul, Cosmas and Damian, and of all Thy Saints. Grant for the sake of their merits and prayers that in all things we may be guarded and helped by Thy protection.","french":"puis de saint Joseph, époux de cette même Vierge, et de vos bienheureux Apôtres et Martyrs, Pierre et Paul, André, Jacques, Jean, Thomas, Jacques, Philippe, Barthélemy, Matthieu, Simon et Thaddée ; Lin, Clet, Clément, Xyste, Corneille, Cyprien, Laurent, Chrysogone, Jean et Paul, Côme et Damien, et de tous vos saints ; accordez, par leurs mérites et leurs prières, que nous soyons toujours munis du secours de votre protection.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0160","latin":"Per eúndem Christum, Dóminum nostrum. Amen.","english":"Through the same Christ our Lord. Amen.","french":"Par le même Christ notre Seigneur. Ainsi soit-il.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B050":{"title":"Hanc igitur","blockId":"AO.SM.B050","units":[{"cue":"AO.SM.C0161","latin":"Hanc igitur oblatiónem servitutis nostræ, sed et cunctae famíliæ tuæ, quaesumus, Dómine, ut placátus accípias: diésque nostros in tua pace dispónas, atque ab ætérna damnatióne nos éripi, et in electórum tuórum iúbeas grege numerári.","english":"O Lord, we beseech Thee, graciously to accept this oblation of our service and that of Thy whole household. Order our days in Thy peace, and command that we be rescued from eternal damnation and numbered in the flock of Thine elect.","french":"Cette oblation donc de notre ministère, mais aussi de votre famille entière, nous vous prions, Seigneur, de l’accepter avec bienveillance, de disposer nos jours dans votre paix, et d’ordonner que nous soyons arrachés à la damnation éternelle et comptés dans la troupe de vos élus.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0162","latin":"Per Christum, Dóminum nostrum. Amen.","english":"Through Christ our Lord. Amen.","french":"Par le Christ notre Seigneur. Ainsi soit-il.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B051":{"title":"Quam oblationem","blockId":"AO.SM.B051","units":[{"cue":"AO.SM.C0163","latin":"Quam oblatiónem tu, Deus, in ómnibus, quaesumus,","english":"Which offering do thou, O God, we beseech thee,","french":"Cette oblation, ô Dieu, nous vous en prions, daignez","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0164","latin":"bene ✠ díctam, adscríp ✠ tam, ra ✠ tam, rationábilem, acceptabilémque fácere dignéris:","english":"make blessed, approved, ratified, reasonable and acceptable:","french":"la rendre en tout point ✠ bénie, ✠ approuvée, ✠ ratifiée, digne et agréable :","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0165","latin":"ut nobis Cor ✠ pus,","english":"that it may become for us the Body,","french":"afin qu’elle devienne pour nous le ✠ Corps,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0166","latin":"et San ✠ guis fiat","english":"and Blood","french":"et le ✠ Sang","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0167","latin":"dilectíssimi Fílii tui, Dómini nostri Iesu Christi.","english":"of thy most beloved Son, our Lord Jesus Christ.","french":"de votre Fils bien-aimé, notre Seigneur Jésus-Christ.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B052":{"title":"Qui pridie · Consecration of the Host","blockId":"AO.SM.B052","units":[{"cue":"AO.SM.C0168","latin":"Qui prídie quam paterétur, accépit panem in sanctas ac venerábiles manus suas,","english":"Who, the day before he suffered, took bread into his holy and venerable hands,","french":"La veille du jour où il a souffert, il a pris du pain dans ses mains saintes et vénérables,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0169","latin":"elevátis óculis in coelum ad te Deum, Patrem suum omnipoténtem,","english":"and with eyes lifted up to heaven unto thee, God, his almighty Father,","french":"les yeux levés au ciel vers vous, Dieu son Père tout-puissant,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0170","latin":"tibi grátias agens,","english":"giving thanks to thee,","french":"vous rendant grâces,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0171","latin":"bene ✠ dixit,","english":"he blessed it,","french":"l’a ✠ béni,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0172","latin":"fregit, dedítque discípulis suis, dicens: Accípite, et manducáte ex hoc omnes.","english":"broke it, and gave it to his disciples, saying: Take and eat ye all of this.","french":"rompu et donné à ses disciples, en disant : Prenez et mangez tous de ceci.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0173","latin":"HOC EST ENIM CORPUS MEUM.","english":"FOR THIS IS MY BODY.","french":"CAR CECI EST MON CORPS.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0174","latin":"[GENUFLECTS — ELEVATES THE SACRED HOST — REPLACES IT — GENUFLECTS]","english":"[Genuflects — elevates the Sacred Host — replaces It — genuflects]","french":"[Génuflexion — élévation de la sainte Hostie — dépose l’Hostie — génuflexion]","clock":"PRIEST_ACTION"}]},"AO.SM.B053":{"title":"Simili modo · Consecration of the Chalice","blockId":"AO.SM.B053","units":[{"cue":"AO.SM.C0175","latin":"Símili modo postquam coenátum est, accípiens et hunc præclárum Cálicem in sanctas ac venerábiles manus suas:","english":"In like manner, after he had supped, taking also this excellent Chalice into his holy and venerable hands:","french":"De même, après le repas, prenant aussi ce très glorieux Calice dans ses mains saintes et vénérables :","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0176","latin":"item tibi grátias agens,","english":"again giving thanks to thee,","french":"vous rendant grâces encore,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0177","latin":"bene ✠ dixit,","english":"he blessed it,","french":"il l’a ✠ béni,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0178","latin":"dedítque discípulis suis, dicens: Accípite, et bíbite ex eo omnes.","english":"and gave it to his disciples, saying: Take and drink ye all of this.","french":"et donné à ses disciples, en disant : Prenez, et buvez-en tous.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0179","latin":"HIC EST ENIM CALIX SÁNGUINIS MEI, NOVI ET ÆTÉRNI TESTAMÉNTI: MYSTÉRIUM FÍDEI: QUI PRO VOBIS ET PRO MULTIS EFFUNDÉTUR IN REMISSIÓNEM PECCATÓRUM.","english":"FOR THIS IS THE CHALICE OF MY BLOOD, OF THE NEW AND ETERNAL TESTAMENT: THE MYSTERY OF FAITH: WHICH SHALL BE SHED FOR YOU AND FOR MANY UNTO THE REMISSION OF SINS.","french":"CAR CECI EST LE CALICE DE MON SANG, CELUI DE L’ALLIANCE NOUVELLE ET ÉTERNELLE : MYSTÈRE DE LA FOI : QUI SERA RÉPANDU POUR VOUS ET POUR BEAUCOUP EN RÉMISSION DES PÉCHÉS.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0180","latin":"Hæc quotiescúmque fecéritis, in mei memóriam faciétis.","english":"As often as ye shall do these things, ye shall do them in memory of me.","french":"Chaque fois que vous ferez cela, vous le ferez en mémoire de moi.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0181","latin":"[GENUFLECTS — ELEVATES THE PRECIOUS BLOOD — REPLACES/COVERS THE CHALICE — GENUFLECTS]","english":"[Genuflects — elevates the Precious Blood — replaces/covers the Chalice — genuflects]","french":"[Génuflexion — élévation du Précieux Sang — dépose et couvre le Calice — génuflexion]","clock":"PRIEST_ACTION"}]},"AO.SM.B054":{"title":"Unde et memores","blockId":"AO.SM.B054","units":[{"cue":"AO.SM.C0182","latin":"Unde et mémores, Dómine, nos servi tui, sed et plebs tua sancta, eiusdem Christi Fílii tui, Dómini nostri, tam beátæ passiónis, nec non et ab ínferis resurrectiónis, sed et in coelos gloriósæ ascensiónis:","english":"Wherefore, O Lord, we Thy servants, and Thy holy people also, calling to mind the blessed Passion of the same Christ Thy Son our Lord, as also His Resurrection from the grave and glorious Ascension into heaven:","french":"C’est pourquoi, Seigneur, nous vos serviteurs, et aussi votre peuple saint, en mémoire de la bienheureuse Passion de votre Fils Jésus-Christ notre Seigneur, de sa Résurrection des enfers et aussi de sa glorieuse Ascension dans les cieux :","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0183","latin":"offérimus præcláræ maiestáti tuæ de tuis donis ac datis,","english":"offer unto thy excellent majesty of thy gifts and grants,","french":"nous présentons à votre sublime majesté cette offrande venant des biens que vous nous avez donnés :","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0184","latin":"hóstiam ✠ puram, hóstiam ✠ sanctam, hóstiam ✠ immaculátam,","english":"a pure victim, a holy victim, an immaculate victim,","french":"la victime ✠ pure, la victime ✠ sainte, la victime ✠ immaculée,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0185","latin":"Panem ✠ sanctum vitæ ætérnæ, et Calicem ✠ salútis perpétuæ.","english":"the holy Bread of eternal life and the Chalice of everlasting salvation.","french":"le Pain ✠ sacré de la vie éternelle et le Calice ✠ de l’éternel salut.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B055":{"title":"Supra quae","blockId":"AO.SM.B055","units":[{"cue":"AO.SM.C0186","latin":"Supra quæ propítio ac seréno vultu respícere dignéris: et accépta habére, sicúti accépta habére dignátus es múnera púeri tui iusti Abel, et sacrifícium Patriárchæ nostri Abrahæ: et quod tibi óbtulit summus sacérdos tuus Melchísedech, sanctum sacrifícium, immaculátam hóstiam.","english":"Deign to look upon them with a favorable and gracious countenance, and to accept them as Thou didst accept the offerings of Thy just servant Abel, and the sacrifice of our Patriarch Abraham, and that which Thy high priest Melchisedech offered up to Thee, a holy Sacrifice, an immaculate Victim.","french":"Sur ces offrandes daignez jeter un regard favorable et serein, et les accepter comme vous avez bien voulu accepter les présents de votre serviteur Abel le Juste, le sacrifice de notre patriarche Abraham, et celui que vous offrit votre grand prêtre Melchisédech, sacrifice saint, victime immaculée.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B056":{"title":"Supplices te rogamus","blockId":"AO.SM.B056","units":[{"cue":"AO.SM.C0187","latin":"Súpplices te rogámus, omnípotens Deus: iube hæc perférri per manus sancti Angeli tui in sublíme altáre tuum, in conspéctu divínæ maiestátis tuæ:","english":"Humbly we beseech Thee, almighty God, to command that these our offerings be carried by the hands of Thy holy Angel to Thine Altar on high, in the sight of Thy divine Majesty:","french":"Suppliants, nous vous en prions, Dieu tout-puissant : ordonnez que ces offrandes soient portées par les mains de votre saint Ange sur votre sublime autel, en présence de votre majesté divine ;","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0188","latin":"ut, quotquot ex hac altáris participatióne sacrosánctum Fílii tui","english":"that as many of us as shall receive from this altar the most sacred","french":"afin que, nous tous qui recevrons par cette participation de l’autel le très saint","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0189","latin":"Cor ✠ pus, et Sán ✠ guinem sumpsérimus,","english":"Body and Blood of thy Son,","french":"✠ Corps et le ✠ Sang de votre Fils,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0190","latin":"omni benedictióne coelésti et grátia repleámur.","english":"may be filled with every heavenly blessing and grace.","french":"nous soyons comblés de toute grâce et bénédiction céleste.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0191","latin":"Per eúndem Christum, Dóminum nostrum. Amen.","english":"Through the same Christ our Lord. Amen.","french":"Par le même Christ notre Seigneur. Ainsi soit-il.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B057":{"title":"Memento etiam, Domine — Dead","blockId":"AO.SM.B057","units":[{"cue":"AO.SM.C0192","latin":"Meménto étiam, Dómine, famulórum famularúmque tuárum N. et N., qui nos præcessérunt cum signo fídei, et dórmiunt in somno pacis.","english":"Remember also, O Lord, thy servants and handmaids N. and N. who have gone before us with the sign of faith and sleep the sleep of peace.","french":"Souvenez-vous aussi, Seigneur, de vos serviteurs et de vos servantes N. et N., qui nous ont précédés avec le signe de la foi, et qui dorment du sommeil de la paix.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0193","latin":"[SILENT COMMEMORATION OF THE DEAD]","english":"[Silent commemoration of the dead]","french":"[Commémoration silencieuse des défunts]","clock":"PRIEST_ACTION"},{"cue":"AO.SM.C0194","latin":"Ipsis, Dómine, et ómnibus in Christo quiescéntibus locum refrigérii, lucis pacis ut indúlgeas, deprecámur.","english":"To these, O Lord, and to all who rest in Christ, grant, we beseech thee, a place of refreshment, light and peace.","french":"À eux, Seigneur, et à tous ceux qui reposent dans le Christ, nous vous supplions d’accorder le lieu du rafraîchissement, de la lumière et de la paix.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0195","latin":"Per eúndem Christum, Dóminum nostrum. Amen.","english":"Through the same Christ our Lord. Amen.","french":"Par le même Christ notre Seigneur. Ainsi soit-il.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B058":{"title":"Nobis quoque peccatoribus","blockId":"AO.SM.B058","units":[{"cue":"AO.SM.C0196","latin":"Nobis quoque peccatóribus","english":"To us also, thy sinful servants","french":"À nous aussi, pécheurs,","clock":"PUBLIC_TEXT"},{"cue":"AO.SM.C0197","latin":"fámulis tuis, de multitúdine miseratiónum tuárum sperántibus, partem áliquam et societátem donáre dignéris, cum tuis sanctis Apóstolis et Martýribus: cum Ioánne, Stéphano, Matthía, Bárnaba, Ignátio, Alexándro, Marcellíno, Petro, Felicitáte, Perpétua, Agatha, Lúcia, Agnéte, Cæcília, Anastásia, et ómnibus Sanctis tuis: intra quorum nos consórtium, non æstimátor mériti, sed véniæ, quaesumus, largítor admítte.","english":"who put our trust in the multitude of Thy mercies, vouchsafe to grant some part and fellowship with Thy holy Apostles and Martyrs: with John, Stephen, Matthias, Barnabas, Ignatius, Alexander, Marcellinus, Peter, Felicitas, Perpetua, Agatha, Lucy, Agnes, Cecilia, Anastasia, and all Thy Saints. Into their company we beseech Thee admit us, not considering our merits, but freely pardoning our offenses.","french":"vos serviteurs, qui espérons en l’abondance de vos miséricordes, daignez accorder quelque participation à la société de vos saints Apôtres et Martyrs : avec Jean, Étienne, Mathias, Barnabé, Ignace, Alexandre, Marcellin, Pierre, Félicité, Perpétue, Agathe, Lucie, Agnès, Cécile, Anastasie, et avec tous vos saints ; vous qui donnez largement et ne regardez pas au mérite, mais au pardon, nous vous en prions, admettez-nous dans leur compagnie.","clock":"PUBLIC_TEXT"},{"cue":"AO.SM.C0198","latin":"Per Christum, Dóminum nostrum.","english":"Through Christ our Lord.","french":"Par le Christ notre Seigneur.","clock":"PUBLIC_TEXT"}]},"AO.SM.B059":{"title":"Per quem haec omnia","blockId":"AO.SM.B059","units":[{"cue":"AO.SM.C0199","latin":"Per quem hæc ómnia, Dómine, semper bona creas,","english":"By whom, O Lord, thou dost always create all these good things,","french":"Par lui, Seigneur, vous ne cessez de créer tous ces biens,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0200","latin":"sancti ✠ ficas, viví ✠ ficas, bene ✠ dícis et præstas nobis.","english":"dost sanctify, quicken, bless and bestow them upon us.","french":"de les ✠ sanctifier, de les ✠ vivifier, de les ✠ bénir et de nous les donner.","clock":"PRIEST_PRIVATE"}]},"AO.SM.B060":{"title":"Per ipsum","blockId":"AO.SM.B060","units":[{"cue":"AO.SM.C0201","latin":"[UNCOVERS CHALICE — GENUFLECTS — TAKES SACRED HOST]","english":"[Uncovers Chalice — genuflects — takes Sacred Host]","french":"[Découvre le Calice — génuflexion — prend la sainte Hostie]","clock":"PRIEST_ACTION"},{"cue":"AO.SM.C0202","latin":"Per ip ✠ sum, et cum ip ✠ so, et in ip ✠ so,","english":"Through him, and with him, and in him,","french":"Par ✠ lui, et avec ✠ lui, et en ✠ lui,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0203","latin":"est tibi Deo Patri ✠ omnipotenti, in unitáte Spíritus ✠ Sancti,","english":"is unto thee, God the Father almighty, in the unity of the Holy Ghost,","french":"est à vous, Dieu le Père ✠ tout-puissant, en l’unité du Saint ✠ Esprit,","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0204","latin":"omnis honor, et glória.","english":"all honour and glory.","french":"tout honneur et toute gloire.","clock":"PRIEST_PRIVATE"},{"cue":"AO.SM.C0205","latin":"[REPLACES THE HOST — COVERS THE CHALICE — GENUFLECTS]","english":"[Replaces the Host — covers the Chalice — genuflects]","french":"[Dépose l’Hostie — couvre le Calice — génuflexion]","clock":"PRIEST_ACTION"}]},"AO.SM.B061":{"title":"Per omnia saecula saeculorum — Canon conclusion","blockId":"AO.SM.B061","units":[{"cue":"AO.SM.C0206","latin":"℣. Per ómnia sǽcula sæculórum.","english":"℣. World without end.","french":"Pour les siècles des siècles.","clock":"PUBLIC_TEXT"},{"cue":"AO.SM.C0207","latin":"℟. Amen.","english":"℟. Amen.","french":"Ainsi soit-il.","clock":"USER_RESPONSE"}]}},"claims":{"MF01-C01":{"stage":"MF01","text":{"en":"The older Roman vocabulary commonly distinguishes the Mass of the Catechumens from the Mass of the Faithful; these names are useful historical and catechetical labels rather than two separate Masses.","fr":"Le vocabulaire romain ancien distingue communément la Messe des catéchumènes de la Messe des fidèles ; ces noms sont des repères historiques et catéchétiques utiles, non deux Messes séparées."}},"MF01-C02":{"stage":"MF01","text":{"en":"The first movement contains preparation, prayer and instruction: the prayers at the foot of the altar, Introit, Kyrie, Gloria and Collect lead into the lessons, Gospel and Creed when prescribed.","fr":"Le premier mouvement contient préparation, prière et instruction : les prières au bas de l’autel, l’Introït, le Kyrie, le Gloria et la Collecte conduisent aux lectures, à l’Évangile et au Credo lorsqu’il est prescrit."}},"MF01-C03":{"stage":"MF01","text":{"en":"The second movement centres on offering, Consecration and Communion; the Offertory, Canon and Communion therefore belong to one sacrificial movement rather than three unrelated devotions.","fr":"Le second mouvement est centré sur l’offrande, la Consécration et la Communion ; l’Offertoire, le Canon et la Communion appartiennent donc à un même mouvement sacrificiel et non à trois dévotions sans lien."}},"MF02-C01":{"stage":"MF02","text":{"en":"The 1962 Missal attaches many gestures to exact words: bows at holy names or phrases, signs of the Cross, genuflections and kisses of the altar are part of the celebrant’s prescribed ceremonial.","fr":"Le Missel de 1962 attache de nombreux gestes à des mots précis : inclinations aux saints noms ou à certaines phrases, signes de croix, génuflexions et baisers de l’autel font partie du cérémonial prescrit au célébrant."}},"MF02-C02":{"stage":"MF02","text":{"en":"Traditional participation also uses bodily gestures, but congregational custom and the celebrant’s rubrics are different authority layers.","fr":"La participation traditionnelle emploie aussi des gestes corporels, mais la coutume de l’assemblée et les rubriques du célébrant relèvent de niveaux d’autorité différents."}},"MF02-C03":{"stage":"MF02","text":{"en":"The point of ceremonial is not choreography for its own sake: external worship should express and foster the interior worship of the heart.","fr":"Le cérémonial n’est pas une chorégraphie pour elle-même : le culte extérieur doit exprimer et nourrir le culte intérieur du cœur."}},"MF03-C01":{"stage":"MF03","text":{"en":"At Orate, fratres the Roman text itself distinguishes ‘my sacrifice and yours’, showing both a real participation of the faithful and a distinction of roles.","fr":"À l’Orate, fratres, le texte romain distingue lui-même « mon sacrifice et le vôtre », montrant à la fois une participation réelle des fidèles et une distinction des rôles."}},"MF03-C02":{"stage":"MF03","text":{"en":"Pius XII teaches that the sacramental immolation is performed by the priest alone in the person of Christ, while the faithful offer through the priest and, in a qualified sense, together with him by joining their prayers and interior dispositions.","fr":"Pie XII enseigne que l’immolation sacramentelle est accomplie par le prêtre seul dans la personne du Christ, tandis que les fidèles offrent par les mains du prêtre et, en un sens qualifié, avec lui en unissant leurs prières et dispositions intérieures."}},"MF03-C03":{"stage":"MF03","text":{"en":"Campion’s useful practical insight is therefore sound when properly qualified: the visible Offertory can prompt the faithful to offer their work, sufferings, thanksgiving and petitions without pretending to perform the priest’s rite.","fr":"L’intuition pratique de Campion est donc juste lorsqu’elle est bien précisée : l’Offertoire visible peut inviter les fidèles à offrir leur travail, leurs souffrances, leur action de grâces et leurs intentions sans prétendre accomplir le rite du prêtre."}},"MF04-C01":{"stage":"MF04","text":{"en":"The Canon is prayed in a low voice in the 1962 rite; silence does not mean nothing is happening, but marks a dense sequence of offering, remembrance and intercession.","fr":"Le Canon est récité à voix basse dans le rite de 1962 ; le silence ne signifie pas qu’il ne se passe rien, mais accompagne une séquence dense d’offrande, de mémoire et d’intercession."}},"MF04-C02":{"stage":"MF04","text":{"en":"The Canon prays for the Church, the Pope and local bishop, particular living persons, the saints, the departed, and finally the celebrant and faithful as sinners seeking mercy.","fr":"Le Canon prie pour l’Église, le Pape et l’évêque du lieu, des vivants en particulier, les saints, les défunts, puis enfin le célébrant et les fidèles comme pécheurs implorant la miséricorde."}},"MF04-C03":{"stage":"MF04","text":{"en":"The Mementos are natural moments for the faithful to remember the living and the dead rather than treating the silent Canon as dead time.","fr":"Les Mémentos sont des moments naturels pour que les fidèles se souviennent des vivants et des morts, au lieu de considérer le Canon silencieux comme un temps mort."}},"MF05-C01":{"stage":"MF05","text":{"en":"Pius XII explicitly teaches the transubstantiation of bread into Christ’s Body and wine into His Blood; the Eucharistic species remain the sensible signs under which the whole Christ is truly present.","fr":"Pie XII enseigne explicitement la transsubstantiation du pain au Corps du Christ et du vin à son Sang ; les espèces eucharistiques demeurent les signes sensibles sous lesquels le Christ tout entier est réellement présent."}},"MF05-C02":{"stage":"MF05","text":{"en":"The separate consecration under the two species sacramentally represents Christ’s sacrificial death; it does not divide or kill the risen Christ again.","fr":"La consécration séparée sous les deux espèces représente sacramentellement la mort sacrificielle du Christ ; elle ne divise pas et ne tue pas de nouveau le Christ ressuscité."}},"MF05-C03":{"stage":"MF05","text":{"en":"The elevations are therefore moments of adoration of Christ truly present, not merely visual pauses for following the ceremony.","fr":"Les élévations sont donc des moments d’adoration du Christ réellement présent, et non de simples pauses visuelles pour suivre la cérémonie."}},"MF06-C01":{"stage":"MF06","text":{"en":"The Mass is not a second death of Christ. Pius XII teaches that the Victim is the same divine Redeemer, while the manner of offering is different: Calvary was bloody; the altar presents the sacrifice in an unbloody sacramental manner.","fr":"La Messe n’est pas une seconde mort du Christ. Pie XII enseigne que la Victime est le même divin Rédempteur, tandis que le mode d’offrande diffère : le Calvaire fut sanglant ; l’autel présente le sacrifice d’une manière sacramentelle non sanglante."}},"MF06-C02":{"stage":"MF06","text":{"en":"The Roman Canon consciously places the Eucharistic offering within biblical sacrificial history by naming Abel, Abraham and Melchisedech.","fr":"Le Canon romain inscrit consciemment l’offrande eucharistique dans l’histoire biblique du sacrifice en nommant Abel, Abraham et Melchisédech."}},"MF06-C03":{"stage":"MF06","text":{"en":"Sacrifice and sacred banquet are therefore not rival explanations of the Mass: Communion is participation in the sacrificial Victim offered to the Father.","fr":"Sacrifice et banquet sacré ne sont donc pas deux explications rivales de la Messe : la Communion est participation à la Victime sacrificielle offerte au Père."}},"MF07-C01":{"stage":"MF07","text":{"en":"Pius XII states that Holy Communion pertains to the integrity of the Mass and is obligatory for the priest who celebrates.","fr":"Pie XII affirme que la Sainte Communion appartient à l’intégrité de la Messe et qu’elle est obligatoire pour le prêtre qui célèbre."}},"MF07-C02":{"stage":"MF07","text":{"en":"The faithful’s sacramental Communion is strongly recommended, but a person may assist at Mass without receiving Communion.","fr":"La Communion sacramentelle des fidèles est vivement recommandée, mais une personne peut assister à la Messe sans communier."}},"MF07-C03":{"stage":"MF07","text":{"en":"This distinction prevents a common misunderstanding: the liturgy does not become complete only when the congregation has communicated.","fr":"Cette distinction évite un malentendu fréquent : la liturgie ne devient pas complète seulement lorsque l’assemblée a communié."}},"MF08-C01":{"stage":"MF08","text":{"en":"The Postcommunion is the Church’s liturgical thanksgiving; personal thanksgiving after Communion can continue after the formal rites have ended.","fr":"La Postcommunion est l’action de grâces liturgique de l’Église ; l’action de grâces personnelle après la Communion peut se poursuivre après la fin des rites formels."}},"MF08-C02":{"stage":"MF08","text":{"en":"Campion’s final catechetical application is useful when kept as application rather than etymology: having worshipped and received Christ, the Catholic returns to ordinary duties with a responsibility to live the faith.","fr":"L’application catéchétique finale de Campion est utile lorsqu’on la garde comme application et non comme étymologie : après avoir adoré et reçu le Christ, le catholique retourne à ses devoirs ordinaires avec la responsabilité de vivre la foi."}},"MF08-C03":{"stage":"MF08","text":{"en":"Thanksgiving, charity, good example and fidelity to one’s duties are therefore fruits of Mass, not extra choreography added to the rite.","fr":"L’action de grâces, la charité, le bon exemple et la fidélité aux devoirs sont donc des fruits de la Messe, non une chorégraphie ajoutée au rite."}}}}</script>
<script>
(function(){
'use strict';
const data=JSON.parse(document.getElementById('canon-payload').textContent),studies=data.studies;
const list=document.getElementById('study-list'),root=document.getElementById('study');
if(data.status!=='EDITORIAL_PREVIEW_ONLY_UNPUBLISHED'||studies.length!==8||studies.reduce((n,s)=>n+s.sections.length,0)!==34)throw Error('Review data invalid');
const key='ao-canon-eight-editorial-review-20261017-'+studies.map(s=>s.id).join(':');
let active=0,lang='en',blockChoice={},reviewer='',note='',message='',decisions={};
const t=(en,fr)=>lang==='fr'?fr:en, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bilingual(o,klass){return lang==='both'?'<p class="'+klass+'">'+esc(o?.en)+'</p><p lang="fr" class="'+klass+' second">'+esc(o?.fr)+'</p>':'<p class="'+klass+'"'+(lang==='fr'?' lang="fr"':'')+'>'+esc(o?.[lang]??o?.en)+'</p>';}
function current(){return studies[active]}
function changed(){try{localStorage.setItem(key,JSON.stringify({decisions,reviewer,lang,active,blockChoice}))}catch(e){}}
function restore(){try{let saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved.decisions&&typeof saved.decisions==='object')for(const s of studies){const d=saved.decisions[s.id];if(d&&['approve','revise','pending'].includes(d.decision)&&typeof d.note==='string'&&d.note.length<=4000)decisions[s.id]=d;}if(typeof saved.reviewer==='string')reviewer=saved.reviewer.slice(0,120);if(['en','fr','both'].includes(saved.lang))lang=saved.lang;if(Number.isInteger(saved.active)&&saved.active>=0&&saved.active<8)active=saved.active;if(saved.blockChoice&&typeof saved.blockChoice==='object')blockChoice=saved.blockChoice;}catch(e){}}
function renderNav(){
list.innerHTML=studies.map((s,i)=>{const d=decisions[s.id]?.decision||'pending',words={approve:'Wording approved',revise:'Revision requested',pending:'Pending'};return '<button type="button" class="study-button '+(i===active?'active':'')+'" data-index="'+i+'" data-decision="'+d+'" aria-current="'+(i===active?'step':'false')+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><b>'+esc(s.title[lang==='fr'?'fr':'en'])+'</b><small>'+esc(s.block_ids.join(' · '))+'</small><span class="state">'+words[d]+'</span></button>'}).join('');
const done=studies.filter(s=>decisions[s.id]&&decisions[s.id].decision!=='pending').length;
document.getElementById('meter').style.width=(done/8*100)+'%';
document.getElementById('meter-label').textContent=done+'/8 wording decisions · no public releases';
}
function render(){
let s=current(),d=decisions[s.id]||{decision:'pending',note:''},chosen=blockChoice[s.id];
