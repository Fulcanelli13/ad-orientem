if(!s.block_ids.includes(chosen))chosen=s.block_ids[0];
const b=data.blocks[chosen],langSource=lang==='fr'?'french':'english';
document.documentElement.lang=lang==='fr'?'fr':'en';
for(const button of document.querySelectorAll('[data-language]'))button.setAttribute('aria-pressed',String(button.dataset.language===lang));
renderNav();
const claimList=(ids)=>ids.map(id=>data.claims[id]?'<li>'+esc(id)+' · '+esc(data.claims[id].text[lang==='fr'?'fr':'en'])+'</li>':'').join('');
const sections=s.sections.map((section,i)=>'<section class="chapter"><h3>'+(i+1)+'. '+esc(section.heading[lang==='fr'?'fr':'en'])+'</h3>'+bilingual(section.body,'')+'<details class="evidence"><summary>'+t('Existing Formation claim links','Correspondances avec la Formation existante')+' · '+esc(section.claim_ids.join(', '))+'</summary><ul>'+claimList(section.claim_ids)+'</ul></details></section>').join('');
root.innerHTML=
'<div class="notice">EDITORIAL DRAFT — Review of wording only. The eight long studies remain unpublished; source, theological, rights and release checks are separate.</div>'+
'<span class="index">CANON STUDY '+String(active+1).padStart(2,'0')+' / 08 · '+esc(s.stage_id)+'</span>'+
'<h1 class="title">'+esc(s.title[lang==='fr'?'fr':'en'])+'</h1>'+bilingual(s.lead,'lead')+
'<div class="meta">'+esc(s.block_ids.join(' · '))+' · '+s.sections.length+' '+t('sections','sections')+' · '+t('draft wording','rédaction provisoire')+'</div>'+
'<h2 class="section-title">'+t('Read the original prayer','Lire la prière originale')+'</h2>'+
'<div class="tabrow" role="group" aria-label="Source prayer">'+s.block_ids.map(id=>'<button type="button" class="pill" data-block="'+esc(id)+'" aria-pressed="'+String(id===chosen)+'">'+esc(data.blocks[id].title)+'</button>').join('')+'</div>'+
'<section class="source"><h3>'+esc(b.title)+'</h3><p class="intro">'+esc(chosen)+' · '+t('Original canonical Sung source','Texte latin de référence')+'</p>'+b.units.map(u=>'<div class="cue"><div class="cue-id">'+esc(u.cue)+' · '+esc(u.clock)+'</div><div class="lat">'+esc(u.latin)+'</div>'+((lang==='both')?'<div class="translation">'+esc(u.english)+'</div><div class="translation" lang="fr">'+esc(u.french)+'</div>':'<div class="translation">'+esc(u[langSource]||u.english)+'</div>')+'</div>').join('')+'</section>'+
'<h2 class="section-title">'+t('Study and interpretation','Étude et commentaire')+'</h2><div class="chapters">'+sections+'</div>'+
'<section class="review" id="decision"><h2>'+t('Editorial wording decision','Décision sur le texte')+'</h2><p>'+t('Approve this study’s wording, request revisions, or leave it pending. This does not certify sources, rights, theology or publication.','Approuvez le texte, demandez une révision ou laissez-le en attente. Cela ne certifie ni les sources, ni les droits, ni la doctrine, ni la publication.')+'</p>'+
'<div class="choices" role="group" aria-label="Study wording decision">'+
'<button class="btn '+(d.decision==='approve'?'selected':'')+'" data-decision="approve" aria-pressed="'+(d.decision==='approve')+'">'+t('Approve wording','Approuver le texte')+'</button>'+
'<button class="btn '+(d.decision==='revise'?'selected':'')+'" data-decision="revise" aria-pressed="'+(d.decision==='revise')+'">'+t('Request revision','Demander une révision')+'</button>'+
'<button class="btn '+(d.decision==='pending'?'selected':'')+'" data-decision="pending" aria-pressed="'+(d.decision==='pending')+'">'+t('Pending','En attente')+'</button></div>'+
'<label>'+t('Reviewer notes','Notes de relecture')+'<textarea id="note" maxlength="4000" placeholder="'+t('Specific wording, source or translation corrections…','Corrections de rédaction, de source ou de traduction…')+'"></textarea></label>'+
'<label>'+t('Reviewer name (needed for recognized wording approval)','Nom du relecteur (requis pour valider le texte)')+'<input id="reviewer" maxlength="120" placeholder="'+t('Your name','Votre nom')+'"></label>'+
'<div class="actions"><button class="btn" data-next>'+t('Next pending study','Étude suivante en attente')+'</button><button class="btn primary" data-export>'+t('Export decisions (.json)','Exporter les décisions (.json)')+'</button><button class="btn" data-import>'+t('Import earlier decisions','Importer les décisions précédentes')+'</button><input id="import-input" type="file" accept=".json,application/json" hidden></div>'+
'<div id="status" class="status" role="status">'+esc(message)+'</div><p>'+t('Your changes are saved only in this browser until you export the JSON. No decisions are sent to GitHub automatically.','Vos choix restent dans ce navigateur jusqu’à l’export du fichier JSON. Aucun envoi automatique sur GitHub.')+'</p></section>'+
'<p class="foot">Original source IDs retained · Canon B047–B061 · 8 studies / 34 sections · Unpublished P2 editorial branch</p>';
root.querySelector('#note').value=d.note||'';root.querySelector('#reviewer').value=reviewer;changed();
}
const canonical=s=>({id:s.id,stage_id:s.stage_id,block_ids:s.block_ids,profile:s.profile,use:s.use,content_type:s.content_type,claim_ids:s.claim_ids,title:s.title,lead:s.lead,sections:s.sections});
async function sha(s){const bytes=new TextEncoder().encode(JSON.stringify(canonical(s))),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function exported(){return {schema:'ao-mass-explorer-canon-owner-decisions-v1',scope:'EDITORIAL_WORDING_ONLY_NOT_PUBLICATION',reviewer:reviewer.trim()||null,decisions:await Promise.all(studies.map(async s=>({study_id:s.id,block_ids:[...s.block_ids],content_sha256:await sha(s),decision:decisions[s.id]?.decision||'pending',note:decisions[s.id]?.note||''}))),human_review_required:true,formal_rights_check_outstanding:true};}
async function exportDecisions(){try{if(reviewer.trim()&&(reviewer.trim().length<3||reviewer.trim().length>120))throw Error('Reviewer name must be at least three characters if provided');let out=await exported();let blob=new Blob([JSON.stringify(out,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ad-orientem-roman-canon-review-decisions.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);message='Review decisions exported. Nothing was published.';render();}catch(e){message=e.message;render();}}
async function importDecisions(file){if(file.size>512000)throw Error('Review file too large');let obj=JSON.parse(await file.text());if(obj.schema!=='ao-mass-explorer-canon-owner-decisions-v1'||obj.scope!=='EDITORIAL_WORDING_ONLY_NOT_PUBLICATION'||!obj.human_review_required||!obj.formal_rights_check_outstanding||!Array.isArray(obj.decisions)||obj.decisions.length!==8)throw Error('Wrong review format');
const draft={};for(const s of studies){let item=obj.decisions.find(d=>d.study_id===s.id);if(!item||obj.decisions.filter(d=>d.study_id===s.id).length!==1||JSON.stringify(item.block_ids)!==JSON.stringify(s.block_ids)||item.content_sha256!==await sha(s)||!['pending','approve','revise'].includes(item.decision)||typeof item.note!=='string'||item.note.length>4000)throw Error('Stale or invalid decision for '+s.id);draft[s.id]={decision:item.decision,note:item.note};}
if(obj.reviewer!==null&&obj.reviewer!==undefined&&(typeof obj.reviewer!=='string'||obj.reviewer.length<3||obj.reviewer.length>120))throw Error('Invalid reviewer');
decisions=draft;reviewer=obj.reviewer||'';message='All eight SHA-locked decisions successfully restored.';render();}
list.addEventListener('click',e=>{const btn=e.target.closest('[data-index]');if(!btn)return;active=Number(btn.dataset.index);message='';render();window.scrollTo(0,0)});
document.querySelector('.top').addEventListener('click',e=>{const btn=e.target.closest('[data-language]');if(!btn)return;lang=btn.dataset.language;render()});
root.addEventListener('input',e=>{if(e.target.id==='note'){let s=current();decisions[s.id]={decision:decisions[s.id]?.decision||'pending',note:e.target.value};changed()}else if(e.target.id==='reviewer'){reviewer=e.target.value;changed()}});
root.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.block){blockChoice[current().id]=btn.dataset.block;render();return}if(btn.dataset.decision){let s=current();decisions[s.id]={decision:btn.dataset.decision,note:decisions[s.id]?.note||''};message='';render();return}if(btn.hasAttribute('data-next')){let start=active;let next=[...studies.slice(start+1),...studies.slice(0,start+1)].find(s=>(decisions[s.id]?.decision||'pending')==='pending');if(next){active=studies.indexOf(next);message='';render();window.scrollTo(0,0)}else{message='No remaining pending studies.';render()}return}if(btn.hasAttribute('data-export')){exportDecisions();return}if(btn.hasAttribute('data-import')){root.querySelector('#import-input').click()}});
root.addEventListener('change',async e=>{if(e.target.id!=='import-input')return;const file=e.target.files?.[0];if(!file)return;try{await importDecisions(file)}catch(err){message='Import refused: '+err.message;render()}});
restore();render();
})();
