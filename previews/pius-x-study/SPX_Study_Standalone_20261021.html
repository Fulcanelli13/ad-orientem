<script type="application/json" id="spxData">{"version":"SPX_STUDY_PLAYABLE_REVIEW_V1","date":"2026-10-21","status":"REVIEW_ONLY_UNAPPROVED_ADAPTED_DIALOGUE","provenance":{"dataOwners":[{"path":"data/learn/research/pius-x-document-first-three-benchmark-source-map-20261021.v1.json","sha":"76516e3a12c34cb7480b594e2bfa55007df94d87"},{"path":"data/learn/research/pius-x-document-first-remaining-acerbo-esupremi-20261021.v1.json","sha":"19044fd3038b0d57f13a70242c35e42a87dbea91"},{"path":"data/learn/research/pius-x-document-first-remaining-haerent-20261021.v1.json","sha":"e55bb97b19c49bf9d7cbf8d12e5095e829b3aef9"},{"path":"data/learn/research/pius-x-document-first-34-editorial-corrections-20261021.v1.json","sha":"d2a117774ccb02e7d1e22bdf6cd43878505f0115"}],"assetOwner":"feature/living-church-p3-character-folio-20261018","art":[{"path":"assets/living-church/backgrounds/pius-x-papal-study.webp","sha":"4891ded84b31cc78689642f1ae7f535a5bfa29b5"},{"path":"assets/living-church/sprites/pius-neutral.webp","sha":"46e3c4df5dde3a63afec60a56a49459b456c7e15"},{"path":"assets/living-church/sprites/pius-welcoming.webp","sha":"c2bd38392b1a31c8c3aa26221c6d5af6b2b0e69a"},{"path":"assets/living-church/sprites/pius-explaining.webp","sha":"e75daef0e9c33eb1712249d7aa8b9a525a5a63d3"},{"path":"assets/living-church/sprites/pius-thoughtful.webp","sha":"39c5c3320d538a9e34eb334a76fb3bb6fa384c40"},{"path":"assets/living-church/sprites/pius-grave.webp","sha":"e383de752a6fbc75ce1359a5c8754283f191f9e9"}],"dataStatus":"34 derivative exchanges from canonical research owners; no human or theological release approval","artStatus":"Five approved reference poses; public distribution approval pending"},"counts":{"documents":3,"turns":34,"segments":68},"docs":[{"id":"ACERBO","title":"Acerbo nimis","genre":"PAPAL_ENCYCLICAL","originalAudience":"bishops","warning":"1905 legislation is historical; a lay visitor is not an addressee of diocesan decrees.","urls":{"en":"https://www.vatican.va/content/pius-x/en/encyclicals/documents/hf_p-x_enc_15041905_acerbo-nimis.html","fr":"https://www.vatican.va/content/pius-x/fr/encyclicals/documents/hf_p-x_enc_15041905_acerbo-nimis.html","la":"https://www.vatican.va/content/pius-x/la/encyclicals/documents/hf_p-x_enc_15041905_acerbo-nimis.html"},"turns":[{"id":"SPX.BENCH.ACERBO.T1","question":{"en":"Holy Father, what did you consider the principal cause of the weakening of Christian life?","fr":"Très Saint-Père, quelle cause teniez-vous pour principale dans l'affaiblissement de la vie chrétienne ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T1.S1","en":"When We published Our encyclical Acerbo nimis, We did not dismiss the other explanations then given for the decline of religion.","fr":"Lorsque Nous avons publié Notre encyclique Acerbo nimis, Nous n'avons pas rejeté toutes les autres explications données de l'affaiblissement de la religion.","claims":[{"id":"A01","locus":"§1","meaning":"Acknowledges other causes of religious decline without rejecting them all."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T1.S2","en":"Yet We agreed above all with those who attributed the weakness of souls and its grave consequences to ignorance of divine things.","fr":"Mais Nous partagions surtout le jugement de ceux qui attribuaient la faiblesse des âmes et ses graves conséquences à l'ignorance des choses divines.","claims":[{"id":"A02","locus":"§1","meaning":"Treats ignorance of divine things as chief cause of weakness in Christian religious life."}],"secondaryAuthority":null}],"sections":["§1"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T2","question":{"en":"Surely that ignorance mostly concerned people without schooling?","fr":"Cette ignorance touchait surtout ceux qui n'avaient pas reçu d'instruction ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T2.S1","en":"We spoke also, and especially, of people well educated in worldly matters who scarcely knew their religion.","fr":"Nous parlions aussi, et surtout, de personnes fort instruites des affaires du monde, mais connaissant à peine leur religion.","claims":[{"id":"A03","locus":"§2","meaning":"Religious ignorance includes people educated in worldly matters."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T2.S2","en":"Some reached their last hours still needing elementary religious teaching, when that time ought to have been devoted to stirring up their love for God.","fr":"Certaines arrivaient aux dernières heures de leur vie en ayant encore besoin des premiers enseignements religieux, au lieu de consacrer ce temps à ranimer leur amour de Dieu.","claims":[{"id":"A04","locus":"§2","meaning":"Some dying people require first religious instruction when they should be turning toward love of God."}],"secondaryAuthority":null}],"sections":["§2"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T5","question":{"en":"But can a person know the faith and still lead a wicked life?","fr":"Peut-on connaître la foi et cependant mener une mauvaise vie ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T5.S1","en":"Certainly. In Our encyclical Acerbo nimis, We expressly admitted that a corrupt will may coexist with knowledge of religion.","fr":"Assurément. Dans Notre encyclique Acerbo nimis, Nous reconnaissions expressément qu'une volonté corrompue peut coexister avec la connaissance de la religion.","claims":[{"id":"A11","locus":"§5","meaning":"Pius X explicitly admits that religious knowledge may coexist with moral corruption."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T5.S2","en":"Yet as We explained, a traveller with open eyes may stray, whereas one who is blind runs a greater danger of losing the way.","fr":"Cependant, comme Nous l'expliquions, un voyageur qui voit peut s'égarer, tandis que l'aveugle court un plus grand danger de perdre son chemin.","claims":[{"id":"A12","locus":"§5","meaning":"He uses the open-eyed versus blind traveler to show why ignorance increases danger."}],"secondaryAuthority":null}],"sections":["§5"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T6","question":{"en":"Who should be responsible for correcting such ignorance?","fr":"À qui revient la charge de combattre cette ignorance ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T6.S1","en":"We laid this grave charge upon pastors of souls. To feed the flock entrusted to a priest is, before all else, to teach it.","fr":"Nous imposions cette grave charge aux pasteurs des âmes. Nourrir le troupeau confié au prêtre, c'est avant tout l'instruire.","claims":[{"id":"A13","locus":"§7","meaning":"Pastors of souls are obliged to instruct the flock; feeding chiefly includes teaching."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T6.S2","en":"We therefore required knowledge of divine things to accompany holiness in the priest; the faithful rightly seek God's law from his lips.","fr":"Nous demandions donc au prêtre d'unir à la sainteté la connaissance des choses divines ; les fidèles attendent à juste titre de ses lèvres la loi de Dieu.","claims":[{"id":"A14","locus":"§9","meaning":"Knowledge of divine law and holiness must both characterize a priest."}],"secondaryAuthority":null}],"sections":["§7","§9"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T3","question":{"en":"Why would an ordinary Sunday sermon not be enough?","fr":"Pourquoi le sermon du dimanche ne suffirait-il pas ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T3.S1","en":"In that encyclical We recalled the distinction made by Our predecessor Benedict XIV, in Etsi minime, between explaining the Gospel and teaching the rudiments of doctrine.","fr":"Nous rappelions dans cette encyclique la distinction faite par Notre prédécesseur Benoît XIV, dans Etsi minime, entre expliquer l'Évangile et enseigner les premiers éléments de la doctrine.","claims":[{"id":"A05","locus":"§12","meaning":"Benedict XIV's Etsi minime distinguishes preaching the Gospel from catechism instruction."}],"secondaryAuthority":"Benedict XIV — Etsi minime"},{"id":"SPX.BENCH.ACERBO.T3.S2","en":"We illustrated this by comparing the Gospel homily to bread for adults and elementary catechesis to milk for little children. One cannot take the place of the other.","fr":"Nous l’illustrions en comparant l’homélie sur l’Évangile au pain des adultes et l’enseignement élémentaire du catéchisme au lait des petits enfants. L’un ne saurait tenir lieu de l’autre.","claims":[{"id":"A06","locus":"§12","meaning":"Gospel homily compared to bread for adults and rudiments to milk for the newly born."}],"secondaryAuthority":null}],"sections":["§12"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T4","question":{"en":"Is it enough, then, to explain the definitions correctly?","fr":"Suffit-il alors d'expliquer correctement les définitions ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T4.S1","en":"We required catechists to explain a truth fully and to compare God's commands with the conduct of their hearers, for amendment of life is the object of such teaching.","fr":"Nous demandions aux catéchistes d'expliquer pleinement une vérité et de confronter les commandements de Dieu à la conduite de leurs auditeurs, car l'amendement de la vie est le but de cet enseignement.","claims":[{"id":"A07","locus":"§13","meaning":"Catechesis explains doctrine and relates commandments to conduct; amendment of life is aim."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T4.S2","en":"We asked them to draw examples from Scripture, the history of the Church and the saints, and to exhort their hearers to leave vice and practise virtue.","fr":"Nous leur demandions des exemples tirés de l'Écriture, de l'histoire de l'Église et des saints, et d'exhorter les fidèles à fuir le vice et pratiquer la vertu.","claims":[{"id":"A08","locus":"§13","meaning":"Catechist uses Scripture, Church history and saints and exhorts against vice and toward virtue."}],"secondaryAuthority":null}],"sections":["§13"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T7","question":{"en":"Do you reject splendid sermons in favour of the catechism?","fr":"Rejetez-vous les grands sermons au profit du catéchisme ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T7.S1","en":"We did not condemn eloquent preachers who sincerely defended the faith or praised the saints.","fr":"Nous ne condamnions point les prédicateurs éloquents qui défendaient sincèrement la foi ou célébraient les saints.","claims":[{"id":"A15","locus":"§14","meaning":"Pius X does not disapprove of genuine eloquent preaching in defence of faith and saints."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T7.S2","en":"But We insisted that such preaching presupposes the foundation laid by catechesis. Even an ornate sermon applauded by a crowd may leave its hearers’ hearts untouched.","fr":"Mais Nous rappelions que cette prédication suppose le fondement posé par le catéchisme. Même un sermon brillant, applaudi par la foule, peut ne pas toucher le cœur de ses auditeurs.","claims":[{"id":"A16","locus":"§14","meaning":"Catechism supplies indispensable foundations and must not be displaced by applause-seeking oratory."}],"secondaryAuthority":null}],"sections":["§14"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T8","question":{"en":"Did you require adults, and not only children, to learn the catechism?","fr":"Avez-vous aussi prescrit le catéchisme aux adultes ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T8.S1","en":"Yes. In Acerbo nimis We prescribed instruction for adults in plain words adapted to their understanding, besides the customary Gospel homily.","fr":"Oui. Dans Acerbo nimis, Nous prescrivions aux adultes une instruction simple, adaptée à leur intelligence, distincte de l'homélie habituelle.","claims":[{"id":"A17","locus":"§24","meaning":"Pius X legislated catechism teaching to adults in addition to Gospel homilies in 1905."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T8.S2","en":"We prescribed instruction based on the Catechism of the Council of Trent, covering the Apostles’ Creed, the Sacraments, the Ten Commandments, the Lord’s Prayer and the Precepts of the Church over four or five years.","fr":"Nous prescrivions un enseignement fondé sur le Catéchisme du concile de Trente, traitant, sur quatre ou cinq années, du Symbole des Apôtres, des Sacrements, des dix Commandements, de l’Oraison dominicale et des préceptes de l’Église.","claims":[{"id":"A18","locus":"§24","meaning":"Pius X prescribed in 1905 a four-to-five-year adult catechesis cycle based on the Catechism of the Council of Trent: Apostles' Creed, Sacraments, Ten Commandments, Lord's Prayer, Precepts of the Church."}],"secondaryAuthority":null}],"sections":["§24"],"optional":false,"qualification":"The cadence, diocesan directives, and catechism prescribed in §24 are historical legislation (1905), not current universal law."},{"id":"SPX.BENCH.ACERBO.T9","question":{"en":"Is simple catechetical teaching easier than a learned sermon?","fr":"Un enseignement simple du catéchisme est-il plus facile qu'un sermon savant ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T9.S1","en":"We instructed bishops to ensure that pastors prepared such instruction seriously rather than performing it carelessly.","fr":"Nous chargions les évêques de veiller à ce que les pasteurs préparassent sérieusement cet enseignement au lieu de le donner sans soin.","claims":[{"id":"A19","locus":"§25","meaning":"Bishops were ordered in 1905 to ensure full implementation and adequate prior pastoral preparation."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T9.S2","en":"We warned in Acerbo nimis that simplicity demands labour and meditation: fluency of speech cannot replace careful study, especially before those least instructed.","fr":"Nous avertissions dans Acerbo nimis que la simplicité exige travail et méditation : la facilité de parole ne remplace pas l'étude attentive, surtout devant les moins instruits.","claims":[{"id":"A20","locus":"§26","meaning":"Teaching simply needs careful study; ease of speech alone is insufficient."},{"id":"A09","locus":"§26","meaning":"Simple catechetical instruction demands more effort and meditation than many elaborate sermons."},{"id":"A10","locus":"§26","meaning":"Less educated hearers require greater diligence and careful preparation."}],"secondaryAuthority":null}],"sections":["§25","§26"],"optional":false,"qualification":null},{"id":"SPX.BENCH.ACERBO.T10","question":{"en":"What did you most urgently ask of the bishops?","fr":"Quelle demande adressiez-vous avec le plus d'insistance aux évêques ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T10.S1","en":"We acknowledged the many good and praiseworthy undertakings already carried out in their dioceses.","fr":"Nous reconnaissions les nombreuses œuvres utiles et dignes d'éloge déjà accomplies dans leurs diocèses.","claims":[{"id":"A21","locus":"§27","meaning":"Pius X acknowledged many works of the bishops as useful and praiseworthy."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T10.S2","en":"Nevertheless, We entreated them above all to ensure, with perseverance, that knowledge of Christian doctrine entered deeply into the minds of all.","fr":"Néanmoins, Nous les conjurions avant tout de veiller avec persévérance à ce que la doctrine chrétienne pénétrât profondément dans l'esprit de tous.","claims":[{"id":"A22","locus":"§27","meaning":"He urged bishops to prioritize deep instruction of the faithful in Christian doctrine."}],"secondaryAuthority":null}],"sections":["§27"],"optional":false,"qualification":"This is a retrospective answer to a lay visitor. The original §27 is an address to bishops."},{"id":"SPX.BENCH.ACERBO.T11","question":{"en":"But isn't the faith already given through Baptism?","fr":"Mais la foi n'est-elle pas déjà donnée au baptême ?"},"segments":[{"id":"SPX.BENCH.ACERBO.T11.S1","en":"Indeed, We recognised that faith is bestowed in Baptism; We denied only that it could be left without the nourishment of instruction.","fr":"Assurément, Nous reconnaissions que la foi est donnée au baptême ; Nous niions seulement qu'on puisse la laisser sans la nourriture de l'instruction.","claims":[{"id":"A23","locus":"§16","meaning":"Faith is given in Baptism, but the divine seed must be nourished by teaching."}],"secondaryAuthority":null},{"id":"SPX.BENCH.ACERBO.T11.S2","en":"We compared it to the understanding of an infant, which exists from birth yet needs the mother's voice to awaken it.","fr":"Nous la comparions à l'intelligence de l'enfant, présente dès la naissance, mais que la parole de sa mère doit éveiller.","claims":[{"id":"A24","locus":"§16","meaning":"A child's understanding needs a mother's speech to awaken it; analogy to faith's growth."}],"secondaryAuthority":null}],"sections":["§16"],"optional":true,"qualification":"The original §16 follows §14 and before §24; navigation may make it optional, but the record must retain original passage order."}]},{"id":"ESUPREMI","title":"E supremi","genre":"PAPAL_ENCYCLICAL","originalAudience":"bishops","warning":"Admonition to bishops and teachers is explained as such, not asserted as the visitor's canonical duty.","urls":{"en":"https://www.vatican.va/content/pius-x/en/encyclicals/documents/hf_p-x_enc_04101903_e-supremi.html","fr":"https://www.vatican.va/content/pius-x/fr/encyclicals/documents/hf_p-x_enc_04101903_e-supremi.html","la":"https://www.vatican.va/content/pius-x/la/encyclicals/documents/hf_p-x_enc_04101903_e-supremi.html"},"turns":[{"id":"SPX.BENCH.E_SUPREMI.T1","question":{"en":"What purpose did you set for your pontificate?","fr":"Quel but assigniez-vous à votre pontificat ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T1.S1","en":"In Our first encyclical, E supremi, We gave Our pontificate no other programme than the restoration of all things in Christ.","fr":"Dans Notre première encyclique, E supremi, Nous n'avons assigné à Notre pontificat d'autre programme que de tout restaurer dans le Christ.","claims":[{"id":"E01","locus":"§4","meaning":"His sole pontifical programme was restoration of all things in Christ."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T1.S2","en":"We denied that this resolution concealed a partisan or merely earthly design.","fr":"Nous avons rejeté l'idée que cette résolution dissimulât un dessein de parti ou un but purement terrestre.","claims":[{"id":"E02","locus":"§4","meaning":"He rejects political or earthly party aims in his pontifical programme."}],"secondaryAuthority":null}],"sections":["§4"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T5","question":{"en":"How did you hope to lead people who had turned away from Christ back to Him?","fr":"Comment espériez-vous ramener au Christ ceux qui s'en étaient éloignés ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T5.S1","en":"In Our encyclical E supremi, We held that instruction in religion was a chief means of restoring God's rule in souls, for some opposed the faith chiefly through ignorance.","fr":"Dans Notre encyclique E supremi, Nous tenions l'instruction religieuse pour un moyen principal de restaurer le règne de Dieu dans les âmes, car certains s'opposaient à la foi surtout par ignorance.","claims":[{"id":"E09","locus":"§12","meaning":"Religious instruction is chief among means of restoring God in souls; some opposition springs from ignorance more than malice."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T5.S2","en":"We observed that even educated persons could be ignorant of religion, and denied that the genuine progress of knowledge itself extinguished faith.","fr":"Nous remarquions que des personnes fort instruites pouvaient ignorer leur religion, et Nous niions que le véritable progrès des connaissances éteignît par lui-même la foi.","claims":[{"id":"E10","locus":"§12","meaning":"Religious ignorance is found even among cultured people; growing knowledge does not itself destroy faith."}],"secondaryAuthority":null}],"sections":["§12"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T2","question":{"en":"When someone attacks the faith, is severity the best answer?","fr":"Lorsque quelqu'un attaque la foi, la sévérité est-elle la meilleure réponse ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T2.S1","en":"We warned in E supremi that bitter zeal does not draw souls to God, and that harsh reproaches often do more harm than good.","fr":"Nous avertissions dans E supremi qu'un zèle amer n'attire point les âmes à Dieu et que les reproches âpres font souvent plus de mal que de bien.","claims":[{"id":"E03","locus":"§13","meaning":"Charity is most effective means of attracting souls; bitter zeal and harsh reproach can harm."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T2.S2","en":"For the work of drawing souls to Christ, We placed charity first.","fr":"Pour attirer les âmes au Christ, Nous mettions la charité au premier rang.","claims":[{"id":"E03","locus":"§13","meaning":"Charity is most effective means of attracting souls; bitter zeal and harsh reproach can harm."}],"secondaryAuthority":null}],"sections":["§13"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T3","question":{"en":"But should we simply leave error uncorrected?","fr":"Mais faudrait-il donc laisser l'erreur sans correction ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T3.S1","en":"Not so: We recalled that the Apostle urged Timothy to correct and rebuke, but also insisted upon patience.","fr":"Nullement : Nous rappelions que l'Apôtre recommandait à Timothée de reprendre et de réprimander, mais exigeait aussi la patience.","claims":[{"id":"E04","locus":"§13","meaning":"Paul's call to correct also requires all patience, as Pius X highlights."}],"secondaryAuthority":"St Paul — 2 Timothy 4:2"},{"id":"SPX.BENCH.E_SUPREMI.T3.S2","en":"We set before those who teach the faith the gentleness of Christ, including the prophet's image of the bruised reed He would not break.","fr":"Nous donnions en exemple à ceux qui enseignent la foi la douceur du Christ, notamment l'image prophétique du roseau froissé qu'Il ne brise point.","claims":[{"id":"E05","locus":"§13","meaning":"Christ's gentle invitation and bruised reed example are cited by Pius X."}],"secondaryAuthority":"Isaiah 42:3 (cited by Pius X)"}],"sections":["§13"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T6","question":{"en":"Whose example should guide a firm but charitable correction?","fr":"Quel exemple doit guider une correction ferme et charitable ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T6.S1","en":"We held up Our Lord, who invited the burdened to come to Him and receive rest, as the model of patience and gentleness.","fr":"Nous donnions pour modèle Notre-Seigneur, qui invitait les âmes accablées à venir à Lui pour trouver le repos.","claims":[{"id":"E11","locus":"§13","meaning":"Christ's invitation to the burdened is used as example of gentleness."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T6.S2","en":"We also recalled the prophet Isaiah's image of the bruised reed He would not break and the smoking flax He would not extinguish.","fr":"Nous rappelions aussi, avec le prophète Isaïe, le roseau froissé qu'Il ne brise point et la mèche qui fume encore qu'Il n'éteint point.","claims":[{"id":"E12","locus":"§13","meaning":"Pius X invokes Isaiah's bruised reed and smoking flax as Christ's compassion."}],"secondaryAuthority":"Isaiah 42:3, cited by Pius X"}],"sections":["§13"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T7","question":{"en":"Does that charity extend even to those hostile to the Church?","fr":"Cette charité s'étend-elle même aux ennemis de l'Église ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T7.S1","en":"We expressly extended such charity even to those who opposed or persecuted Christians.","fr":"Nous étendions expressément cette charité même à ceux qui s'opposaient aux chrétiens ou les persécutaient.","claims":[{"id":"E13","locus":"§13","meaning":"Charity is extended even to adversaries and persecutors."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T7.S2","en":"We noted that some might appear worse than they were, having been influenced by prejudice or by the example of others.","fr":"Nous faisions observer que certains pouvaient paraître pires qu'ils n'étaient, influencés par des préjugés ou par l'exemple d'autrui.","claims":[{"id":"E14","locus":"§13","meaning":"Some hostility may arise from prejudice, example or human respect; Pius X phrases this as a possibility."}],"secondaryAuthority":null}],"sections":["§13"],"optional":false,"qualification":"The original's 'perhaps' is retained; no judgment of a named person's motives may be put into character speech."},{"id":"SPX.BENCH.E_SUPREMI.T4","question":{"en":"What if patience brings no visible change?","fr":"Et si la patience ne produit aucun changement visible ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T4.S1","en":"We acknowledged that the fruits of these labours might be slow in coming.","fr":"Nous reconnaissions que les fruits de ces travaux pouvaient tarder à paraître.","claims":[{"id":"E07","locus":"§13","meaning":"Fruit of charitable labour may be delayed; God rewards good will, not merely results."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T4.S2","en":"Yet We recalled that charity does not weary of waiting: God rewards the goodwill shown in the work, not merely its visible results.","fr":"Mais Nous rappelions que la charité ne se lasse pas d'attendre : Dieu récompense la bonne volonté dans le travail, non seulement ses résultats visibles.","claims":[{"id":"E07","locus":"§13","meaning":"Fruit of charitable labour may be delayed; God rewards good will, not merely results."}],"secondaryAuthority":null}],"sections":["§13"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T8","question":{"en":"Was this work for priests alone?","fr":"Cette œuvre appartenait-elle aux seuls prêtres ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T8.S1","en":"No. In E supremi We called all the faithful to care for God's cause and for souls, while acting under the direction of the bishops.","fr":"Non. Dans E supremi, Nous appelions tous les fidèles à se préoccuper de la cause de Dieu et des âmes, tout en agissant sous la direction des évêques.","claims":[{"id":"E15","locus":"§14","meaning":"Pius X includes all faithful in care for souls, directed by bishops."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T8.S2","en":"We praised Catholic associations, provided they sought Christian practice and remained under proper ecclesiastical direction.","fr":"Nous louions les associations catholiques pourvu qu'elles favorisassent la pratique chrétienne et respectassent la direction de l'autorité ecclésiastique.","claims":[{"id":"E16","locus":"§14","meaning":"Catholic associations should favor faithful Christian life under episcopal authority."}],"secondaryAuthority":null}],"sections":["§14"],"optional":false,"qualification":"The encyclical states the governance rule for its contemporary associations; not a blanket modern regulatory adjudication."},{"id":"SPX.BENCH.E_SUPREMI.T9","question":{"en":"What did you hope the faithful would actually do?","fr":"Que désiriez-vous voir accomplir par les fidèles ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T9.S1","en":"We warned that eloquent discussion of rights and duties is of little avail when no action follows.","fr":"Nous avertissions que de beaux discours sur les droits et les devoirs servent peu s'ils ne sont pas suivis d'actes.","claims":[{"id":"E17","locus":"§14","meaning":"Abstract discussion of duties without practical observance has little value."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T9.S2","en":"We called for observance of God's commandments and the Church's precepts, open profession of religion and works of charity undertaken without worldly self-interest.","fr":"Nous demandions l'observation des commandements de Dieu et des préceptes de l'Église, la profession ouverte de la religion et des œuvres de charité sans intérêt mondain.","claims":[{"id":"E18","locus":"§14","meaning":"Open profession of faith, observing precepts, and selfless charitable works are commended."}],"secondaryAuthority":null}],"sections":["§14"],"optional":false,"qualification":null},{"id":"SPX.BENCH.E_SUPREMI.T10","question":{"en":"Did you consider serious study unimportant for priests?","fr":"Estimiez-vous peu importante l'étude sérieuse chez les prêtres ?"},"segments":[{"id":"SPX.BENCH.E_SUPREMI.T10.S1","en":"We did not slight priestly learning; We prized studies insofar as they equipped priests to serve the faith and souls.","fr":"Nous ne méprisions point la science des prêtres ; Nous estimions les études dans la mesure où elles les préparaient à servir la foi et les âmes.","claims":[{"id":"E19","locus":"§11","meaning":"Priest's learning and competence are encouraged where serving priestly duty."}],"secondaryAuthority":null},{"id":"SPX.BENCH.E_SUPREMI.T10.S2","en":"We urged that priests who would form Christ in others first bear His image within themselves.","fr":"Nous exhortions les prêtres qui devaient former le Christ chez autrui à en porter d'abord eux-mêmes l'image.","claims":[{"id":"E20","locus":"§10","meaning":"Priest is charged to form Christ in souls by first being himself formed in Christ."}],"secondaryAuthority":null}],"sections":["§11","§10"],"optional":true,"qualification":"Question originally drafted as study versus priestly ministry; present response must stay within §§10–12, not infer a general anti-intellectual theory."}]},{"id":"HAERENT","title":"Haerent animo","genre":"PAPAL_APOSTOLIC_EXHORTATION","originalAudience":"Catholic clergy","warning":"No official Vatican EN/FR edition identified here. English/French require separate translation review, not certified quotations.","urls":{"it":"https://www.vatican.va/content/pius-x/it/apost_exhortations/documents/hf_p-x_exh_19080804_haerent-animo.html","la":"https://www.vatican.va/content/pius-x/la/apost_exhortations/documents/hf_p-x_exh_19080804_haerent-animo.html"},"turns":[{"id":"SPX.BENCH.HAERENT.T1","question":{"en":"Why did you urge priests to pursue personal holiness?","fr":"Pourquoi exhortiez-vous les prêtres à rechercher leur propre sainteté ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T1.S1","en":"In Our exhortation Haerent animo, We placed the holiness of priests among Our greatest concerns for the welfare of the Church.","fr":"Dans Notre exhortation Haerent animo, Nous mettions la sainteté des prêtres parmi Nos principales préoccupations pour le bien de l'Église.","claims":[{"id":"H01","locus":"§1","meaning":"His chief pastoral concern is priestly formation and virtue for the Church's welfare."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T1.S2","en":"We addressed priests with the solicitude of a father for a suffering child, to recall the negligent and encourage those already zealous.","fr":"Nous Nous adressions aux prêtres avec la sollicitude d'un père pour un enfant malade, afin de rappeler les négligents et d'encourager ceux qui étaient déjà fervents.","claims":[{"id":"H02","locus":"§2","meaning":"He opens his heart as a father to negligent priests; encouragement also intended for faithful clergy."}],"secondaryAuthority":null}],"sections":["§1","§2"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T5","question":{"en":"Why must a priest's personal life agree with his teaching?","fr":"Pourquoi la vie du prêtre doit-elle être conforme à son enseignement ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T5.S1","en":"In Haerent animo We recalled that the priest, called to teach souls, must first set them an example; Christ Himself acted before He taught.","fr":"Dans Haerent animo, Nous rappelions que le prêtre, chargé d'instruire les âmes, doit d'abord leur donner l'exemple ; le Christ Lui-même a agi avant d'enseigner.","claims":[{"id":"H11","locus":"§3","meaning":"Holiness must accompany the doctrine preached by a priest; Christ did first, then taught."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T5.S2","en":"The priest acts not in his own name but as a minister of Christ and a dispenser of His mysteries.","fr":"Le prêtre n'agit pas en son propre nom, mais comme ministre du Christ et dispensateur de ses mystères.","claims":[{"id":"H12","locus":"§4","meaning":"Priestly ministry is exercised in the name of Christ; priests are ministers of his mysteries."}],"secondaryAuthority":null}],"sections":["§3","§4"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T2","question":{"en":"Wouldn't a priest become holy simply through tireless service to others?","fr":"Le prêtre ne devient-il pas saint par son seul dévouement au service des autres ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T2.S1","en":"We rejected the notion that a priest's perfection consists only in outward service while the virtues of his own soul are neglected.","fr":"Nous avons rejeté l'idée que la perfection du prêtre consiste dans la seule activité extérieure, au détriment des vertus de sa propre âme.","claims":[{"id":"H03","locus":"§8","meaning":"Rejects limiting priestly perfection to active virtues and outward works."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T2.S2","en":"We recalled with Leo XIII that humility, obedience and self-denial do not lose their necessity with the passing of time.","fr":"Nous rappelions avec Léon XIII que l'humilité, l'obéissance et le renoncement à soi ne cessent pas d'être nécessaires avec le temps.","claims":[{"id":"H04","locus":"§§8–9","meaning":"He relies on unchanging example of Christ and cites Leo XIII on humility, obedience and self-denial."}],"secondaryAuthority":"Leo XIII (quoted by Pius X in §§8–9)"}],"sections":["§8","§§8–9"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T3","question":{"en":"Should he withdraw from the parish to seek this interior perfection?","fr":"Doit-il se retirer des charges paroissiales pour rechercher cette perfection intérieure ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T3.S1","en":"No: We also warned that a priest must not neglect the duties of his ministry through a mistaken wish for his own interior perfection.","fr":"Non : Nous avertissions aussi que le prêtre ne devait pas négliger les devoirs de son ministère par un désir mal compris de perfection intérieure.","claims":[{"id":"H05","locus":"§10","meaning":"Rejects neglecting apostolic tasks under pretext of private inner perfection."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T3.S2","en":"We named preaching, hearing confessions, assisting the sick and dying, teaching the uninstructed and comforting the afflicted among those duties.","fr":"Nous nommions parmi ces devoirs la prédication, les confessions, l'assistance aux malades et aux mourants, l'instruction des ignorants et la consolation des affligés.","claims":[{"id":"H06","locus":"§10","meaning":"Priestly duties include preaching, hearing confessions, comforting afflicted, attending sick and dying."}],"secondaryAuthority":null}],"sections":["§10"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T6","question":{"en":"Were learning and practical ability also valuable in a priest?","fr":"La science et les qualités pratiques étaient-elles aussi utiles au prêtre ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T6.S1","en":"We recalled the words of St Paul: one man plants and another waters, but God gives the increase.","fr":"Nous rappelions les paroles de saint Paul : l'un plante et l'autre arrose, mais Dieu donne l'accroissement.","claims":[{"id":"H13","locus":"§11","meaning":"God gives growth; natural talent and activity are not sufficient for saving souls."}],"secondaryAuthority":"St Paul — 1 Corinthians 3:7"},{"id":"SPX.BENCH.HAERENT.T6.S2","en":"We did encourage learning in the clergy; yet We insisted that it could not replace holiness, and pointed to the blessed Curé of Ars as an example of what a holy priest can accomplish.","fr":"Nous encouragions la science du clergé ; mais Nous insistions pour qu'elle ne remplaçât point la sainteté, et Nous citions le bienheureux Curé d'Ars pour montrer ce qu'un prêtre saint peut accomplir.","claims":[{"id":"H14","locus":"§12","meaning":"Pius X values studies but warns they cannot replace the priest's holiness."},{"id":"H15","locus":"§12","meaning":"He cites the Curé of Ars as a near-contemporary example of holy priestly fruitfulness."}],"secondaryAuthority":null}],"sections":["§11","§12"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T4","question":{"en":"And how can a priest preserve prayer amid those duties?","fr":"Et comment le prêtre peut-il garder la prière au milieu de ces devoirs ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T4.S1","en":"In that exhortation We reminded the clergy how constantly Our Lord Himself prayed, and taught that prayer is indispensable to the holiness of the priest.","fr":"Dans cette exhortation, Nous rappelions au clergé combien Notre-Seigneur Lui-même priait et que la prière est indispensable à la sainteté du prêtre.","claims":[{"id":"H07","locus":"§13","meaning":"Prayer indispensable to priestly holiness; example of Christ praying."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T4.S4","en":"We also warned that a priest could recite his appointed prayers merely from habit, without giving the rest of his day to conversation with God.","fr":"Nous avertissions aussi qu’un prêtre pouvait réciter les prières prescrites par habitude, sans consacrer le reste de la journée à s’entretenir avec Dieu.","claims":[{"id":"H16","locus":"§14","meaning":"In the exhortation he warns priests against the habit of prayer without inner attention."}],"secondaryAuthority":null}],"sections":["§13","§14"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T7","question":{"en":"What if a priest says he has too many duties to meditate?","fr":"Si le prêtre affirme être trop occupé pour méditer ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T7.S1","en":"We insisted in Haerent animo that priests reserve time daily for meditation, and recalled how St Bernard had urged even Pope Eugenius III not to abandon it amid grave responsibilities.","fr":"Nous insistions dans Haerent animo pour que les prêtres réservassent chaque jour du temps à la méditation, et rappelions que saint Bernard pressait même le pape Eugène III de ne point l'abandonner au milieu des charges les plus graves.","claims":[{"id":"H17","locus":"§15","meaning":"He presents daily meditation as indispensable for priests and cites St Bernard to Eugenius III."}],"secondaryAuthority":"St Bernard addressing Eugenius III (quoted by Pius X)"},{"id":"SPX.BENCH.HAERENT.T7.S2","en":"Habit can weaken reverence even in sacred duties; We therefore did not accept constant outward activity as an excuse for neglecting meditation.","fr":"L'habitude peut affaiblir la révérence jusque dans les fonctions sacrées ; Nous n'admettions donc point l'activité extérieure continuelle comme excuse à l'abandon de la méditation.","claims":[{"id":"H18","locus":"§16","meaning":"Routine can cool priestly attention to sacred duties and increase need for meditation."},{"id":"H20","locus":"§18","meaning":"Excessive activity offered as reason to omit meditation is condemned."}],"secondaryAuthority":null}],"sections":["§15","§16","§18"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T8","question":{"en":"How can prayer guide the duties of a parish priest?","fr":"Comment la prière peut-elle guider les devoirs d'un curé ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T8.S1","en":"We cited St Charles Borromeo: when the priest administers sacraments, let him ponder what he does; when he celebrates Mass, the sacrifice; and when he guides souls, the Blood that redeemed them.","fr":"Nous citions saint Charles Borromée : lorsqu'un prêtre administre les sacrements, qu'il médite sur ses actes ; à la messe, sur le sacrifice ; lorsqu'il guide les âmes, sur le Sang qui les a rachetées.","claims":[{"id":"H21","locus":"§20","meaning":"He cites St Charles Borromeo's examples: sacraments, Mass, psalms and souls."}],"secondaryAuthority":"St Charles Borromeo — pastoral exhortation quoted by Pius X"},{"id":"SPX.BENCH.HAERENT.T8.S2","en":"And We urged priests to meditate upon Christ's life: if they share in His authority, ought they not imitate His holy works?","fr":"Et Nous pressions les prêtres de méditer la vie du Christ : s'ils participent à Son autorité, ne doivent-ils pas imiter aussi Ses œuvres saintes ?","claims":[{"id":"H22","locus":"§21","meaning":"He urges priests to meditate on Jesus Christ and conform holy conduct to priestly authority."}],"secondaryAuthority":null}],"sections":["§20","§21"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T9","question":{"en":"Why should a priest read spiritual books when he already prays?","fr":"Pourquoi un prêtre doit-il lire des livres spirituels s'il prie déjà ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T9.S1","en":"We urged priests to add spiritual reading, especially the Scriptures, to meditation; We recalled St Jerome's counsel to learn what one must teach.","fr":"Nous exhortions les prêtres à joindre la lecture spirituelle, surtout la Sainte Écriture, à la méditation ; Nous rappelions le conseil de saint Jérôme d'apprendre ce que l'on doit enseigner.","claims":[{"id":"H23","locus":"§22","meaning":"Daily meditation ought to be joined with spiritual reading, particularly Scripture."},{"id":"H24","locus":"§22","meaning":"St Jerome is cited: learn what you must teach."}],"secondaryAuthority":"St Jerome to Nepotian, cited by Pius X"},{"id":"SPX.BENCH.HAERENT.T9.S2","en":"We compared good spiritual books to faithful friends: they warn us of neglected duties, awaken conscience and counsel without selfish interest.","fr":"Nous comparions les bons livres spirituels à de fidèles amis : ils rappellent les devoirs négligés, réveillent la conscience et conseillent sans intérêt personnel.","claims":[{"id":"H25","locus":"§23","meaning":"Good spiritual books are likened to faithful friends, offering correction without flattery."}],"secondaryAuthority":null}],"sections":["§22","§23"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T10","question":{"en":"How can a priest know whether meditation is changing his conduct?","fr":"Comment un prêtre peut-il savoir si sa méditation change sa conduite ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T10.S1","en":"In Haerent animo We also recommended daily examination of conscience, recalling the counsel of St John Chrysostom and St Bernard.","fr":"Dans Haerent animo, Nous recommandions aussi l'examen quotidien de conscience, en rappelant les conseils de saint Jean Chrysostome et de saint Bernard.","claims":[{"id":"H26","locus":"§25","meaning":"Examination of conscience helps priests to see whether meditation and reading are put into practice."},{"id":"H27","locus":"§25","meaning":"St John Chrysostom and St Bernard are cited in favor of regular examination."}],"secondaryAuthority":"St John Chrysostom and St Bernard, both cited by Pius X"},{"id":"SPX.BENCH.HAERENT.T10.S2","en":"Men carefully account for worldly losses and gains; We urged priests to watch their own thoughts, words and actions with no less diligence.","fr":"Les hommes tiennent soigneusement compte de leurs pertes et de leurs gains matériels ; Nous exhortions les prêtres à surveiller avec non moins d'application leurs pensées, paroles et actions.","claims":[{"id":"H28","locus":"§26","meaning":"Pius X contrasts careful worldly accounting with neglect of soul examination."},{"id":"H29","locus":"§27","meaning":"Frequently examining thoughts, words and actions helps the Christian resist wrongdoing."}],"secondaryAuthority":null}],"sections":["§25","§26","§27"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T11","question":{"en":"What was your concluding prayer for the clergy?","fr":"Quelle était votre prière finale pour le clergé ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T11.S1","en":"At the close of Haerent animo, We raised to the Father Our Lord's petition that His ministers be sanctified.","fr":"À la fin de Haerent animo, Nous élevions vers le Père la supplication de Notre-Seigneur demandant la sanctification de Ses ministres.","claims":[{"id":"H30","locus":"§37","meaning":"Pius X prays for sanctification of priests using Christ's prayer to the Father."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T11.S2","en":"We rejoiced that faithful people joined Our prayer, and that generous souls, in cloisters and in the world, offered themselves to God for the clergy. From Christ’s Sacred Heart We implored grace, charity and every virtue for priests.","fr":"Nous Nous réjouissions que des fidèles s’unissent à Notre prière, et que des âmes généreuses, dans les cloîtres comme dans le monde, s’offrent elles-mêmes à Dieu pour le clergé. Du Sacré-Cœur du Christ, Nous implorions pour les prêtres la grâce, la charité et toutes les vertus.","claims":[{"id":"H31","locus":"§37","meaning":"Faithful people joined Pius X's prayers for priests; especially generous souls in cloisters and the world offered themselves to God for clergy; he implored grace, charity and all virtue from Christ's Sacred Heart."}],"secondaryAuthority":null}],"sections":["§37"],"optional":false,"qualification":null},{"id":"SPX.BENCH.HAERENT.T12","question":{"en":"Can a priest lose his first fervour while still performing his duties?","fr":"Un prêtre peut-il perdre sa ferveur première tout en exerçant son ministère ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T12.S1","en":"We warned that priests might continue the sacred offices while the fervour and reverence of their earlier ministry gradually grew cold.","fr":"Nous avertissions que des prêtres pouvaient continuer les fonctions sacrées tandis que leur première ferveur et leur révérence se refroidissaient peu à peu.","claims":[{"id":"H19","locus":"§17","meaning":"He describes progressive erosion of priestly fervour despite continuation of external duties."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T12.S2","en":"That is one reason We insisted on returning each day to contemplation of heavenly things rather than permitting habit to obscure them.","fr":"C'est pourquoi Nous insistions pour revenir chaque jour à la contemplation des choses célestes, au lieu de laisser l'habitude les obscurcir.","claims":[{"id":"H18","locus":"§16","meaning":"Routine can cool priestly attention to sacred duties and increase need for meditation."}],"secondaryAuthority":null}],"sections":["§17","§16"],"optional":true,"qualification":null},{"id":"SPX.BENCH.HAERENT.T13","question":{"en":"What practical help, beyond daily prayer, did you advise priests to seek?","fr":"Quels soutiens pratiques recommandiez-vous aux prêtres au-delà de la prière quotidienne ?"},"segments":[{"id":"SPX.BENCH.HAERENT.T13.S1","en":"We recommended spiritual exercises, annually where possible, and shorter monthly recollection according to the provisions of bishops.","fr":"Nous recommandions les exercices spirituels, chaque année si possible, et de plus courtes récollections mensuelles, selon les dispositions des évêques.","claims":[{"id":"H32","locus":"§34","meaning":"He commends annual retreats where possible and shorter monthly recollection under episcopal guidelines."}],"secondaryAuthority":null},{"id":"SPX.BENCH.HAERENT.T13.S2","en":"We encouraged priestly associations for mutual support under episcopal authority; We had Ourselves promoted such an association during Our episcopate and found it helpful.","fr":"Nous encouragions les associations sacerdotales d'entraide sous l'autorité des évêques ; Nous en avions Nous-mêmes soutenu une durant Notre épiscopat et en avions constaté l'utilité.","claims":[{"id":"H33","locus":"§35","meaning":"He recommends mutual priestly support and collaboration regulated by the bishop."},{"id":"H34","locus":"§36","meaning":"He encouraged such an association while a bishop and experienced its usefulness."}],"secondaryAuthority":null}],"secti const words=s=>[...new Set(norm(s).split(" ").filter(x=>x.length>2&&!STOP.has(x)))];
const byId=id=>corpus.find(x=>x.turn.id===id);
const now=()=>byId(state.turn);
const citationLoci=record=>record.turn.sections.join(", ");
const label=doc=>doc.title+" · "+(doc.turns.length)+" "+tr().counts;
function expression(record){
 if(!record)return "welcoming";
 const q=norm(record.turn.question.en);
 if(/wicked|error|bitter|attack|weakening|corrupt|grave|sin|fervour/.test(q))return "grave";
 if(/prayer|meditat|spiritual|conscience|baptism|charity|holiness/.test(q))return "thoughtful";
 if(/hope|purpose|example|thank|pray for/.test(q))return "welcoming";
 return "explaining";
}
function announce(text){$("aria-status").textContent=text;}
function setPortrait(emotion){

 if(img.src!==src){img.classList.add("portrait-change");img.src=src;img.classList.remove("portrait-change");}
}
function openTurn(id,push=true){

 if(push&&state.turn)state.history.push({turn:state.turn,segment:state.segment});
 state.view="dialogue";state.turn=id;state.doc=record.doc.id;state.segment=0;state.citation=false;state.mobileMenu=false;
 render();announce(record.turn.question[state.language]);
}
function view(name){state.view=name;state.citation=false;state.mobileMenu=false;render();}

function answerSegment(seg){

function nextChoices(current){
 return (relatedIds[current.turn.id]||[]).map(byId).filter(r=>r&&r.doc.id===current.doc.id);
}
function contextHTML(record){
 const related=nextChoices(record).slice(0,2);
 const heading=state.language==="fr"?"Passages voisins du même document":"Related passages from the same document";
 const note=state.language==="fr"?"Ces passages répondent à d’autres questions ; ils ne sont pas la suite inventée de cette réponse.":"These passages address other questions. They are not an invented continuation of this answer.";
 return "<p class='eyebrow' style='margin-top:22px'>"+heading+"</p><p class='discreet-note'>"+note+"</p>"+
 related.map(r=>"<article class='related-passage'><p class='source-pill' style='text-align:left'>"+fmt(r.doc.title)+" · "+fmt(citationLoci(r))+"</p>"+
 "<p class='context-question'>"+fmt(r.turn.question[state.language])+"</p>"+
 r.turn.segments.map(seg=>"<p class='related-copy'>"+fmt(seg[state.language])+"</p>").join("")+
 "<button type='button' data-open='"+safe(r.turn.id)+"'>"+
 (state.language==="fr"?"Ouvrir cette question":"Open this question")+" →</button></article>").join("");
}
function dialogueHTML(record){
 const t=record.turn,expanded=state.segment===1;
 const allClaims=[...new Set(t.segments.flatMap(seg=>seg.claims.map(c=>c.id)))];
 let s="<div class='dialog-head'><span class='character-name'>"+tr().speaker+"</span><span class='source-pill'>"+fmt(record.doc.title)+" · "+fmt(citationLoci(record))+"</span></div>"+
 "<p class='eyebrow'>"+tr().question+"</p><h2 class='dialog-title'>"+fmt(t.question[state.language])+"</h2>"+
 "<p class='editor-label'>"+tr().review+"</p>"+
 t.segments.map(answerSegment).join("")+
 "<div class='sourcebar'><span class='progress'>"+fmt(allClaims.join(", "))+"</span><button id='sourceButton' data-source='1'>"+tr().sources+" ↗</button></div>";
 if(expanded)s+=contextHTML(record);
 s+="<div class='actions'><button class='"+(expanded?"secondary":"primary")+"' data-next='1'>"+
 (expanded?(state.language==="fr"?"Masquer les passages associés":"Hide related passages"):(state.language==="fr"?"Lire les passages associés":"Read related passages"))+
 "</button><button class='quiet' data-search='1'>"+tr().another+"</button></div>";
 s+="<p class='eyebrow' style='margin-top:23px'>"+tr().choices+"</p><div class='choices'>"+
 nextChoices(record).map(r=>keyChoice(r)).join("")+"</div>";
 if(state.history.length)s+="<div class='actions'><button class='quiet' data-back='1'>"+tr().back+"</button></div>";
 return s;
}
function score(query,record){
 const q=norm(query),a=words(query);
 if(a.length===0)return 0;
 const question=norm(record.turn.question[state.language]),target=new Set(words(question));
 const other=record.turn.question[state.language==="en"?"fr":"en"];
 let hits=a.filter(x=>target.has(x)).length;
 const claimWords=new Set(words(record.turn.segments.flatMap(x=>x.claims.map(c=>c.meaning)).join(" ")));
 let claimHits=a.filter(x=>claimWords.has(x)).length;
 const title=norm(record.doc.title);
 let points=(hits*2+claimHits*.48)/(Math.max(4,a.length)*2.5);
 if(question.includes(q)&&q.length>12)points+=.4;
 if(a.some(w=>title.includes(w)&&w.length>4))points+=.08;
 return points;
}
function findMatches(q){
 const ranked=corpus.map(r=>({r,score:score(q,r)})).sort((a,b)=>b.score-a.score);
 return ranked.filter(x=>x.score>.065).slice(0,5).map(x=>x.r);
}
function searchHTML(){
 const has=state.searchQuery.trim().length>0;
 const result=has?state.suggestions:[];
 const suggested=result.length?result:corpus.filter(r=>r.doc.id===state.doc).slice(0,4);
 return "<div class='dialog-head'><span class='character-name'>"+tr().speaker+"</span><span class='source-pill'>"+tr().statusShort+"</span></div>"+
 "<h2 class='dialog-title'>"+tr().searchTitle+"</h2><p class='visitor-line'>"+tr().searchText+"</p>"+
 "<form class='search-form' id='askForm'><label class='search-label' for='askInput'><span class='eyebrow'>"+tr().type+"</span></label><input id='askInput' autocomplete='off' maxlength='300' placeholder='"+safe(tr().placeholder)+"' value='"+safe(state.searchQuery)+"'><button class='primary' type='submit'>"+tr().find+"</button></form>"+
 (has?"<p class='discreet-note'>"+(result.length?tr().results:tr().miss)+"</p>":"<p class='discreet-note'>"+tr().nav+"</p>")+
 "<div class='choices'>"+suggested.map(keyChoice).join("")+"</div>"+
 "<div class='actions'><button class='quiet' data-view='browse'>"+tr().showAll+"</button><button class='quiet' data-view='welcome'>"+tr().reset+"</button></div>";
}
function browseHTML(){
 const d=data.docs.find(x=>x.id===state.doc)||data.docs[0];
 return "<div class='dialog-head'><span class='character-name'>"+tr().speaker+"</span><span class='source-pill'>"+tr().statusShort+"</span></div>"+
 "<p class='eyebrow'>"+tr().explore+"</p><h2 class='dialog-title'>"+fmt(d.title)+"</h2>"+
 "<p class='visitor-line'>"+tr().nav+"</p><div class='choices'>"+d.turns.map(t=>keyChoice({doc:d,turn:t})).join("")+"</div>"+
 "<p class='discreet-note'>"+tr().review+"</p>";
}
function sourceHTML(record){
 const selected=record.turn.segments;
 const distinctClaims=[...new Map(selected.flatMap(seg=>seg.claims).map(c=>[c.id,c])).values()];
 const cite=distinctClaims.map(c=>"<div class='cite-row'><div class='id'>"+fmt(c.id)+" · "+fmt(c.locus)+"</div><p>"+fmt(c.meaning)+"</p></div>").join("");
 const urls=Object.entries(record.doc.urls).map(([lang,url])=>"<a target='_blank' rel='noopener noreferrer' href='"+safe(url)+"'>"+fmt(lang.toUpperCase())+" ↗</a>").join("");
 return "<div class='cite-top'><span class='eyebrow'>"+tr().sourceLabel+"</span><button type='button' data-close='1'>"+tr().hide+" ×</button></div>"+
 "<h2 class='cite-name'>"+fmt(record.doc.title)+"</h2>"+
 "<p class='source-pill' style='text-align:left'>"+fmt(citationLoci(record))+"</p>"+
 "<p class='warning'>"+tr().audience+": "+fmt(record.doc.originalAudience)+". "+fmt(record.doc.warning)+"</p>"+
 "<div class='citation-links'>"+urls+"</div>"+
 "<p class='eyebrow'>"+tr().claim+"</p>"+cite+
 "<p class='warning'>"+tr().caution+"</p>"+
 "<p class='discreet-note'>"+tr().notes+": "+fmt(selected.map(seg=>seg.id).join(", "))+" · "+fmt(data.version)+"</p>";
}
function navHTML(){
 return data.docs.map(d=>"<button class='doc-tab' data-doc='"+d.id+"' data-active='"+(d.id===state.doc)+"'>"+fmt(d.title)+"<small>"+d.turns.length+" "+tr().counts+"</small></button>"+
 (d.id===state.doc?"<div class='topic-list'>"+d.turns.map((t,i)=>"<button class='topic' data-open='"+safe(t.id)+"' data-active='"+(t.id===state.turn)+"'><span class='ordinal'>"+(i+1<10?"0":"")+(i+1)+"</span>"+fmt(t.question[state.language])+"</button>").join("")+"</div>":"")).join("");
}
function render(){
 const record=now();document.documentElement.lang=state.language;
 $("subtitle").textContent=tr().subtitle;$("research-status").textContent=tr().status;$("searchBtn").textContent=tr().ask;$("langBtn").textContent=state.language==="en"?"FR":"EN";$("libraryBtn").textContent=tr().contents;$("libraryTitle").textContent=tr().work;$("libNotice").innerHTML="<strong>"+tr().statusShort+"</strong><br>"+tr().lib;$("watermark").textContent=tr().research;
 $("docNav").innerHTML=navHTML();$("library").dataset.open=String(state.mobileMenu);$("libraryBtn").setAttribute("aria-expanded",String(state.mobileMenu));
 $("breadcrumb").innerHTML=state.view==="dialogue"&&record?fmt(record.doc.title)+" <span>· "+fmt(citationLoci(record))+"</span>":"THE PAPAL STUDY <span>· "+tr().statusShort+"</span>";
 setPortrait(expression(state.view==="dialogue"?record:null));
 $("study").style.backgroundImage="url('"+data.art.study+"')";
 $("folioContent").innerHTML=state.view==="dialogue"&&record?dialogueHTML(record):state.view==="search"?searchHTML():state.view==="browse"?browseHTML():welcomeHTML();
 $("citation").hidden=!(state.citation&&record&&state.view==="dialogue");
 if(state.citation&&record)$("citation").innerHTML=sourceHTML(record);
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.id==="langBtn"){state.language=state.language==="en"?"fr":"en";render();return;}
 if(t.id==="libraryBtn"){state.mobileMenu=!state.mobileMenu;render();return;}
 if(t.id==="searchBtn"||t.dataset.search){view("search");setTimeout(()=>$("askInput")?.focus(),40);return;}
 if(t.dataset.open){openTurn(t.dataset.open);return;}
 if(t.dataset.doc){state.doc=t.dataset.doc;view("browse");return;}
 if(t.dataset.view){view(t.dataset.view);return;}
 if(t.dataset.next){if(now()){state.segment=state.segment===1?0:1;render();}return;}
 if(t.dataset.source){state.citation=true;render();$("citation").querySelector("button")?.focus();return;}
 if(t.dataset.close){state.citation=false;render();$("sourceButton")?.focus();return;}
 if(t.dataset.back){const v=state.history.pop();if(v){state.turn=v.turn;state.segment=v.segment;state.view="dialogue";state.doc=now().doc.id;render();}return;}
});
document.addEventListener("submit",e=>{if(e.target.id!=="askForm")return;e.preventDefault();const input=$("askInput");state.searchQuery=input.value.trim();state.suggestions=findMatches(state.searchQuery);render();announce((state.suggestions.length?tr().results:tr().miss));});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(state.citation){state.citation=false;render();}else if(state.mobileMenu){state.mobileMenu=false;render();}return;}
 if(e.target.closest("input,textarea,button,a"))return;
 if(e.key==="ArrowRight"&&state.view==="dialogue"&&state.segment===0){state.segment=1;render();}
 if(e.key==="ArrowLeft"&&state.view==="dialogue"&&state.segment===1){state.segment=0;render();}
});
render();
})();
