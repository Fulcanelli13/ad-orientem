const labels=lang==='fr'?{facts:'Pourquoi cette vie est exemplaire',places:'Lieux associés',sources:'Sources et lectures complémentaires',art:'Portrait du saint en attente de validation',rel:'Lien avec un sanctuaire, pas nécessairement lieu de vie',blessed:'Bienheureux · non canonisé',saint:'Saint canonisé',unmapped:'Site indicatif sans repère publié'}:{facts:'Why this life is exemplary',places:'Associated places',sources:'Sources & further reading',art:'Saint portrait pending artwork approval',rel:'Shrine association, not necessarily a place where the saint lived',blessed:'Blessed · not canonized',saint:'Canonized saint',unmapped:'Indicative place — no marker'};
function labelOf(p){return p.display_name[lang]||p.display_name.en}
function goodGeo(p){return p&&!p.indicative&&['site','complex_anchor'].includes(p.precision)&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&clean(p.geo_source)}
function sourceLinks(target,ids){
 const seen=new Set();
 for(const id of ids){if(seen.has(id))continue;seen.add(id);const s=sourceRegistry[id];if(!s)continue;const url=clean(s.url);if(!url)continue;const a=el('a','source',s.title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';target.append(a)}
}
function openPerson(p,placeId=null){
 current=p;selectedPlace=placeId;
 const root=$('profile');root.replaceChildren();
 const portrait=el('div','portrait');portrait.append(el('small',null,labels.art));root.append(portrait);
 root.append(el('div','kicker',p.recognition_status==='BEATIFIED_NOT_CANONIZED'?labels.blessed:labels.saint));
 root.append(el('h2',null,labelOf(p)));
 root.append(el('p','why',p.why_honoured[lang]||p.why_honoured.en));
 root.append(el('h3',null,labels.facts));
 const ul=el('ul','facts');for(const f of p.biography_facts)ul.append(el('li',null,f[lang]||f.en));root.append(ul);
 root.append(el('h3',null,labels.places));
 const group=el('div','places');
 for(const link of p.place_links){const loc=byId.get(link.place_id);if(!loc)continue;const b=el('button',null,loc.name+(loc.indicative?' · '+labels.unmapped:''));b.type='button';b.addEventListener('click',()=>{if(goodGeo(loc)&&map){map.flyTo({center:[loc.lng,loc.lat],zoom:11,essential:false})} else b.title=labels.unmapped;selectedPlace=loc.id;});group.append(b)}
 root.append(group);
 root.append(el('div','status',labels.rel));
 const d=el('details');const sum=el('summary',null,labels.sources);d.append(sum);sourceLinks(d,p.further_reading_source_ids||[]);
 root.append(d);
 root.append(el('p','foot',lang==='fr'?'Maquette éditoriale : les sources n’impliquent ni approbation iconographique ni certification de chaque récit.':'Editorial review only: source links do not certify every historical account or approve artwork.'));
 for(const b of $('people').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.id===p.saint_id));
}
function renderPeople(term=''){
 const pane=$('people');pane.replaceChildren();
 for(const p of people){const match=[p.display_name.en,p.display_name.fr,p.why_honoured.en,p.why_honoured.fr].join(' ').toLowerCase().includes(term.toLowerCase());if(!match)continue;
 const b=el('button','personbutton',labelOf(p));b.type='button';b.dataset.id=p.saint_id;b.setAttribute('aria-pressed',String(current?.saint_id===p.saint_id));b.addEventListener('click',()=>openPerson(p));pane.append(b)}
}
$('search').addEventListener('input',e=>renderPeople(e.target.value));
renderPeople();openPerson(people[0]);
const locs=places.filter(goodGeo);
$('mapnote').textContent=locs.length+' '+(lang==='fr'?'lieux attestés pour examen':'source-grounded place anchors for review')+' · '+labels.rel;
try{
 const mod=await import('https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs');
 map=new mod.Map({container:'map',style:'https://tiles.openfreemap.org/styles/dark',center:[7,22],zoom:1,renderWorldCopies:false,attributionControl:true});
 map.addControl(new mod.NavigationControl({showCompass:false}),'bottom-left');
 for(const loc of locs){
   const m=new mod.Marker({color:'#a99167'}).setLngLat([loc.lng,loc.lat]).addTo(map);
   m.getElement().style.cursor='pointer';m.getElement().setAttribute('title',loc.name);
   m.getElement().addEventListener('click',()=>{
      const relevant=people.filter(p=>p.place_links.some(x=>x.place_id===loc.id));
      if(relevant[0])openPerson(relevant[0],loc.id);
   });
   markers.set(loc.id,m);
 }
 if(locs.length>1){const bounds=new mod.LngLatBounds();for(const x of locs)bounds.extend([x.lng,x.lat]);map.fitBounds(bounds,{padding:45,maxZoom:3,duration:0})}
}catch(error){console.warn('Map basemap unavailable',error);$('mapfallback').style.display='block'}
</script>
</body></html>
