<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad Orientem phone acceptance harness</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c12}
</style>
</head>
<body>
<script type="module">
import { mountNativeReaderPreview } from "../../src/mass/reader-native-preview.js";

const t=(lat,en)=>({lat,en});
const proper={
  sourcePath:"Sancti/10-07",
  introit:t("Gaudeámus omnes in Dómino","Let us all rejoice in the Lord"),
  collects:[t("Deus, cuius Unigénitus","O God, whose only-begotten Son")],
  epistle:t("Ab inítio et ante sǽcula","From the beginning and before the world"),
  gradual:t("Propter veritátem","Because of truth"),
  sequence:{lat:"",en:""},
  gospel:t("In illo témpore: Missus est Angelus","At that time the Angel was sent"),
  offertory:t("In me grátia omnis viæ","In me is all grace of the way"),
  secrets:[t("Fac nos, quǽsumus, Dómine","Grant us, we beseech Thee, O Lord")],
  preface:t("Vere dignum et iustum est","It is truly meet and just"),
  communion:t("Floréte, flores","Send forth flowers"),
  postcommunions:[t("Sacratíssimæ Genetrícis tuæ","May the prayers of Thy most holy Mother")],
};
const params=new URLSearchParams(location.search);
const rite=String(params.get("rite")??(params.get("asperges")==="1"?"asperges":"")).toLowerCase();
const withAsperges=rite==="asperges";
const withPalm=rite==="palm";
const withAsh=rite==="ash";
const precedingRites=withAsperges?["ASPERGES"]:withPalm?["PALM"]:withAsh?["ASH"]:[];
const resolvedMass={
  schema:"ao-resolved-mass-v2",
  date:"2026-10-04",
  form:"MISSA_CANTATA_INCENSE",
  presentationMode:"LIVE",
  actualCelebration:{id:"holy_rosary",type:"VOTIVE",title:"Holy Rosary"},
  calendarCelebration:{id:"Tempora/Pent18-0",type:"CALENDAR",title:"Sunday"},
  explicitlySelectedCelebration:true,
  proper:{status:"READY",data:proper,sourcePath:"Sancti/10-07"},
  overlays:["VOTIVE_PROPER"],
  precedingRites,
  followingActions:[],
  distinctRite:null,
  provenance:{seasonalMode:null},
};
const prepared={
  schema:"ao-mass-entry-prepared-v1",
  session:{
    resolvedMass,
    plan:{
      kind:"MASS",
      precedingGraphs:precedingRites,
      followingGraphs:[],
      overlayGraphs:["VOTIVE_PROPER"],
      massEntry:(withPalm||withAsh)?"INTROIT":"FOOT_CLUSTER",
      normalLastGospel:withPalm?false:true,
    },
  },
  readerPreferences:{
    mode:"LIVE",
    language:"vernacular",
    postureProfile:"FOLLOW_CONGREGATION",
    gestureProfile:"GUIDED_1962",
    localPostures:{},
  },
};

try{
  window.__AO_PHONE_PREVIEW=await mountNativeReaderPreview({doc:document,prepared});
  document.documentElement.dataset.harnessReady="true";
}catch(error){
  window.__AO_PHONE_HARNESS_ERROR=String(error?.stack??error);
  document.documentElement.dataset.harnessReady="error";
  console.error(error);
}
</script>
</body>
</html>
