<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad Orientem phone acceptance harness</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c12}
</style>
</head>
<body>
<script type="module">
import { mountNativeReaderPreview } from "../../src/mass/reader-native-preview.js";
import { compileMassPlan } from "../../src/mass/session-engine.js";
import { createHostIconResolver } from "../../src/mass/reader-icons.js";
import { R17_FROZEN_ACTIVE_ICON_ASSETS } from "../../src/mass/reader-icon-bank.js";
import { R17_REVIEWED_POSTURE_ASSETS } from "../../src/mass/reader-reviewed-posture-assets.js";
import { R17_FINAL_APPROVED_MASS_ASSETS } from "../../src/mass/reader-final-approved-assets.js";
import { CANONICAL_ICON_ASSETS } from "../../src/mass/reader-canonical-icons.js";

const params=new URLSearchParams(location.search);
const lang=params.get("lang")==="fr"?"fr":"en";
const requestedMode=String(params.get("mode")||"LIVE").toUpperCase();
// Include legacy SIMPLE URLs in migration coverage, never as a third reader.
const mode=requestedMode==="MISSAL"?"MISSAL":"LIVE";
const t=(lat,en,fr)=>lang==="fr"?({lat,en:"",fr}):({lat,en,fr:""});
// Test-only source proof; deliberately distinct from production Proper.
const separatelyNamedChants=params.get("sourceChants")==="1";
// Only for the real-phone notation acceptance: an exact, already pinned
// 1962 All Saints Proper, never a synthetic title-to-score lookup.
const scoredProperKind=String(params.get("scoreProper")??"");
const epiphanyScoredProper=scoredProperKind==="epiphany";
const immaculateScoredProper=scoredProperKind==="immaculate";
const adventIProper=scoredProperKind==="advent1";
const adventIIProper=scoredProperKind==="advent2";
const adventIIIProper=scoredProperKind==="advent3";
const adventIVProper=scoredProperKind==="advent4";
const exactScoredProper=scoredProperKind==="all-saints"||epiphanyScoredProper||
 immaculateScoredProper||adventIProper||adventIIProper||adventIIIProper||adventIVProper;
const alternateIsTract=params.get("tract")==="1";
const altKind=alternateIsTract?"TRACT":"ALLELUIA";
const altSection=alternateIsTract?"Tractus":"Alleluia";
const gradualSource={
  lat:"Propter veritátem",en:"Because of truth",fr:"À cause de la vérité",
};
const altSource=alternateIsTract
  ?{lat:"Tractus · Qui confídunt",en:"Tract · They that trust",fr:"Trait · Ceux qui mettent leur confiance"}
  :{lat:"Alleluia · Ave Maria",en:"Alleluia · Hail Mary",fr:"Alléluia · Je vous salue, Marie"};
const gradualCombined=Object.fromEntries(["lat","en","fr"].map(lang=>[
  lang,gradualSource[lang]+"\n"+altSource[lang],
]));
const readerChantSourceProof=separatelyNamedChants?{
  status:"SOURCE_VERIFIED_EXACT",sourcePath:"Sancti/10-07",
  sourceOrder:["Graduale",altSection],
  aggregateVerifiedLanguages:["la","en","fr"],
  parts:[
    {kind:"GRADUAL",sourceSectionId:"Graduale",sourceRef:"Sancti/10-07:Graduale",...gradualSource},
    {kind:altKind,sourceSectionId:altSection,sourceRef:"Sancti/10-07:"+altSection,...altSource},
  ],
}:null;
// Test-only source-proof flags for selected Mass days without Gloria/Credo.
const fixtureGloria=params.get("gloria")==="0"?false:params.get("gloria")==="1"?true:null;
const fixtureCredo=params.get("credo")==="0"?false:params.get("credo")==="1"?true:null;
const proper={
  sourcePath:"Sancti/10-07",
  ...(fixtureGloria!==null?{hasGloria:fixtureGloria,showGloria:fixtureGloria}:{}),
  ...(fixtureCredo!==null?{hasCredo:fixtureCredo,showCredo:fixtureCredo}:{}),
  ...(separatelyNamedChants?{readerChantSourceProof}:{}),
  introit:t("Gaudeámus omnes in Dómino","Let us all rejoice in the Lord","Réjouissons-nous ensemble dans le Seigneur"),
  collects:[t("Deus, cuius Unigénitus","O God, whose only-begotten Son","Ô Dieu, dont le Fils unique")],
  epistle:t("Ab inítio et ante sǽcula","From the beginning and before the world","Dès le commencement et avant les siècles"),
  gradual:separatelyNamedChants?gradualCombined:
    t("Propter veritátem","Because of truth","À cause de la vérité"),
  // This variant exists only for browser verification of a separately sourced Sequence.
  // Production text continues to come exclusively from the selected day\u0027s Proper.
  sequence:params.get("sequence")==="1"
    ?t("Lauda Sion Salvatórem","Praise, O Sion, thy Saviour","Loue, Sion, ton Sauveur")
    :{lat:"",en:"",fr:""},
  gospel:t("In illo témpore: Missus est Angelus","At that time the Angel was sent","En ce temps-là, l’Ange fut envoyé"),
  offertory:t("In me grátia omnis viæ","In me is all grace of the way","En moi est toute grâce"),
  secrets:[t("Fac nos, quǽsumus, Dómine","Grant us, we beseech Thee, O Lord","Faites que nous, Seigneur")],
  preface:t("Vere dignum et iustum est","It is truly meet and just","Il est vraiment juste et nécessaire"),
  communion:t("Floréte, flores","Send forth flowers","Fleurissez, fleurs"),
  postcommunions:[t("Sacratíssimæ Genetrícis tuæ","May the prayers of Thy most holy Mother","Que les prières de votre très sainte Mère")],
};
if(exactScoredProper){
 Object.assign(proper,{
  sourcePath:"Sancti/11-01",
  introit:t("Gaudeámus omnes in Dómino, diem festum celebrántes sub honóre Sanctórum ómnium.",
    "Let us rejoice in the Lord","Réjouissons-nous dans le Seigneur"),
  gradual:t("Timéte Dóminum, omnes Sancti ejus: quóniam nihil deest timéntibus eum.",
    "Fear the Lord, all ye His saints","Craignez le Seigneur, vous tous ses saints"),
  offertory:t("Justórum ánimæ in manu Dei sunt, et non tanget illos torméntum malítiæ.",
    "The souls of the just are in God's hand","Les âmes des justes sont dans la main de Dieu"),
  communion:t("Beáti mundo corde, quóniam ipsi Deum vidébunt; beáti pacífici.",
    "Blessed are the clean of heart","Bienheureux les cœurs purs")
 });
}
// The five exact 6 January 1962 source texts, including its original
// Graduale paragraph, which contains BOTH Gradual and Alleluia. This is a
// source-binding fixture only; default unrelated Mass prayers are not
// asserted as an entire Epiphany Missal transcription.
if(epiphanyScoredProper){
 Object.assign(proper,{
  sourcePath:"Sancti/01-06",
  introit:t("Ecce, advénit dominátor Dóminus: et regnum in manu ejus et potéstas et impérium.",
    "Behold, the Lord the ruler is come","Voici que le Seigneur, le dominateur, est venu"),
  gradual:t("Omnes de Saba vénient, aurum et thus deferéntes, et laudem Dómino annuntiántes. V. Surge et illumináre, Jerúsalem: quia glória Dómini super te orta est. Allelúja, allelúja. Vídimus stellam ejus in Oriénte, et vénimus cum munéribus adoráre Dóminum. Allelúja.",
    "All they from Saba shall come, bringing gold and frankincense. Alleluia: We have seen His star in the East.",
    "Tous ceux de Saba viendront, portant de l'or et de l'encens. Alléluia : nous avons vu son étoile en Orient."),
  offertory:t("Reges Tharsis, et ínsulæ múnera ófferent: reges Arabum et Saba dona addúcent: et adorábunt eum omnes reges terræ.",
    "The kings of Tharsis and the islands shall offer presents","Les rois de Tharsis et des îles offriront des présents"),
  communion:t("Vídimus stellam ejus in Oriénte, et vénimus cum munéribus adoráre Dóminum.",
    "We have seen His star in the East, and have come with gifts to adore the Lord",
    "Nous avons vu son étoile en Orient et sommes venus avec des présents adorer le Seigneur")
 });
}
// 8 December source check: the actual Latin in pinned Sancti/12-08,
// including the Gradual and Alleluia joined by its 1962 Graduale section.
// Only the named five Proper chants form part of this reference fixture.
if(immaculateScoredProper){
 Object.assign(proper,{
  sourcePath:"Sancti/12-08",
  introit:t("Gaudens gaudébo in Dómino, et exsultábit ánima mea in Deo meo: quia índuit me vestiméntis salútis: et induménto justítiæ circúmdedit me, quasi sponsam ornátam monílibus suis.",
    "I will greatly rejoice in the Lord","Je tressaillirai de joie dans le Seigneur"),
  gradual:t("Benedícta es tu, Virgo María, a Dómino, Deo excélso, præ ómnibus muliéribus super terram. Tu glória Jerúsalem, tu lætítia Israël, tu honorificéntia pópuli nostri. Allelúja, allelúja. Tota pulchra es, María: et mácula originális non est in te. Allelúja.",
    "Blessed art thou, O Virgin Mary. Alleluia: Thou art all fair, O Mary.",
    "Vous êtes bénie, Vierge Marie. Alléluia : Vous êtes toute belle, Marie."),
  offertory:t("Ave, María, grátia plena; Dóminus tecum: benedícta tu in muliéribus, allelúja.",
    "Hail Mary, full of grace; the Lord is with thee",
    "Je vous salue, Marie, pleine de grâce ; le Seigneur est avec vous"),
  communion:t("Gloriósa dicta sunt de te, María: quia fecit tibi magna qui potens est.",
    "Glorious things are said of thee, Mary","Des choses glorieuses ont été dites de vous, Marie")
 });
}
// Source-owner exact first two 1962 Advent Sundays: only four 1961
// reference scores per Sunday. The Offertory is deliberately UNBOUND:
 // Advent I adds "Domine" in the 1961 score; Advent II has
 // "conversus" in the 1962 Latin vs "convertens" in the GABC.
if(adventIProper){
 Object.assign(proper,{
  sourcePath:"Tempora/Adv1-0",hasGloria:false,showGloria:false,
  hasCredo:true,showCredo:true,
  introit:t("Ad te levávi ánimam meam: Deus meus, in te confído, non erubéscam: neque irrídeant me inimíci mei: étenim univérsi, qui te exspéctant, non confundéntur.",
   "To Thee have I lifted up my soul","Vers Vous j'élève mon âme"),
  gradual:t("Univérsi, qui te exspéctant, non confundéntur, Dómine. V. Vias tuas, Dómine, notas fac mihi: et sémitas tuas édoce me. Allelúja, allelúja. V. Osténde nobis, Dómine, misericórdiam tuam: et salutáre tuum da nobis. Allelúja.",
   "All who await Thee shall not be confounded. Alleluia: Show us Thy mercy.",
   "Tous ceux qui Vous attendent ne seront pas confondus. Alléluia : montrez-nous Votre miséricorde."),
  offertory:t("Ad te levávi ánimam meam: Deus meus, in te confído, non erubéscam: neque irrídeant me inimíci mei.",
   "To Thee I lift my soul","Vers Vous j'élève mon âme"),
  communion:t("Dóminus dabit benignitátem: et terra nostra dabit fructum suum.",
   "The Lord shall give kindness","Le Seigneur donnera sa bonté")
 });
}
if(adventIIProper){
 Object.assign(proper,{
  sourcePath:"Tempora/Adv2-0",hasGloria:false,showGloria:false,
  hasCredo:true,showCredo:true,
  introit:t("Pópulus Sion, ecce, Dóminus véniet ad salvándas gentes: et audítam fáciet Dóminus glóriam vocis suæ in lætítia cordis vestri.",
   "People of Sion, behold, the Lord shall come","Peuple de Sion, voici que le Seigneur viendra"),
  gradual:t("Ex Sion species decóris ejus: Deus maniféste véniet. V. Congregáte illi sanctos ejus, qui ordinavérunt testaméntum ejus super sacrifícia. Allelúja, allelúja. V. Lætátus sum in his, quæ dicta sunt mihi: in domum Dómini íbimus. Allelúja.",
   "Out of Sion the beauty of His comeliness. Alleluia: I rejoiced.",
   "De Sion vient l'éclat de sa beauté. Alléluia : je me suis réjoui."),
  offertory:t("Deus, tu convérsus vivificábis nos, et plebs tua lætábitur in te: osténde nobis, Dómine, misericórdiam tuam.",
   "O God, turning again, Thou wilt give us life",
   "Ô Dieu, en revenant vers nous, Vous nous ferez vivre"),
  communion:t("Jerúsalem, surge et sta in excélso, et vide jucunditátem, quæ véniet tibi a Deo tuo.",
   "Jerusalem, arise and stand on high","Jérusalem, lève-toi et tiens-toi dans les hauteurs")
 });
}
// M49 test-only independent proper source fixtures. No text is changed
// within the production Mass resolver and no source-scoped hold is bypassed.
if(adventIIIProper){
 Object.assign(proper,{
  sourcePath:"Tempora/Adv3-0",hasGloria:false,showGloria:false,
  hasCredo:true,showCredo:true,
  introit:t("Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra nota sit ómnibus homínibus: Dóminus enim prope est. Nihil sollíciti sitis: sed in omni oratióne petitiónes vestræ innotéscant apud Deum.",
    "Rejoice in the Lord always","Réjouissez-vous toujours dans le Seigneur"),
  gradual:t("Qui sedes, Dómine, super Chérubim, éxcita poténtiam tuam, et veni. V. Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph. Allelúja, allelúja. V. Excita, Dómine, poténtiam tuam, et veni, ut salvos fácias nos. Allelúja.",
    "Thou who sittest upon the cherubim. Alleluia: Stir up Thy power.",
    "Vous qui siégez sur les chérubins. Alléluia : éveillez votre puissance."),
  offertory:t("Benedixísti, Dómine, terram tuam: avertísti captivitátem Jacob: remisísti iniquitátem plebis tuæ.",
    "Thou hast blessed Thy land, O Lord","Vous avez béni votre terre, Seigneur"),
  communion:t("Dícite: pusillánimes, confortámini et nolíte timére: ecce, Deus noster véniet et salvábit nos.",
    "Say to the fainthearted, take courage","Dites aux cœurs défaillants : prenez courage")
 });
}
if(adventIVProper){
 Object.assign(proper,{
  sourcePath:"Tempora/Adv4-0",hasGloria:false,showGloria:false,
  hasCredo:true,showCredo:true,
  introit:t("Roráte, cœli, désuper, et nubes pluant justum: aperiátur terra, et gérminet Salvatórem.",
    "Drop down dew, ye heavens","Cieux, répandez votre rosée"),
  gradual:t("Prope est Dóminus ómnibus invocántibus eum: ómnibus, qui ínvocant eum in veritáte. V. Laudem Dómini loquétur os meum: et benedícat omnis caro nomen sanctum ejus. Allelúja, allelúja. V. Veni, Dómine, et noli tardáre: reláxa facínora plebis tuæ Israël. Allelúja.",
    "The Lord is near to all who call upon Him","Le Seigneur est proche de ceux qui l'invoquent"),
  offertory:t("Ave, María, grátia plena; Dóminus tecum: benedícta tu in muliéribus, et benedíctus fructus ventris tui.",
    "Hail Mary, full of grace","Je vous salue, Marie, pleine de grâce"),
  communion:t("Ecce, virgo concípiet et páriet fílium, et vocábitur nomen ejus Emmánuel.",
    "Behold, a virgin shall conceive","Voici qu'une vierge concevra")
 });
}
const rite=String(params.get("rite")??(params.get("asperges")==="1"?"asperges":"")).toLowerCase();
const withAsperges=rite==="asperges";
const withPalm=rite==="palm";
const withAsh=rite==="ash";
const withCandlemas=rite==="candlemas";
const withGoodFriday=rite==="good-friday";
const withEasterVigil=rite==="easter-vigil";
const precedingRites=withAsperges?["ASPERGES"]:withPalm?["PALM"]:withAsh?["ASH"]:withCandlemas?["CANDLEMAS"]:[];
const requestedForm=String(params.get("form")??"MISSA_CANTATA_INCENSE").toUpperCase();
const following=String(params.get("following")||"").toLowerCase();
if(!["","corpus","requiem"].includes(following))throw new Error("Unsupported following-action fixture");
const fixtureRequiem=params.get("requiem")==="1"||following==="requiem";
const followingActions=following==="corpus"?["CORPUS_CHRISTI_PROCESSION"]:
  following==="requiem"?["REQUIEM_ABSOLUTION"]:[];
const allowedForms=new Set(["MISSA_CANTATA_INCENSE","MISSA_CANTATA_SIMPLE","SOLEMN","LOW"]);
if(!allowedForms.has(requestedForm))throw new Error("Unsupported test fixture form");
const fixtureDate=params.get("date")||(adventIProper?"2026-11-29":adventIIProper?"2026-12-06":adventIIIProper?"2026-12-13":adventIVProper?"2026-12-20":immaculateScoredProper?"2026-12-08":epiphanyScoredProper?"2027-01-06":exactScoredProper?"2026-11-01":withGoodFriday?"2026-04-03":withEasterVigil?"2027-03-27":"2026-10-04");
if(!/^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$/.test(fixtureDate))throw new Error("Invalid test fixture date");
const resolvedMass={
  schema:"ao-resolved-mass-v2",
  date:fixtureDate,
  form:requestedForm,
  presentationMode:mode,
  actualCelebration:adventIProper?{id:"Tempora/Adv1-0",type:"CALENDAR",title:"First Sunday of Advent"}:
    adventIIProper?{id:"Tempora/Adv2-0",type:"CALENDAR",title:"Second Sunday of Advent"}:
    adventIIIProper?{id:"Tempora/Adv3-0",type:"CALENDAR",title:"Third Sunday of Advent"}:
    adventIVProper?{id:"Tempora/Adv4-0",type:"CALENDAR",title:"Fourth Sunday of Advent"}:
    immaculateScoredProper?{id:"immaculata-bmv",type:"CALENDAR",title:"Immaculate Conception"}:
    epiphanyScoredProper?{id:"epiphany",type:"CALENDAR",title:"Epiphany of Our Lord"}:
    exactScoredProper?{id:"all-saints",type:"CALENDAR",title:"All Saints"}:
    withGoodFriday?{id:"good-friday",type:"CALENDAR",title:"Good Friday"}:
    withEasterVigil?{id:"easter-vigil",type:"CALENDAR",title:"Easter Vigil"}:
    withCandlemas?{id:"purificatio-bmv",type:"CALENDAR",title:"Purification of Our Lady"}:
    fixtureRequiem?{id:"requiem",type:"REQUIEM",title:"Requiem"}:
    following==="corpus"?{id:"corpus-christi",type:"CALENDAR",title:"Corpus Christi"}:
    {id:"holy_rosary",type:params.get("print")==="1"?"CALENDAR":"VOTIVE",title:"Holy Rosary"},
  calendarCelebration:adventIProper?{id:"Tempora/Adv1-0",type:"CALENDAR",title:"First Sunday of Advent"}:
    adventIIProper?{id:"Tempora/Adv2-0",type:"CALENDAR",title:"Second Sunday of Advent"}:
    adventIIIProper?{id:"Tempora/Adv3-0",type:"CALENDAR",title:"Third Sunday of Advent"}:
    adventIVProper?{id:"Tempora/Adv4-0",type:"CALENDAR",title:"Fourth Sunday of Advent"}:
    immaculateScoredProper?{id:"immaculata-bmv",type:"CALENDAR",title:"Immaculate Conception"}:
    epiphanyScoredProper?{id:"epiphany",type:"CALENDAR",title:"Epiphany of Our Lord"}:
    exactScoredProper?{id:"all-saints",type:"CALENDAR",title:"All Saints"}:
    withGoodFriday?{id:"good-friday",type:"CALENDAR",title:"Good Friday"}:
    withEasterVigil?{id:"easter-vigil",type:"CALENDAR",title:"Easter Vigil"}:
    withCandlemas?{id:"purificatio-bmv",type:"CALENDAR",title:"Purification of Our Lady"}:
    {id:"Tempora/Pent18-0",type:"CALENDAR",title:"Sunday"},
  explicitlySelectedCelebration:params.get("print")!=="1",
  proper:{status:"READY",data:proper,sourcePath:proper.sourcePath},
  overlays:fixtureRequiem?["REQUIEM"]:(exactScoredProper||params.get("print")==="1"?[]:["VOTIVE_PROPER"]),
  precedingRites,
  followingActions,
  distinctRite:withGoodFriday?"GOOD_FRIDAY":withEasterVigil?"EASTER_VIGIL":null,
  provenance:{seasonalMode:null,
    // Test harness only: a supplied, source-verified actual Sunday context.
    // Never infer a tone in production from the date or feast title.
    ...(["1","ferial"].includes(params.get("notation"))?{musicToneContext:{
      schema:"ao-1962-sourced-tone-context-v1",sourceOwner:"1962_PROPER_RESOLVER",
      verified:true,celebrationKind:params.get("notation")==="ferial"?"FERIA":"SUNDAY",liturgicalClass:params.get("notation")==="ferial"?4:2
    }}:{}),
    ...(fixtureGloria!==null?{gloria:fixtureGloria}:{}),
    ...(fixtureCredo!==null?{credo:fixtureCredo}:{}),
    ...(following==="requiem"?{requiemAbsolution:{
      bodyPresent:params.get("body")!=="0",
      burialProcession:params.get("burial")==="1"}}:{}),
    ...(withEasterVigil?{easterVigil:{fontMode:String(params.get("font")||"IN_CHURCH").toUpperCase(),
      baptismPresent:params.get("baptism")==="1"}}:{})},
};
const prepared={
  schema:"ao-mass-entry-prepared-v1",
  session:{
    resolvedMass,
    plan:(params.get("matrix")==="1"||withGoodFriday||withEasterVigil||withCandlemas||followingActions.length>0||requestedForm==="SOLEMN"||requestedForm==="LOW")
      ? compileMassPlan(resolvedMass)
      : {
      kind:"MASS",
      precedingGraphs:precedingRites,
      followingGraphs:[],
      overlayGraphs:params.get("print")==="1"?[]:["VOTIVE_PROPER"],
      massEntry:(withPalm||withAsh)?"INTROIT":"FOOT_CLUSTER",
      normalLastGospel:withPalm?false:true,
    },
  },
  readerPreferences:{
    mode,
    language:lang,
    secondConfiteor:params.get("secondConfiteor")==="1",
    postureProfile:"FOLLOW_CONGREGATION",
    gestureProfile:"GUIDED_1962",
    localPostures:{},
  },
};

if(params.get("matrix")==="1"){
  // Test-fixture-only metadata: compile the source-owned Mass plan.
  window.__AO_FOUR_FORM_SCENARIO=Object.freeze({
    form:requestedForm,family:fixtureRequiem?"REQUIEM":"VOTIVE",
    planKind:prepared.session.plan?.kind??null,
    overlayGraphs:[...(prepared.session.plan?.overlayGraphs??[])],
    blessingAllowed:prepared.session.plan?.blessingAllowed,
    ordinaryPeacePrayerAllowed:prepared.session.plan?.ordinaryPeacePrayerAllowed,
    dismissal:prepared.session.plan?.dismissal,
    syntheticProper:true,
  });
}
try{
  if(params.get("production")==="1"){
    // Exercise the actual app entry/default-card selection, not a mock mode.
    const {mountR17Preview}=await import("../../src/mass/browser-entry.js");
    const mounted=await mountR17Preview({doc:document,prepared});
    window.__AO_PHONE_PREVIEW=mounted.preview;
  }else{
    window.__AO_PHONE_PREVIEW=await mountNativeReaderPreview({doc:document,prepared,
      iconResolver:createHostIconResolver({assets:{...R17_FROZEN_ACTIVE_ICON_ASSETS,...R17_REVIEWED_POSTURE_ASSETS,...R17_FINAL_APPROVED_MASS_ASSETS,...CANONICAL_ICON_ASSETS}})});
  }
  document.documentElement.dataset.harnessReady="true";
}catch(error){
  window.__AO_PHONE_HARNESS_ERROR=String(error?.stack??error);
  document.documentElement.dataset.harnessReady="error";
  console.error(error);
}
</script>
</body>
</html>
