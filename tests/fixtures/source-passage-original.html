<h1 id="principle">A Note on Sources</h1>
<p id="first">A reliable source has a named work and a defined edition.</p>
<p id="second">Commentary should keep the name of its author.</p>
<h2 id="navigation">Reading with Context</h2>
<p id="return">A passage may be opened and returned to without disturbing the original page.</p>
<p id="weight">Load a section only when someone chooses to read it.</p>
